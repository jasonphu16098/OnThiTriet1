phát triển đòi hỏi phải xem xét sự vật như thế nào?","o":["Xem xét trong trạng thái đang tồn tại của sự vật.","Xem xét sự chuyển hoá từ trạng thái này sang trạng thái kia.","Xem xét các giai đoạn khác nhau của sự vật.","Gồm cả a, b, c."],"a":[3],"p":37,"e":"Quan điểm phát triển đòi hỏi xem xét sự vật trong trạng thái hiện tại, trong sự chuyển hóa từ trạng thái này sang trạng thái khác và qua các giai đoạn khác nhau. Đáp án d gộp cả ba.","w":{"a":"Một yêu cầu: xem xét sự vật ở trạng thái đang tồn tại.","b":"Một yêu cầu: xem xét sự chuyển hóa giữa các trạng thái.","c":"Một yêu cầu: xem xét các giai đoạn khác nhau."}},{"s":5,"n":"7","q":"Trong nhận thức sự vật chỉ xem xét ở một trạng thái tồn tại của nó thì thuộc vào lập trường triết học nào?","o":["Quan điểm siêu hình phiến diện.","Quan điểm chiết trung.","Quan điểm biện chứng duy vật."],"a":[0],"p":37,"e":"Chỉ xem xét sự vật ở một trạng thái tồn tại là quan điểm siêu hình, phiến diện, bỏ qua quá trình biến đổi.","w":{"b":"Chiết trung trộn lẫn các quan điểm khác nhau.","c":"Duy vật biện chứng xem xét sự vật trong vận động, phát triển."}},{"s":5,"n":"8","q":"Thêm các tập hợp từ thích hợp vào câu sau để được luận điểm của chủ nghĩa duy vật biện chứng: Trên thực tế các quan điểm toàn diện, quan điểm phát triển, quan điểm lịch sử cụ thể phải....","o":["Tách rời nhau hoàn toàn.","Không tách rời nhau.","Có lúc tách rời nhau, có lúc không."],"a":[1],"p":37,"e":"Quan điểm toàn diện, quan điểm phát triển và quan điểm lịch sử - cụ thể không tách rời nhau, vì cả ba đều xuất phát từ cùng một phép biện chứng.","w":{"a":"Tách rời hoàn toàn là sai.","c":"Có lúc tách rời, có lúc không là không nhất quán."}},{"s":5,"n":"9","q":"Thêm cụm từ nào vào câu sau để được luận điểm của chủ nghĩa duy vậ biện chứng: Nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển phải........","o":["Đồng nhất với nhau một cách hoàn toàn.","Độc lập với nhau một cách hoàn toàn.","Quan hệ chặt chẽ với nhau, nhưng không đồng nhất với nhau."],"a":[2],"p":38,"e":"Hai nguyên lý của phép biện chứng quan hệ chặt chẽ với nhau nhưng không đồng nhất, vì mỗi nguyên lý phản ánh một mặt khác nhau của thế giới.","w":{"a":"Hai nguyên lý không đồng nhất với nhau.","b":"Hai nguyên lý không độc lập hoàn toàn với nhau."}},{"s":5,"n":"10","q":"Các phạm trù số, hàm số, điểm, đường, mặt là phạm trù của khoa học nào?","o":["Vật lý","Hoá học","Toán học.","Triết học."],"a":[2],"p":38,"e":"Số, hàm số, điểm, đường, mặt là các phạm trù của toán học.","w":{"a":"Vật lý có các phạm trù như lực, năng lượng.","b":"Hóa học có các phạm trù như nguyên tố, hợp chất.","d":"Phạm trù triết học là những khái niệm chung nhất."}},{"s":5,"n":"11","q":"Các phạm trù: thực vật, động vật, tế bào, đồng hoá, dị hoá là những phạm trù của khoa học nào","o":["Toán học","Vật lý học","Sinh vật học.","Triết học."],"a":[2],"p":38,"e":"Thực vật, động vật, tế bào, đồng hóa, dị hóa là các phạm trù của sinh vật học.","w":{"a":"Toán học có phạm trù số, hàm số.","b":"Vật lý học có phạm trù lực, năng lượng.","d":"Phạm trù triết học là những khái niệm chung nhất."}},{"s":5,"n":"12","q":"Các phạm trù: vật chất, ý thức, vận động, mâu thuẫn, bản chất, hiện tượng là những phạm trù của khoa học nào?","o":["Kinh tế chính trị học","Luật học.","Hoá học.","Triết học."],"a":[3],"p":38,"e":"Vật chất, ý thức, vận động, mâu thuẫn, bản chất, hiện tượng là các phạm trù của triết học, vì chúng phản ánh những mặt chung nhất của thế giới.","w":{"a":"Kinh tế chính trị học có phạm trù như hàng hóa, giá trị.","b":"Luật học có phạm trù như quyền, nghĩa vụ.","c":"Hóa học có phạm trù nguyên tố, hợp chất."}},{"s":5,"n":"13","q":"Thêm cụm từ nào vào chỗ trống của câu sau để được định nghĩa về phạm trù: \"phạm trù là những........... phản ánh những mặt, những thuộc tính, những mối liên hệ chung, cơ bản nhất của các sự vật và hiện tượng thuộc một lĩnh vực nhất định\".","o":["Khái niệm.","Khái niệm rộng nhất.","Khái niệm cơ bản nhất.","Gồm b và c."],"a":[3],"p":38,"e":"Phạm trù là những khái niệm rộng nhất và cơ bản nhất phản ánh các mặt, thuộc tính, mối liên hệ chung của sự vật thuộc một lĩnh vực nhất định. Đáp án d gộp b và c.","w":{"a":"\"Khái niệm\" chưa nêu mức độ rộng nhất, cơ bản nhất.","b":"Đúng một phần: khái niệm rộng nhất.","c":"Đúng một phần: khái niệm cơ bản nhất."}},{"s":5,"n":"14","q":"Thêm cụm từ nào vào chỗ trống của câu sau để được định nghĩa phạm trù triết học: \"Phạm trù triết học là những......(1).... phản ánh những mặt, những mối liên hệ cơ bản và phổ biến nhất của.....(2).... hiện thực\".","o":["1- khái niệm, 2- các sự vật của.","1- Khái niệm rộng nhất, 2- một lĩnh vực của.","1- Khái niệm chung nhất, 2- toàn bộ thế giới."],"a":[2],"p":38,"e":"Phạm trù triết học là những khái niệm chung nhất phản ánh những mặt, những mối liên hệ cơ bản và phổ biến nhất của toàn bộ thế giới hiện thực.","w":{"a":"Chưa nêu mức độ chung nhất và phạm vi toàn bộ thế giới.","b":"\"Một lĩnh vực\" là phạm vi của phạm trù khoa học cụ thể."}},{"s":5,"n":"15","q":"Thêm cụm từ nào vào chỗ trống của câu sau để được một luận điểm của chủ nghĩa duy vật biện chứng: Quan hệ giữa phạm trù triết học và phạm trù của các khoa học cụ thể là quan hệ giữa....(1)....và....(2)....","o":["1- cái riêng, 2- cái riêng.","1- cái riêng, 2- cái chung.","1- cái chung, 2- cái riêng.","1- cái chung, 2- cái chung."],"a":[2],"p":38,"e":"Phạm trù triết học là cái chung, phạm trù của khoa học cụ thể là cái riêng. Cái chung tồn tại thông qua cái riêng.","w":{"a":"Cả hai đều là cái riêng là sai.","b":"Đảo ngược quan hệ chung - riêng.","d":"Cả hai đều là cái chung là sai."}},{"s":5,"n":"16","q":"Trường phái triết học nào cho rằng phạm trù là những thực thể ý niệm tồn tại độc lập với ý thức con người và thế giới vật chất?","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng."],"a":[0],"p":38,"e":"Cho phạm trù là thực thể ý niệm tồn tại độc lập với ý thức con người và thế giới vật chất là duy tâm khách quan (như Pla-tông).","w":{"b":"Duy tâm chủ quan coi phạm trù do ý thức con người tạo ra.","c":"Duy vật biện chứng coi phạm trù là sản phẩm của nhận thức."}},{"s":5,"n":"17","q":"Trường phái triết học nào cho rằng phạm trù được hình thành trong quá trình hoạt động thực tiễn và hoạt động nhận thức của con người?","o":["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật siêu hình thế kỷ XVII - XVIII."],"a":[0],"p":39,"e":"Phạm trù hình thành trong quá trình hoạt động thực tiễn và nhận thức của con người là quan điểm của chủ nghĩa duy vật biện chứng.","w":{"b":"Duy tâm chủ quan coi phạm trù là sản phẩm của ý thức thuần túy.","c":"Duy tâm khách quan coi phạm trù là thực thể ý niệm.","d":"Duy vật siêu hình coi phạm trù là bất biến."}},{"s":5,"n":"18","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng phạm trù có tính chất chủ quan hay khách quan?","o":["Khách quan","Chủ quan","Vừa khách quan, vừa chủ quan."],"a":[2],"p":39,"e":"Phạm trù vừa khách quan vừa chủ quan: nội dung phản ánh thế giới khách quan, hình thức là sản phẩm của tư duy con người.","w":{"a":"Phạm trù không hoàn toàn khách quan vì hình thức do con người tạo ra.","b":"Phạm trù không hoàn toàn chủ quan vì nội dung bắt nguồn từ hiện thực."}},{"s":5,"n":"19","q":"Thêm cụm từ thích hợp vào chỗ trống của câu sau để được luận điểm của chủ nghĩa duy vật biện chứng về tính chất của các phạm trù: Nội dung của phạm trù có tính..(1)..., hình thức của phạm trù có tính...(2)..","o":["1- chủ quan, 2- khách quan","1- chủ quan, 2- chủ quan.","1- khách quan, 2- chủ quan."],"a":[2],"p":39,"e":"Nội dung của phạm trù có tính khách quan (phản ánh hiện thực), hình thức của phạm trù có tính chủ quan (do tư duy con người tạo ra).","w":{"a":"Đảo ngược nội dung và hình thức.","b":"Cả hai đều chủ quan là duy tâm chủ quan."}},{"s":5,"n":"20","q":"Quan điểm triết học nào cho các phạm trù hoàn toàn tách rời nhau, không vận động, phát triển?","o":["Quan điểm siêu hình.","Quan điểm duy vật biện chứng.","Quan điểm duy tâm biện chứng."],"a":[0],"p":39,"e":"Cho các phạm trù hoàn toàn tách rời nhau, không vận động, phát triển là quan điểm siêu hình.","w":{"b":"Duy vật biện chứng coi phạm trù vận động, chuyển hóa.","c":"Biện chứng duy tâm cũng coi phạm trù vận động."}},{"s":5,"n":"21","q":"Chọn cụm từ thích hợp điền vào chỗ trống của câu sau để được định nghĩa khái niệm cái riêng: \"cái riêng là phạm trù triết học dùng để chỉ......\"","o":["Một sự vật, một quá trình riêng lẻ nhất định.","Một đặc điểm chung của các sự vật","Nét đặc thù của một số các sự vật."],"a":[0],"p":39,"e":"Cái riêng là phạm trù triết học chỉ một sự vật, một quá trình riêng lẻ nhất định.","w":{"b":"Đặc điểm chung của các sự vật là cái chung.","c":"Nét đặc thù của một số sự vật chưa phải định nghĩa cái riêng."}},{"s":5,"n":"22","q":"Chọn cụm từ thích hợp điền vào chỗ trống của câu sau để được định nghĩa khái niệm cái chung: \"cái chung là phạm trù triết học dùng để chỉ......., được lặp lại trong nhiều sự vật hay quá trình riêng lẻ\".","o":["Một sự vật, một quá trình.","Những mặt, những thuộc tính.","Những mặt, những thuộc tính không"],"a":[1],"p":39,"e":"Cái chung là phạm trù chỉ những mặt, những thuộc tính được lặp lại trong nhiều sự vật hay quá trình riêng lẻ.","w":{"a":"Một sự vật, một quá trình là cái riêng.","c":"Phương án này bị cắt dở trong file gốc và không thành định nghĩa cái chung."}},{"s":5,"n":"23","q":"Thêm cụm từ vào chỗ trống của câu sau để được định nghĩa khái niệm cái đơn nhất: \"Cái đơn nhất là phạm trù triết học dùng để chỉ.........\"","o":["Những mặt lặp lại trong nhiều sự vật","Một sự vật riêng lẻ.","Những nét, những mặt chỉ ở một sự vật"],"a":[2],"p":39,"e":"Cái đơn nhất là phạm trù chỉ những nét, những mặt chỉ có ở một sự vật, không lặp lại ở sự vật khác.","w":{"a":"Những mặt lặp lại ở nhiều sự vật là cái chung.","b":"Một sự vật riêng lẻ là cái riêng."}},{"s":5,"n":"24","q":"Phái triết học nào cho chỉ có cái chung tồn tại thực, còn cái riêng không tồn tại thực?","o":["Phái Duy Thực.","Phái Duy Danh","Phái nguỵ biện","Phái chiết trung"],"a":[0],"p":39,"e":"Phái Duy thực (thời trung cổ) cho rằng chỉ có cái chung tồn tại thực, cái riêng chỉ là biểu hiện của cái chung.","w":{"b":"Phái Duy danh cho rằng chỉ có cái riêng tồn tại thực.","c":"Nguỵ biện và chiết trung không phải hai trường phái bàn về quan hệ chung - riêng theo cách này.","d":"Nguỵ biện và chiết trung không phải hai trường phái bàn về quan hệ chung - riêng theo cách này."}},{"s":5,"n":"25","q":"Trường phái triết học nào thừa nhận chỉ có cái riêng tồn tại thực, cái chung chỉ là tên gọi trống rỗng?","o":["Phái Duy Thực","Phái Duy Danh","Phái chiết trung","Phái nguỵ biện."],"a":[1],"p":39,"e":"Phái Duy danh cho rằng chỉ có cái riêng tồn tại thực, cái chung chỉ là tên gọi trống rỗng.","w":{"a":"Phái Duy thực nói ngược lại.","c":"Chiết trung và nguỵ biện không đưa ra quan điểm này.","d":"Chiết trung và nguỵ biện không đưa ra quan điểm này."}},{"s":5,"n":"26","q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa cái chung và cái riêng","o":["Chỉ có cái chung tồn tại khách quan và vĩnh viễn.","Chỉ có cái riêng tồn tại khách quan và thực sự","Cái riêng và cái chung đều tồn tại khách quan và không tách rời nhau."],"a":[2],"p":40,"e":"Chủ nghĩa duy vật biện chứng cho rằng cái riêng và cái chung đều tồn tại khách quan và không tách rời nhau.","w":{"a":"Chỉ có cái chung tồn tại là quan điểm duy thực.","b":"Chỉ có cái riêng tồn tại là quan điểm duy danh."}},{"s":5,"n":"27","q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa cái chung và cái riêng?","o":["Cái chung tồn tại khách quan, bên ngoài cái riêng.","Cái riêng tồn tại khách quan không bao chứa cái chung","Không có cái chung thuần tuý tồn tại ngoài cái riêng, cái chung tồn tại thông qua cái riêng."],"a":[2],"p":40,"e":"Không có cái chung thuần túy tồn tại ngoài cái riêng, cái chung tồn tại thông qua cái riêng và biểu hiện ở cái riêng.","w":{"a":"Cái chung tồn tại ngoài cái riêng là quan điểm duy thực.","b":"Cái riêng chứa cái chung, không phải không bao chứa."}},{"s":5,"n":"28","q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa cái chung và cái riêng?","o":["Cái riêng chỉ tồn tại trong mối liên hệ với cái chung.","Cái riêng không bao chứa cái chung nào.","Cái riêng và cái chung hoàn toàn tách rời nhau"],"a":[0],"p":40,"e":"Cái riêng chỉ tồn tại trong mối liên hệ với cái chung, vì mỗi cái riêng đều chứa những thuộc tính chung.","w":{"b":"Cái riêng luôn bao chứa cái chung.","c":"Cái riêng và cái chung gắn bó, không tách rời."}},{"s":5,"n":"29","q":"Trong những luận điểm sau, đâu là luận điểm của chủ nghĩa duy vật biện chứng?","o":["Mỗi con người là một cái riêng, không có gì chung với người khác,","Mỗi con người vừa là cái riêng, đồng thời có nhiều cái chung với người khác.","Mỗi người chỉ là sự thể hiện của cái chung, không có cái đơn nhất của nó."],"a":[1],"p":40,"e":"Mỗi con người vừa là cái riêng (cá nhân độc nhất), vừa có nhiều điểm chung với người khác (cùng là con người, cùng thuộc xã hội).","w":{"a":"Con người không phải không có gì chung với người khác.","c":"Mỗi người có cả nét đơn nhất riêng lẫn nét chung với người khác."}},{"s":5,"n":"30","q":"Luận điểm nào sâu đây là luận điểm của chủ nghĩa duy vật biện chứng?","o":["Mỗi khái niệm là một cái riêng","Mỗi khái niệm là một cái chung.","Mỗi khái niệm vừa là cái riêng vừa là cái chung."],"a":[2],"p":40,"e":"Mỗi khái niệm vừa là cái riêng (so với khái niệm rộng hơn) vừa là cái chung (so với các sự vật nằm trong nó). Cái chung và cái riêng chỉ có tính tương đối.","w":{"a":"Chỉ là cái riêng thì bỏ qua tính chung của khái niệm.","b":"Chỉ là cái chung thì bỏ qua tính riêng."}},{"s":5,"n":"31","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Không có cái chung tồn tại thuần tuý bên ngoài cái riêng. Không có cái riêng tồn tại không liên hệ với cái chung\"","o":["Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm siêu hình."],"a":[1],"p":40,"e":"Không có cái chung thuần túy ngoài cái riêng, không có cái riêng không liên hệ với cái chung, là quan điểm duy vật biện chứng.","w":{"a":"Duy vật siêu hình không nhìn thấy mối liên hệ biện chứng giữa chung và riêng.","c":"Duy tâm siêu hình tuyệt đối hóa một mặt."}},{"s":5,"n":"32","q":"Thêm cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm nguyên nhân: Nguyên nhân là phạm trù chỉ....(1).. giữa các mặt trong một sự vật, hoặc giữa các sự vật với nhau gây ra...(2)..","o":["1- sự liên hệ lẫn nhau, 2- một sự vật mới","1- sự thống nhất, 2- một sự vật mới","1- sự tác động lẫn nhau, 2- một biến đổi nhất định nào đó."],"a":[2],"p":40,"e":"Nguyên nhân là phạm trù chỉ sự tác động lẫn nhau giữa các mặt trong một sự vật hoặc giữa các sự vật với nhau, gây ra một biến đổi nhất định.","w":{"a":"Liên hệ lẫn nhau là khái niệm rộng hơn, và \"một sự vật mới\" thu hẹp kết quả.","b":"Sự thống nhất không phải là sự tác động gây ra biến đổi."}},{"s":5,"n":"33","q":"Thêm cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm kết quả: \"Kết quả là...(1).. do...(2).. lẫn nhau giữa các mặt trong một sự vật hoặc giữa các sự vật với nhau gây ra\"","o":["1- mối liên hệ, 2- kết hợp","1- sự tác động, 2- những biến đổi","1- những biến đổi xuất hiện, 2- sự tác động."],"a":[2],"p":40,"e":"Kết quả là những biến đổi xuất hiện do sự tác động lẫn nhau giữa các mặt trong một sự vật hoặc giữa các sự vật với nhau gây ra.","w":{"a":"Mối liên hệ và kết hợp không thành định nghĩa kết quả.","b":"Phương án này đảo vị trí giữa tác động và biến đổi."}},{"s":5,"n":"34","q":"Xác định nguyên nhân của sự phát sáng của dây tóc bóng đèn.","o":["Nguồn điện","Dây tóc bóng đèn","Sự tác động giữa dòng điện và dây tóc bóng đèn"],"a":[2],"p":40,"e":"Nguyên nhân phát sáng của dây tóc là sự tác động giữa dòng điện và dây tóc bóng đèn, vì nguyên nhân là sự tác động lẫn nhau giữa các sự vật, không nằm ở một sự vật riêng lẻ.","w":{"a":"Nguồn điện một mình chưa gây ra phát sáng.","b":"Dây tóc một mình cũng chưa phát sáng."}},{"s":5,"n":"35","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng đâu là nguyên nhân của cách mạng vô sản.","o":["Sự xuất hiện giai cấp tư sản.","Sự xuất hiện nhà nước tư sản","Sự xuất hiện giai cấp vô sản và Đảng của nó","Mâu thuẫn giữa giai cấp tư sản và giai cấp vô sản."],"a":[3],"p":41,"e":"Nguyên nhân của cách mạng vô sản là mâu thuẫn giữa giai cấp tư sản và giai cấp vô sản, vì mâu thuẫn là động lực của sự biến đổi xã hội.","w":{"a":"Sự xuất hiện giai cấp tư sản là điều kiện, chưa phải nguyên nhân trực tiếp.","b":"Nhà nước tư sản là công cụ của giai cấp tư sản.","c":"Giai cấp vô sản và Đảng là lực lượng thực hiện cách mạng."}},{"s":5,"n":"36","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là đúng","o":["Có thể coi nguyên nhân và kết quả nằm ở hai sự vật khác nhau.","Không thể coi nguyên nhân và kết quả nằm ở hai sự vật khác nhau.","Nguyên nhân và kết quả không cùng một kết cấu vật chất."],"a":[1],"p":41,"e":"Nguyên nhân là sự tác động lẫn nhau và kết quả là biến đổi do tác động đó gây ra. Hai mặt này gắn liền trong cùng một quá trình tác động, không thể xem là nằm ở hai sự vật tách rời.","w":{"a":"Cách hiểu này tách nguyên nhân và kết quả thành hai sự vật rời nhau.","c":"Nguyên nhân và kết quả có thể cùng nằm trong một kết cấu vật chất."}},{"s":5,"n":"37","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Mối liên hệ nhân quả là do cảm giác con người quy định\"","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình"],"a":[1],"p":41,"e":"Cho mối liên hệ nhân quả do cảm giác con người quy định là duy tâm chủ quan.","w":{"a":"Duy tâm khách quan dựa vào ý niệm tuyệt đối.","c":"Duy vật biện chứng coi nhân quả là khách quan.","d":"Duy vật siêu hình cũng coi nhân quả là khách quan."}},{"s":5,"n":"38","q":"Luận điểm sau đây thuộc lập trường triết học nào: Mối liên hệ nhân quả là do ý niệm tuyệt đối quyết định.","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình."],"a":[0],"p":41,"e":"Cho mối liên hệ nhân quả do ý niệm tuyệt đối quyết định là duy tâm khách quan (kiểu Hê-ghen).","w":{"b":"Duy tâm chủ quan dựa vào cảm giác.","c":"Duy vật biện chứng coi nhân quả là khách quan.","d":"Duy vật siêu hình cũng coi nhân quả là khách quan."}},{"s":5,"n":"39","q":"Luận điểm sau đây là của trường phái triết học nào: Mối liên hệ nhân quả tồn tại khách quan phổ biến và tất yếu trong thế giới vật chất.","o":["Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật biện chứng"],"a":[2],"p":41,"e":"Mối liên hệ nhân quả tồn tại khách quan, phổ biến và tất yếu là quan điểm duy vật biện chứng.","w":{"a":"Duy tâm chủ quan phủ nhận tính khách quan của nhân quả.","b":"Duy tâm khách quan coi nhân quả do ý niệm tuyệt đối."}},{"s":5,"n":"40","q":"Luận điểm sau đây là thuộc lập trường triết học nào: Mọi hiện tượng, quá trình đều có nguyên nhân tồn tại khách quan không phụ thuộc vào việc chúng ta có nhận thức được điều đó hay không.","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật biện chứng"],"a":[2],"p":41,"e":"Mọi hiện tượng đều có nguyên nhân khách quan, không phụ thuộc vào việc chúng ta nhận thức được hay không, là quan điểm duy vật biện chứng.","w":{"a":"Duy tâm chủ quan coi nhân quả phụ thuộc nhận thức.","b":"Duy tâm khách quan coi nhân quả do ý niệm."}},{"s":5,"n":"41","q":"Luận điểm sau đây thuộc lập trường triết học nào: Không thể khẳng định một hiện tượng nào đó có nguyên nhân hay không khi chưa nhận thức được nguyên nhân của nó.","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình."],"a":[0],"p":41,"e":"Cho rằng chưa thể khẳng định một hiện tượng có nguyên nhân hay không khi chưa nhận thức được nguyên nhân, tức coi nhân quả phụ thuộc nhận thức, là duy tâm chủ quan.","w":{"b":"Duy tâm khách quan dựa vào ý niệm tuyệt đối.","c":"Duy vật biện chứng coi nhân quả tồn tại khách quan.","d":"Duy vật siêu hình cũng thừa nhận nhân quả khách quan."}},{"s":5,"n":"42","q":"Trong những luận điểm sau đây, đâu là luận điểm của chủ nghĩa duy vật biện chứng?","o":["Ý thức con người không sáng tạo ra mối liên hệ nhân quả của hiện thực.","Mối liên hệ nhân quả chỉ tồn tại khi chúng ta nhận thức được nó.","Không phải mọi hiện tượng đều có nguyên nhân."],"a":[0],"p":41,"e":"Chủ nghĩa duy vật biện chứng cho rằng ý thức không sáng tạo ra mối liên hệ nhân quả, nhân quả tồn tại khách quan.","w":{"b":"Nhân quả chỉ tồn tại khi nhận thức được là duy tâm chủ quan.","c":"Không phải mọi hiện tượng đều có nguyên nhân là phủ nhận tính nhân quả phổ biến."}},{"s":5,"n":"43","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng nhận định nào sau đây là đúng?","o":["Nguyên nhân luôn luôn xuất hiện trước kết quả.","Cái xuất hiện trước đều là nguyên nhân của cái xuất hiện sau.","Mọi sự kế tiếp nhau về mặt thời gian đều là quan hệ nhân quả."],"a":[0],"p":42,"e":"Nguyên nhân luôn xuất hiện trước kết quả. Tuy vậy, không phải cái gì xuất hiện trước cũng là nguyên nhân.","w":{"b":"Cái xuất hiện trước chưa chắc là nguyên nhân của cái xuất hiện sau.","c":"Kế tiếp về thời gian chưa phải quan hệ nhân quả."}},{"s":5,"n":"44","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng đâu là luận điểm sai?","o":["Mọi cái xuất hiện trước đều là nguyên nhân của cái xuất hiện sau.","Nguyên nhân là cái sản sinh ra kết quả.","Nguyên nhân xuất hiện trước kết quả."],"a":[0],"p":42,"e":"Không phải cái gì xuất hiện trước cũng là nguyên nhân của cái xuất hiện sau. Nguyên nhân phải sản sinh ra kết quả. Vì vậy luận điểm a sai.","w":{"b":"Đúng: nguyên nhân là cái sản sinh ra kết quả.","c":"Đúng: nguyên nhân xuất hiện trước kết quả."}},{"s":5,"n":"45","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Nguyên nhân giống nhau trong những điều kiện khác nhau có thể đưa đến nhứng kết quả khác nhau.","Nguyên nhân khác nhau cũng có thể đưa đến kết quả như nhau.","Nguyên nhân giống nhau trong điều kiện giống nhau luôn luôn đưa đến kết quả như nhau."],"a":[2],"p":42,"e":"Cùng một nguyên nhân trong điều kiện giống nhau thì cho kết quả giống nhau, nhưng phương án c nói \"luôn luôn\" nên chưa đúng với thực tế. Nguyên nhân khác nhau có thể cho cùng kết quả, và nguyên nhân giống nhau trong điều kiện khác nhau cho kết quả khác nhau.","w":{"a":"Đúng: điều kiện khác nhau thì kết quả khác nhau.","b":"Đúng: nguyên nhân khác nhau có thể dẫn đến kết quả như nhau."},"f":"Phương án C là đáp án trong file. Cách diễn đạt \"luôn luôn\" làm câu này dễ gây tranh luận. Khi thi nên đối chiếu theo giáo trình của trường."},{"s":5,"n":"46","q":"Trong những luận điểm sau, đâu là luận điểm của chủ nghĩa duy vật biện chứng?","o":["Kết quả do nguyên nhân quyết định, nhưng kết quả lại tác động trở lại nguyên nhân.","Kết quả không tác động gì đối với nguyên nhân.","Kết quả và nguyên nhân không thể thay đổi vị trí cho nhau."],"a":[0],"p":42,"e":"Nguyên nhân sinh ra kết quả, nhưng kết quả sinh ra rồi lại tác động trở lại nguyên nhân. Nguyên nhân và kết quả có thể chuyển hóa cho nhau trong chuỗi quan hệ nhân quả.","w":{"b":"Kết quả có tác động trở lại nguyên nhân.","c":"Nguyên nhân và kết quả có thể đổi chỗ cho nhau trong một chuỗi liên hệ khác."}},{"s":5,"n":"47","q":"Điền cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm ngẫu nhiên: \"Ngẫu nhiên là cái không do...(1)... kết cấu vật chất quyết định, mà do...(2)... quyết định\"","o":["1- nguyên nhân, 2- hoàn cảnh bên ngoài.","1- Mối liên hệ bản chất bên trong, 2- nhân tố bên ngoài.","1- mối liên hệ bên ngoài, 2- mối liên hệ bên trong."],"a":[1],"p":42,"e":"Ngẫu nhiên là cái không do mối liên hệ bản chất bên trong kết cấu vật chất quyết định, mà do các nhân tố bên ngoài, hoàn cảnh quyết định.","w":{"a":"Ngẫu nhiên vẫn có nguyên nhân, nhưng định nghĩa nêu quan hệ bản chất bên trong và nhân tố bên ngoài.","c":"Đảo ngược bên trong và bên ngoài."}},{"s":5,"n":"48","q":"Trong nhứng luận điểm sau đây, đâu là luận điểm của chủ nghĩa duy vật biện chứng?","o":["Mọi cái chung đều là cái tất yếu.","Mọi cái chung đều không phải là cái tất yếu.","Chỉ có cái chung được quyết định bởi bản chất nội tại của sự vật mới là cái tất yếu."],"a":[2],"p":42,"e":"Chỉ có cái chung do bản chất nội tại của sự vật quyết định mới là cái tất yếu. Có cái chung ngẫu nhiên không phải tất yếu.","w":{"a":"Mọi cái chung đều là cái tất yếu là sai, vì còn cái chung ngẫu nhiên.","b":"Mọi cái chung đều không phải tất yếu cũng sai."}},{"s":5,"n":"49","q":"Nhu cầu ăn, mặc, ở, học tập của con người là cái chung hay là cái tất yếu?","o":["Là cái chung","Là cái tất yếu","Vừa là cái chung vừa là cái tất yếu."],"a":[2],"p":42,"e":"Nhu cầu ăn, mặc, ở, học tập là cái chung vì mọi người đều có, và là cái tất yếu vì do bản chất của con người quyết định.","w":{"a":"Đúng nhưng chưa đủ, nó còn là cái tất yếu.","b":"Đúng nhưng chưa đủ, nó còn là cái chung."}},{"s":5,"n":"50","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Mọi cái tất yếu đều là cái chung.","Mọi cái chung đều là cái tất yếu.","Không phải cái chung nào cũng là cái tất yếu."],"a":[1],"p":43,"e":"Không phải cái chung nào cũng là cái tất yếu, nên \"mọi cái chung đều là cái tất yếu\" là luận điểm sai.","w":{"a":"Đúng: mọi cái tất yếu đều là cái chung.","c":"Đúng: không phải cái chung nào cũng tất yếu."}},{"s":5,"n":"51","q":"Sự giống nhau về sở thích ăn, mặc, ở, học nghệ gì là cái chung tất yếu hay là cái chung có tính chất ngẫu nhiên","o":["Cái chung tất yếu","Cái chung ngẫu nhiên"],"a":[1],"p":43,"e":"Sự giống nhau về sở thích ăn, mặc, ở, học nghề là cái chung ngẫu nhiên, vì sở thích do hoàn cảnh và cá nhân quy định, không do bản chất bên trong quyết định.","w":{"a":"Cái chung tất yếu do bản chất quyết định, như nhu cầu ăn, mặc, ở."}},{"s":5,"n":"52","q":"theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Ngẫu nhiên và tất nhiên đều có nguyên nhân","Những hiện tượng chưa nhận thức được nguyên nhân là cái ngẫu nhiên.","Những hiện tượng nhận thức được nguyên nhân đều trở thành cái tất yếu."],"a":[0],"p":43,"e":"Cả cái ngẫu nhiên và cái tất nhiên đều có nguyên nhân. Cái ngẫu nhiên chỉ khác ở chỗ nguyên nhân là nhân tố bên ngoài.","w":{"b":"Hiện tượng chưa nhận thức được nguyên nhân chưa chắc là ngẫu nhiên.","c":"Nhận thức được nguyên nhân không biến cái ngẫu nhiên thành tất yếu."}},{"s":5,"n":"53","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng khẳng định nào sau đây là đúng?","o":["Cái ngẫu nhiên không có nguyên nhân.","Chỉ có cái tất yếu mới có nguyên nhân.","Không phải cái gì con người chưa nhận thức được nguyên nhân là cái ngẫu nhiên."],"a":[2],"p":43,"e":"Không phải cái gì con người chưa nhận thức được nguyên nhân cũng là cái ngẫu nhiên. Ngẫu nhiên và tất nhiên là khách quan, không phụ thuộc nhận thức.","w":{"a":"Cái ngẫu nhiên vẫn có nguyên nhân.","b":"Cả cái tất yếu lẫn ngẫu nhiên đều có nguyên nhân."}},{"s":5,"n":"54","q":"Luận điểm sau đây thuộc lập trường triết học nào: Tất nhiên là cái chúng ta biết được nguyên nhân và chi phối được nó.","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình."],"a":[1],"p":43,"e":"Coi tất nhiên là cái ta biết được nguyên nhân và chi phối được, tức phụ thuộc vào nhận thức của ta, là duy tâm chủ quan.","w":{"a":"Duy tâm khách quan dựa vào ý niệm.","c":"Cả hai đều coi tất nhiên là khách quan.","d":"Cả hai đều coi tất nhiên là khách quan."}},{"s":5,"n":"55","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là đúng?","o":["Đối với sự phát triển của sự vật chỉ có cái tất nhiên mới có vai trò quan trọng.","Cái ngẫu nhiên không có vai trò gì đối với sự phát triển của sự vật","Cả cái tất yếu và cái ngẫu nhiên đều có vai trò quan trọng đối với sự phát triển của sự vật."],"a":[2],"p":43,"e":"Cả cái tất yếu và cái ngẫu nhiên đều có vai trò quan trọng đối với sự phát triển. Cái tất yếu quyết định xu hướng, cái ngẫu nhiên làm sự phát triển diễn ra nhanh hay chậm.","w":{"a":"Cái ngẫu nhiên cũng có ảnh hưởng.","b":"Cái ngẫu nhiên không phải vô tác dụng."}},{"s":5,"n":"56","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Có tất nhiên thuần tuý tồn tại khách quan","Có ngẫu nhiên thuần tuý tồn tại khách quan","Không có cái tất nhiên và ngẫu nhiên thuần tuý tồn tại bên ngoài nhau."],"a":[2],"p":43,"e":"Không có cái tất nhiên và cái ngẫu nhiên thuần túy tồn tại bên ngoài nhau. Cái tất nhiên biểu hiện qua cái ngẫu nhiên.","w":{"a":"Không có tất nhiên thuần túy.","b":"Không có ngẫu nhiên thuần túy."}},{"s":5,"n":"57","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Tất nhiên biểu hiện sự tồn tại của mình thông qua vô vàn cái ngẫu nhiên.","Ngẫu nhiên là hình thức biểu hiện của cái tất nhiên.","Có cái ngẫu nhiên thuần tuý không thể hiện cái tất nhiên."],"a":[2],"p":43,"e":"Mọi cái ngẫu nhiên đều ít nhiều biểu hiện cái tất nhiên. Không có cái ngẫu nhiên thuần túy tách rời tất nhiên, nên phương án c là sai.","w":{"a":"Đúng: tất nhiên biểu hiện qua vô vàn cái ngẫu nhiên.","b":"Đúng: ngẫu nhiên là hình thức biểu hiện của tất nhiên."}},{"s":5,"n":"58","q":"Luận điểm sau đây thuộc lập trường triết học nào: Tất nhiên và ngẫu nhiên tồn tại khách quan nhưng tách rời nhau, không có liên quan gì với nhau.","o":["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy tâm khách quan."],"a":[1],"p":44,"e":"Cho tất nhiên và ngẫu nhiên tồn tại khách quan nhưng tách rời nhau là quan điểm duy vật siêu hình.","w":{"a":"Duy vật biện chứng coi chúng gắn bó, chuyển hóa cho nhau.","c":"Duy tâm khách quan coi chúng do ý niệm."}},{"s":5,"n":"59","q":"Trong hoạt động thực tiễn phải dựa vào cái ngẫu nhiên hay tất nhiên là chính?","o":["Dựa vào ngẫu nhiên","Dựa vào tất yếu","Dựa vào cả hai"],"a":[1],"p":44,"e":"Trong thực tiễn phải dựa chủ yếu vào cái tất yếu, vì nó quyết định xu hướng phát triển. Cái ngẫu nhiên chỉ cần tính đến.","w":{"a":"Dựa vào ngẫu nhiên dễ sai lầm.","c":"Dựa vào cả hai nhưng đáp án nêu cái tất yếu là chính."}},{"s":5,"n":"60","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Không có hình thức tồn tại thuần tuý không chứa đựng nội dung.","Nội dung nào cũng tồn tại trong một hình thức nhất định.","Nội dung và hình thức hoàn toàn tách rời nhau."],"a":[2],"p":44,"e":"Nội dung và hình thức thống nhất với nhau, không tách rời. Vì vậy luận điểm \"hoàn toàn tách rời nhau\" là sai.","w":{"a":"Đúng: không có hình thức thuần túy không chứa nội dung.","b":"Đúng: nội dung nào cũng tồn tại trong một hình thức nhất định."}},{"s":6,"n":"1","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Nội dung và hình thức không tách rời nhau.","Nội dung và hình thức luôn luôn phù hợp với nhau.","Không phải lúc nào nội dung và hình thức cũng phù hợp với nhau."],"a":[1],"p":44,"e":"Nội dung và hình thức không phải lúc nào cũng phù hợp: có lúc phù hợp, có lúc mâu thuẫn. Vì vậy \"luôn luôn phù hợp\" là sai.","w":{"a":"Đúng: nội dung và hình thức không tách rời nhau.","c":"Đúng: không phải lúc nào cũng phù hợp."}},{"s":6,"n":"2","q":"Luận điểm sau đây thuộc lập trường triết học nào: Khái niệm hình thức được tạo ra trong tư duy của con người rồi đưa vào hiện thực để sắp xếp các sự vật cho có trật tự.","o":["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan"],"a":[1],"p":44,"e":"Cho khái niệm hình thức do tư duy tạo ra rồi đưa vào hiện thực để sắp xếp sự vật là duy tâm chủ quan.","w":{"a":"Duy vật biện chứng coi hình thức tồn tại khách quan.","c":"Duy tâm khách quan coi hình thức tồn tại trước sự vật."}},{"s":6,"n":"3","q":"Luận điểm sau đây thuộc lập trường triết học nào: Hình thức thuần tuý của sự vật tồn tại trước sự vật, quyết định nội dung của sự vật","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật biện chứng."],"a":[1],"p":44,"e":"Cho hình thức thuần túy của sự vật tồn tại trước sự vật và quyết định nội dung là duy tâm khách quan (kiểu Pla-tông).","w":{"a":"Duy tâm chủ quan coi hình thức do con người tạo ra.","c":"Duy vật biện chứng coi nội dung quyết định hình thức."}},{"s":6,"n":"4","q":"Trong các luận điểm sau, đâu là quan điểm của chủ nghĩa duy vật biện chứng về quan hệ giữa nội dung và hình thức?","o":["Nội dung quyết định hình thức trong sự phát triển của sự vật.","Hình thức quyết định nội dung.","Tồn tại hình thức thuần tuý không chứa đựng nội dung."],"a":[0],"p":44,"e":"Theo chủ nghĩa duy vật biện chứng, nội dung quyết định hình thức trong quá trình phát triển, hình thức tác động trở lại nội dung.","w":{"b":"Hình thức quyết định nội dung là đảo ngược quan hệ.","c":"Không có hình thức thuần túy tồn tại không chứa đựng nội dung."}},{"s":6,"n":"5","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, trong các luận điểm sau, đâu là luận điểm sai?","o":["Hình thức thúc đẩy nội dung phát triển nếu nó phù hợp với nội dung.","Hình thức kìm hãm nội dung phát triển nếu nó không phù hợp với nội dung.","Hình thức hoàn toàn không phụ thuộc vào nội dung"],"a":[2],"p":45,"e":"Hình thức phụ thuộc vào nội dung và phản ánh nội dung, nên \"hoàn toàn không phụ thuộc\" là sai.","w":{"a":"Đúng: hình thức phù hợp thì thúc đẩy nội dung phát triển.","b":"Đúng: hình thức không phù hợp thì kìm hãm nội dung."}},{"s":6,"n":"6","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Bản chất đồng nhất với cái chung.","Cái chung và bản chất hoàn toàn khác nhau, không có gì chung","Có cái chung là bản chất, có cái chung không phải là bản chất."],"a":[2],"p":45,"e":"Có cái chung là bản chất, có cái chung không phải bản chất. Bản chất là cái chung nhưng không phải cái chung nào cũng là bản chất.","w":{"a":"Bản chất không đồng nhất với cái chung.","b":"Bản chất và cái chung có điểm giao nhau."}},{"s":6,"n":"7","q":"Luận điểm sau đây thuộc lập trường triết học nào: Bản chất là những thực thể tinh thần tồn tại khách quan, quyết định sự tồn tại của sự vật","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật siêu hình."],"a":[1],"p":45,"e":"Cho bản chất là thực thể tinh thần tồn tại khách quan, quyết định sự tồn tại của sự vật, là duy tâm khách quan.","w":{"a":"Duy tâm chủ quan coi bản chất do con người đặt ra.","c":"Duy vật siêu hình coi bản chất là vật chất."}},{"s":6,"n":"8","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Bản chất chỉ là tên gọi trống rỗng, do con người đặt ra, không tồn tại thực\"","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật biện chứng"],"a":[0],"p":45,"e":"Cho bản chất chỉ là tên gọi trống rỗng do con người đặt ra là duy tâm chủ quan, vì phủ nhận sự tồn tại khách quan của bản chất.","w":{"b":"Duy tâm khách quan coi bản chất là thực thể tinh thần có thật.","c":"Duy vật biện chứng coi bản chất tồn tại khách quan."}},{"s":6,"n":"9","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Hiện tượng tồn tại, nhưng đó là tổng hợp những cảm giác của con người\".","o":["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy tâm chủ quan"],"a":[2],"p":45,"e":"Coi hiện tượng chỉ là tổng hợp cảm giác của con người là duy tâm chủ quan.","w":{"a":"Duy vật biện chứng coi hiện tượng tồn tại khách quan.","b":"Duy tâm khách quan nói đến ý niệm."}},{"s":6,"n":"10","q":"Luận điểm nào sau đây là luận điểm của chủ nghĩa duy vật biện chứng?","o":["Bản chất tồn tại khách quan bên ngoài sự vật","Hiện tượng là tổng hợp các cảm giác của con người","Bản chất và hiện tượng đều tồn tại khách quan, là cái vốn có của sự vật."],"a":[2],"p":45,"e":"Bản chất và hiện tượng đều tồn tại khách quan, là cái vốn có của sự vật.","w":{"a":"Bản chất tồn tại trong sự vật, không ở bên ngoài.","b":"Hiện tượng là tổng hợp cảm giác là duy tâm chủ quan."}},{"s":6,"n":"11","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là đúng?","o":["Hiện tượng không bộc lộ bản chất","Có hiện tượng hoàn toàn không biểu hiện bản chất.","Hiện tượng nào cũng biểu hiện bản chất ở một mức độ nhất định."],"a":[2],"p":45,"e":"Hiện tượng nào cũng biểu hiện bản chất ở một mức độ nhất định, nên bản chất được nhận thức thông qua hiện tượng.","w":{"a":"Hiện tượng luôn bộc lộ bản chất.","b":"Không có hiện tượng hoàn toàn không biểu hiện bản chất."}},{"s":6,"n":"12","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là đúng?","o":["Bản chất không được biểu hiện ở hiện tượng","Bản chất nào hiện tượng ấy, bản chất hoàn toàn đồng nhất với hiện tượng.","Bản chất nào hiện tượng ấy, bản chất thay đổi hiện tượng biểu hiện nó cũng thay đổi."],"a":[2],"p":45,"e":"Bản chất nào thì hiện tượng ấy; khi bản chất thay đổi thì hiện tượng biểu hiện nó cũng thay đổi.","w":{"a":"Bản chất luôn biểu hiện qua hiện tượng.","b":"Bản chất và hiện tượng không hoàn toàn đồng nhất."}},{"s":6,"n":"13","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Bản chất và hiện tượng không hoàn toàn phù hợp nhau.","Cùng một bản chất có thể biểu hiện ở nhiều hiện tượng khác nhau","Một bản chất không thể biểu hiện ở nhiều hiện tượng khác nhau."],"a":[2],"p":46,"e":"Một bản chất có thể biểu hiện ở nhiều hiện tượng khác nhau, nên \"không thể biểu hiện ở nhiều hiện tượng\" là sai.","w":{"a":"Đúng: bản chất và hiện tượng không hoàn toàn phù hợp.","b":"Đúng: một bản chất có nhiều hiện tượng."}},{"s":6,"n":"14","q":"Theo quan điểm của chủ nghĩa Mác - Lênin, luận điểm nào sau đây nói về bản chất của giai cấp tư sản?","o":["Giai cấp tư sản bóc lột giá trị thặng dư","Giai cấp tư sản tích cực đổi mới công nghệ","Giai cấp tư sản thường áp dụng khoa học kỹ thuật, nâng cao năng suất lao động","Giai cấp tư sản tích cực đổi mới phương pháp quản lý."],"a":[0],"p":46,"e":"Bản chất của giai cấp tư sản là bóc lột giá trị thặng dư. Các hoạt động như đổi mới công nghệ chỉ là phương tiện để tăng giá trị thặng dư.","w":{"b":"Đổi mới công nghệ là biểu hiện, không phải bản chất.","c":"Áp dụng khoa học kỹ thuật là biểu hiện, không phải bản chất.","d":"Đổi mới phương pháp quản lý là biểu hiện, không phải bản chất."}},{"s":6,"n":"15","q":"Điền cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm hiện thực: \"Hiện thực là phạm trù triết học chỉ cái.........\"","o":["Mối liên hệ giữa các sự vật.","Chưa có, chưa tồn tại","Hiện có đang tồn tại"],"a":[2],"p":46,"e":"Hiện thực là phạm trù triết học chỉ cái hiện có, đang tồn tại.","w":{"a":"Mối liên hệ giữa các sự vật là định nghĩa của liên hệ.","b":"Cái chưa có, chưa tồn tại là khả năng."}},{"s":6,"n":"16","q":"Điền cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm khả năng: \"Khả năng là phạm trù triết học chỉ.......... khi có các điều kiện thích hợp\".","o":["Cái đang có, đang tồn tại","Cái chưa có, nhưng sẽ có","Cái không thể có","Cái tiền đề để tạo nên sự vật mới."],"a":[1],"p":46,"e":"Khả năng là phạm trù chỉ cái chưa có, nhưng sẽ có khi có các điều kiện thích hợp.","w":{"a":"Cái đang có là hiện thực.","c":"Cái không thể có là không khả năng.","d":"Tiền đề để tạo ra sự vật mới không phải định nghĩa khả năng."}},{"s":6,"n":"17","q":"Dấu hiệu để phân biệt khả năng với hiện thực là gì?","o":["Sự có mặt và không có mặt trên thực tế","Sự nhận biết được hay không nhận biết được.","Sự xác định hay không xác định."],"a":[0],"p":46,"e":"Dấu hiệu phân biệt khả năng và hiện thực là sự có mặt hay không có mặt trên thực tế. Hiện thực đang có, khả năng chưa có.","w":{"b":"Nhận biết được hay không là chuyện nhận thức, không phải thuộc tính của sự vật.","c":"Xác định hay không xác định không phân biệt khả năng với hiện thực."}},{"s":6,"n":"18","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Cái hiện chưa có nhưng sẽ có là khả năng.","Cái hiện đang có là hiện thực.","Cái chưa cảm nhận được là khả năng."],"a":[0],"p":46,"e":"File gốc đánh dấu đáp án A. Cần biết rằng \"cái hiện chưa có nhưng sẽ có là khả năng\" chính là định nghĩa khả năng, còn khả năng không phụ thuộc vào việc con người cảm nhận được hay chưa.","w":{"b":"Cái hiện đang có là hiện thực, đúng với giáo trình.","c":"Khả năng tồn tại khách quan, không phụ thuộc vào cảm nhận của con người, nên phương án này mới là nhận định sai theo giáo trình."},"f":"Đáp án trong file là A, nhưng theo giáo trình, A là định nghĩa đúng và C mới là phương án sai. Câu này có thể có sai lệch trong file gốc."},{"s":6,"n":"19","q":"Thêm cụm từ nào vào câu sau để được một khẳng định của chủ nghĩa duy vật biện chứng về các loại khả năng: \"Khả năng hình thành do các....... quy định được gọi là khả năng ngẫu nhiên\".","o":["Mối liên hệ chung","Mối liên hệ tất nhiên, ổn định","Tương tác ngẫu nhiên","Nguyên nhân bên trong"],"a":[2],"p":46,"e":"Khả năng hình thành do các tương tác ngẫu nhiên quy định được gọi là khả năng ngẫu nhiên.","w":{"a":"Mối liên hệ chung không xác định loại khả năng.","b":"Mối liên hệ tất nhiên, ổn định tạo ra khả năng tất nhiên.","d":"Nguyên nhân bên trong gắn với khả năng tất nhiên."}},{"s":6,"n":"20","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Khả năng và hiện thực đều tồn tại khách quan.","Khả năng và hiện thực không tách rời nhau","Chỉ có hiện thực tồn tại khách quan, khả năng chỉ là cảm giác của con người."],"a":[2],"p":46,"e":"Khả năng tồn tại khách quan, độc lập với cảm giác của con người. Vì vậy phương án c là sai.","w":{"a":"Đúng: khả năng và hiện thực đều khách quan.","b":"Đúng: khả năng và hiện thực không tách rời."}},{"s":6,"n":"21","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Hiện thực nào cũng chứa đựng khả năng.","Khả năng luôn tồn tại trong hiện thực.","Khả năng chỉ tồn tại trong ý niệm, không tồn tại trong hiện thực."],"a":[2],"p":47,"e":"Khả năng tồn tại ngay trong hiện thực, độc lập với ý niệm trong đầu người. Phương án c là sai.","w":{"a":"Đúng: hiện thực nào cũng chứa khả năng.","b":"Đúng: khả năng luôn tồn tại trong hiện thực."}},{"s":6,"n":"22","q":"Theo quan niệm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Cùng một sự vật, trong những điều kiện nhất định tồn tại nhiều khả năng.","Một sự vật trong những điều kiện nhất định chỉ tồn tại một khả năng.","Hiện thực thay đổi khả năng cũng thay đổi."],"a":[1],"p":47,"e":"Một sự vật trong những điều kiện nhất định có thể có nhiều khả năng. Phương án b là sai.","w":{"a":"Đúng: một sự vật có nhiều khả năng.","c":"Đúng: hiện thực thay đổi thì khả năng cũng thay đổi."}},{"s":6,"n":"23","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Trong hoạt động thực tiễn phải dựa vào khả năng.","Trong hoạt động thực tiễn phải dựa vào hiện thực, không cần tính đến khả năng.","Trong hoạt động thực tiễn phải dựa vào hiện thực, đồng thời phải tính đến khả năng."],"a":[2],"p":47,"e":"Trong hoạt động thực tiễn phải dựa vào hiện thực, đồng thời phải tính đến khả năng, vì khả năng cho biết hướng phát triển.","w":{"a":"Chỉ dựa vào khả năng là xa rời thực tế.","b":"Không tính đến khả năng làm mất định hướng."}},{"s":6,"n":"24","q":"Luận điểm sau thuộc lập trường triết học nào: Quy luật trong các khoa học là sự sáng tạo chủ quan của con người và được áp dụng vào tự nhiên và xã hội.","o":["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật siêu hình."],"a":[1],"p":47,"e":"Coi quy luật là sáng tạo chủ quan của con người rồi áp vào tự nhiên và xã hội là duy tâm chủ quan.","w":{"a":"Duy vật biện chứng coi quy luật khách quan.","c":"Duy tâm khách quan coi quy luật là của ý niệm.","d":"Duy vật siêu hình cũng coi quy luật là khách quan."}},{"s":6,"n":"25","q":"Điền tập hợp từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm \"chất\": \"Chất là phạm trù triết học dùng để chỉ... (1)... khách quan... (2)... là sự thống nhất hữu cơ những thuộc tính làm cho sự vật là nó chứ không là cái khác\"","o":["1- Tính quy định, 2- Vốn có của sự vật.","1- Mối liên hệ, 2- Của các sự vật.","1- Các nguyên nhân, 2- Của các sự vật."],"a":[0],"p":47,"e":"Chất là tính quy định khách quan vốn có của sự vật, là sự thống nhất hữu cơ các thuộc tính làm cho sự vật là nó chứ không phải cái khác.","w":{"b":"Mối liên hệ không phải định nghĩa của chất.","c":"Các nguyên nhân không phải định nghĩa của chất."}},{"s":6,"n":"26","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Chất là tính quy định vốn có của sự vật.","Chất là tổng hợp hữu cơ các thuộc tính của sự vật nói lên sự vật là cái gì.","Chất đồng nhất với thuộc tính."],"a":[2],"p":47,"e":"Chất là tính quy định tổng hợp của nhiều thuộc tính, nên không đồng nhất với một thuộc tính. Phương án c là sai.","w":{"a":"Đúng: chất là tính quy định vốn có của sự vật.","b":"Đúng: chất là sự tổng hợp hữu cơ các thuộc tính."}},{"s":6,"n":"27","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai","o":["Thuộc tính của sự vật là những đặc tính vốn có của sự vật.","Thuộc tính của sự vật bộc lộ thông qua sự tác động giữa các sự vật","Thuộc tính của sự vật không phải là cái vốn có của sự vật"],"a":[2],"p":47,"e":"Thuộc tính là cái vốn có của sự vật. Phương án c phủ nhận điều đó nên sai.","w":{"a":"Đúng: thuộc tính là đặc tính vốn có.","b":"Đúng: thuộc tính bộc lộ khi sự vật tác động qua lại."}},{"s":6,"n":"28","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Chất tồn tại khách quan bên ngoài sự vật.","Chất tồn tại khách quan gắn liền với sự vật.","Không có chất thuần tuý bên ngoài sự vật."],"a":[0],"p":48,"e":"Chất tồn tại khách quan gắn liền với sự vật, không tồn tại bên ngoài sự vật. Phương án a là sai.","w":{"b":"Đúng: chất gắn liền với sự vật.","c":"Đúng: không có chất thuần túy bên ngoài sự vật."}},{"s":6,"n":"29","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Mỗi sự vật có nhiều thuộc tính.","Mỗi thuộc tính biểu hiện một mặt chất của sự vật.","Mỗi thuộc tính có thể đóng vai trò là tính quy định về chất trong một quan hệ nhất định.","Mỗi sự vật chỉ có một tính quy định về chất."],"a":[3],"p":48,"e":"Mỗi sự vật có nhiều thuộc tính, và trong những quan hệ khác nhau thì thuộc tính khác nhau là tính quy định về chất. Vì vậy sự vật có nhiều tính quy định về chất, \"chỉ có một\" là sai.","w":{"a":"Đúng: sự vật có nhiều thuộc tính.","b":"Đúng: mỗi thuộc tính biểu hiện một mặt chất.","c":"Đúng: thuộc tính có thể là tính quy định về chất trong một quan hệ."}},{"s":6,"n":"30","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Không có chất thuần tuý tồn tại bên ngoài sự vật.","Chỉ có sự vật có chất mới tồn tại.","Chỉ có sự vật có vô vàn chất mới tồn tại","Sự vật và chất hoàn toàn đồng nhất với nhau."],"a":[3],"p":48,"e":"Sự vật và chất không đồng nhất hoàn toàn. Chất là một tính quy định của sự vật, nên phương án d là sai.","w":{"a":"Đúng: không có chất thuần túy bên ngoài sự vật.","b":"Đúng: sự vật tồn tại phải có chất.","c":"Đúng: sự vật nào cũng có vô vàn chất. Cách diễn đạt gượng nhưng ý này khớp giáo trình."},"f":"Phương án C cũng có cách diễn đạt khó, nhưng đáp án trong file là D."},{"s":6,"n":"31","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Chất của sự vật được biểu hiện thông qua thuộc tính của sự vật.","Mọi thuộc tính đều biểu hiện chất của sự vật.","Thuộc tính thay đổi, luôn làm cho chất của sự vật thay đổi."],"a":[0],"p":48,"e":"Chất của sự vật được biểu hiện thông qua các thuộc tính của nó, vì thuộc tính bộc lộ khi sự vật tác động với sự vật khác.","w":{"b":"Không phải mọi thuộc tính đều biểu hiện chất. Chỉ những thuộc tính cơ bản mới tạo thành chất.","c":"Thuộc tính thay đổi không phải lúc nào cũng làm chất thay đổi, chỉ thuộc tính cơ bản thay đổi mới làm chất thay đổi."}},{"s":6,"n":"32","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Chất của sự vật tồn tại do phương pháp quan sát sự vật của con người quyết định\".","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật siêu hình."],"a":[1],"p":48,"e":"Cho chất của sự vật do phương pháp quan sát của con người quyết định là duy tâm chủ quan, vì coi chất phụ thuộc vào chủ thể.","w":{"a":"Duy tâm khách quan coi chất do ý niệm quyết định.","c":"Duy vật siêu hình coi chất tồn tại khách quan."}},{"s":6,"n":"33","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Chất của sự vật phụ thuộc vào số lượng các yếu tố tạo thành sự vật.","Chất của sự vật phụ thuộc vào phương thức kết hợp các yếu tố của sự vật.","Mọi sự thay đổi phương thức kết hợp các yếu tố của sự vật, đều không làm cho chất của sự vật thay đổi."],"a":[2],"p":48,"e":"Chất của sự vật phụ thuộc cả vào số lượng các yếu tố lẫn phương thức kết hợp của chúng. Vì vậy \"thay đổi phương thức kết hợp không làm chất thay đổi\" là sai.","w":{"a":"Đúng: chất phụ thuộc vào số lượng yếu tố.","b":"Đúng: chất phụ thuộc vào phương thức kết hợp."}},{"s":6,"n":"34","q":"Luận điểm sau đây thuộc lập trường triết học nào: Chất tồn tại khách quan trước khi sự vật tồn tại, quyết định đến sự tồn tại của sự vật.","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng."],"a":[0],"p":48,"e":"Cho chất tồn tại khách quan trước sự vật và quyết định sự tồn tại của sự vật là duy tâm khách quan, vì đặt cái chung có trước cái riêng.","w":{"b":"Duy tâm chủ quan coi chất do ý thức con người quyết định.","c":"Cả hai đều coi chất gắn liền với sự vật.","d":"Cả hai đều coi chất gắn liền với sự vật."}},{"s":6,"n":"35","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Lượng là tính quy định vốn có của sự vật.","Lượng nói lên quy mô, trình độ phát triển của sự vật","Lượng phụ thuộc vào ý chí của con người.","Lượng tồn tại khách quan gắn liền với sự vật."],"a":[2],"p":48,"e":"Lượng tồn tại khách quan, không phụ thuộc ý chí con người. Phương án c vì vậy là sai.","w":{"a":"Đúng: lượng là tính quy định vốn có.","b":"Đúng: lượng nói lên quy mô, trình độ phát triển.","d":"Đúng: lượng tồn tại khách quan gắn liền với sự vật."}},{"s":6,"n":"36","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Chất và lượng của sự vật đều tồn tại khách quan.","Không có chất lượng thuần tuý tồn tại bên ngoài sự vật.","Sự phân biệt giữa chất và lượng phụ thuộc vào ý chí của con người","Sự phân biệt giữa chất và lượng của sự vật có tính chất tương đối."],"a":[2],"p":49,"e":"Sự phân biệt chất và lượng có tính tương đối, vì có tính quy định ở quan hệ này là chất nhưng ở quan hệ khác là lượng, và không phụ thuộc ý chí con người. Phương án c vì vậy là sai.","w":{"a":"Đúng: chất và lượng đều khách quan.","b":"Đúng: không có chất, lượng thuần túy ngoài sự vật.","d":"Đúng: sự phân biệt chất - lượng có tính tương đối."}},{"s":6,"n":"37","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Sự vật nào cũng là sự thống nhất giữa mặt chất và lượng.","Tính quy định về chất nào của sự vật cũng có tính quy định về lượng tương ứng.","Tính quy định về chất không có tính ổn định.","Tính quy định về lượng nói lên mặt thường xuyên biến đổi của sự vật."],"a":[2],"p":49,"e":"Tính quy định về chất tương đối ổn định, còn lượng thường xuyên biến đổi. Vì vậy phương án c là sai.","w":{"a":"Đúng: sự vật là thống nhất giữa chất và lượng.","b":"Đúng: mỗi tính quy định về chất có tính quy định về lượng tương ứng.","d":"Đúng: lượng là mặt thường xuyên biến đổi."}},{"s":6,"n":"38","q":"Theo quan điểm của CNDVBC luận điểm nào sau đây là đúng?","o":["Độ là phạm trù chỉ sự biến đổi của lượng.","Độ là phạm trù chỉ sự biến đổi của chất.","Độ là phạm trù triết học chỉ giới hạn biến đổi của lượng, trong đó chưa làm thay đổi chất của sự vật."],"a":[2],"p":49,"e":"Độ là phạm trù chỉ giới hạn trong đó sự biến đổi của lượng chưa làm thay đổi căn bản chất của sự vật.","w":{"a":"Độ là giới hạn của sự biến đổi lượng, bản thân nó không phải sự biến đổi của lượng.","b":"Độ cũng không phải sự biến đổi của chất."}},{"s":6,"n":"39","q":"Giới hạn từ 0oC đến 100oC được gọi là gì trong quy luật lượng - chất?","o":["Độ","Chất","Lượng","Bước nhảy"],"a":[0],"p":49,"e":"Giới hạn từ 0°C đến 100°C là độ, trong khoảng này nước vẫn giữ nguyên trạng thái lỏng.","w":{"b":"Chất là tính quy định vốn có.","c":"Lượng là quy mô, trình độ.","d":"Bước nhảy là sự chuyển hóa tại điểm nút (100°C)."}},{"s":6,"n":"40","q":"Khi nước chuyển từ trạng thái lỏng sang trạng thái khí tại 100oC được gọi là gì trong quy luật lượng - chất?","o":["Độ","Bước nhảy","Chuyển hoá","Tiệm tiến"],"a":[1],"p":49,"e":"Nước chuyển từ lỏng sang khí tại 100°C là bước nhảy, vì chất thay đổi căn bản khi lượng đạt đến điểm nút.","w":{"a":"Độ là giới hạn trước điểm nút.","c":"\"Chuyển hóa\" nói chung chưa chỉ đúng bước nhảy.","d":"\"Tiệm tiến\" là sự biến đổi dần về lượng."}},{"s":6,"n":"41","q":"Trong một mối quan hệ nhất định cái gì xác định sự vật?","o":["Tính quy định về lượng","Tính quy định về chất","Thuộc tính của sự vật."],"a":[1],"p":49,"e":"Trong một mối quan hệ nhất định, tính quy định về chất xác định sự vật là nó chứ không phải cái khác.","w":{"a":"Tính quy định về lượng nói lên quy mô, trình độ.","c":"Thuộc tính là yếu tố tạo thành chất."}},{"s":6,"n":"42","q":"Tính quy định nói lên sự vật trong một mối quan hệ nhất định đó, gọi là gì?","o":["Chất","Lượng","Độ","Bước nhảy"],"a":[0],"p":49,"e":"Chất là tính quy định khách quan vốn có của sự vật, làm cho nó là nó chứ không phải cái khác trong một mối quan hệ nhất định.","w":{"b":"Lượng là quy mô, trình độ.","c":"Độ là giới hạn giữa chất và lượng.","d":"Bước nhảy là sự chuyển hóa về chất."}},{"s":6,"n":"471","q":"Tính quy định nói lên quy mô trình độ phát triển của sự vật được gọi là gì?","o":["Chất","Lượng","Độ","Điểm nút"],"a":[1],"p":49,"e":"Lượng là tính quy định nói lên quy mô, trình độ phát triển, các yếu tố biểu hiện ở số lượng, tốc độ, màu sắc.","w":{"a":"Chất là tính quy định làm sự vật là nó.","c":"Độ là giới hạn.","d":"Điểm nút là giới hạn tại đó lượng gây ra thay đổi về chất."}},{"s":6,"n":"43","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai","o":["Trong giới hạn của độ sự thay đổi của lượng chưa làm cho chất của sự vật biến đổi.","Trong giới hạn của độ sự thay đổi của lượng đều đưa đến sự thay đổi về chất của sự vật.","Chỉ khi lượng đạt đến giới hạn của độ mới làm cho chất của sự vật thay đổi."],"a":[1],"p":49,"e":"Trong giới hạn của độ, thay đổi về lượng chưa làm chất thay đổi. Vì vậy \"đều đưa đến thay đổi về chất\" là sai.","w":{"a":"Đúng: trong độ, chất chưa biến đổi.","c":"Đúng: chỉ khi lượng đạt giới hạn của độ chất mới thay đổi."}},{"s":6,"n":"44","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Không phải mọi sự biến đổi của lượng đều đưa đến sự biến đổi của chất.","Sự thay đổi của lượng phải đạt đến một giới hạn nhất định mới làm cho chất của sự vật thay đổi.","Mọi sự thay đổi của lượng đều đưa đến sự thay đổi về chất của sự vật"],"a":[2],"p":50,"e":"Chỉ khi thay đổi về lượng đạt đến giới hạn nhất định (điểm nút) mới làm chất thay đổi. Vì vậy \"mọi sự thay đổi của lượng đều đưa đến thay đổi về chất\" là sai.","w":{"a":"Đúng: không phải mọi biến đổi lượng làm chất đổi.","b":"Đúng: phải đạt đến giới hạn nhất định."}},{"s":6,"n":"45","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Sự biến đổi về chất là kết quả sự biến đổi về lượng của sự vật.","Không phải sự biến đổi về chất nào cũng là kết quả của sự biến đổi về lượng.","Chất không có tác động gì đến sự thay đổi của lượng."],"a":[0],"p":50,"e":"Sự biến đổi về chất là kết quả của sự biến đổi về lượng khi lượng đạt tới điểm nút.","w":{"b":"Mọi biến đổi về chất đều bắt nguồn từ tích lũy về lượng.","c":"Chất tác động trở lại lượng, quy định quy mô, tốc độ của lượng."}},{"s":6,"n":"46","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Phát triển của sự vật chỉ bao hàm sự thay đổi về lượng.","Phát triển của sự vật chỉ bao hàm sự thay đổi về chất.","Quá trình phát triển của sự vật là quá trình chuyển hoá từ sự thay đổi dần dần về lượng sang sự thay đổi về chất và ngược lại."],"a":[2],"p":50,"e":"Phát triển là quá trình chuyển hóa từ thay đổi dần dần về lượng sang thay đổi về chất, rồi chất mới lại tác động tạo ra lượng mới.","w":{"a":"Phát triển gồm cả thay đổi về chất, ngoài thay đổi về lượng.","b":"Phát triển gồm cả thay đổi về lượng, ngoài thay đổi về chất."}},{"s":6,"n":"47","q":"Câu ca dao: Một cây làm chẳng nên non Ba cây chụm lại nên hòn núi cao, Thể hiện nội dung quy luật nào của phép biện chứng duy vật","o":["Quy luật mâu thuẫn","Quy luật phủ định của phủ định","Quy luật chuyển hoá từ những sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại."],"a":[2],"p":50,"e":"\"Một cây làm chẳng nên non, ba cây chụm lại nên hòn núi cao\" thể hiện quy luật chuyển hóa từ thay đổi về lượng sang thay đổi về chất: lượng cây tăng đến mức tạo ra chất mới.","w":{"a":"Quy luật mâu thuẫn nói về nguồn gốc phát triển.","b":"Quy luật phủ định của phủ định nói về khuynh hướng phát triển."}},{"s":6,"n":"49","q":"Trong hoạt động thực tiễn sai lầm của sự chủ quan, nóng vội là do không tôn trọng quy luật nào?","o":["Quy luật mâu thuẫn","Quy luật phủ định của phủ định","Quy luật lượng - chất"],"a":[2],"p":50,"e":"Chủ quan, nóng vội là muốn chuyển lượng sang chất khi lượng chưa đủ, tức không tôn trọng quy luật lượng - chất.","w":{"a":"Quy luật mâu thuẫn nói về nguồn gốc phát triển.","b":"Quy luật phủ định của phủ định nói về khuynh hướng phát triển."}},{"s":6,"n":"50","q":"Trong hoạt động thực tiễn sai lầm của trì trệ bảo thủ là do không tôn trọng quy luật nào của phép biện chứng duy vật?","o":["Quy luật lượng - chất.","Quy luật phủ định của phủ định.","Quy luật mâu thuẫn."],"a":[0],"p":50,"e":"Trì trệ, bảo thủ là khi lượng đã đủ mà không chịu thay đổi chất, tức không tôn trọng quy luật lượng - chất.","w":{"b":"Quy luật phủ định của phủ định nói về khuynh hướng phát triển.","c":"Quy luật mâu thuẫn nói về nguồn gốc phát triển."}},{"s":6,"n":"51","q":"Lênin nói quy luật mâu thẫn có vị trí như thế nào trong phép biện chứng duy vật?","o":["Là hạt nhân của phép biện chứng duy vật, vạch ra nguồn gốc bên trong của sự vận động và phát triển.","Vạch ra xu hướng của sự phát triển.","Vạch ra cách thức của sự phát triển."],"a":[0],"p":50,"e":"Lênin gọi quy luật mâu thuẫn là hạt nhân của phép biện chứng duy vật vì nó chỉ ra nguồn gốc bên trong của vận động và phát triển.","w":{"b":"Xu hướng phát triển do quy luật phủ định của phủ định chỉ ra.","c":"Cách thức phát triển do quy luật lượng - chất chỉ ra."}},{"s":6,"n":"52","q":"Trong lý luận về mâu thuẫn người ta gọi hai cực dương và âm của thanh nam châm là gì?","o":["Hai mặt","Hai thuộc tính","Hai mặt đối lập","Hai yếu tố."],"a":[2],"p":50,"e":"Hai cực dương và âm của nam châm là hai mặt đối lập: chúng trái ngược nhau và cùng tồn tại trong một nam châm.","w":{"a":"\"Hai mặt\" chưa nêu tính đối lập.","b":"\"Thuộc tính\" chưa nêu tính đối lập.","d":"\"Yếu tố\" chưa nêu tính đối lập."}},{"s":6,"n":"53","q":"Trong lý luận về mâu thuẫn người ta gọi quá trình đồng hoá và dị hoá trong cơ thể sống là gì?","o":["Những thuộc tính","Những sự vật","Hai yếu tố","Hai mặt đối lập."],"a":[3],"p":50,"e":"Đồng hóa và dị hóa là hai quá trình trái ngược nhau trong cơ thể sống, tức hai mặt đối lập.","w":{"a":"\"Thuộc tính\" chưa nêu tính đối lập.","b":"\"Sự vật\" không đúng.","c":"\"Yếu tố\" chưa nêu tính đối lập."}},{"s":6,"n":"54","q":"Trong quy luật mâu thuẫn tính quy định về chất và tính quy định về lượng được gọi là gì","o":["Hai sự vật","Hai quá trình","Hai thuộc tính","Hai mặt đối lập"],"a":[3],"p":51,"e":"Tính quy định về chất và về lượng là hai mặt đối lập trong sự vật, cùng tồn tại và quy định nhau.","w":{"a":"Chất và lượng không phải hai sự vật.","b":"Chất và lượng không phải hai quá trình.","c":"\"Thuộc tính\" chưa nêu tính đối lập."}},{"s":6,"n":"55","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Mặt đối lập là những mặt có đặc điểm trái ngược nhau.","Mặt đối lập tồn tại khách quan trong các sự vật","Mặt đối lập không nhất thiết phải gắn liền với sự vật","Mặt đối lập là vốn có của các sự vật, hiện tượng"],"a":[2],"p":51,"e":"Mặt đối lập luôn gắn liền với sự vật, vốn có của sự vật. Vì vậy phương án c là sai.","w":{"a":"Đúng: mặt đối lập có đặc điểm trái ngược.","b":"Đúng: mặt đối lập tồn tại khách quan.","d":"Đúng: mặt đối lập vốn có của sự vật."}},{"s":6,"n":"56","q":"Theo quan điểm của CNDVBC các mặt đối lập do đâu mà có?","o":["Do ý thức cảm giác của con người tạo ra.","Do ý niệm tuyệt đối sinh ra","Vốn có của thế giới vật chất, không do ai sinh ra."],"a":[2],"p":51,"e":"Các mặt đối lập vốn có của thế giới vật chất, không do ai sinh ra.","w":{"a":"Do ý thức, cảm giác tạo ra là duy tâm chủ quan.","b":"Do ý niệm tuyệt đối sinh ra là duy tâm khách quan."}},{"s":6,"n":"57","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Các mặt đối lập nằm trong sự liên hệ với nhau, không có mặt đối lập nào tồn tại biệt lập.","Không phải lúc nào các mặt đối lập cũng liên hệ với nhau.","Các mặt đối lập liên hệ, tác động qua lại với nhau một cách khách quan."],"a":[1],"p":51,"e":"Các mặt đối lập luôn liên hệ, tác động qua lại một cách khách quan. Vì vậy \"không phải lúc nào cũng liên hệ\" là sai.","w":{"a":"Đúng: các mặt đối lập nằm trong liên hệ với nhau.","c":"Đúng: các mặt đối lập liên hệ khách quan."}},{"s":6,"n":"58","q":"Luận điểm nào sau đây là không đúng","o":["Hai mặt đối lập biện chứng của sự vật liên hệ với nhau tạo thành mâu thuẫn biện chứng","Ghép hai mặt đối lập lại với nhau là được mâu thuẫn biện chứng","Không phải ghép bất kỳ hai mặt đối lập lại với nhau là được mâu thuẫn biện chứng."],"a":[1],"p":51,"e":"Không phải cứ ghép hai mặt đối lập bất kỳ là được mâu thuẫn biện chứng. Chúng phải cùng nằm trong một sự vật và liên hệ với nhau.","w":{"a":"Đúng: hai mặt đối lập biện chứng liên hệ tạo mâu thuẫn.","c":"Đúng: không phải ghép bất kỳ hai mặt đối lập nào."}},{"s":6,"n":"59","q":"Hai mặt đối lập ràng buộc nhau, tạo tiền đề tồn tại cho nhau triết học gọi là gì?","o":["Sự đấu tranh của hai mặt đối lập","Sự thống nhất của hai mặt đối lập.","Sự chuyển hoá của hai mặt đối lập."],"a":[1],"p":51,"e":"Hai mặt đối lập ràng buộc nhau, tạo tiền đề tồn tại cho nhau là sự thống nhất của các mặt đối lập.","w":{"a":"Đấu tranh là sự bài trừ, phủ định nhau.","c":"Chuyển hóa là bước phát triển sau cùng của mâu thuẫn."}},{"s":6,"n":"60","q":"Theo quan điểm của CNDVBC sự thống nhất của các mặt đối lập có những biểu hiện gì?","o":["Sự cùng tồn tại, nương tựa nhau.","Sự đồng nhất, có những điểm chung giữa hai mặt đối lập","Sự tác động ngang bằng nhau.","Sự bài trừ phủ định nhau.","Gồm a, b và c."],"a":[4],"p":51,"e":"Sự thống nhất của các mặt đối lập biểu hiện ở sự cùng tồn tại, nương tựa nhau, sự đồng nhất có những điểm chung, và sự tác động ngang bằng nhau. Đáp án e gộp a, b, c.","w":{"a":"Đúng một phần: cùng tồn tại, nương tựa nhau.","b":"Đúng một phần: đồng nhất, có điểm chung.","c":"Đúng một phần: tác động ngang bằng nhau.","d":"Bài trừ, phủ định nhau là biểu hiện của đấu tranh."}},{"s":7,"n":"1","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Sự thống nhất của các mặt đối lập loại trừ sự đấu tranh của các mặt đối lập\".","o":["Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm biện chứng."],"a":[0],"p":52,"e":"Cho thống nhất của các mặt đối lập loại trừ đấu tranh là quan điểm duy vật siêu hình, vì nó tách rời hai mặt vốn gắn bó trong mâu thuẫn.","w":{"b":"Duy vật biện chứng coi thống nhất và đấu tranh gắn bó.","c":"Duy tâm biện chứng cũng thừa nhận hai mặt đó gắn bó."}},{"s":7,"n":"2","q":"Sự tác động theo xu hướng nào thì được gọi là sự đấu tranh của các mặt đối lập?","o":["Ràng buộc nhau.","Nương tựa nhau","Phủ định, bài trừ nhau."],"a":[2],"p":52,"e":"Sự tác động theo xu hướng phủ định, bài trừ nhau gọi là sự đấu tranh của các mặt đối lập.","w":{"a":"Ràng buộc nhau là biểu hiện của thống nhất.","b":"Nương tựa nhau là biểu hiện của thống nhất."}},{"s":7,"n":"3","q":"Lập trường triết học nào cho rằng mâu thuẫn tồn tại là do tư duy, ý thức của con người quyết định?","o":["Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật biện chứng."],"a":[1],"p":52,"e":"Cho mâu thuẫn tồn tại do tư duy, ý thức con người quyết định là duy tâm chủ quan.","w":{"a":"Duy vật siêu hình coi mâu thuẫn tồn tại khách quan hoặc phủ nhận mâu thuẫn.","c":"Duy tâm khách quan coi mâu thuẫn là sự vận động của ý niệm tuyệt đối.","d":"Duy vật biện chứng coi mâu thuẫn khách quan."}},{"s":7,"n":"4","q":"Quan điểm triết học nào cho rằng mâu thuẫn và quy luật mâu thuẫn là sự vận động của ý niệm tuyệt đối?","o":["Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật siêu hình"],"a":[1],"p":52,"e":"Cho mâu thuẫn là sự vận động của ý niệm tuyệt đối là duy tâm khách quan (Hê-ghen).","w":{"a":"Duy tâm chủ quan coi mâu thuẫn do ý thức con người.","c":"Duy vật siêu hình không nói về ý niệm tuyệt đối."}},{"s":7,"n":"5","q":"Quan điểm nào sau đây là của CNDVBC?","o":["Mâu thuẫn tồn tại khách quan trong mọi sự vật, hiện tượng, quá trình của tự nhiên, xã hội và tư duy.","Mâu thuẫn chỉ tồn tại trong tư duy.","Mâu thuẫn chỉ tồn tại trong một số hiện tượng."],"a":[0],"p":52,"e":"Chủ nghĩa duy vật biện chứng cho rằng mâu thuẫn tồn tại khách quan, phổ biến trong mọi sự vật, hiện tượng, quá trình của tự nhiên, xã hội và tư duy.","w":{"b":"Mâu thuẫn tồn tại ngoài tư duy, trong cả tự nhiên và xã hội.","c":"Mâu thuẫn có ở mọi hiện tượng, không giới hạn ở một số."}},{"s":7,"n":"6","q":"Trong mâu thuẫn biện chứng các mặt đối lập quan hệ với nhau như thế nào?","o":["Chỉ thống nhất với nhau.","Chỉ có mặt đấu tranh với nhau","Vừa thống nhất vừa đấu tranh với nhau."],"a":[2],"p":52,"e":"Trong mâu thuẫn biện chứng, các mặt đối lập vừa thống nhất vừa đấu tranh với nhau.","w":{"a":"Chỉ thống nhất thì không có mâu thuẫn.","b":"Chỉ đấu tranh thì sự vật không tồn tại."}},{"s":7,"n":"7","q":"Trong hai xu hướng tác động của của các mặt đối lập xu hướng nào quy định sự ổn định tương đối của sự vật?","o":["Thống nhất của các mặt đối lập","Đấu tranh của các mặt đối lập","Cả a và b."],"a":[0],"p":52,"e":"Xu hướng thống nhất của các mặt đối lập quy định sự ổn định tương đối của sự vật.","w":{"b":"Xu hướng đấu tranh quy định sự biến đổi thường xuyên.","c":"Hai xu hướng có tác dụng khác nhau."}},{"s":7,"n":"8","q":"Trong hai xu hướng tác động của các mặt đối lập xu hương nào quy định sự biến đổi thường xuyên của sự vật?","o":["Thống nhất của các mặt đối lập.","Đấu tranh của các mặt đối lập.","Cả a và b."],"a":[1],"p":52,"e":"Xu hướng đấu tranh của các mặt đối lập quy định sự biến đổi thường xuyên của sự vật.","w":{"a":"Xu hướng thống nhất quy định sự ổn định tương đối.","c":"Hai xu hướng có tác dụng khác nhau."}},{"s":7,"n":"9","q":"theo quan điểm của CNDVBC luận điểm nào sau đây là sai?","o":["Trong mâu thuẫn biện chứng thống nhất và đấu tranh của các mặt đối lập là không thể tách rời nhau.","Sự vận động và phát triển của sự vật chỉ do một mình sự đấu tranh của các mặt đối lập quyết định.","Sự vận động và phát triển của sự vật là do sự thống nhất và đấu tranh của các mặt đối lập quyết định"],"a":[1],"p":52,"e":"Sự vận động, phát triển của sự vật do cả thống nhất và đấu tranh của các mặt đối lập quyết định. Phương án b chỉ nêu đấu tranh nên sai.","w":{"a":"Đúng: thống nhất và đấu tranh không thể tách rời.","c":"Đúng: vận động, phát triển do cả thống nhất và đấu tranh."}},{"s":7,"n":"10","q":"Mâu thuẫn quy định bản chất của sự vật, thay đổi cùng với sự thay đổi căn bản về chất của sự vật, được gọi là mâu thuẫn gì?","o":["Mâu thuẫn chủ yếu.","Mâu thuẫn bên trong","Mâu thuẫn cơ bản."],"a":[2],"p":53,"e":"Mâu thuẫn quy định bản chất của sự vật, tồn tại suốt quá trình và thay đổi cùng với sự thay đổi căn bản về chất là mâu thuẫn cơ bản.","w":{"a":"Mâu thuẫn chủ yếu nổi lên hàng đầu trong một giai đoạn.","b":"Mâu thuẫn bên trong phân loại theo quan hệ với sự vật."}},{"s":7,"n":"11","q":"Mâu thuẫn nổi lên hàng đầu ở một giai đoạn phát triển nhất định của sự vật, chi phối các mâu thuẫn khác trong giai đoạn đó được gọi là mâu thuẫn gì?","o":["Mâu thuẫn cơ bản","Mâu thuẫn chủ yếu","Mâu thuẫn thứ yếu.","Mâu thuẫn đối kháng"],"a":[1],"p":53,"e":"Mâu thuẫn nổi lên hàng đầu ở một giai đoạn, chi phối các mâu thuẫn khác trong giai đoạn đó, là mâu thuẫn chủ yếu.","w":{"a":"Mâu thuẫn cơ bản quy định bản chất sự vật.","c":"Mâu thuẫn thứ yếu có vị trí thấp hơn.","d":"Mâu thuẫn đối kháng phân loại theo tính chất của các mặt đối lập."}},{"s":7,"n":"12","q":"Luận điểm nào thể hiện quan điểm siêu hình trong các luận điểm sau","o":["Sự phân biệt giữa mâu thuẫn bên trong và mâu thuẫn bên ngoài chỉ là tương đối","Giải quyết mâu thuẫn bên trong liên hệ chặt chẽ với việc giải quyết mâu thuẫn bên ngoài.","Giải quyết mâu thuẫn bên trong không quan hệ với việc giải quyết mâu thuẫn bên ngoài."],"a":[2],"p":53,"e":"Quan điểm siêu hình tách rời mâu thuẫn bên trong khỏi mâu thuẫn bên ngoài, nên coi việc giải quyết mâu thuẫn bên trong không liên quan đến mâu thuẫn bên ngoài.","w":{"a":"Đúng với phép biện chứng: sự phân biệt chỉ là tương đối.","b":"Đúng với phép biện chứng: hai việc liên hệ chặt chẽ."}},{"s":7,"n":"13","q":"Mâu thuẫn đối kháng tồn tại ở đâu?","o":["Trong cả tự nhiên, xã, hội và tư duy.","Trong mọi xã hội.","Trong xã hội có giai cấp đối kháng"],"a":[2],"p":53,"e":"Mâu thuẫn đối kháng chỉ tồn tại trong xã hội có giai cấp đối kháng, vì nó là mâu thuẫn giữa những giai cấp có lợi ích đối lập căn bản.","w":{"a":"Mâu thuẫn đối kháng không tồn tại trong tự nhiên và tư duy.","b":"Không tồn tại trong mọi xã hội, chẳng hạn xã hội nguyên thủy."}},{"s":7,"n":"14","q":"Trong quy luật phủ định của phủ định sự thay thế sự vật này bằng sự vật kia (thí dụ: nụ thành hoa, hoa thành quả v.v.) được gọi là gì?","o":["Mâu thuẫn","Phủ định","Tồn tại","Vận động"],"a":[1],"p":53,"e":"Trong quy luật phủ định của phủ định, sự thay thế sự vật này bằng sự vật khác (nụ thành hoa, hoa thành quả) là phủ định.","w":{"a":"Mâu thuẫn là nguồn gốc phát triển.","c":"Tồn tại là phạm trù chỉ sự có mặt.","d":"Vận động là sự biến đổi nói chung."}},{"s":7,"n":"15","q":"Sự tự thay thế sự vật này bằng sự vật kia không phụ thuộc vào ý thức con người trong phép biện chứng duy vật được gọi là gì?","o":["Vận động","Phủ định","Phủ định biện chứng","Phủ định của phủ định"],"a":[2],"p":53,"e":"Sự tự thay thế sự vật này bằng sự vật kia không phụ thuộc vào ý thức con người là phủ định biện chứng, vì nó do mâu thuẫn bên trong sự vật gây ra.","w":{"a":"Vận động là sự biến đổi nói chung.","b":"Phủ định nói chung gồm cả phủ định siêu hình do ngoại lực.","d":"Phủ định của phủ định là quy luật gồm hai lần phủ định liên tiếp."}},{"s":7,"n":"16","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Phủ định biện chứng có tính khách quan","Phủ định biện chứng là kết quả giải quyết những mâu thuẫn bên trong sự vật","Phủ định biện chứng phụ thuộc vào ý thức của con người"],"a":[2],"p":53,"e":"Phủ định biện chứng do mâu thuẫn bên trong sự vật gây ra, diễn ra khách quan, không phụ thuộc ý thức con người. Vì vậy phương án c là sai.","w":{"a":"Đúng: phủ định biện chứng có tính khách quan.","b":"Đúng: nó là kết quả giải quyết mâu thuẫn bên trong."}},{"s":7,"n":"17","q":"Theo quan điểm của CNDVBC luận điểm nào sau đây là sai?","o":["Phủ định biện chứng xoá bỏ cái cũ hoàn toàn","Phủ định biện chứng không đơn giản là xoá bỏ cái cũ.","Phủ định biện chứng loại bỏ những yếu tố không thích hợp của cái cũ","Phủ định biện chứng giữ lại và cải biến những yếu tố còn thích hợp của cái cũ."],"a":[0],"p":53,"e":"Phủ định biện chứng không xóa bỏ hoàn toàn cái cũ, nó giữ lại và cải biến những yếu tố còn thích hợp. Phương án a vì vậy là sai.","w":{"b":"Đúng: phủ định biện chứng không đơn giản là xóa bỏ.","c":"Đúng: loại bỏ yếu tố không thích hợp.","d":"Đúng: giữ lại và cải biến yếu tố còn thích hợp."}},{"s":7,"n":"18","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Cái mới ra đời trên cơ sở phá huỷ hoàn toàn cái cũ\"","o":["Quan điểm siêu hình","Quan điểm biện chứng duy vật","Quan điểm biện chứng duy tâm"],"a":[0],"p":53,"e":"Cho cái mới ra đời trên cơ sở phá hủy hoàn toàn cái cũ là quan điểm siêu hình, vì nó phủ định sạch trơn, không kế thừa.","w":{"b":"Duy vật biện chứng coi phủ định có kế thừa.","c":"Biện chứng duy tâm cũng thừa nhận kế thừa."}},{"s":7,"n":"19","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Cái mới ra đời trên cơ sở giữ nguyên cái cũ\".","o":["Quan điểm biện chứng duy vật","Quan điểm biện chứng duy tâm","Quan điểm siêu hình, phản biện chứng."],"a":[2],"p":54,"e":"Cho cái mới ra đời bằng cách giữ nguyên cái cũ là quan điểm siêu hình, phản biện chứng, vì nó phủ nhận sự thay đổi.","w":{"a":"Duy vật biện chứng vừa giữ vừa loại bỏ.","b":"Biện chứng duy tâm cũng coi trọng sự thay đổi."}},{"s":7,"n":"20","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Triết học Mác ra đời trên cơ sở phủ định hoàn toàn các hệ thống triết học trong lịch sử\".","o":["Quan điểm duy tâm siêu hình.","Quan điểm biện chứng duy vật.","Quan điểm biện chứng duy tâm."],"a":[0],"p":54,"e":"Cho triết học Mác ra đời bằng phủ định hoàn toàn các hệ thống triết học trước đó là quan điểm phủ định sạch trơn. Thực tế Mác kế thừa phép biện chứng của Hê-ghen và chủ nghĩa duy vật của Phoi-ơ-bắc.","w":{"b":"Quan điểm biện chứng duy vật coi phủ định là có kế thừa.","c":"Quan điểm biện chứng duy tâm cũng không phủ định sạch trơn."}},{"s":7,"n":"21","q":"Sự tự phủ định để đưa sự vật dường như quay lại điểm xuất phát ban đầu trong phép biện chứng được gọi là gì?","o":["Phủ định biện chứng.","Phủ định của phủ định","Chuyển hoá"],"a":[1],"p":54,"e":"Sự tự phủ định hai lần liên tiếp, đưa sự vật dường như quay lại điểm xuất phát nhưng ở trình độ cao hơn, là phủ định của phủ định.","w":{"a":"Phủ định biện chứng chỉ một lần phủ định.","c":"Chuyển hóa là khái niệm rộng."}},{"s":7,"n":"22","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Phủ định của phủ định có tính khách quan và kế thừa","Phủ định của phủ định hoàn toàn lặp lại cái ban đầu","Phủ định của phủ định lặp lại cái ban đầu trên cơ sở mới cao hơn"],"a":[1],"p":54,"e":"Phủ định của phủ định lặp lại cái ban đầu trên cơ sở mới cao hơn, nên \"hoàn toàn lặp lại cái ban đầu\" là sai.","w":{"a":"Đúng: phủ định của phủ định có tính khách quan và kế thừa.","c":"Đúng: nó lặp lại cái ban đầu trên cơ sở cao hơn."}},{"s":7,"n":"23","q":"Con đường phát triển của sự vật mà quy luật phủ định của phủ định vạch ra là con đường nào?","o":["Đường thẳng đi lên","Đường tròn khép kín","Đường xoáy ốc đi lên"],"a":[2],"p":54,"e":"Phủ định của phủ định vạch ra con đường phát triển xoáy ốc đi lên: có lặp lại, nhưng ở trình độ cao hơn.","w":{"a":"Đường thẳng đi lên là quan điểm siêu hình.","b":"Đường tròn khép kín là quan điểm siêu hình."}},{"s":7,"n":"24","q":"theo quan điểm của CNDVBC luận điểm nào sau đây là sai?","o":["Phủ định của phủ định kết thúc một chu kỳ phát triển của sự vật","Phủ định của phủ định kết thúc sự phát triển của sự vật.","Phủ định của phủ định mở đầu một chu kỳ phát triển mới của sự vật"],"a":[1],"p":54,"e":"Phủ định của phủ định kết thúc một chu kỳ và mở đầu chu kỳ mới, nên sự phát triển không dừng lại. Phương án b vì vậy là sai.","w":{"a":"Đúng: kết thúc một chu kỳ phát triển.","c":"Đúng: mở đầu một chu kỳ mới."}},{"s":7,"n":"25","q":"Vị trí của quy luật phủ định của phủ định trong phép biện chứng duy vật?","o":["Chỉ ra nguồn gốc của sự phát triển","Chỉ ra cách thức của sự phát triển","Chỉ ra xu hướng của sự phát triển","Cả a, b và c"],"a":[2],"p":54,"e":"Quy luật phủ định của phủ định chỉ ra xu hướng của sự phát triển, còn quy luật mâu thuẫn chỉ ra nguồn gốc và quy luật lượng - chất chỉ ra cách thức.","w":{"a":"Nguồn gốc của sự phát triển do quy luật mâu thuẫn chỉ ra.","b":"Cách thức của sự phát triển do quy luật lượng - chất chỉ ra.","d":"Mỗi quy luật có vị trí riêng."}},{"s":7,"n":"26","q":"Trường phái triết học nào cho nhận thức là sự kết hợp các cảm giác của con người?","o":["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình"],"a":[1],"p":54,"e":"Cho nhận thức là sự kết hợp các cảm giác của con người là duy tâm chủ quan.","w":{"a":"Duy tâm khách quan coi nhận thức là sự hồi tưởng hoặc tự ý thức của ý niệm.","c":"Cả hai đều coi nhận thức là phản ánh hiện thực khách quan.","d":"Cả hai đều coi nhận thức là phản ánh hiện thực khách quan."}},{"s":7,"n":"27","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Chúng ta chỉ nhận thức được các cảm giác của chúng ta thôi\".","o":["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng"],"a":[1],"p":54,"e":"Chỉ nhận thức được cảm giác của chính mình là duy tâm chủ quan, vì nó phủ nhận khả năng nhận thức thế giới bên ngoài.","w":{"a":"Duy tâm khách quan nói về ý niệm.","c":"Cả hai đều thừa nhận nhận thức phản ánh thế giới khách quan.","d":"Cả hai đều thừa nhận nhận thức phản ánh thế giới khách quan."}},{"s":7,"n":"28","q":"Trường phái triết học nào cho nhận thức là \"sự hồi tưởng\" của linh hồn về thế giới ý niệm?","o":["Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng"],"a":[1],"p":54,"e":"Cho nhận thức là sự hồi tưởng của linh hồn về thế giới ý niệm (Pla-tông) là duy tâm khách quan.","w":{"a":"Duy tâm chủ quan dựa vào cảm giác.","c":"Cả hai đều thừa nhận nhận thức phản ánh thế giới vật chất.","d":"Cả hai đều thừa nhận nhận thức phản ánh thế giới vật chất."}},{"s":7,"n":"29","q":"Trường phái triết học nào cho nhận thức là sự tự ý thức về mình của ý niệm tuyệt đối","o":["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan"],"a":[2],"p":55,"e":"Coi nhận thức là sự tự ý thức về mình của ý niệm tuyệt đối (Hê-ghen) là duy tâm khách quan.","w":{"a":"Duy vật biện chứng coi nhận thức là phản ánh hiện thực khách quan.","b":"Duy tâm chủ quan dựa vào cảm giác."}},{"s":7,"n":"30","q":"Theo quan điểm của CNDVBC luận điểm nào sau đây là sai?","o":["Chủ nghĩa duy vật đều thừa nhận nhận thức là sự phản ánh hiện thực khách quan vào đầu óc con ngươì.","CNDV đều thừa nhận nhận thức là sự phản ánh sáng tạo hiện thực khách quan vào trong đầu óc con người dựa trên cơ sở thực tiễn.","CNDVBC thừa nhận nhận thức là quá trình phản ánh sáng tạo hiện thực khách quan vào trong đầu óc con người trên cơ sở thực tiễn."],"a":[1],"p":55,"e":"Chỉ chủ nghĩa duy vật biện chứng mới thừa nhận nhận thức là sự phản ánh sáng tạo dựa trên cơ sở thực tiễn. Chủ nghĩa duy vật nói chung thì chưa. Phương án b vì thế sai.","w":{"a":"Đúng: chủ nghĩa duy vật đều thừa nhận nhận thức là phản ánh hiện thực.","c":"Đúng: chủ nghĩa duy vật biện chứng thừa nhận phản ánh sáng tạo trên cơ sở thực tiễn."}},{"s":7,"n":"31","q":"Trường phái triết học nào cho thực tiễn là cơ sở chủ yếu và trực tiếp nhất của nhận thức?","o":["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng"],"a":[2],"p":55,"e":"Chủ nghĩa duy vật biện chứng coi thực tiễn là cơ sở chủ yếu và trực tiếp nhất của nhận thức.","w":{"a":"Duy tâm khách quan không xuất phát từ thực tiễn.","b":"Duy vật siêu hình chưa thấy vai trò của thực tiễn."}},{"s":7,"n":"32","q":"Thêm cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa phạm trù thực tiễn: \"Thực tiễn là toàn bộ những........... của con người nhằm cải tạo tự nhiên và xã hội\"","o":["Hoạt động.","Hoạt động vật chất","Hoạt động có mục đích","Hoạt động vật chất có mục đích, mang tính lịch s
