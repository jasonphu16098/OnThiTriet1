 kiểm nghiệm và củng cố."}},{"s":2,"n":"16","q":"Nhân tố nào được coi là phương thức tồn tại của ý thức?","o":["Tình cảm","Ý chí","Tri thức","Niềm tin"],"a":[2],"p":16,"e":"Ý thức tồn tại dưới dạng tri thức, nên tri thức được coi là phương thức tồn tại của ý thức.","w":{"a":"Tình cảm là một yếu tố của ý thức, không phải phương thức tồn tại của nó.","b":"Ý chí là yếu tố hành động của ý thức.","d":"Niềm tin là yếu tố hình thành trên cơ sở tri thức."}},{"s":2,"n":"17","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng mối quan hệ giữa vật chất và ý thức được biểu hiện như thế nào?","o":["Ý thức quyết định vật chất","Vật chất quyết định ý thức","Vật chất quyết định ý thức, ý thức tác động trở lại vật chất","Vật chất và ý thức có mối quan hệ hỗ trợ lẫn nhau"],"a":[2],"p":16,"e":"Chủ nghĩa duy vật biện chứng khẳng định vật chất quyết định ý thức, và ý thức có tác động trở lại vật chất thông qua hoạt động thực tiễn của con người.","w":{"a":"Ý thức quyết định vật chất là quan điểm duy tâm.","b":"Chỉ nói vật chất quyết định ý thức thì thiếu mặt tác động trở lại của ý thức.","d":"Hỗ trợ lẫn nhau đặt hai bên ngang hàng, xóa vai trò quyết định của vật chất."}},{"s":2,"n":"18","q":"Quan điểm cho rằng “ý thức quyết định vật chất” là quan điểm của trường phái nào?","o":["Chủ nghĩa duy tâm","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật chất phác thời cổ đại"],"a":[0],"p":16,"e":"Cho rằng ý thức quyết định vật chất là trả lời mặt thứ nhất của vấn đề cơ bản theo hướng ý thức có trước. Đó là lập trường của chủ nghĩa duy tâm.","w":{"b":"Chủ nghĩa duy vật biện chứng khẳng định vật chất quyết định ý thức.","c":"Chủ nghĩa duy vật siêu hình cũng khẳng định vật chất có trước.","d":"Chủ nghĩa duy vật chất phác thời cổ đại coi vật chất có trước."}},{"s":2,"n":"19","q":"Quan điểm của chủ nghĩa duy tâm về mối quan hệ giữa vật chất và ý thức?","o":["Ý thức quyết định vật chất","Vật chất quyết định ý thức","Vật chất quyết định ý thức còn ý thức tác động trở lại đối với vật chất","Vật chất và ý thức tồn tại độc lập với nhau"],"a":[0],"p":16,"e":"Chủ nghĩa duy tâm coi ý thức, tinh thần có trước và quyết định vật chất.","w":{"b":"Vật chất quyết định ý thức là quan điểm duy vật.","c":"Vật chất quyết định ý thức còn ý thức tác động trở lại là quan điểm duy vật biện chứng.","d":"Vật chất và ý thức tồn tại độc lập là quan điểm nhị nguyên luận."}},{"s":2,"n":"20","q":"( ELO 1) Phương thức tồn tại của vật chất là gì?","o":["Không gian","Thời gian","Vận động","Không gian, thời gian, vận động"],"a":[2],"p":17,"e":"Vận động là phương thức tồn tại của vật chất. Không gian và thời gian là hình thức tồn tại. Không có vật chất nào không vận động.","w":{"a":"Không gian là hình thức tồn tại.","b":"Thời gian là hình thức tồn tại.","d":"Phương án này gộp phương thức với hình thức tồn tại."}},{"s":2,"n":"21","q":"Vật chất theo quan niệm của các nhà triết học Trung Quốc là Ngũ hành. Ngũ hành bao gồm các yếu tố nào?","o":["Đất, Nước, Lửa, Không khí, Mộc","Thổ, Thủy, Hỏa, Không khí, Kim","Kim, Mộc, Thủy, Hỏa, Thổ","Thủy, Hỏa, Mộc, Kim, Apêrôn"],"a":[2],"p":17,"e":"Ngũ hành theo quan niệm Trung Quốc cổ đại gồm Kim, Mộc, Thủy, Hỏa, Thổ, năm yếu tố cấu thành vạn vật.","w":{"a":"Đất, nước, lửa, không khí là bốn yếu tố của các quan niệm Hy Lạp, Ấn Độ, \"Mộc\" lẫn vào là nhầm lẫn.","b":"Không khí không thuộc ngũ hành.","d":"Apêrôn là khái niệm của A-na-xi-măng-đrơ ở Hy Lạp."}},{"s":2,"n":"22","q":"Ý nghĩa thực tiễn rút ra từ định nghĩa vật chất của Lênin là gì?","o":["Bác bỏ quan điểm duy vật về vật chất","Vật chất không thay đổi về hình dạng lẫn cấu trúc","Thúc đẩy các khoa học phát triển","Khẳng tính thứ nhất tuyệt đối của vật chất"],"a":[2],"p":17,"e":"Định nghĩa vật chất của Lênin tạo cơ sở thế giới quan và phương pháp luận khoa học cho các khoa học, giúp giải quyết cuộc khủng hoảng vật lý học đầu thế kỷ XX và thúc đẩy các khoa học phát triển.","w":{"a":"Định nghĩa của Lênin khẳng định quan điểm duy vật, không bác bỏ.","b":"Vật chất luôn vận động và biến đổi hình dạng, cấu trúc.","d":"Khẳng định tính thứ nhất của vật chất là ý nghĩa lý luận về vấn đề cơ bản của triết học, và chỉ tuyệt đối trong phạm vi vấn đề đó."}},{"s":2,"n":"23","q":"Tính chất của đứng im theo quan điểm của chủ nghĩa duy vật biện chứng là?","o":["Đứng im là không vận động","Đứng im là tuyệt đối","Đứng im là tạm thời","Đứng im là vận động trong thế cân bằng ổn định tuyệt đối"],"a":[2],"p":17,"e":"Theo chủ nghĩa duy vật biện chứng, đứng im là tạm thời, tương đối. Đó là trạng thái ổn định tương đối của sự vật trong một quan hệ và một thời điểm xác định.","w":{"a":"Đứng im vẫn là một hình thức vận động, nên không phải là không vận động.","b":"Vận động mới là tuyệt đối, đứng im là tương đối.","d":"Thế cân bằng ổn định chỉ có tính tương đối."}},{"s":2,"n":"24","q":"Hình thức tồn tại của vật chất là yếu tố nào?","o":["Vận động","Không gian, thời gian","Vận động, không gian, thời gian","Vận động, không gian, thời gian, đứng im"],"a":[1],"p":17,"e":"Không gian và thời gian là hình thức tồn tại của vật chất. Vận động là phương thức tồn tại, nên không gộp vào hình thức tồn tại.","w":{"a":"Vận động là phương thức tồn tại.","c":"Phương án này gộp vận động với hình thức tồn tại.","d":"Đứng im không phải hình thức tồn tại, nó là trạng thái đặc biệt của vận động."}},{"s":2,"n":"25","q":"Phương pháp tư duy nào chi phối những hiểu biết triết học duy vật về vật chất ở thế kỷ XVII – XVIII?","o":["Phương pháp biện chứng duy tâm","Phương pháp biện chứng duy vật","Phương pháp siêu hình máy móc","Phương pháp biện chứng sơ khai"],"a":[2],"p":17,"e":"Ở thế kỷ XVII đến XVIII, cơ học Niu-tơn phát triển mạnh nên tư duy siêu hình, máy móc chi phối hiểu biết về vật chất, coi sự vật tách rời và bất biến.","w":{"a":"Phép biện chứng duy tâm là của Hê-ghen ở thế kỷ XIX.","b":"Phép biện chứng duy vật chỉ ra đời ở thế kỷ XIX.","d":"Phép biện chứng sơ khai gắn với triết học cổ đại."}},{"s":2,"n":"26","q":"Nhà triết học nào cho nước là thực thể đầu tiên của thế giới và quan điểm đó thuộc lập trường triết học nào?","o":["Talet – chủ nghĩa duy vật chất phác","Điđrô – chủ nghĩa duy vật biện chứng","Béccơli – chủ nghĩa duy tâm chủ quan","Platôn – chủ nghĩa duy tâm khách quan"],"a":[0],"p":18,"e":"Ta-lét ở Hy Lạp cổ đại cho rằng nước là khởi nguyên của vạn vật. Đó là lập trường duy vật chất phác, vì ông tìm bản chất thế giới ở một vật chất cụ thể.","w":{"b":"Điđrô là nhà duy vật siêu hình thế kỷ XVIII, không nói nước là thực thể đầu tiên.","c":"Béc-cơ-li là nhà duy tâm chủ quan.","d":"Pla-tông là nhà duy tâm khách quan."}},{"s":2,"n":"27","q":"Nhà triết học nào coi lửa là thực thể đầu tiên của thế giới và quan điểm đó thuộc lập trường triết học nào?","o":["Đêmôcrít – chủ nghĩa duy vật chất phác","Heraclit – chủ nghĩa duy vật chất phác","Hêraclit – chủ nghĩa duy tâm khách quan","Anaximen – chủ nghĩa duy vật chất phác"],"a":[1],"p":18,"e":"Hê-ra-clít coi lửa là thực thể đầu tiên của thế giới. Đó là lập trường duy vật chất phác kết hợp tư tưởng biện chứng sơ khai.","w":{"a":"Đê-mô-crít cho rằng nguyên tử là thực thể đầu tiên.","c":"Hê-ra-clít là nhà duy vật chất phác, không phải duy tâm khách quan.","d":"A-na-xi-men coi không khí là thực thể đầu tiên."}},{"s":2,"n":"28","q":"Nhà triết học nào cho nguyên tử là thực thể đầu tiên của thế giới và đó là lập trường triết học nào?","o":["Đêmôcrít - chủ nghĩa duy vật chất phác","Hêraclít – chủ nghĩa duy vật chất phác","Đêmôcrít – chủ nghĩa duy tâm khách quan","Anaximen – chủ nghĩa duy tâm"],"a":[0],"p":18,"e":"Đê-mô-crít cho rằng nguyên tử là thực thể đầu tiên của thế giới, lập trường duy vật chất phác.","w":{"b":"Hê-ra-clít chọn lửa.","c":"Đê-mô-crít là nhà duy vật, không phải duy tâm khách quan.","d":"A-na-xi-men chọn không khí và cũng là nhà duy vật."}},{"s":2,"n":"29","q":"Đâu là quan niệm của chủ nghĩa duy vật biện chứng về vận động?","o":["Có vật chất không vận động","Có vận động thuần tuý ngoài vật chất","Không có vận động thuần tuý ngoài vật chất","Có vận động là có phát triển"],"a":[2],"p":18,"e":"Chủ nghĩa duy vật biện chứng khẳng định không có vận động thuần túy ngoài vật chất, vì vận động là thuộc tính cố hữu của vật chất.","w":{"a":"Không có vật chất nào không vận động.","b":"Vận động không thể tồn tại ngoài vật chất.","d":"Vận động và phát triển là hai khái niệm khác nhau."}},{"s":2,"n":"30","q":"Tri thức là kết quả của yếu tố nào?","o":["Sự trực giác","Quá trình nhận thức","Quá trình lao động","Sự cảm giác"],"a":[1],"p":18,"e":"Tri thức là kết quả của quá trình nhận thức, tức sự phản ánh thế giới khách quan trong óc người.","w":{"a":"Trực giác chỉ là một cách tiếp nhận tri thức.","c":"Lao động là cơ sở của nhận thức nhưng tri thức là kết quả của quá trình nhận thức.","d":"Cảm giác chỉ là giai đoạn đầu của nhận thức."}},{"s":2,"n":"31","q":"Đâu là tính chất của đứng im?","o":["Tuyệt đối","Tương đối","Không vận động","Sự thống nhất giữa tính tương đối và tuyệt đối"],"a":[1],"p":18,"e":"Theo chủ nghĩa duy vật biện chứng, đứng im chỉ có tính chất tương đối. Vận động là tuyệt đối.","w":{"a":"Vận động mới là tuyệt đối.","c":"Đứng im là một hình thức của vận động, không phải không vận động.","d":"Đứng im không phải thống nhất giữa tương đối và tuyệt đối. Nó chỉ có tính tương đối."}},{"s":2,"n":"32","q":"Trường phái triết học nào cho rằng vận động và đứng im không tách rời nhau?","o":["Chủ nghĩa duy vật chất phác","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII","Chủ nghĩa duy tâm"],"a":[1],"p":18,"e":"Chủ nghĩa duy vật biện chứng coi đứng im là một trạng thái đặc biệt của vận động, nên vận động và đứng im không tách rời nhau.","w":{"a":"Chủ nghĩa duy vật chất phác chưa có quan niệm hoàn chỉnh về mối quan hệ này.","c":"Chủ nghĩa duy vật siêu hình thế kỷ XVII-XVIII coi sự vật cô lập, bất biến.","d":"Chủ nghĩa duy tâm không có quan niệm này."}},{"s":2,"n":"33","q":"Quan điểm triết học nào cho rằng sự thống nhất của thế giới không phải ở tính tồn tại của nó mà ở tính vật chất?","o":["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm chủ quan"],"a":[2],"p":19,"e":"Ăngghen khẳng định tính thống nhất thực sự của thế giới ở tính vật chất của nó, không phải ở tính tồn tại. Đây là quan điểm của chủ nghĩa duy vật biện chứng.","w":{"a":"Duy tâm khách quan coi thế giới thống nhất ở tinh thần khách quan.","b":"Chủ nghĩa duy vật siêu hình thừa nhận vật chất nhưng xem xét thế giới tĩnh tại, cô lập.","d":"Duy tâm chủ quan coi thế giới thống nhất ở cảm giác, ý thức."}},{"s":2,"n":"34","q":"Theo cách phân chia các hình thức vận động của Ăngghen, hình thức nào là thấp nhất?","o":["Hoá học","Vật lý","Cơ học","Sinh học"],"a":[2],"p":19,"e":"Ăngghen chia vận động thành năm hình thức theo trình độ từ thấp lên cao: cơ học, vật lý, hóa học, sinh học, xã hội. Cơ học (di chuyển vị trí) là hình thức thấp nhất.","w":{"a":"Hóa học đứng thứ ba.","b":"Vật lý đứng thứ hai.","d":"Sinh học đứng thứ tư."}},{"s":2,"n":"35","q":"Theo cách phân chia các hình thức vận động của Ăngghen, hình thức vận động nào là cao nhất?","o":["Hoá học","Sinh học","Xã hội","Cơ học"],"a":[2],"p":19,"e":"Trong năm hình thức vận động của Ăngghen, vận động xã hội là cao nhất, vì nó có sự tham gia của con người và ý thức.","w":{"a":"Hóa học là hình thức thứ ba.","b":"Sinh học là hình thức thứ tư.","d":"Cơ học là hình thức thấp nhất."}},{"s":2,"n":"36","q":"“ Vận động hiểu theo nghĩa chung nhất bao gồm tất cả mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, kể từ thay đổi vị trí đơn giản cho đến tư duy” đây là quan điểm về sự vận động của ai?","o":["C. Mác","Hê-ghen","V.I. Lênin","Ph. Ăngghen"],"a":[3],"p":19,"e":"Câu trích này nằm trong tác phẩm của Ph.Ăngghen \"Biện chứng của tự nhiên\", nêu quan niệm vận động theo nghĩa chung nhất.","w":{"a":"Mác cùng Ăngghen xây dựng học thuyết nhưng câu này là của Ăngghen.","b":"Hê-ghen có quan niệm khác về vận động, mang tính duy tâm.","c":"Lênin nêu định nghĩa vật chất, câu này không phải của ông."}},{"s":2,"n":"37","q":"Theo quan điểm của Ph. Ăngghen thì vận động có bao nhiêu hình thức cơ bản?","o":["Bốn hình thức","Năm hình thức","Sáu hình thức (cơ học, vật lý, hoá học, sinh học, xã hội)","Bảy hình thức"],"a":[1],"p":19,"e":"Ăngghen chia vận động thành năm hình thức cơ bản: cơ học, vật lý, hóa học, sinh học, xã hội.","w":{"a":"Bốn là thiếu một hình thức.","c":"Phương án này ghi sáu nhưng liệt kê năm hình thức.","d":"Bảy hình thức không đúng với cách phân chia của Ăngghen."}},{"s":2,"n":"38","q":"Vấn đề cơ bản của triết học là vấn đề gì?","o":["Mối quan hệ giữa tư duy và ý thức","Mối quan hệ giữa tồn tại và vật chất","Mối quan hệ giữa thế giới và vật chất","Mối quan hệ giữa tinh thần và giới tự nhiên"],"a":[3],"p":19,"e":"Vấn đề cơ bản của triết học là quan hệ giữa tư duy và tồn tại, hay giữa ý thức và vật chất, tinh thần và giới tự nhiên. Đáp án d nêu cách diễn đạt này.","w":{"a":"Tư duy và ý thức là cùng một phạm trù, không phải hai mặt đối lập.","b":"Tồn tại và vật chất cũng là cặp khái niệm gần nghĩa, không phải hai mặt cần so sánh.","c":"Thế giới và vật chất không phải cặp đối lập trong vấn đề cơ bản."}},{"s":2,"n":"39","q":"Đặc trưng quan trọng nhất của vật chất là đặc trưng nào?","o":["Tính thực tại","Tính khách quan","Tính cụ thể","Tính phản ánh"],"a":[1],"p":20,"e":"Theo file gốc, đặc trưng quan trọng nhất của vật chất là tính khách quan, tồn tại độc lập với ý thức con người.","w":{"a":"Tính thực tại gần nghĩa nhưng file không chọn.","c":"Tính cụ thể không phải đặc trưng quan trọng nhất.","d":"Tính phản ánh là thuộc tính chung của mọi dạng vật chất, đặc biệt ở ý thức."}},{"s":2,"n":"40","q":"“Vật chất là phạm trù triết học, dùng để chỉ thực tại khách quan, được đem lại cho con người trong cảm giác, được cảm giác chép lại, chụp lại, phản ánh lại và tồn tại không lệ thuộc vào cảm giác”, định nghĩa này là của nhà triết học nào?","o":["C. Mác","Hê-ghen","V.I. Lênin","Ph. Ăngghen"],"a":[2],"p":20,"e":"Định nghĩa này do V.I.Lênin nêu trong tác phẩm \"Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán\" (1908).","w":{"a":"Mác không đưa ra định nghĩa này.","b":"Hê-ghen là nhà duy tâm khách quan.","d":"Ăngghen đã bàn nhiều về vật chất, nhưng định nghĩa này là của Lênin."}},{"s":3,"n":"1","q":"Yếu tố đầu tiên đảm bảo cho sự tồn tại của con người là gì?","o":["Nghiên cứu khoa học","Lao động","Sáng tạo nghệ thuật","Hoạt động chính trị"],"a":[1],"p":21,"e":"Lao động, tức sản xuất ra tư liệu sinh hoạt, là yếu tố đầu tiên đảm bảo sự tồn tại của con người, vì con người phải ăn, mặc, ở trước khi làm khoa học, nghệ thuật hay chính trị.","w":{"a":"Nghiên cứu khoa học cần có đời sống vật chất làm điều kiện.","c":"Sáng tạo nghệ thuật cũng vậy.","d":"Hoạt động chính trị cũng cần lao động sản xuất làm nền."}},{"s":3,"n":"2","q":"Sai lầm cơ bản của chủ nghĩa duy vật trước Mác về phạm trù vật chất là gì?","o":["Không hiểu được bản chất của các hiện tượng ý thức","Mang tính chất ngây thơ, chất phác, siêu hình","Đồng nhất vật chất với vật thể","Quan điểm nửa vời, không triệt để"],"a":[2],"p":21,"e":"Sai lầm cơ bản của chủ nghĩa duy vật trước Mác là đồng nhất vật chất với vật thể, nên không giải thích được những hiện tượng như điện từ mà vật chất không có hình thể cụ thể.","w":{"a":"Họ có giải thích hiện tượng ý thức, dù chưa đúng.","b":"Tính chất phác, siêu hình là đặc điểm chung, chưa phải sai lầm cơ bản về phạm trù vật chất.","d":"Quan điểm nửa vời, không triệt để là nhận xét chung, chưa nêu đúng sai lầm về vật chất."}},{"s":3,"n":"3","q":"Khái niệm nào dùng để chỉ những mối liên hệ, tương tác, chuyển hóa và vận động, phát triển theo quy luật của các sự vật, hiện tượng, quá trình trong giới tự nhiên, xã hội và tư duy?","o":["Biện chứng","Mối liên hệ","Vận động","Duy vật"],"a":[1],"p":21,"e":"File gốc đánh dấu đáp án B. Theo định nghĩa trong giáo trình, khái niệm chỉ những mối liên hệ, tương tác, chuyển hóa, vận động và phát triển theo quy luật của sự vật là \"biện chứng\".","w":{"a":"Phương án này khớp với định nghĩa trong giáo trình.","c":"Vận động là sự biến đổi nói chung.","d":"Duy vật là lập trường coi vật chất có trước."},"f":"Đáp án trong file là B (Mối liên hệ), nhưng giáo trình định nghĩa \"biện chứng\" bằng chính câu trong đề. Câu này có thể có sai lệch trong file gốc."},{"s":3,"n":"4","q":"Siêu hình là phương pháp tư duy về sự vật hiện tượng của thế giới trong trạng thái nào?","o":["Vận động và cô lập","Cô lập và bất biến","Biến đổi và liên hệ qua lại","Vận động và chuyển hóa"],"a":[1],"p":21,"e":"Phương pháp siêu hình xem xét sự vật trong trạng thái cô lập, bất biến, tách rời nhau và tách rời vận động.","w":{"a":"Vận động là đặc điểm của phép biện chứng, siêu hình coi sự vật bất biến.","c":"Biến đổi và liên hệ qua lại là của phép biện chứng.","d":"Vận động và chuyển hóa cũng là của phép biện chứng."}},{"s":3,"n":"5","q":"Quan điểm của phái Bất khả tri về mặt thứ hai của vấn đề cơ bản của triết học là gì?","o":["Con người có khả năng nhận thức được thế giới","Con người không có khả năng nhận thức được thế giới","Con người chỉ nhận thức được một vài lĩnh vực thôi","Ý thức có trước, vật chất có sau"],"a":[1],"p":21,"e":"Thuyết bất khả tri phủ nhận khả năng con người nhận thức được bản chất của thế giới.","w":{"a":"Đây là quan điểm của thuyết khả tri.","c":"Bất khả tri phủ nhận khả năng nhận thức bản chất của thế giới, không giới hạn ở một vài lĩnh vực.","d":"\"Ý thức có trước, vật chất có sau\" trả lời mặt thứ nhất của vấn đề cơ bản."}},{"s":3,"n":"6","q":"Đặc trưng cơ bản của phép biện chứng duy vật là gì?","o":["Phép biện chứng duy vật là phép biện chứng được xác lập trên nền tảng của thế giới quan duy vật siêu hình","Phép biện chứng duy vật là phép biện chứng được xác lập trên nền tảng của thế giới quan duy vật khoa học","Phép biện chứng duy vật là phép biện chứng được xác lập trên nền tảng của thế giới quan duy tâm tôn giáo","Phép biện chứng duy vật là phép biện chứng được xác lập trên nền tảng của thế giới quan duy tâm khoa học"],"a":[1],"p":21,"e":"Phép biện chứng duy vật là phép biện chứng được xác lập trên nền tảng thế giới quan duy vật khoa học, đây là đặc trưng cơ bản phân biệt nó với phép biện chứng duy tâm của Hê-ghen.","w":{"a":"Thế giới quan duy vật siêu hình không phải nền tảng của phép biện chứng duy vật.","c":"Duy tâm tôn giáo trái với thế giới quan duy vật.","d":"Duy tâm khoa học là phép biện chứng duy tâm."}},{"s":3,"n":"7","q":"Những hình thức nhận thức: khái niệm, phán đoán, suy luận thuộc giai đoạn nhận thức nào?","o":["Nhận thức lý trí","Nhận thức lý tính","Trực quan sinh động","Nhận thức siêu nghiệm"],"a":[1],"p":22,"e":"Khái niệm, phán đoán, suy luận là các hình thức của nhận thức lý tính, giai đoạn nhận thức gián tiếp, trừu tượng.","w":{"a":"Cách viết \"lý trí\" không phải thuật ngữ của giai đoạn nhận thức này.","c":"Trực quan sinh động là nhận thức cảm tính.","d":"Nhận thức siêu nghiệm là thuật ngữ của Can-tơ."}},{"s":3,"n":"8","q":"Hoạt động thực tiễn khác với hoạt động nhận thức vì?","o":["Hoạt động thực tiễn có mục đích","Hoạt động thực tiễn là hoạt động vật chất","Hoạt động thực tiễn có tính chất lích sử- xã hội","Hoạt động thực tiễn mang tính tương đối"],"a":[1],"p":22,"e":"Thực tiễn là hoạt động vật chất, cảm tính của con người tác động vào thế giới. Nhận thức là hoạt động tinh thần. Đây là điểm khác cơ bản giữa hai loại hoạt động.","w":{"a":"Hoạt động có mục đích cũng có ở nhận thức.","c":"Tính lịch sử - xã hội là đặc điểm của thực tiễn nhưng không phải điểm phân biệt duy nhất với nhận thức.","d":"Tính tương đối không phải điểm khác cơ bản."}},{"s":3,"n":"9","q":"Câu “Bứt dây động rừng”, thể hiện quan điểm nhận thức nào sau đây?","o":["Quan điểm siêu hình","Quan điểm biện chứng","Quan điểm khoa học","Quan điểm kinh nghiệm"],"a":[1],"p":22,"e":"\"Bứt dây động rừng\" nói mọi sự vật liên hệ ràng buộc nhau, tác động một chỗ kéo theo thay đổi ở chỗ khác. Đó là quan điểm biện chứng về mối liên hệ phổ biến.","w":{"a":"Quan điểm siêu hình coi sự vật tách rời.","c":"Từ \"khoa học\" ở đây không nêu quan điểm triết học nào.","d":"Kinh nghiệm là nguồn của câu tục ngữ, nhưng nội dung triết học của nó là biện chứng."}},{"s":3,"n":"10","q":"Nhân tố tạo thành mâu thuẫn là gì?","o":["Mặt đối lập","Mặt ngược nhau","Sự phủ định của sự vật","Vận động trái chiều"],"a":[0],"p":22,"e":"Mâu thuẫn biện chứng được tạo thành từ các mặt đối lập, những mặt vừa thống nhất vừa đấu tranh với nhau.","w":{"b":"\"Mặt ngược nhau\" không phải thuật ngữ triết học.","c":"Phủ định là khái niệm của quy luật phủ định của phủ định.","d":"\"Vận động trái chiều\" không phải thuật ngữ triết học."}},{"s":3,"n":"11","q":"Phát biều nào sau đây là sai theo quan điểm của phép biện chứng duy vật?","o":["Chất và lượng tồn tại tách rời, biệt lập nhau","Lượng tồn tại trong sự thống nhất với chất để tạo nên sự vật","Chất và lượng đều tồn tại khách quan","Sự phân biệt giữa chất và lượng chỉ có ý nghĩa tương đối"],"a":[0],"p":22,"e":"Chất và lượng thống nhất hữu cơ với nhau trong sự vật, không tồn tại tách rời, biệt lập. Phát biểu a mâu thuẫn với phép biện chứng duy vật.","w":{"b":"Đúng: lượng tồn tại trong sự thống nhất với chất.","c":"Đúng: chất và lượng đều tồn tại khách quan.","d":"Đúng: sự phân biệt chất - lượng chỉ có ý nghĩa tương đối."}},{"s":3,"n":"12","q":"Nếu tuyệt đối hóa vai trò của lý luận sẽ dẫn đến sai lầm của gì?","o":["Bệnh chủ quan duy ý chí, giáo điều","Bệnh thành tích","Kinh nghiệm chủ nghĩa","Bệnh ảo tưởng"],"a":[0],"p":22,"e":"Tuyệt đối hóa lý luận, coi nhẹ thực tiễn, dẫn đến bệnh chủ quan duy ý chí và giáo điều.","w":{"b":"Bệnh thành tích là sai lầm trong đánh giá kết quả công việc.","c":"Kinh nghiệm chủ nghĩa là sai lầm khi tuyệt đối hóa thực tiễn.","d":"Bệnh ảo tưởng không phải sai lầm đặc trưng của việc tuyệt đối hóa lý luận."}},{"s":3,"n":"13","q":"Câu “Môi hở răng lạnh”, thể hiện quan điểm nhận thức nào sau đây?","o":["Quan điểm duy tâm","Quan điểm biện chứng","Quan điểm sinh học","Quan điểm khoa học"],"a":[1],"p":22,"e":"\"Môi hở răng lạnh\" diễn tả mối quan hệ gắn bó, ảnh hưởng lẫn nhau giữa sự vật. Đó là quan điểm biện chứng về mối liên hệ.","w":{"a":"Duy tâm coi ý thức có trước.","c":"Quan điểm sinh học chỉ xét về sinh vật.","d":"\"Khoa học\" không phải tên một quan điểm triết học."}},{"s":3,"n":"14","q":"Nếu tuyệt đối hóa vai trò của thực tiễn sẽ dẫn đến sai lầm gì?","o":["Chủ nghĩa thực dụng và kinh nghiệm chủ nghĩa","Bệnh giáo điều","Bệnh chủ quan duy ý chí","Bệnh ấu trĩ tả khuynh"],"a":[0],"p":23,"e":"Tuyệt đối hóa vai trò của thực tiễn, coi nhẹ lý luận, dẫn đến chủ nghĩa thực dụng và kinh nghiệm chủ nghĩa.","w":{"b":"Bệnh giáo điều là sai lầm khi tuyệt đối hóa lý luận.","c":"Bệnh chủ quan duy ý chí cũng gắn với việc tuyệt đối hóa lý luận.","d":"Bệnh ấu trĩ tả khuynh là sai lầm về đường lối chính trị, cách mạng."}},{"s":3,"n":"15","q":"Vì mâu thuẫn mang tính phong phú, đa dạng nên khi giải quyết mâu thuẫn cần phải làm gì?","o":["Tôn trọng quan điểm lịch sử - cụ thể","Chủ quan, duy ý chí","Áp dụng máy móc, rập khuôn, giáo điều","Tuân thủ kinh nghiệm từ trước"],"a":[0],"p":23,"e":"Mâu thuẫn có tính phong phú, đa dạng, nên khi giải quyết cần tôn trọng quan điểm lịch sử - cụ thể, tức xét từng mâu thuẫn trong điều kiện cụ thể của nó.","w":{"b":"Chủ quan duy ý chí là sai lầm cần tránh.","c":"Máy móc, rập khuôn, giáo điều là sai lầm cần tránh.","d":"Tuân thủ kinh nghiệm cũ là kinh nghiệm chủ nghĩa."}},{"s":3,"n":"16","q":"Hạt nhân của phép biện chứng duy vật là quy luật nào?","o":["Quy luật mâu thuẫn","Quy luật phủ định của phủ định","Quy luật đồng nhất của tư duy","Quy luật lượng - chất"],"a":[0],"p":23,"e":"Lênin gọi quy luật mâu thuẫn là hạt nhân của phép biện chứng vì nó chỉ ra nguồn gốc và động lực của mọi sự vận động, phát triển.","w":{"b":"Quy luật phủ định của phủ định chỉ ra khuynh hướng của sự phát triển.","c":"Quy luật đồng nhất của tư duy là quy luật của logic hình thức.","d":"Quy luật lượng - chất chỉ ra cách thức của sự phát triển."}},{"s":3,"n":"17","q":"Hãy chọn câu đúng theo quan điểm của triết học Mác – Lênin trong các nội dung sau?","o":["Các sự vật, hiện tượng tồn tại biệt lập, tách rời nhau, cái này tồn tại cạnh cái kia. Chúng không có sự phụ thuộc, không có sự ràng buộc và quy định lẫn nhau","Các sự vật, hiện tượng vừa tồn tại độc lập, vừa quy định, tác động qua lại chuyển hoá lẫn nhau","Các sự vật, hiện tượng vừa quy định vừa tác động qua lại chuyển hoá lẫn nhau","Các sự vật, hiện tượng tồn tại do thượng đế"],"a":[1],"p":23,"e":"Các sự vật, hiện tượng vừa tồn tại độc lập, vừa quy định, tác động qua lại và chuyển hóa lẫn nhau. Mỗi sự vật có tính độc lập tương đối, đồng thời liên hệ với các sự vật khác.","w":{"a":"Cho rằng các sự vật biệt lập là quan điểm siêu hình.","c":"Phương án này bỏ sót mặt tồn tại độc lập tương đối của sự vật.","d":"Sự vật tồn tại do Thượng đế là quan điểm duy tâm tôn giáo."}},{"s":3,"n":"18","q":"Theo quan điểm của triết học Mác – Lênin thì cơ sở quy định mối liên hệ của các sự vật, hiện tượng là gì?","o":["Do một lực lượng siêu nhiên nào đó","Do ý thức, cảm giác của con người","Tính thống nhất vật chất của thế giới","Do sự biến đổi nói chung của sự vật"],"a":[2],"p":23,"e":"Cơ sở quy định mối liên hệ của các sự vật là tính thống nhất vật chất của thế giới. Mọi sự vật đều là những dạng tồn tại của vật chất nên chúng có mối liên hệ với nhau.","w":{"a":"Lực lượng siêu nhiên là quan điểm duy tâm tôn giáo.","b":"Ý thức, cảm giác của con người là quan điểm duy tâm chủ quan.","d":"Sự biến đổi nói chung không giải thích vì sao các sự vật liên hệ."}},{"s":3,"n":"19","q":"Quan điểm duy vật biện chứng khẳng định nguồn gốc của sự phát triển là gì?","o":["Do một lực lượng siêu nhiên","Do ý thức của con người","Do giải quyết các mâu thuẫn trong bản thân sự vật","Do sự phát triển không ngừng của xã hội"],"a":[2],"p":23,"e":"Nguồn gốc của sự phát triển là việc giải quyết các mâu thuẫn bên trong bản thân sự vật, nên phát triển là sự tự thân.","w":{"a":"Lực lượng siêu nhiên là quan điểm duy tâm tôn giáo.","b":"Ý thức của con người là quan điểm duy tâm chủ quan.","d":"Sự phát triển của xã hội chỉ là một lĩnh vực của sự phát triển."}},{"s":3,"n":"20","q":"V.I.Lênin đã sử dụng nội dung nào để định nghĩa vật chất?","o":["Phạm trù triết học","Khái niệm triết học","Khái niệm đặc trưng","Phạm trù đặc trưng"],"a":[0],"p":23,"e":"Lênin định nghĩa vật chất bằng cách dùng phạm trù triết học, tức khái niệm chung nhất, rộng nhất, nên không thể định nghĩa bằng cách chỉ ra \"loại\" và \"giống\" như khoa học cụ thể.","w":{"b":"\"Khái niệm triết học\" không phải cách diễn đạt trong định nghĩa.","c":"\"Khái niệm đặc trưng\" không phải cách diễn đạt trong định nghĩa.","d":"\"Phạm trù đặc trưng\" không phải cách diễn đạt trong định nghĩa."}},{"s":3,"n":"21","q":"Tính khoa học và cách mạng rõ nét nhất của phép biện chứng duy vật Mác - Lênin thể hiện ở nội dung nào?","o":["Chứng minh được nguồn gốc và động lực của mọi sự phát triển của xã hội","Là công cụ khoa học nhất để nhận thức thế giới","Xác định triết học là khoa học của mọi khoa học","Không dừng lại ở sự giải thích thế giới mà còn là công cụ để nhận thức và cải tạo thế giới"],"a":[3],"p":24,"e":"Tính khoa học và cách mạng của phép biện chứng duy vật thể hiện rõ nhất ở chỗ nó giải thích thế giới và còn là công cụ để nhận thức và cải tạo thế giới.","w":{"a":"Phương án này chỉ nói về nguồn gốc và động lực phát triển xã hội, thuộc chủ nghĩa duy vật lịch sử.","b":"Công cụ nhận thức là một chức năng, chưa nêu tính cách mạng.","c":"Triết học là khoa học của mọi khoa học là quan điểm của Hê-ghen."}},{"s":3,"n":"22","q":"Quan điểm siêu hình về mối liên hệ giữa các sự vật hiện tượng trong thế giới khách quan là gì?","o":["Là sự qui định, sự tác động và sự chuyển hóa lẫn nhau giữa các sự vật hiện tượng, hay giữa các mặt của một sự vật một hiện tượng trong thế giới khách quan","Cơ sở của sự liên hệ, tác động qua lại giữa các sự vật hiện tượng là thượng đế","Các sự vật hiện tượng không có liên hệ qua lại với nhau hoặc nếu có thì chỉ là những liên hệ một chiều, phiến diện","Các sự vật hiện tượng có liên hệ qua lại với nhau"],"a":[2],"p":24,"e":"Quan điểm siêu hình coi các sự vật không có liên hệ với nhau, hoặc nếu có thì chỉ là liên hệ một chiều, phiến diện.","w":{"a":"Đây là nội dung quan điểm biện chứng về mối liên hệ.","b":"Cho Thượng đế là cơ sở của liên hệ là quan điểm duy tâm tôn giáo.","d":"Thừa nhận sự vật liên hệ với nhau là quan điểm biện chứng."}},{"s":3,"n":"23","q":"Nguyên lý về sự phát triển theo quan điểm của triết học Mác-Lênin là gì?","o":["Phát triển là một quá trình tiến lên liên tục trơn tru, không có những bước quanh co phức tạp không có mâu thuẫn","Sự phát triển do tác động của những thế lực siêu tự nhiên thần bí tôn giáo hoặc của ý thức nói chung","Là kết quả của một quá trình đấu tranh giữa các mặt đối lập bên trong các sự vật hiện tượng của thế giới hiện thực khách quan","Phát triển là một quá trình tăng lên về số lượng"],"a":[2],"p":24,"e":"Phát triển là kết quả của quá trình đấu tranh giữa các mặt đối lập bên trong sự vật, hiện tượng của thế giới khách quan. Đó là nội dung của nguyên lý về sự phát triển.","w":{"a":"Phát triển tiến lên liên tục, trơn tru là quan điểm siêu hình. Phát triển có quanh co, phức tạp.","b":"Sự phát triển do thế lực siêu nhiên là quan điểm duy tâm.","d":"Phát triển gồm cả tăng về số lượng và thay đổi về chất."}},{"s":3,"n":"24","q":"Muốn hiểu đầy đủ và đúng đắn bản chất của sự vật, chúng ta cần dựa trên cơ sở nào?","o":["Chỉ cần căn cứ vào những hiện tượng cá biệt, riêng lẻ để rút ra bản chất của sự vật","Phải nghiên cứu một cách cụ thể, toàn diện, tổng thể những hiện tượng phong phú và đa dạng của sự vật","Nhờ có thực tiễn cung cấp tư liệu làm cho sự vật bộc lộ những hiện tượng riêng lẻ để rút ra bản chất của sự vật","Sự tồn tại thực tế của sự vật, hiện tượng"],"a":[1],"p":24,"e":"Muốn hiểu đúng bản chất của sự vật phải nghiên cứu cụ thể, toàn diện và tổng thể các hiện tượng phong phú của nó, vì bản chất bộc lộ qua nhiều hiện tượng.","w":{"a":"Chỉ dựa vào hiện tượng cá biệt, riêng lẻ thì chỉ nhìn được một mặt.","c":"Thực tiễn cung cấp tư liệu, nhưng cần nghiên cứu toàn diện mới rút ra bản chất.","d":"Sự tồn tại thực tế của sự vật chưa chỉ ra phương pháp nhận thức bản chất."}},{"s":3,"n":"25","q":"Vì sao sự thống nhất của các mặt đối lập là tương đối còn sự đấu tranh của các mặt đối lập là tuyệt đối?","o":["Sự thống nhất của các mặt đối lập thể hiện trạng thái cân bằng giữa các mặt đối lập của sự vật, sự đấu tranh của các mặt đối lập gắn liền với sự vận động và phát triển của sự vật","Sự thống nhất và đấu tranh của các mặt đối lập là trạng thái đứng im tương đối của sự vật","Sự thống nhất và đấu tranh của các mặt đối lập gắn liền với vận động và phát triển của thế giới vật chất","Sự thống nhất và đấu tranh của các mặt đối lập gắn liền với sự tồn tại của thế giới vật chất"],"a":[0],"p":24,"e":"Sự thống nhất của các mặt đối lập thể hiện trạng thái cân bằng của sự vật, nên chỉ tồn tại tương đối, tạm thời. Sự đấu tranh gắn liền với vận động và phát triển, mà vận động là tuyệt đối, nên đấu tranh là tuyệt đối.","w":{"b":"Thống nhất và đấu tranh không cùng là trạng thái đứng im.","c":"Gộp cả thống nhất và đấu tranh vào vận động, phương án này không giải thích vì sao thống nhất là tương đối.","d":"Gộp cả hai vào sự tồn tại, phương án này không phân biệt tính tương đối và tuyệt đối."}},{"s":3,"n":"26","q":"Điểm giống nhau căn bản giữa các quy luật của phép biện chứng và các quy luật của các khoa học là gì?","o":["Đều ra đời dựa trên cơ sở hoạt động thực tiễn của con người, mang nội dung khách quan và là công cụ của con người nhận thức và cải tạo thế giới khách quan trong hoạt động thực tiễn","Đều ra đời trên cơ sở khái quát những kinh nghiệm trong hoạt động thực tiễn của con người, để tìm ra chân lý tuyệt đối","Được hình thành từ nhiều phương pháp khoa học","Dựa vào những thành tựu khoa học"],"a":[0],"p":25,"e":"Các quy luật của phép biện chứng và của các khoa học đều dựa trên hoạt động thực tiễn của con người, mang nội dung khách quan và là công cụ nhận thức, cải tạo thế giới.","w":{"b":"Không có quy luật nào dùng để tìm \"chân lý tuyệt đối\".","c":"\"Hình thành từ nhiều phương pháp khoa học\" không phải điểm giống nhau căn bản.","d":"Chỉ dựa vào thành tựu khoa học thì bỏ qua cơ sở thực tiễn."}},{"s":3,"n":"27","q":"Trong định nghĩa về vật chất, V.I.Lênin xác định thuộc tính chung nhất của vật chất là gì?","o":["Tự vận động","Tự phản ánh","Đều có khả năng phản ánh","Không lệ thuộc vào cảm giác"],"a":[3],"p":25,"e":"Trong định nghĩa của Lênin, tồn tại không lệ thuộc vào cảm giác chính là thuộc tính chung nhất của vật chất, tức tính khách quan.","w":{"a":"Tự vận động là thuộc tính cố hữu của vật chất nhưng không nằm trong định nghĩa này.","b":"\"Tự phản ánh\" không phải thuộc tính được nêu.","c":"Khả năng phản ánh là thuộc tính của mọi dạng vật chất, nhưng không phải thuộc tính chung nhất trong định nghĩa."}},{"s":3,"n":"28","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai khi diễn đạt nội dung về lượng của sự vật?","o":["Lượng là nói lên quy mô, trình độ phát triển của sự vật","Lượng phụ thuộc vào ý chí của con người","Lượng là tính quy định vốn có của sự vật","Lượng tồn tại khách quan gắn liền với sự vật"],"a":[1],"p":25,"e":"Lượng tồn tại khách quan, gắn liền với sự vật, không phụ thuộc ý chí con người. Vì vậy phát biểu b là sai.","w":{"a":"Đúng: lượng nói lên quy mô, trình độ phát triển của sự vật.","c":"Đúng: lượng là tính quy định vốn có của sự vật.","d":"Đúng: lượng tồn tại khách quan gắn liền với sự vật."}},{"s":3,"n":"29","q":"Theo quan điểm của chủ nghĩa Mác – Lênin, để xác định chân lý và sai lầm chúng ta dựa vào cơ sở nào?","o":["Thực tiễn","Giả thuyết","Kinh nghiệm","Phán đoán"],"a":[0],"p":25,"e":"Theo chủ nghĩa Mác-Lênin, thực tiễn là tiêu chuẩn của chân lý, vì chỉ trong thực tiễn mới kiểm nghiệm được nhận thức đúng hay sai.","w":{"b":"Giả thuyết cần được thực tiễn kiểm chứng.","c":"Kinh nghiệm là kết quả của nhận thức, chưa phải tiêu chuẩn.","d":"Phán đoán là hình thức tư duy, cần thực tiễn kiểm nghiệm."}},{"s":3,"n":"30","q":"Theo quan điểm của chủ nghĩa Mác - Lênin, mục đích nhận thức của con người là gì?","o":["Phát hiện ra quy luật của các sự vật, hiện tượng","Nhằm sáng tạo ra những tri thức về thế giới khách quan","Nhằm mục đích phục vụ cho nhu cầu bản thân và xã hội loài người","Để thỏa mãn nhu cầu nhận thức của con người"],"a":[2],"p":25,"e":"Mục đích nhận thức của con người là phục vụ nhu cầu của bản thân và xã hội loài người, nhận thức luôn hướng vào thực tiễn.","w":{"a":"Phát hiện quy luật là một nội dung của nhận thức, chưa phải mục đích cuối cùng.","b":"Sáng tạo tri thức là kết quả, không phải mục đích.","d":"Chỉ thỏa mãn nhu cầu nhận thức thì nhận thức tách khỏi thực tiễn."}},{"s":3,"n":"31","q":"Mệnh đề nào sau đây không đúng với quan niệm của triết học Mác-Lênin về vật chất?","o":["Vật thể không phải là vật chất","Vật thể là dạng tồn tại cụ thể của vật chất","Vật chất không chỉ bao gồm một dạng tồn tại là vật thể","Vật chất tồn tại thông qua những dạng cụ thể của nó"],"a":[0],"p":25,"e":"Vật thể chỉ là một dạng tồn tại cụ thể của vật chất, nên vật thể vẫn thuộc vật chất. Vì vậy phát biểu \"vật thể không phải là vật chất\" là không đúng.","w":{"b":"Đúng: vật thể là dạng tồn tại cụ thể của vật chất.","c":"Đúng: vật chất còn có những dạng tồn tại khác ngoài vật thể.","d":"Đúng: vật chất tồn tại qua các dạng cụ thể."}},{"s":3,"n":"32","q":"Trong xã hội có giai cấp, mâu thuẫn nào có thể dẫn đến cuộc cách mạng xã hội?","o":["Mâu thuẫn văn hóa nghệ thuật","Mâu thuẫn giữa giai cấp thống trị và giai cấp bị trị","Mâu thuẫn giữa dân tộc với dân tộc","Mâu thuẫn tự phát"],"a":[1],"p":26,"e":"Mâu thuẫn giữa giai cấp thống trị và giai cấp bị trị là mâu thuẫn đối kháng. Khi mâu thuẫn này lên đến đỉnh điểm, nó dẫn đến cách mạng xã hội.","w":{"a":"Mâu thuẫn văn hóa nghệ thuật thường không dẫn đến cách mạng xã hội.","c":"Mâu thuẫn giữa các dân tộc có thể dẫn đến xung đột nhưng không phải mâu thuẫn cơ bản.","d":"\"Mâu thuẫn tự phát\" không phải một loại mâu thuẫn trong lý luận."}},{"s":3,"n":"33","q":"Tính chất nào của chân lý thể hiện tính độc lập đối với ý chí chủ quan của con người?","o":["Tính cụ thể","Tính tuyệt đối","Tính tương đối","Tính khách quan"],"a":[3],"p":26,"e":"Tính khách quan của chân lý nghĩa là nội dung của nó không lệ thuộc vào ý chí chủ quan của con người.","w":{"a":"Tính cụ thể: chân lý luôn gắn với điều kiện, hoàn cảnh cụ thể.","b":"Tính tuyệt đối: chân lý phản ánh đúng đối tượng ở mức đầy đủ trong một giới hạn.","c":"Tính tương đối: chân lý phản ánh đúng nhưng chưa đầy đủ."}},{"s":3,"n":"34","q":"Cơ sở thống nhất giữa nhận thức cảm tính và nhận thức lý tính là gì?","o":["Sản xuất vật chất","Hoạt động chính trị - xã hội","Lý luận","Hoạt động thực tiễn"],"a":[3],"p":26,"e":"Hoạt động thực tiễn là cơ sở thống nhất giữa nhận thức cảm tính và nhận thức lý tính, vì cả hai giai đoạn đều bắt nguồn và được kiểm nghiệm trong thực tiễn.","w":{"a":"Sản xuất vật chất chỉ là một hình thức của thực tiễn.","b":"Hoạt động chính trị - xã hội cũng chỉ là một hình thức của thực tiễn.","c":"Lý luận là kết quả của nhận thức lý tính."}},{"s":3,"n":"35","q":"Sự thống nhất của các mặt đối lập gắn liền với trạng thái nào của các sự vật hiện tượng trong thế giới khách quan?","o":["Sự vật hiện tượng đang vận động và biến đổi","Sự vật hiện tượng được sinh ra","Sự vật hiện tượng đang bị tiêu vong","Sự vật hiện tượng đang trong trạng thái đứng im tương đối"],"a":[3],"p":26,"e":"Sự thống nhất của các mặt đối lập gắn với trạng thái đứng im tương đối của sự vật, khi các mặt đối lập ở thế cân bằng.","w":{"a":"Khi sự vật đang vận động và biến đổi, đấu tranh nổi lên.","b":"Sự sinh ra của sự vật là kết quả của một quá trình giải quyết mâu thuẫn.","c":"Khi sự vật bị tiêu vong, thống nhất bị phá vỡ."}},{"s":3,"n":"36","q":"Theo Lênin, đâu là một trong những yếu tố tạo nên sự nghiệp cách mạng của hàng triệu người trong cuộc đấu tranh giai cấp quyết liệt nhằm giải phóng mình, giải phóng nhân loại?","o":["Tri thức","Lý trí","Ý chí","Tình cảm"],"a":[2],"p":26,"e":"Lênin nhấn mạnh ý chí là một yếu tố tạo nên sự nghiệp cách mạng của hàng triệu người, cùng với tri thức và tình cảm.","w":{"a":"Tri thức là điều kiện nhưng chưa tạo thành hành động.","b":"Lý trí là cơ sở của hành động nhưng chưa phải yếu tố mà Lênin nhấn mạnh trong câu này.","d":"Tình cảm có vai trò nhưng chưa phải yếu tố được Lênin nêu ở đây."}},{"s":3,"n":"37","q":"Theo quan điểm của chủ nghĩa duy vật biên chứng, vật chất và ý thức tồn tại trong mối quan hệ biện chứng với nhau, tác động lẫn nhau thông qua yếu tố nào sau đây?","o":["Hoạt động lý luận","Hoạt động nghiên cứu","Họat động thực tiễn","Hoạt động học tập"],"a":[2],"p":26,"e":"Vật chất và ý thức tác động lẫn nhau thông qua hoạt động thực tiễn của con người.","w":{"a":"Hoạt động lý luận là hoạt động tinh thần.","b":"Nghiên cứu là một hoạt động nhận thức.","d":"Học tập cũng là hoạt động nhận thức."}},{"s":3,"n":"38","q":"Quan điểm đòi hỏi chúng ta khi nhận thức và hành động phải xuất phát từ bản thân sự vật, hiện tượng, không lấy ý muốn chủ quan của mình làm cơ sở định ra chính sách, không lấy ý chí áp đặt cho thực tế, là quan điểm thuộc nguyên tắc nào?","o":["Nguyên tắc chủ quan","Nguyên tắc khách quan","Nguyên tắc toàn diện","Nguyên tắc phát triển"],"a":[1],"p":26,"e":"Nguyên tắc khách quan đòi hỏi xuất phát từ bản thân sự vật, hiện tượng, tôn trọng quy luật khách quan, không lấy ý muốn chủ quan áp đặt cho thực tế.","w":{"a":"\"Nguyên tắc chủ quan\" không phải nguyên tắc của phép biện chứng duy vật.","c":"Nguyên tắc toàn diện đòi hỏi xem xét sự vật trong nhiều mối liên hệ.","d":"Nguyên tắc phát triển đòi hỏi xem xét sự vật trong vận động, phát triển."}},{"s":3,"n":"39","q":"Nguyên tắc khách quan đòi hỏi chống lại đặc điểm nào trong nhận thức và thực tiễn?","o":["Khách quan duy vật","Biện chứng","Toàn diện","Chủ quan duy ý chí"],"a":[3],"p":27,"e":"Nguyên tắc khách quan đòi hỏi chống chủ quan duy ý chí, tức lấy ý muốn chủ quan thay cho điều kiện thực tế.","w":{"a":"Khách quan duy vật là nội dung của nguyên tắc khách quan.","b":"Biện chứng là phương pháp đúng.","c":"Toàn diện là một nguyên tắc cần vận dụng."}},{"s":3,"n":"40","q":"Bên cạnh việc kế thừa tinh hoa của các học thuyết triết học trước đó, chủ nghĩa duy vật biện chứng còn sử dụng những thành tựu nào?","o":["Thành tựu của khoa học tự nhiên đương thời","Thành tựu của tâm lý học","Thành tựu kinh tế","Thành tựu cơ học cổ điển"],"a":[0],"p":27,"e":"Chủ nghĩa duy vật biện chứng kế thừa tinh hoa các học thuyết trước và sử dụng thành tựu của khoa học tự nhiên đương thời, như ba phát minh lớn nửa đầu thế kỷ XIX.","w":{"b":"Tâm lý học không phải thành tựu then chốt.","c":"Thành tựu kinh tế thuộc tiền đề kinh tế - xã hội.","d":"Cơ học cổ điển là cơ sở của chủ nghĩa duy vật siêu hình."}},{"s":3,"n":"41","q":"“Khi giải quyết những vấn đề tự nhiên, các nhà duy vật đứng trên quan điểm duy vật, nhưng khi giải quyết những vấn đề xã hội, họ lại trượt qua chủ nghĩa duy tâm”. Hạn chế này được gọi là quan điểm nào?","o":["Duy vật siêu hình","Duy vật chất phác","Duy vật nửa vời, không triệt để","Duy vật nhị nguyên"],"a":[2],"p":27,"e":"Các nhà duy vật trước Mác duy vật khi giải quyết vấn đề tự nhiên nhưng duy tâm khi giải quyết vấn đề xã hội. Đó là chủ nghĩa duy vật nửa vời, không triệt để.","w":{"a":"Duy vật siêu hình xem xét sự vật tĩnh tại, cô lập.","b":"Duy vật chất phác là hình thức cổ đại.","d":"\"Duy vật nhị nguyên\" không phải tên hình thức nêu trong giáo trình."}},{"s":3,"n":"42","q":"Những phát minh trong khoa học tự nhiên cuối thế kỷ XIX đầu thế kỷ XX, đặc biệt của W. Roentgen, H. Becquerel, J.J. Thomson… đã bác bỏ quan niệm của các nhà duy vật trước Mác về vật chất, từ đó dẫn đến cuộc khủng hoảng nào sau đây?","o":["Khủng hoảng chính trị","Khủng hoảng kinh tế","Khủng hoảng niềm tin","Khủng hoảng thế giới quan"],"a":[3],"p":27,"e":"Phát minh vật lý cuối thế kỷ XIX đầu thế kỷ XX (tia X, phóng xạ, điện tử) bác bỏ quan niệm đồng nhất vật chất với nguyên tử, dẫn đến cuộc khủng hoảng thế giới quan trong vật lý học.","w":{"a":"Khủng hoảng chính trị không phải hệ quả trực tiếp của các phát minh.","b":"Khủng hoảng kinh tế không phải hệ quả trực tiếp.","c":"Khủng hoảng niềm tin không phải thuật ngữ trong giáo trình."}},{"s":3,"n":"43","q":"Sự tồn tại và phát triển của chủ nghĩa duy vật có nguồn gốc từ yếu tố nào dưới đây?","o":["Sự phát triển của tôn giáo","Sự phát triển của chủ nghĩa duy tâm","Sự phát triển của thần học","Sự phát triển của khoa học và thực tiễn"],"a":[3],"p":27,"e":"Chủ nghĩa duy vật tồn tại và phát triển dựa trên sự phát triển của khoa học và thực tiễn.","w":{"a":"Tôn giáo gắn với chủ nghĩa duy tâm.","b":"Duy tâm là đối lập của duy vật.","c":"Thần học gắn với duy tâm tôn giáo."}},{"s":3,"n":"44","q":"Hình thái lịch sử đầu tiên của chủ nghĩa duy vật xuất hiện nhiều nhất ở nhóm quốc gia nào sau đây?","o":["Đức, Pháp","Anh, Mĩ","Ấn Độ, Trung Quốc, Hy Lạp","Ai Cập, Nga"],"a":[2],"p":27,"e":"Hình thái lịch sử đầu tiên của chủ nghĩa duy vật, chủ nghĩa duy vật chất phác, xuất hiện nhiều nhất ở Ấn Độ, Trung Quốc và Hy Lạp cổ đại.","w":{"a":"Đức, Pháp là nơi triết học phát triển thời cận đại.","b":"Anh, Mỹ không phải nơi xuất hiện hình thái đầu tiên.","d":"Ai Cập, Nga không nằm trong nhóm này."}},{"s":3,"n":"45","q":"Đâu là điểm phân biệt sự khác nhau giữa chủ nghĩa duy vật biện chứng (CNDVBC) và phép biện chứng duy vật (PBCDV)?","o":["CNDVBC là học thuyết còn PBCDV là trường phái","CNDVBC là trường phái còn PBCDV là học thuyết","CNDVBC được xác lập trên nền tảng thế giới quan duy vật, còn PBCDV được xác lập trên nền tảng phương pháp luận biện chứng","PBCDV được xác lập trên nền tảng thế giới quan duy vật, còn CNDVBC được xác lập trên nền tảng phương pháp luận biện chứng"],"a":[1],"p":28,"e":"File gốc chọn B: chủ nghĩa duy vật biện chứng là trường phái triết học, còn phép biện chứng duy vật là học thuyết về mối liên hệ phổ biến và sự phát triển.","w":{"a":"Đảo ngược cách phân biệt.","c":"Phép biện chứng duy vật dựa trên thế giới quan duy vật và cả phương pháp luận.","d":"Cả hai đều dựa trên thế giới quan duy vật."}},{"s":4,"n":"1","q":"Điều khẳng định nào sau đây là sai?","o":["Chủ nghĩa duy vật biện chứng cho rằng động vật bậc cao chưa có ý thức.","Chủ nghĩa duy vật biện chứng cho rằng động vật bậc cao cũng có ý thức.","Chủ nghĩa duy vật biện chứng cho rằng chỉ có con người mới có ý thức","Chủ nghĩa duy vật đều cho ý thức là sự phản ánh hiện thực khách quan vào óc con người."],"a":[1],"p":29,"e":"Chủ nghĩa duy vật biện chứng cho rằng ý thức là sản phẩm của bộ óc người, chỉ con người mới có ý thức. Động vật bậc cao chỉ có tâm lý, nên phát biểu b là sai.","w":{"a":"Đúng: động vật bậc cao chưa có ý thức.","c":"Đúng: chỉ có con người mới có ý thức.","d":"Đúng: chủ nghĩa duy vật coi ý thức là phản ánh hiện thực khách quan vào óc con người."}},{"s":4,"n":"2","q":"Hình thức phản ánh đặc trưng của của thế giới vô cơ là gì?","o":["Phản ánh vật lý hoá học.","Phản ánh sinh học.","Phản ánh ý thức."],"a":[0],"p":29,"e":"Thế giới vô cơ phản ánh bằng các tác động vật lý, hóa học (biến dạng, nóng chảy, phản ứng).","w":{"b":"Phản ánh sinh học là của giới hữu sinh.","c":"Phản ánh ý thức chỉ có ở con người."}},{"s":4,"n":"3","q":"Hình thức phản ánh đặc trưng của thế giới thực vật và động vật chưa có hệ thần kinh là gì?","o":["Phản ánh vật lý, hoá học.","Tính kích thích.","Tính cảm ứng","Tâm lý động vật."],"a":[1],"p":29,"e":"Thực vật và động vật chưa có hệ thần kinh phản ánh bằng tính kích thích: phản ứng với tác động của môi trường.","w":{"a":"Phản ánh vật lý, hóa học là của giới vô cơ.","c":"Tính cảm ứng là của động vật có hệ thần kinh đơn giản.","d":"Tâm lý động vật là của động vật bậc cao có hệ thần kinh trung ương."}},{"s":4,"n":"4","q":"Hình thức phản ánh đặc trưng của động vật có hệ thần kinh là gì?","o":["Tính kích thích.","Tâm lý động vật.","Tính cảm ứng.","Các phản xạ."],"a":[3],"p":29,"e":"Động vật có hệ thần kinh phản ánh bằng các phản xạ.","w":{"a":"Tính kích thích là của thực vật và động vật chưa có hệ thần kinh.","b":"Tâm lý động vật là hình thức ở động vật bậc cao.","c":"Tính cảm ứng là hình thức thấp hơn phản xạ, ở động vật có hệ thần kinh đơn giản."}},{"s":4,"n":"5","q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng vê nguồn gốc của ý thức?","o":["Ý thức ra đời là kết quả quá trình phát triển lâu dài thuộc tính phản ánh của thế giới vật chất.","Ý thức ra đời là kết quả sự tác động lẫn nhau giữa các sự vật vật chất.","Ý thức ra đời là kết quả quá trình tiến hoá của hệ thần kinh."],"a":[0],"p":29,"e":"Theo chủ nghĩa duy vật biện chứng, ý thức là kết quả của quá trình phát triển lâu dài của thuộc tính phản ánh của vật chất.","w":{"b":"Chỉ nói tác động lẫn nhau giữa các sự vật vật chất thì chưa đến mức hình thành ý thức.","c":"Tiến hóa của hệ thần kinh là điều kiện nhưng chưa đủ giải thích nguồn gốc ý thức."}},{"s":4,"n":"6","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng nguồn gốc tự nhiên của ý thức gồm những yếu tố nào?","o":["Bộ óc con người.","Thế giới bên ngoài tác động vào bộ óc.","Lao động của con người","Gồm a và b.","Gồm cả a, b, và c."],"a":[3],"p":29,"e":"Nguồn gốc tự nhiên của ý thức gồm hai yếu tố: bộ óc con người và sự tác động của thế giới bên ngoài vào bộ óc.","w":{"a":"Mới nêu một yếu tố.","b":"Mới nêu một yếu tố.","c":"Lao động thuộc nguồn gốc xã hội.","e":"Lao động thuộc nguồn gốc xã hội."}},{"s":4,"n":"7","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng điều kiện cần và đủ cho sự ra đời và phát triển ý thức là những điều kiện nào?","o":["Bộ óc con người và thế giới bên ngoài tác động vào bộ óc người","Lao động của con người và ngôn ngữ.","Gồm cả a, và b."],"a":[2],"p":29,"e":"Điều kiện cần và đủ cho sự ra đời và phát triển ý thức gồm cả nguồn gốc tự nhiên (bộ óc và thế giới bên ngoài) và nguồn gốc xã hội (lao động và ngôn ngữ).","w":{"a":"Mới nêu nguồn gốc tự nhiên.","b":"Mới nêu nguồn gốc xã hội."}},{"s":4,"n":"8","q":"Nguồn gốc xã hội của ý thức là yếu tố nào?","o":["Bộ óc con người.","Sự tác động của thế giới bên ngoài vào bộ óc con người.","Lao động và ngôn ngữ của con người."],"a":[2],"p":29,"e":"Nguồn gốc xã hội của ý thức là lao động và ngôn ngữ.","w":{"a":"Bộ óc con người thuộc nguồn gốc tự nhiên.","b":"Tác động của thế giới bên ngoài cũng thuộc nguồn gốc tự nhiên."}},{"s":4,"n":"9","q":"Nguồn gốc xã hội cho sự ra đời của ý thức là yếu tố nào?","o":["Bộ não người.","Thế giới vật chất bên ngoài tác động vào bộ não.","Lao động và ngôn ngữ."],"a":[2],"p":30,"e":"Nguồn gốc xã hội của ý thức là lao động và ngôn ngữ.","w":{"a":"Bộ não người thuộc nguồn gốc tự nhiên.","b":"Thế giới bên ngoài tác động vào bộ não thuộc nguồn gốc tự nhiên."}},{"s":4,"n":"10","q":"Yếu tố đầu tiên đảm bảo cho sự tồn tại của con người là gì?","o":["Làm khoa học.","Sáng tạo nghệ thuật.","Lao động.","Làm chính trị."],"a":[2],"p":30,"e":"Lao động là yếu tố đầu tiên bảo đảm sự tồn tại của con người, vì con người phải làm ra của cải vật chất trước khi làm khoa học, nghệ thuật hay chính trị.","w":{"a":"Khoa học cần lao động làm nền tảng.","b":"Nghệ thuật cũng cần có đời sống vật chất làm nền.","d":"Chính trị cũng cần có đời sống vật chất làm nền."}},{"s":4,"n":"11","q":"Nhân tố nào làm con người tách khỏi thế giới động vật?","o":["Hoạt động sinh sản duy trì nòi giống.","Lao động.","Hoạt động tư duy phê phán."],"a":[1],"p":30,"e":"Lao động làm con người tách khỏi thế giới động vật, vì nhờ lao động con người sáng tạo công cụ và cải tạo tự nhiên.","w":{"a":"Sinh sản có ở cả động vật.","c":"Tư duy phê phán có sau, và nảy sinh từ lao động."}},{"s":4,"n":"12","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, quá trình hình thành ý thức là quá trình nào?","o":["Tiếp thu sự tác động của thế giới bên ngoài.","Sáng tạo thuần tuý trong tư duy con người.","Hoạt động chủ động cải tạo thế giới và phản ánh sáng tạo thế giới."],"a":[2],"p":30,"e":"Ý thức hình thành trong quá trình con người hoạt động chủ động cải tạo thế giới và phản ánh sáng tạo thế giới.","w":{"a":"Chỉ tiếp thu tác động bên ngoài là quan điểm phản ánh thụ động.","b":"Sáng tạo thuần túy trong tư duy là quan điểm duy tâm."}},{"s":4,"n":"13","q":"Để phản ánh khái quát hiện thực khách quan và trao đổi tư tưởng con người cần có cái gì?","o":["Cộng cụ lao động.","Cơ quan cảm giác.","Ngôn ngữ."],"a":[2],"p":30,"e":"Để phản ánh khái quát hiện thực và trao đổi tư tưởng, con người cần ngôn ngữ. Ngôn ngữ là vỏ vật chất của tư duy.","w":{"a":"Công cụ lao động giúp tác động vào tự nhiên, chưa phải phương tiện trao đổi tư tưởng.","b":"Cơ quan cảm giác chỉ tiếp nhận tác động ở giai đoạn cảm tính."}},{"s":4,"n":"14","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nguồn gốc trực tiếp và quan trọng nhất quyết định sự ra đời và phát triển của ý thức là gì?","o":["Sự tác động của tự nhiên vào bộ óc con người.","Lao động, thực tiễn xã hội.","Bộ não người và hoạt động của nó."],"a":[1],"p":30,"e":"Nguồn gốc trực tiếp và quan trọng nhất của ý thức là lao động và thực tiễn xã hội. Lao động làm bộ óc phát triển và hình thành ngôn ngữ.","w":{"a":"Tác động của tự nhiên vào bộ óc là nguồn gốc tự nhiên.","c":"Bộ não và hoạt động của nó là điều kiện tự nhiên, chưa phải nguồn gốc trực tiếp quan trọng nhất."}},{"s":4,"n":"15","q":"Quan điểm sau đây thuộc lập trường triết học nào: ý thức là thực thể độc lập, là thực tại duy nhất.","o":["Chủ nghĩa duy tâm.","Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy vật biện chứng"],"a":[0],"p":30,"e":"Cho ý thức là thực thể độc lập, là thực tại duy nhất là lập trường của chủ nghĩa duy tâm.","w":{"b":"Duy vật siêu hình coi vật chất có trước.","c":"Duy vật biện chứng coi ý thức là sự phản ánh của vật chất."}},{"s":4,"n":"16","q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về bản chất của ý thức?","o":["Ý thức là thực thể độc lập.","Ý thức là sự phản ánh hiện thực khách quan vào bộ óc con người.","Ý thức là sự phản ánh sáng tạo hiện thực khách quan vào bộ óc con người.","Ý thức là năng lực của mọi dạng vật chất."],"a":[2],"p":30,"e":"Ý thức là sự phản ánh sáng tạo hiện thực khách quan vào bộ óc con người. Từ \"sáng tạo\" cho thấy ý thức không sao chép máy móc mà chọn lọc, cải biến và có thể tạo ra hình ảnh mới.","w":{"a":"Ý thức là thực thể độc lập là quan điểm duy tâm.","b":"Phương án này thiếu yếu tố \"sáng tạo\", nên chưa phân biệt với phản ánh thụ động.","d":"Năng lực của mọi dạng vật chất là thuộc tính phản ánh, không phải ý thức."}},{"s":4,"n":"17","q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về bản chất của ý thức?","o":["Ý thức là hình ảnh chủ quan của thế giới khách quan.","Ý thức là hình ảnh phản chiếu về thế giới khách quan.","Ý thức là tượng trưng của sự vật."],"a":[0],"p":30,"e":"Ý thức là hình ảnh chủ quan của thế giới khách quan: nội dung do thế giới khách quan quy định, hình thức tồn tại là chủ quan, trong óc người.","w":{"b":"\"Phản chiếu\" nghe như phản ánh gương soi, bỏ qua tính chủ quan và sáng tạo.","c":"Ý thức không phải \"tượng trưng\" của sự vật."}},{"s":4,"n":"18","q":"Sự khác nhau cơ bản giữa phản ánh ý thức và các hình thức phản ánh khác của thế giới vật chất là ở chỗ nào?","o":["Tính đúng đắn trung thực với vật phản ánh.","Tính sáng tạo năng động.","Tính bị quy định bởi vật phản ánh."],"a":[1],"p":31,"e":"Điểm khác cơ bản của phản ánh ý thức là tính sáng tạo, năng động: con người phản ánh có chọn lọc, có mục đích và cải biến thông tin.","w":{"a":"Mọi hình thức phản ánh đều có thể mang tính trung thực.","c":"Bị quy định bởi vật phản ánh cũng đúng với các hình thức phản ánh khác."}},{"s":4,"n":"19","q":"Quan niệm của chủ nghĩa duy vật biện chứng về tính sáng tạo của ý thức là thế nào?","o":["Ý thức tạo ra vật chất.","Ý thức tạo ra sự vật trong hiện thực.","Ý thức tạo ra hình ảnh mới về sự vật trong tư duy."],"a":[2],"p":31,"e":"Tính sáng tạo của ý thức là tạo ra hình ảnh mới về sự vật trong tư duy, chứ ý thức không tạo ra vật chất.","w":{"a":"Ý thức tạo ra vật chất là quan điểm duy tâm.","b":"Ý thức không trực tiếp tạo ra sự vật trong hiện thực, phải qua hoạt động thực tiễn."}},{"s":4,"n":"20","q":"Theo quan niệm của chủ nghiã duy vật biện chứng, trong kết cấu của ý thức yếu tố nào là cơ bản và cốt lõi nhất?","o":["Tri thức.","Tình cảm.","Niềm tin, ý chí."],"a":[0],"p":31,"e":"Tri thức là yếu tố cơ bản, cốt lõi nhất của ý thức, là phương thức tồn tại của ý thức.","w":{"b":"Tình cảm hình thành trên cơ sở tri thức.","c":"Niềm tin và ý chí cũng dựa trên tri thức."}},{"s":4,"n":"21","q":"Kết cấu theo chiều dọc (chiều sâu) của ý thức gồm những yếu tố nào?","o":["Tự ý thức; tiềm thức; vô thức.","Tri thức; niềm tin; ý chí.","Cảm giác, khái niệm; phán đoán"],"a":[0],"p":31,"e":"Theo chiều sâu, ý thức gồm tự ý thức, tiềm thức và vô thức.","w":{"b":"Tri thức, niềm tin, ý chí là các yếu tố theo chiều ngang.","c":"Cảm giác, khái niệm, phán đoán là các hình thức nhận thức."}},{"s":4,"n":"22","q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa vật chất và ý thức?","o":["Ý thức do vật chất quyết định.","Ý thức tác động đến vật chất.","Ý thức do vật chất quyết định, nhưng có tính độc lập tương đối và tác động đến vật chất thông qua hoạt động thực tiễn."],"a":[2],"p":31,"e":"Ý thức do vật chất quyết định, có tính độc lập tương đối và tác động trở lại vật chất thông qua hoạt động thực tiễn. Đây là quan điểm đầy đủ nhất.","w":{"a":"Thiếu mặt tác động trở lại của ý thức.","b":"Thiếu mặt vật chất quyết định ý thức."}},{"s":4,"n":"23","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng ý thức tác động đến đời sống hiện thực như thế nào?","o":["Ý thức tự nó có thể làm thay đổi được hiện thực.","Ý thức tác động đến hiện thực thông qua hoạt động thực tiễn.","Ý thức tác động đến hiện thực thông qua hoạt động lý luận."],"a":[1],"p":31,"e":"Ý thức tác động đến hiện thực thông qua hoạt động thực tiễn của con người.","w":{"a":"Ý thức tự nó không làm thay đổi được hiện thực.","c":"Hoạt động lý luận là hoạt động tinh thần, chưa trực tiếp cải biến hiện thực."}},{"s":4,"n":"24","q":"Quan điểm sau đây thuộc lập trường triết học nào: Nhận thức sự vật và hoạt động thực tiễn chỉ dựa vào những nguyên lý chung, không xuất phát từ bản thân sự vật?","o":["Chủ nghĩa kinh nghiệm.","Chủ nghĩa duy tâm kinh viện.","Chủ nghĩa duy vật biện chứng"],"a":[1],"p":31,"e":"Nhận thức và hành động chỉ dựa vào nguyên lý chung có sẵn, không xuất phát từ bản thân sự vật, là biểu hiện của chủ nghĩa duy tâm kinh viện, giáo điều (theo đáp án file).","w":{"a":"Chủ nghĩa kinh nghiệm tuyệt đối hóa kinh nghiệm riêng lẻ.","c":"Chủ nghĩa duy vật biện chứng đòi hỏi xuất phát từ sự vật."}},{"s":4,"n":"25","q":"Hoạt động chỉ dựa theo ý muốn chủ quan không dựa vào thực tiễn là lập trường triết học nào?","o":["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy tâm."],"a":[2],"p":31,"e":"Hoạt động chỉ dựa theo ý muốn chủ quan, không dựa vào thực tiễn, là lập trường duy tâm.","w":{"a":"Duy vật biện chứng đòi hỏi xuất phát từ thực tiễn.","b":"Duy vật siêu hình coi vật chất có trước nhưng nhìn sự vật tĩnh tại."}},{"s":4,"n":"26","q":"Quan điểm sau đây thuộc lập trường triết học nào: Trong nhận thức và hoạt động thực tiễn phải lấy hiện thực khách quan làm căn cứ, không được lấy mong muốn chủ quan làm căn cứ.","o":["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm.","Chủ nghĩa duy vật siêu hình."],"a":[0],"p":31,"e":"Lấy hiện thực khách quan làm căn cứ, không lấy mong muốn chủ quan làm căn cứ, là lập trường duy vật biện chứng.","w":{"b":"Duy tâm lấy ý thức chủ quan làm căn cứ.","c":"Duy vật siêu hình cũng coi trọng khách quan nhưng nhìn sự vật tĩnh tại, tách rời."}},{"s":4,"n":"27","q":"Phép biện chứng duy vật có mấy nguyên lý cơ bản?","o":["Một nguyên lý cơ bản","Hai nguyên lý cơ bản.","Ba nguyên lý cơ bản."],"a":[1],"p":32,"e":"Phép biện chứng duy vật có hai nguyên lý cơ bản: nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển.","w":{"a":"Một nguyên lý là thiếu.","c":"Ba nguyên lý là thừa."}},{"s":4,"n":"28","q":"Nguyên lý cơ bản của phép biện chứng duy vật là nguyên lý nào?","o":["Nguyên lý về sự tồn tại khách quan của vật chất.","Nguyên lý về sự vận động và đứng im của các sự vật.","Nguyên lý về mối liên hệ phổ biến và về sự phát triển.","Nguyên lý về tính liên tục và tính gián đoạn của thế giới vật chất."],"a":[2],"p":32,"e":"Nguyên lý cơ bản của phép biện chứng duy vật là nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển.","w":{"a":"Tồn tại khách quan của vật chất là nội dung của chủ nghĩa duy vật.","b":"Vận động và đứng im là nội dung về vận động.","d":"Liên tục và gián đoạn là cặp thuộc tính, không phải nguyên lý của phép biện chứng."}},{"s":4,"n":"29","q":"Quan điểm siêu hình trả lời câu hỏi sau đây như thế nào: Các sự vật trong thế giới có liên hệ với nhau không?","o":["Các sự vật tồn tại biệt lập với nhau, không liên hệ, phụ thuộc nhau.","Các sự vật có thể có liên hệ với nhau, nhưng chỉ mang tính chất ngẫu nhiên, bề ngoài.","Các sự vật tồn tại trong sự liên hệ nhau.","Gồm a và b."],"a":[3],"p":32,"e":"Quan điểm siêu hình cho rằng các sự vật hoặc tồn tại biệt lập, hoặc nếu có liên hệ thì chỉ ngẫu nhiên, bề ngoài. Đáp án d gộp a và b.","w":{"a":"Đúng một phần: sự vật tồn tại biệt lập.","b":"Đúng một phần: liên hệ chỉ ngẫu nhiên, bề ngoài.","c":"Các sự vật tồn tại trong sự liên hệ là quan điểm biện chứng."}},{"s":4,"n":"30","q":"Quan điểm của chủ nghĩa duy vật biện chứng trả lời câu hỏi sau đây như thế nào: Các sự vật trong thế giới có liên hệ với nhau không?","o":["Các sự vật hoàn toàn biệt lập nhau.","Các sự vật liên hệ nhau chỉ mang tính chất ngẫu nhiên.","Các sự vật vừa khác nhau, vừa liên hệ, ràng buộc nhau một cách khách quan và tất yếu."],"a":[2],"p":32,"e":"Chủ nghĩa duy vật biện chứng cho rằng các sự vật vừa khác nhau, vừa liên hệ, ràng buộc nhau một cách khách quan và tất yếu.","w":{"a":"Biệt lập hoàn toàn là quan điểm siêu hình.","b":"Liên hệ chỉ ngẫu nhiên là quan điểm siêu hình."}},{"s":4,"n":"31","q":"Theo quan điểm của chủ nghĩa duy tâm chủ quan mối liên hệ giữa các sự vật do cái gì quyết định?","o":["Do lực lượng siêu tự nhiên (thượng đế) quyết định.","Do bản tính của thế giới vật chất.","Do cảm giác của con người quyết định."],"a":[2],"p":32,"e":"Duy tâm chủ quan cho rằng mối liên hệ giữa sự vật do cảm giác, ý thức của con người quyết định.","w":{"a":"Lực lượng siêu tự nhiên là quan điểm duy tâm khách quan.","b":"Bản tính vật chất của thế giới là quan điểm duy vật."}},{"s":4,"n":"32","q":"Theo quan điểm của chủ nghĩa duy tâm khách quan, mối quan hệ giữa các sự vật do cái gì quyết định?","o":["Do lực lượng siêu nhiên (thượng đế, ý niệm tuyệt đối) quyết định.","Do cảm giác, thói quen con người quyết định.","Do bản tính của thế giới vật chất."],"a":[0],"p":32,"e":"Duy tâm khách quan cho rằng mối liên hệ giữa sự vật do một lực lượng tinh thần có trước thế giới quyết định, như Thượng đế hay ý niệm tuyệt đối.","w":{"b":"Cảm giác, thói quen của con người là quan điểm duy tâm chủ quan.","c":"Bản tính vật chất của thế giới là quan điểm duy vật."}},{"s":4,"n":"33","q":"Điền cụm từ thích hợp vào chỗ trống trong câu sau để được định nghĩa khái niệm về \"liên hệ\": Liên hệ là phạm trù triết học chỉ..... giữa các sự vật, hiện tượng hay giữa các mặt của một hiện tượng trong thế giới","o":["Sự di chuyển.","Những thuộc tính, những đặc điểm","Sự quy định, sự tác động qua lại, sự chuyển hoá lẫn nhau."],"a":[2],"p":32,"e":"Liên hệ là phạm trù triết học chỉ sự quy định, sự tác động qua lại và chuyển hóa lẫn nhau giữa các sự vật, hiện tượng.","w":{"a":"Sự di chuyển là vận động cơ học.","b":"Thuộc tính, đặc điểm là nội dung của phạm trù chất."}},{"s":4,"n":"34","q":"Quan điểm của chủ nghĩa duy vật biện chứng về nguồn gốc mối liên hệ giữa các sự vật và hiện tượng là từ đâu?","o":["Do lực lượng siêu nhiên (thượng đế, ý niệm) sinh ra.","Do tính thống nhất vật chất của thế giới.","Do cảm giác thói quen của con người tạo ra.","Do tư duy con người tạo ra rồi đưa vào tự nhiên và xã hội."],"a":[1],"p":32,"e":"Theo chủ nghĩa duy vật biện chứng, mối liên hệ giữa các sự vật bắt nguồn từ tính thống nhất vật chất của thế giới.","w":{"a":"Do Thượng đế, ý niệm sinh ra là quan điểm duy tâm khách quan.","c":"Do cảm giác, thói quen tạo ra là quan điểm duy tâm chủ quan.","d":"Do tư duy con người đưa vào tự nhiên là quan điểm duy tâm chủ quan."}},{"s":4,"n":"35","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng mối liên hệ giữa các sự vật có tính chất gì?","o":["Tính ngẫu nhiên, chủ quan.","Tính khách quan, tính phổ biến, tính đa dạng.","Tính khách quan, nhưng không có tính phổ biến và đa dạng."],"a":[1],"p":33,"e":"Mối liên hệ giữa các sự vật có tính khách quan, tính phổ biến và tính đa dạng.","w":{"a":"Liên hệ không có tính ngẫu nhiên, chủ quan.","c":"Liên hệ có tính phổ biến và đa dạng, ngoài tính khách quan."}},{"s":4,"n":"36","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng một sự vật trong quá trình tồn tại và phát triển có một hay nhiều mối liên hệ.","o":["Có một mối liên hệ","Có một số hữu hạn mối liên hệ","Có vô vàn các mối liên hệ."],"a":[2],"p":33,"e":"Mỗi sự vật có vô vàn mối liên hệ với các sự vật khác, trong đó có liên hệ bên trong và bên ngoài, cơ bản và không cơ bản.","w":{"a":"Một mối liên hệ không đủ để mô tả sự vật.","b":"Số mối liên hệ không hữu hạn."}},{"s":4,"n":"37","q":"Theo quan niệm của chủ nghĩa duy vật biện chứng các mối liên hệ có vai trò như thế nào đối với sự tồn tại và phát triển của sự vật?","o":["Có vai trò ngang bằng nhau.","Có vai trò khác nhau, nên chỉ cần biết một số mối liên hệ.","Có vai trò khác nhau, cần phải xem xét mọi mối liên hệ."],"a":[2],"p":33,"e":"Các mối liên hệ có vai trò khác nhau (bên trong, cơ bản, chủ yếu...), nhưng muốn hiểu đầy đủ sự vật phải xem xét mọi mối liên hệ.","w":{"a":"Các mối liên hệ có vai trò khác nhau, không ngang bằng.","b":"Chỉ biết một số mối liên hệ thì nhận thức phiến diện."}},{"s":4,"n":"38","q":"Quan điểm nào cho rằng thế giới vô cơ, thế giới sinh vật và xã hội loài người là 3 lĩnh vực hoàn toàn khác biệt nhau, không quan hệ gì với nhau?","o":["Quan điểm siêu hình.","Quan điểm biện chứng duy vật.","Quan điểm duy tâm biện chứng."],"a":[0],"p":33,"e":"Quan điểm siêu hình coi thế giới vô cơ, sinh vật và xã hội là ba lĩnh vực tách biệt, không liên hệ với nhau.","w":{"b":"Duy vật biện chứng coi chúng liên hệ và chuyển hóa lẫn nhau.","c":"Duy tâm biện chứng là phép biện chứng của Hê-ghen, vẫn nhìn thấy mối liên hệ."}},{"s":4,"n":"39","q":"Quan điểm nào cho rằng mối liên hệ giữa các sự vật, hiện tượng trong thế giới là biểu hiện của mối liên hệ giữa các ý niệm?","o":["Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan."],"a":[2],"p":33,"e":"Cho rằng mối liên hệ giữa sự vật là biểu hiện của mối liên hệ giữa các ý niệm là quan điểm duy tâm khách quan (như Hê-ghen).","w":{"a":"Duy vật siêu hình không bàn đến ý niệm.","b":"Duy vật biện chứng coi liên hệ là khách quan, vật chất.","d":"Duy tâm chủ quan coi liên hệ do cảm giác con người."}},{"s":4,"n":"40","q":"Đòi hỏi của quan điểm toàn diện như thế nào?","o":["Chỉ xem xét một mối liên hệ.","Phải xem xét tất cả các mối liên hệ của sự vật.","Phải xem xét tất cả các mối liên hệ đồng thời phân loại được vị trí, vai trò của các mối liên hệ."],"a":[2],"p":33,"e":"Quan điểm toàn diện đòi hỏi xem xét tất cả các mối liên hệ và còn phải phân loại được vị trí, vai trò của từng mối liên hệ, tránh dàn trải.","w":{"a":"Chỉ xem một mối liên hệ là phiến diện.","b":"Xem xét tất cả nhưng không phân loại thì chưa đủ."}},{"s":4,"n":"41","q":"Cơ sở lý luận của quan điểm toàn diện là nguyên lý nào?","o":["Nguyên lý về sự phát triển.","Nguyên lý về mối liên hệ phổ biến.","Nguyên lý về sự tồn tại khách quan của thế giới vật chất."],"a":[1],"p":33,"e":"Cơ sở lý luận của quan điểm toàn diện là nguyên lý về mối liên hệ phổ biến.","w":{"a":"Nguyên lý về sự phát triển là cơ sở của quan điểm phát triển.","c":"Sự tồn tại khách quan của thế giới là nội dung của chủ nghĩa duy vật."}},{"s":4,"n":"42","q":"Trong những luận điểm sau đây, đâu là luận điểm của quan điểm siêu hình về sự phát triển?","o":["Xem xét sự phát triển chỉ là sự tăng, hay giảm đơn thuần về lượng.","Xem sự phát triển bao hàm cả sự thay đổi dần về lượng và sự nhảy vọt về chất.","Xem sự phát triển đi lên bao hàm cả sự thụt lùi tạm thời."],"a":[0],"p":33,"e":"Quan điểm siêu hình coi sự phát triển chỉ là sự tăng hay giảm đơn thuần về lượng, không có sự thay đổi về chất.","w":{"b":"Phát triển bao hàm thay đổi dần về lượng và nhảy vọt về chất là quan điểm biện chứng.","c":"Phát triển đi lên bao hàm cả thụt lùi tạm thời là quan điểm biện chứng."}},{"s":4,"n":"43","q":"Trong các quan điểm sau đây, đâu là quan điểm siêu hình về sự phát triển?","o":["Xem xét sự phát triển như một quá trình tiến lên liên tục, không có bước quanh co, thụt lùi, đứt đoạn.","Xem xét sự phát triển là một quá trình tiến từ thấp lên cao. từ đơn giản đến phức tạp. bao hàm cả sự tụt lùi, đứt đoạn.","Xem xét sự phát triển như là quá trình đi lên bao hàm cả sự lặp lại cái cũ trên cơ sở mới."],"a":[0],"p":33,"e":"Quan điểm siêu hình xem phát triển là quá trình tiến lên liên tục, không có quanh co, thụt lùi, đứt đoạn.","w":{"b":"Tiến từ thấp lên cao, bao hàm thụt lùi, đứt đoạn là quan điểm biện chứng.","c":"Đi lên bao hàm lặp lại cái cũ trên cơ sở mới là quan điểm biện chứng."}},{"s":4,"n":"44","q":"Trong các quan điểm sau đây, đâu là quan điểm siêu hình về sự phát triển?","o":["Chất của sự vật không thay đổi gì trong quá trình tồn tại và phát triển của chúng.","Phát triển là sự chuyển hoá từ những thay đổi về lượng thành sự thay đổi về chất.","Phát triển bao hàm sự nảy sinh chất mới và sự phá vỡ chất cũ."],"a":[0],"p":34,"e":"Quan điểm siêu hình cho rằng chất của sự vật không thay đổi trong quá trình tồn tại và phát triển.","w":{"b":"Chuyển hóa từ lượng thành chất là quan điểm biện chứng.","c":"Sự nảy sinh chất mới và phá vỡ chất cũ là quan điểm biện chứng."}},{"s":4,"n":"45","q":"Luận điểm sau đây về sự phát triển thuộc lập trường triết học nào: \"Phát triển diễn ra theo con đường tròn khép kín, là sự lặp lại đơn thuần cái cũ\".","o":["Quan điểm biện chứng duy vật.","Quan điểm siêu hình.","Quan điểm biện chứng duy tâm."],"a":[1],"p":34,"e":"Phát triển theo vòng tròn khép kín, chỉ lặp lại cái cũ, là quan điểm siêu hình.","w":{"a":"Biện chứng duy vật coi phát triển theo đường xoáy ốc.","c":"Biện chứng duy tâm có tính phát triển nhưng trên cơ sở tinh thần."}},{"s":4,"n":"46","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Phát triển chỉ là những bước nhảy về chất, không có sự thay đổi về lượng\".","o":["Triết học duy vật biện chứng.","Triết học duy vật siêu hình.","Triết học biện chứng duy tâm."],"a":[1],"p":34,"e":"Cho rằng phát triển chỉ có bước nhảy về chất, không có thay đổi về lượng, là quan điểm siêu hình, vì nó tách rời chất và lượng.","w":{"a":"Duy vật biện chứng coi lượng và chất chuyển hóa cho nhau.","c":"Biện chứng duy tâm cũng thừa nhận quan hệ lượng - chất, nhưng trên nền tinh thần."}},{"s":4,"n":"47","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Phát triển là quá trình chuyển hoá từ những thay đổi về lượng thành sự thay đổi về chất và ngược lại\"","o":["Quan điểm biện chứng.","Quan điểm siêu hình.","Quan điểm chiết trung và nguỵ biện."],"a":[0],"p":34,"e":"Phát triển là quá trình chuyển hóa từ thay đổi về lượng thành thay đổi về chất và ngược lại là quan điểm biện chứng.","w":{"b":"Siêu hình tách rời lượng và chất.","c":"Chiết trung và nguỵ biện trộn lẫn những quan điểm đối lập."}},{"s":4,"n":"48","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Phát triển là quá trình vận động tiến lên theo con đường xoáy ốc\".","o":["Quan điểm siêu hình.","Quan điểm chiết trung và nguỵ biện.","Quan điểm biện chứng."],"a":[2],"p":34,"e":"Phát triển theo đường xoáy ốc, tức lặp lại cái cũ ở trình độ cao hơn, là quan điểm biện chứng.","w":{"a":"Siêu hình coi phát triển là tuần hoàn khép kín hoặc tăng đơn thuần.","b":"Chiết trung và nguỵ biện trộn lẫn những quan điểm đối lập."}},{"s":4,"n":"49","q":"Luận điểm sau đây về nguồn gốc của sự phát triển thuộc lập trường triết học nào: \"Phát triển là do sự sắp đặt của thượng đế và thần thánh\".","o":["Chủ nghĩa duy tâm có tính chất tôn giáo.","Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy vật tự phát."],"a":[0],"p":34,"e":"Cho rằng phát triển do Thượng đế, thần thánh sắp đặt là chủ nghĩa duy tâm mang tính tôn giáo.","w":{"b":"Duy vật siêu hình không viện đến thần thánh.","c":"Duy vật tự phát không dùng thần thánh để giải thích."}},{"s":4,"n":"50","q":"Luận điểm sau đây về nguồn gốc của sự phát triển thuộc lập trường triết học nào: \"phát triển trong hiện thực là tồn tại khác, là biểu hiện của sự phát triển của ý niệm tuyệt đối\".","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình."],"a":[1],"p":34,"e":"Cho rằng phát triển trong hiện thực chỉ là biểu hiện của sự phát triển của ý niệm tuyệt đối là duy tâm khách quan (Hê-ghen).","w":{"a":"Duy tâm chủ quan dựa vào cảm giác.","c":"Duy vật biện chứng dựa vào mâu thuẫn trong sự vật.","d":"Duy vật siêu hình tìm nguồn gốc phát triển từ ngoài sự vật nhưng vẫn là duy vật."}},{"s":4,"n":"51","q":"Luận điểm sau đây về nguồn gốc sự phát triển thuộc lập trường triết học nào: \"Phát triển của các sự vật là do cảm giác, ý thức con người quyết định\".","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình."],"a":[0],"p":34,"e":"Cho rằng phát triển của sự vật do cảm giác, ý thức của con người quyết định là duy tâm chủ quan.","w":{"b":"Duy tâm khách quan dựa vào ý niệm tuyệt đối.","c":"Cả hai đều là lập trường duy vật.","d":"Cả hai đều là lập trường duy vật."}},{"s":4,"n":"52","q":"Luận điểm sau đây về nguồn gốc của sự phát triển thuộc lập trường triết học nào: \"Mâu thuẫn tồn tại khách quan trong chính sự vật quy định sự phát triển của sự vật\".","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình."],"a":[2],"p":35,"e":"Cho rằng mâu thuẫn khách quan trong chính sự vật quy định sự phát triển là chủ nghĩa duy vật biện chứng.","w":{"a":"Duy tâm chủ quan dựa vào cảm giác.","b":"Duy tâm khách quan dựa vào ý niệm.","d":"Duy vật siêu hình tìm nguyên nhân phát triển từ bên ngoài sự vật."}},{"s":4,"n":"53","q":"Trong các luận điểm sau đây, đâu là luận điểm của chủ nghĩa duy vật biện chứng?","o":["Phát triển của các sự vật là biểu hiện của sự vận động của ý niệm tuyệt đối.","Phát triển của các sự vật do cảm giác, ý thức con người quyết định.","Phát triển của các sự vật do sự tác động lẫn nhau của các mặt đối lập của bản thân sự vật quyết định."],"a":[2],"p":35,"e":"Chủ nghĩa duy vật biện chứng cho rằng phát triển của sự vật do sự tác động lẫn nhau của các mặt đối lập trong bản thân sự vật quyết định.","w":{"a":"Ý niệm tuyệt đối là quan điểm duy tâm khách quan.","b":"Cảm giác, ý thức là quan điểm duy tâm chủ quan."}},{"s":4,"n":"54","q":"Trong những luận điểm sau, đâu là định nghĩa về sự phát triển theo quan điểm của chủ nghĩa duy vật biện chứng?","o":["Phát triển là phạm trù chỉ sự vận động của các sự vật.","Phát triển là phạm trù chỉ sự liên hệ giữa các sự vật.","Phát triển là phạm trù chỉ quá trình vận động tiến lên từ thấp đến cao, từ đơn gian đến phức tạp, từ kém hoàn thiện đến hoàn thiện hơn của các sự vật."],"a":[2],"p":35,"e":"Phát triển là phạm trù chỉ quá trình vận động tiến lên từ thấp đến cao, từ đơn giản đến phức tạp, từ kém hoàn thiện đến hoàn thiện hơn.","w":{"a":"Đó là định nghĩa của vận động.","b":"Đó là định nghĩa của liên hệ."}},{"s":4,"n":"55","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nhận định nào sau đây là không đúng?","o":["Phát triển bao quát toàn bộ sự vận động nói chung.","Phát triển chỉ khái quát xu hướng vận động đi lên của các sự vật.","Phát triển chỉ là một trường hợp cá biệt của sự vận động."],"a":[1],"p":35,"e":"File gốc đánh dấu đáp án B. Theo giáo trình, phát triển là khuynh hướng vận động đi lên của sự vật, và là một trường hợp đặc biệt của vận động. Vận động bao quát cả sự thay đổi nói chung, còn phát triển thì không.","w":{"a":"Phương án này cho rằng phát triển bao quát toàn bộ vận động, trái với giáo trình.","c":"Phát triển là một trường hợp đặc biệt của vận động."},"f":"Phương án B (\"phát triển chỉ khái quát xu hướng vận động đi lên\") khớp với giáo trình, còn phương án A mới là nhận định sai. Câu này có thể có sai lệch trong file gốc."},{"s":4,"n":"56","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là đúng?","o":["Phát triển là xu hướng chung của sự vận động của thế giới vật chất.","Phát triển là xu hướng chung nhưng không bản chất của sự vận động của sự vật.","Phát triển là xu hướng cá biệt của sự vận động của các sự vật."],"a":[0],"p":35,"e":"Phát triển là xu hướng chung của sự vận động của thế giới vật chất.","w":{"b":"Phát triển là xu hướng chung và mang tính bản chất.","c":"Phát triển là xu hướng phổ biến, không phải cá biệt."}},{"s":4,"n":"57","q":"Trong thế giới vô cơ sự phát triển biểu hiện như thế nào?","o":["Sự tác động qua lại giữa các kết cấu vật chất trong điều kiện nhất định làm nảy sinh các hợp chất mới.","Sự hoàn thiện của cơ thể thích ứng tốt hơn với sự biến đổi của môi trường.","Điều chỉnh hoạt động của cơ thể cho phù hợp với môi trường sống."],"a":[0],"p":35,"e":"Trong thế giới vô cơ, phát triển biểu hiện ở sự tác động qua lại giữa các kết cấu vật chất, làm nảy sinh các hợp chất mới.","w":{"b":"Sự hoàn thiện của cơ thể thích ứng với môi trường là phát triển trong giới hữu cơ.","c":"Điều chỉnh hoạt động cơ thể cho phù hợp môi trường cũng là phát triển trong giới hữu cơ."}},{"s":4,"n":"58","q":"Trong xã hội sự phát triển biểu hiện ra như thế nào?","o":["Sự xuất hiện các hợp chất mới.","Sự xuất hiện các giống loài động vật, thực vật mới thích ứng tốt hơn với môi trường.","Sự thay thế chế độ xã hội này bằng một chế độ xã hội khác dân chủ, văn minh hơn."],"a":[2],"p":35,"e":"Trong xã hội, phát triển biểu hiện ở sự thay thế chế độ xã hội này bằng chế độ xã hội khác dân chủ, văn minh hơn.","w":{"a":"Sự xuất hiện các hợp chất mới là phát triển trong giới vô cơ.","b":"Giống loài mới thích ứng tốt hơn là phát triển trong giới hữu cơ."}},{"s":4,"n":"59","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, những tính chất nào sau đây là tính chất của sự phát triển?","o":["Tính khách quan.","Tính phổ biến.","Tính chất đa dạng, phong phú trong nội dung và hình thức phát triển.","Cả a, b, và c."],"a":[3],"p":36,"e":"Sự phát triển có tính khách quan, tính phổ biến và tính đa dạng, phong phú. Đáp án d gộp cả ba.","w":{"a":"Đúng một phần: tính khách quan.","b":"Đúng một phần: tính phổ biến.","c":"Đúng một phần: tính đa dạng, phong phú."}},{"s":4,"n":"60","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng điều khẳng định nào sau đây là đúng?","o":["Mong muốn của con người quy định sự phát triển.","Mong muốn của con người tự nó không có ảnh hưởng đến sự phát triển của các sự vật.","Mong muốn của con người hoàn toàn không có ảnh hưởng gì đến sự phát triển của các sự vật."],"a":[1],"p":36,"e":"Mong muốn của con người tự nó không ảnh hưởng đến sự phát triển. Muốn tác động phải thông qua hoạt động thực tiễn.","w":{"a":"Mong muốn không quy định sự phát triển, đó là quan điểm duy tâm.","c":"Mong muốn thông qua thực tiễn vẫn có ảnh hưởng, nên không phải \"hoàn toàn không ảnh hưởng\"."}},{"s":5,"n":"1","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là đúng?","o":["Nguyện vọng, ý chí của con người tự nó tác động đến sự phát triển.","Nguyện vọng, ý chí của con người không có ảnh hưởng gì đến sự phát triển.","Nguyện vọng, ý chí của con người có ảnh hưởng đến sự phát triển thông qua hoạt động thực tiễn."],"a":[2],"p":37,"e":"Nguyện vọng, ý chí của con người có ảnh hưởng đến sự phát triển, nhưng phải thông qua hoạt động thực tiễn, vì chỉ thực tiễn mới biến ý chí thành tác động vật chất.","w":{"a":"Ý chí tự nó không tác động được đến sự phát triển, đó là quan điểm duy tâm.","b":"Ý chí không hoàn toàn vô tác dụng, vì khi gắn với thực tiễn nó có ảnh hưởng."}},{"s":5,"n":"2","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Sự phát triển trong tự nhiên, xã hội và tư duy là hoàn toàn đồng nhất với nhau\".","o":["Quan điểm siêu hình.","Quan điểm biện chứng duy vật.","Quan điểm biện chứng duy tâm."],"a":[0],"p":37,"e":"Cho rằng sự phát triển ở tự nhiên, xã hội và tư duy hoàn toàn đồng nhất với nhau là quan điểm siêu hình, vì nó xóa nhòa đặc thù riêng của từng lĩnh vực.","w":{"b":"Phép biện chứng duy vật thừa nhận cả điểm chung và điểm riêng.","c":"Biện chứng duy tâm cũng không đồng nhất hóa như vậy."}},{"s":5,"n":"3","q":"Luận điểm sau đây thuộc quan điểm triết học nào: \"Quá trình phát triển của mỗi sự vật là hoàn toàn khác biệt nhau, không có điểm chung nào\".","o":["Quan điểm siêu hình.","Quan điểm biện chứng duy vật.","Quan điểm biện chứng duy tâm."],"a":[0],"p":37,"e":"Cho rằng quá trình phát triển của mỗi sự vật hoàn toàn khác biệt nhau, không có điểm chung, là quan điểm siêu hình, vì nó chỉ thấy cái riêng.","w":{"b":"Phép biện chứng duy vật nhìn thấy cả cái chung và cái riêng.","c":"Biện chứng duy tâm cũng thừa nhận điểm chung."}},{"s":5,"n":"4","q":"Luận điểm sau đây thuộc quan điểm triết học nào: Quá trình phát triển của các sự vật vừa khác nhau, vừa có sự thống nhất với nhau.","o":["Quan điểm biện chứng.","Quan điểm siêu hình.","Quan điểm chiết trung và nguỵ biện."],"a":[0],"p":37,"e":"Quá trình phát triển của các sự vật vừa khác nhau, vừa thống nhất với nhau là quan điểm biện chứng.","w":{"b":"Siêu hình thiên về đồng nhất hoặc tách biệt tuyệt đối.","c":"Chiết trung và nguỵ biện trộn lẫn các quan điểm đối lập một cách tùy tiện."}},{"s":5,"n":"5","q":"Trong nhận thức cần quán triệt quan điểm phát triển. Điều đó dựa trên cơ sở lý luận của nguyên lý nào?","o":["Nguyên lý về mối liên hệ phổ biến.","Nguyên lý về sự phát triển.","Nguyên lý về tính thống nhất vật chất của thế giới."],"a":[1],"p":37,"e":"Quan điểm phát triển dựa trên nguyên lý về sự phát triển.","w":{"a":"Nguyên lý về mối liên hệ phổ biến là cơ sở của quan điểm toàn diện.","c":"Tính thống nhất vật chất của thế giới là cơ sở của chủ nghĩa duy vật."}},{"s":5,"n":"6","q":"Quan điểm
