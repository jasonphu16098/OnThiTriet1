ử - xã hội"],"a":[3],"p":55,"e":"Thực tiễn là toàn bộ hoạt động vật chất có mục đích, mang tính lịch sử - xã hội của con người nhằm cải tạo tự nhiên và xã hội.","w":{"a":"Hoạt động nói chung chưa nêu đặc trưng.","b":"Hoạt động vật chất thiếu tính mục đích và lịch sử - xã hội.","c":"Hoạt động có mục đích cũng có ở hoạt động tinh thần."}},{"s":7,"n":"33","q":"Hoạt động nào sau đây là hoạt động thực tiễn","o":["Mọi hoạt động vật chất của con người","Hoạt động tư duy sáng tạo ra các ý tưởng","Hoạt động quan sát và thực nghiệm khoa học."],"a":[2],"p":55,"e":"Quan sát và thực nghiệm khoa học là một hình thức của hoạt động thực tiễn.","w":{"a":"Không phải mọi hoạt động vật chất của con người đều là thực tiễn, vì thực tiễn cần có mục đích và tính xã hội.","b":"Hoạt động tư duy là hoạt động tinh thần."}},{"s":7,"n":"34","q":"Hình thức hoạt động thực tiễn cơ bản nhất quy định đến các hình thức khác là hình thức nào?","o":["Hoạt động sản xuất vật chất","Hoạt động chính trị xã hội.","Hoạt động quan sát và thực nghiệm khoa học."],"a":[0],"p":55,"e":"Hoạt động sản xuất vật chất là hình thức cơ bản nhất của thực tiễn, quy định các hình thức khác.","w":{"b":"Hoạt động chính trị - xã hội dựa trên cơ sở sản xuất vật chất.","c":"Quan sát và thực nghiệm khoa học dựa trên điều kiện sản xuất vật chất."}},{"s":7,"n":"35","q":"Theo quan điểm của CNDVBC tiêu chuẩn của chân lý là gì?","o":["Được nhiều người thừa nhận.","Đảm bảo không mâu thuẫn trong suy luận","Thực tiễn"],"a":[2],"p":55,"e":"Tiêu chuẩn của chân lý là thực tiễn, vì chỉ thực tiễn mới kiểm nghiệm được nhận thức có phù hợp với hiện thực không.","w":{"a":"Số đông thừa nhận không bảo đảm chân lý.","b":"Không mâu thuẫn trong suy luận chỉ là tiêu chuẩn logic."}},{"s":7,"n":"36","q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về tiêu chuẩn chân lý","o":["Thực tiễn là tiêu chuẩn của chân lý có tính chất tương đối.","Thực tiễn là tiêu chuẩn của chân lý có tính chất tuyệt đối","Thực tiễn là tiêu chuẩn của chân lý vừa có tính chất tương đối vừa có tính chất tuyệt đối."],"a":[2],"p":55,"e":"Thực tiễn là tiêu chuẩn của chân lý vừa tuyệt đối vừa tương đối. Tuyệt đối vì nó là tiêu chuẩn duy nhất, tương đối vì thực tiễn luôn biến đổi, phát triển.","w":{"a":"Chỉ tương đối thì chưa nêu mặt tuyệt đối.","b":"Chỉ tuyệt đối thì chưa nêu mặt tương đối."}},{"s":7,"n":"37","q":"Giai đoạn nhận thức diễn ra trên cơ sở sự tác động trực tiếp của các sự vật lên các giác quan của con người là giai đoạn nhận thức nào?","o":["Nhận thức lý tính","Nhận thức lý luận","Nhận thức khoa học","Nhận thức cảm tính"],"a":[3],"p":56,"e":"Giai đoạn nhận thức diễn ra qua sự tác động trực tiếp của sự vật lên các giác quan là nhận thức cảm tính.","w":{"a":"Nhận thức lý tính là giai đoạn trừu tượng.","b":"Nhận thức lý luận là trình độ nhận thức khác.","c":"Nhận thức khoa học là trình độ nhận thức khác."}},{"s":7,"n":"38","q":"Nhận thức cảm tính được thực hiện dưới các hình thức nào?","o":["Khái niệm và phán đoán","Cảm giác, tri giác và khái niệm","Cảm giác, tri giác và biểu tượng"],"a":[2],"p":56,"e":"Nhận thức cảm tính gồm ba hình thức: cảm giác, tri giác và biểu tượng.","w":{"a":"Khái niệm và phán đoán là hình thức của nhận thức lý tính.","b":"Khái niệm thuộc nhận thức lý tính."}},{"s":7,"n":"39","q":"Sự phản ánh trừu tượng, khái quát những đặc điểm chung, bản chất của các sự vật được gọi là giai đoạn nhận thức nào?","o":["Nhận thức cảm tính","Nhận thức lý tính","Nhận thức kinh nghiệm"],"a":[1],"p":56,"e":"Phản ánh trừu tượng, khái quát những đặc điểm chung, bản chất của sự vật là nhận thức lý tính.","w":{"a":"Nhận thức cảm tính phản ánh trực tiếp bề ngoài.","c":"Nhận thức kinh nghiệm là trình độ nhận thức khác."}},{"s":7,"n":"40","q":"Nhận thức lý tính được thực hiện dưới hình thức nào?","o":["Cảm giác, tri giác và biểu tượng","Khái niệm, phán đoán, suy luận","Tri giác, biểu tượng, khái niệm"],"a":[1],"p":56,"e":"Nhận thức lý tính gồm ba hình thức: khái niệm, phán đoán, suy luận.","w":{"a":"Cảm giác, tri giác và biểu tượng là hình thức cảm tính.","c":"Tri giác, biểu tượng thuộc cảm tính, khái niệm thuộc lý tính."}},{"s":7,"n":"41","q":"Khái niệm là hình thức nhận thức của giai đoạn nào?","o":["Nhận thức cảm tính.","Nhận thức lý tính","Nhận thức kinh nghiệm"],"a":[1],"p":56,"e":"Khái niệm là hình thức của nhận thức lý tính, vì nó phản ánh những đặc điểm chung, bản chất của sự vật.","w":{"a":"Nhận thức cảm tính có cảm giác, tri giác, biểu tượng.","c":"Nhận thức kinh nghiệm là trình độ nhận thức khác."}},{"s":7,"n":"42","q":"Giai đoạn nhận thức nào gắn với thực tiễn?","o":["Nhận thức lý luận","Nhận thức cảm tính","Nhận thức lý tính"],"a":[1],"p":56,"e":"Theo đáp án của file, giai đoạn gắn với thực tiễn là nhận thức cảm tính, vì nó diễn ra trực tiếp qua tiếp xúc của giác quan với sự vật trong hoạt động thực tiễn.","w":{"a":"Nhận thức lý luận ở mức trừu tượng, khái quát hóa cao.","c":"Nhận thức lý tính là giai đoạn gián tiếp, trừu tượng."}},{"s":7,"n":"43","q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Cảm giác là hình ảnh chủ quan của thế giới khách quan\".","o":["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan"],"a":[0],"p":56,"e":"\"Cảm giác là hình ảnh chủ quan của thế giới khách quan\" là luận điểm của chủ nghĩa duy vật biện chứng, vì nó thừa nhận nguồn gốc khách quan của cảm giác.","w":{"b":"Duy tâm chủ quan coi cảm giác là cái có trước.","c":"Duy tâm khách quan coi ý niệm có trước."}},{"s":7,"n":"44","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Nhận thức cảm tính gắn liền với thực tiễn","Nhận thức cảm tính chưa phân biệt được cái bản chất với cái không bản chất","Nhận thức cảm tính phản ánh sai sự vật","Nhận thức cảm tính chưa phản ánh đầy đủ và sâu sắc sự vật."],"a":[2],"p":56,"e":"Nhận thức cảm tính phản ánh đúng sự vật ở bề ngoài, nhưng chưa đầy đủ và sâu sắc. Phương án c, cho rằng nó phản ánh sai, là sai.","w":{"a":"Đúng: nhận thức cảm tính gắn liền với thực tiễn.","b":"Đúng: chưa phân biệt được bản chất với không bản chất.","d":"Đúng: chưa phản ánh đầy đủ và sâu sắc."}},{"s":7,"n":"45","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Nhận thức lý tính phản ánh những mối liên hệ chung, bản chất của sự vật.","Nhận thức lý tính phản ánh sự vật sâu sắc, đầy đủ và chính xác hơn nhận thức cảm tính.","Nhận thức lý tính luôn đạt đến chân lý không mắc sai lầm."],"a":[2],"p":56,"e":"Nhận thức lý tính cũng có thể mắc sai lầm, nên \"luôn đạt đến chân lý\" là sai. Chân lý phải được thực tiễn kiểm nghiệm.","w":{"a":"Đúng: nhận thức lý tính phản ánh mối liên hệ chung, bản chất.","b":"Đúng: nhận thức lý tính phản ánh sâu sắc hơn nhận thức cảm tính."}},{"s":7,"n":"46","q":"Luận điểm sau đây là của ai và thuộc trường phái triết học nào: \"Từ trực quan sinh động đến tư duy trừu tượng và từ tư duy trừu tượng đến thực tiễn, đó là con đường biện chứng của sự nhận thức chân lý, nhận thức thực tại khách quan\"","o":["Phoi-ơ-bắc; chủ nghĩa duy vật siêu hình.","Lênin; chủ nghĩa duy vật biện chứng.","Hêghen; chủ nghĩa duy tâm khách quan."],"a":[1],"p":56,"e":"Câu này của V.I.Lênin trong \"Bút ký triết học\", khẳng định con đường biện chứng của nhận thức từ trực quan sinh động đến tư duy trừu tượng rồi đến thực tiễn. Đó là lập trường duy vật biện chứng.","w":{"a":"Phoi-ơ-bắc theo duy vật siêu hình, chưa nêu được vai trò của thực tiễn.","c":"Hê-ghen theo duy tâm khách quan."}},{"s":7,"n":"47","q":"theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Thực tiễn không có lý luận là thực tiễn mù quáng.","Lý luận không có thực tiễn là lý luận suông","Lý luận có thể phát triển không cần thực tiễn."],"a":[2],"p":56,"e":"Lý luận không thể phát triển nếu không có thực tiễn, vì thực tiễn là cơ sở và động lực của lý luận. Phương án c vì vậy là sai.","w":{"a":"Đúng: thực tiễn không có lý luận là thực tiễn mù quáng.","b":"Đúng: lý luận không có thực tiễn là lý luận suông."}},{"s":7,"n":"48","q":"Thêm cụm từ thích hợp vào chỗ trống của câu sau để được khái niệm về chân lý: \"Chân lý là những...(1)... phù hợp với hiện thực khách quan và được...(2)... kiểm nghiệm\"","o":["1- cảm giác của con người; 2- ý niệm tuyệt đối","1- Tri thức; 2- thực tiễn","1- ý kiến; 2- nhiều người."],"a":[1],"p":57,"e":"Chân lý là những tri thức phù hợp với hiện thực khách quan và được thực tiễn kiểm nghiệm.","w":{"a":"Cảm giác và ý niệm tuyệt đối là cách hiểu duy tâm.","c":"Ý kiến nhiều người không phải tiêu chuẩn của chân lý."}},{"s":7,"n":"49","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai","o":["Chân lý có tính khách quan","Chân lý có tính tương đối","Chân lý có tính trừu tượng","Chân lý có tính cụ thể"],"a":[2],"p":57,"e":"Chân lý có tính khách quan, tính tương đối, tính tuyệt đối và tính cụ thể. \"Tính trừu tượng\" không phải tính chất của chân lý. Phương án c vì vậy là sai.","w":{"a":"Đúng: chân lý có tính khách quan.","b":"Đúng: chân lý có tính tương đối.","d":"Đúng: chân lý có tính cụ thể."}},{"s":7,"n":"50","q":"Theo quan điểm của CNDVBC, luận điểm nào sau đây là sai?","o":["Nhận thức kinh nghiệm tự nó không chứng minh được tính tất yếu","Nhận thức kinh nghiệm tự nó chứng minh được tính tất yếu","Lý luận không tự phát xuất hiện từ kinh nghiệm"],"a":[1],"p":57,"e":"Nhận thức kinh nghiệm tự nó không chứng minh được tính tất yếu, nên phương án b là sai. Phải có lý luận mới nhận thức được tính tất yếu.","w":{"a":"Đúng: kinh nghiệm không chứng minh tính tất yếu.","c":"Đúng: lý luận không tự phát xuất hiện từ kinh nghiệm."}},{"s":7,"n":"51","q":"Trong hoạt động thực tiễn không coi trọng lý luận thì sẽ thế nào?","o":["Sẽ rơi vào chủ nghĩa kinh viện giáo điều","Sẽ rơi vào chủ nghĩa kinh nghiệm hẹp hòi.","Sẽ rơi vào ảo tưởng."],"a":[1],"p":57,"e":"Không coi trọng lý luận trong thực tiễn thì rơi vào chủ nghĩa kinh nghiệm hẹp hòi, vì chỉ dựa vào kinh nghiệm riêng lẻ.","w":{"a":"Chủ nghĩa kinh viện, giáo điều là sai lầm khi tuyệt đối hóa lý luận.","c":"Ảo tưởng không đặc trưng cho việc coi nhẹ lý luận."}},{"s":7,"n":"52","q":"Chọn phương án đúng theo quan điểm của chủ nghĩa duy vật?","o":["Vật chất là tính thứ nhất, ý thức là tính thứ hai.","Vật chất có trước, ý thức có sau, vật chất quyết định ý thức.","Ý thức tồn tại độc lập tách khỏi vật chất."],"a":[0,1],"p":57,"e":"Chủ nghĩa duy vật khẳng định vật chất là tính thứ nhất, có trước, quyết định ý thức, và ý thức là tính thứ hai, có sau. Hai phương án a và b đều diễn tả điều này.","w":{"a":"Đúng: vật chất là tính thứ nhất, ý thức là tính thứ hai.","b":"Đúng: vật chất có trước, ý thức có sau, vật chất quyết định ý thức.","c":"Ý thức tồn tại độc lập tách khỏi vật chất là quan điểm duy tâm."}},{"s":7,"n":"53","q":"Các hình thức nào dưới đây là hình thức cơ bản của chủ nghĩa duy vật?","o":["Chủ nghĩa duy vật chất phác","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng"],"a":[0,1,2],"p":57,"e":"Chủ nghĩa duy vật có ba hình thức cơ bản: chất phác, siêu hình và biện chứng. Cả ba phương án đều đúng.","w":{"a":"Chủ nghĩa duy vật chất phác (cổ đại).","b":"Chủ nghĩa duy vật siêu hình (thế kỷ XV-XVIII).","c":"Chủ nghĩa duy vật biện chứng (Mác, Ăngghen)."}},{"s":7,"n":"54","q":"Thế nào là nhị nguyên luận?","o":["Vật chất có trước, ý thức có sau.","Vật chất và ý thức song song tồn tại, không cái nào phụ thuộc cái nào.","Ý thức có trước, vật chất có sau."],"a":[1],"p":57,"e":"Nhị nguyên luận cho rằng vật chất và ý thức song song tồn tại, không cái nào phụ thuộc cái nào.","w":{"a":"Vật chất có trước là duy vật.","c":"Ý thức có trước là duy tâm."}},{"s":7,"n":"55","q":"Thế nào là phương pháp siêu hình?","o":["Xem xét các sự vật trong trạng thái cô lập, tách rời tuyệt đối.","Xem xét trong trạng thái tĩnh tại, không vận động, phát triển.","Xem xét phát triển thuần túy về lượng, không có thay đổi về chất."],"a":[0,1,2],"p":57,"e":"Phương pháp siêu hình xem xét sự vật cô lập, tĩnh tại và chỉ thấy thay đổi về lượng. Cả ba phương án đều mô tả đúng.","w":{"a":"Xem xét sự vật trong trạng thái cô lập, tách rời.","b":"Xem xét trong trạng thái tĩnh tại.","c":"Xem xét phát triển thuần túy về lượng."}},{"s":7,"n":"56","q":"Thế nào là phương pháp biện chứng?","o":["Xem xét sự vật trong mối liên hệ tác động qua lại lẫn nhau.","Xem xét sự vật trong quá trình vận động, phát triển.","Thừa nhận có sự đứng im tương đối của các sự vật, hiện tượng trong thế giới vật chất."],"a":[0,1,2],"p":57,"e":"Phương pháp biện chứng xem xét sự vật trong mối liên hệ, trong quá trình vận động, phát triển, và thừa nhận đứng im tương đối. Cả ba phương án đều đúng.","w":{"a":"Xem xét sự vật trong mối liên hệ qua lại.","b":"Xem xét sự vật trong vận động, phát triển.","c":"Thừa nhận đứng im tương đối."}},{"s":7,"n":"57","q":"Câu \"nhân chi sơ tính bản thiện\" là của ai?","o":["Khổng Tử","Mạnh Tử","Tuân Tử","Lão Tử"],"a":[1],"p":58,"e":"Câu \"Nhân chi sơ, tính bản thiện\" gắn với Mạnh Tử, người cho rằng bản tính con người vốn lành.","w":{"a":"Khổng Tử nói \"tính tương cận, tập tương viễn\".","c":"Tuân Tử chủ trương tính ác.","d":"Lão Tử là người sáng lập đạo gia."}},{"s":7,"n":"58","q":"Triết học Hêghen có những đặc điểm gì?","o":["Biện chứng","Duy tâm, bảo thủ","Cách mạng","Cả a và b"],"a":[3],"p":58,"e":"Triết học Hê-ghen có hai mặt: phương pháp biện chứng (cách mạng) và hệ thống duy tâm, bảo thủ. Đáp án d gộp a và b.","w":{"a":"Đúng một phần: có tính biện chứng.","b":"Đúng một phần: hệ thống duy tâm, bảo thủ.","c":"Tính cách mạng thuộc phương pháp biện chứng."}},{"s":7,"n":"59","q":"Triết học Phoi ơ bắc có những đặc điểm gì?","o":["Duy vật","Duy tâm trong xã hội","Siêu hình","Cả a,b và c"],"a":[3],"p":58,"e":"Triết học Phoi-ơ-bắc có tính duy vật (nhân bản), duy tâm trong xã hội và siêu hình. Đáp án d gộp cả ba.","w":{"a":"Đúng một phần: duy vật.","b":"Đúng một phần: duy tâm trong xã hội.","c":"Đúng một phần: siêu hình."}},{"s":7,"n":"60","q":"Tác phẩm \"Tuyên ngôn của Đảng cộng sản\" được C. Mác và Ph. Ăng ghen viết vào năm nào?","o":["Năm 1844","Năm 1847","Năm 1848","Năm 1850"],"a":[2],"p":58,"e":"Tuyên ngôn của Đảng Cộng sản do C.Mác và Ph.Ăngghen viết vào năm 1848, đánh dấu sự ra đời của chủ nghĩa Mác.","w":{"a":"1844 là năm viết Bản thảo kinh tế - triết học.","b":"1847 là năm công bố Sự khốn cùng của triết học.","d":"1850 không gắn với Tuyên ngôn."}},{"s":8,"n":"1","q":"Tác phẩm \"Chống Đuyrinh\" được Ph. Ăng ghen viết vào thời gian nào?","o":["Từ 1876 - 1877","Từ 1875 - 1878","Từ 1876 - 1878"],"a":[2],"p":59,"e":"Ph.Ăngghen viết \"Chống Đuy-rinh\" từ năm 1876 đến năm 1878, đăng thành loạt bài rồi in thành sách.","w":{"a":"1876-1877 thiếu năm 1878, năm tác phẩm hoàn thành.","b":"Ăngghen bắt đầu viết từ năm 1876, không phải 1875."}},{"s":8,"n":"2","q":"Trong số ba phát minh dưới đây, phát minh nào là thuộc về triết học Mác?","o":["Phát minh ra “giai cấp”.","Phát minh ra các quy luật cơ bản của phép biện chứng.","Phát minh ra rằng: đấu tranh giai cấp là động lực phát triển trong các xã hội có giai cấp."],"a":[2],"p":59,"e":"Theo file, phát minh thuộc về triết học Mác là: đấu tranh giai cấp là động lực phát triển trong xã hội có giai cấp.","w":{"a":"Khái niệm \"giai cấp\" đã được các nhà sử học tư sản nêu trước Mác.","b":"Các quy luật cơ bản của phép biện chứng do Hê-ghen nêu ra từ trước, Mác cải tạo chúng trên nền duy vật."}},{"s":8,"n":"3","q":"Hãy xác định mệnh đề đúng trong ba mệnh đề dưới đây:","o":["Triết học macxit là một học thuyết đã hoàn chỉnh, xong xuôi.","Triết học macxit chưa hoàn chỉnh, xong xuôi và cần phải bổ sung để phát triển.","Triết học macxit là “khoa học của mọi khoa học”."],"a":[1],"p":59,"e":"Triết học Mác là học thuyết mở, cần được bổ sung và phát triển cùng thực tiễn và khoa học.","w":{"a":"Triết học Mác không \"hoàn chỉnh, xong xuôi\".","c":"\"Khoa học của mọi khoa học\" là quan niệm của Hê-ghen."}},{"s":8,"n":"4","q":"Hãy chỉ ra nhận định đúng trong số ba nhận định sau đây về bản tính của phép biện chứng:","o":["Bản tính của phép biện chứng là phê phán, cách mạng và không hề biết sợ.","Bản tính của phép biện chứng là hướng đến cái tuyệt đối.","Bản tính của phép biện chứng"],"a":[0],"p":59,"e":"Bản tính của phép biện chứng là phê phán, cách mạng và không hề biết sợ, vì nó nhìn mọi sự vật trong vận động, phát triển và tất yếu bị diệt vong.","w":{"b":"Hướng đến cái tuyệt đối là quan niệm siêu hình.","c":"Phương án này bị cắt dở trong file gốc."}},{"s":8,"n":"5","q":"Hãy chỉ ra phương án đúng trong ba nhận xét dưới đây về mối quan hệ giữa sản xuất và tiêu dùng:","o":["Sản xuất đối lập hoàn toàn với tiêu dùng, vì sản xuất là sáng tạo còn tiêu dùng là phá huỷ.","Sản xuất cũng là tiêu dùng.","Sản xuất là cái có trước và quy định tiêu dùng."],"a":[1],"p":59,"e":"Sản xuất cũng là tiêu dùng: trong sản xuất, người ta tiêu dùng sức lao động và tư liệu sản xuất. Đây là luận điểm của Mác.","w":{"a":"Sản xuất và tiêu dùng gắn bó, không đối lập hoàn toàn.","c":"Sản xuất quy định tiêu dùng, nhưng tiêu dùng cũng tác động trở lại sản xuất. Phương án này chỉ nêu một chiều."}},{"s":8,"n":"6","q":"C. Mác viết: \"Phương pháp biện chứng của tôi không những khác phương pháp của Hê ghen về căn bản, mà còn đối lập hẳn với phương pháp ấy nữa\". Câu đó C.Mác viết trong tác phẩm nào?","o":["\"Phê phát triết học pháp quyền của Hê ghen\"","\"Tuyên ngôn của Đảng Cộng sản\"","\"Tư bản\""],"a":[2],"p":59,"e":"Câu này nằm trong \"Lời bạt\" cho lần xuất bản thứ hai bộ Tư bản của C.Mác, nói về sự khác biệt giữa phương pháp biện chứng của Mác và của Hê-ghen.","w":{"a":"\"Phê phán triết học pháp quyền của Hê-ghen\" là tác phẩm sớm hơn.","b":"Tuyên ngôn của Đảng Cộng sản không có câu này."}},{"s":8,"n":"7","q":"Cống hiến vĩ đại nhất của C.Mác về triết học là gì?","o":["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật lịch sử","Coi thực tiễn là trung tâm"],"a":[1],"p":59,"e":"Cống hiến vĩ đại nhất của C.Mác về triết học là chủ nghĩa duy vật lịch sử, vì nó mở rộng quan điểm duy vật vào xã hội và lập nên khoa học về lịch sử.","w":{"a":"Chủ nghĩa duy vật biện chứng là cống hiến lớn nhưng không được xem là vĩ đại nhất.","c":"Coi thực tiễn là trung tâm là quan điểm xuyên suốt, chưa phải cống hiến cụ thể."}},{"s":8,"n":"8","q":"Định nghĩa của V.I. Lênin về vật chất được nêu ra trong tác phẩm nào?","o":["Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán.","Bút ký triết học","Nhà nước và cách mạng."],"a":[0],"p":60,"e":"Định nghĩa vật chất của V.I.Lênin nằm trong tác phẩm \"Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán\" (1908).","w":{"b":"\"Bút ký triết học\" ghi chép về phép biện chứng.","c":"\"Nhà nước và cách mạng\" bàn về nhà nước."}},{"s":8,"n":"9","q":"Thuộc tính cơ bản để phân biệt vật chất với ý thức?","o":["Thực tại khách quan","Vận động","Không gian và thời gian."],"a":[0],"p":60,"e":"Thuộc tính cơ bản phân biệt vật chất với ý thức là thực tại khách quan, tồn tại độc lập với ý thức.","w":{"b":"Vận động là phương thức tồn tại của vật chất.","c":"Không gian, thời gian là hình thức tồn tại của vật chất."}},{"s":8,"n":"10","q":"Các hình thức tồn tại cơ bản của vật chất.","o":["Vận động","Tồn tại khách quan","Không gian và thời gian","a và c"],"a":[0,2],"p":60,"alt":[[3]],"e":"File gốc chấp nhận hai đáp án: vận động, và không gian - thời gian, hoặc phương án d gộp cả hai. Theo giáo trình, vận động là phương thức tồn tại, còn không gian và thời gian là hình thức tồn tại của vật chất.","w":{"b":"Tồn tại khách quan là thuộc tính, không phải hình thức tồn tại.","d":"Gộp a và c, file chấp nhận như đáp án thay thế cho cặp A, C."}},{"s":8,"n":"11","q":"Thuộc tính chung nhất của vận động là gì?","o":["Thay đổi vị trí trong không gian","Sự thay đổi về chất","Sự biến đổi nói chung","a và b"],"a":[2],"p":60,"e":"Vận động theo nghĩa chung nhất là sự biến đổi nói chung, bao gồm mọi sự thay đổi và mọi quá trình trong vũ trụ, từ thay đổi vị trí đơn giản đến tư duy.","w":{"a":"Thay đổi vị trí trong không gian chỉ là vận động cơ học.","b":"Sự thay đổi về chất chỉ là một dạng biến đổi.","d":"Gộp a và b vẫn chưa nêu nghĩa chung nhất."}},{"s":8,"n":"12","q":"Đứng im có tách rời vận động không?","o":["Tách rời vận động","Có quan hệ với vận động","Bao hàm vận động","b và c"],"a":[2],"p":60,"e":"Đứng im không tách rời vận động. Đứng im là trạng thái đặc biệt của vận động, tức nó bao hàm vận động.","w":{"a":"Đứng im không tách rời vận động.","b":"\"Có quan hệ\" đúng nhưng chưa nêu bản chất.","d":"Gộp b và c; đáp án chọn c."}},{"s":8,"n":"13","q":"Bài học kinh nghiệm mà Đảng ta đã rút ra trong công cuộc đổi mới là gì?","o":["Đổi mới kinh tế trước, đổi mới chính trị sau.","Đổi mới chính trị trước, đổi mới kinh tế sau.","Kết hợp đổi mới kinh tế với đổi mới chính trị."],"a":[2],"p":60,"e":"Bài học của Đảng trong công cuộc đổi mới là kết hợp đổi mới kinh tế với đổi mới chính trị, lấy đổi mới kinh tế làm trọng tâm, từng bước đổi mới chính trị.","w":{"a":"Chỉ đổi mới kinh tế trước, bỏ qua chính trị, là chưa đúng.","b":"Đổi mới chính trị trước kinh tế cũng không đúng."}},{"s":8,"n":"14","q":"Tư tưởng nào là của Đại hội Đảng toàn quốc lần thứ IX đề ra:","o":["Chủ động hội nhập kinh tế quốc tế và khu vực.","Tích cực hội nhập kinh tế quốc tế và khu vực.","Đẩy nhanh tiến trình hội nhập kinh tế quốc tế và khu vực."],"a":[0],"p":60,"e":"Tư tưởng \"chủ động hội nhập kinh tế quốc tế và khu vực\" được nêu tại Đại hội IX của Đảng (2001).","w":{"b":"\"Tích cực hội nhập\" xuất hiện ở các kỳ đại hội sau.","c":"\"Đẩy nhanh tiến trình hội nhập\" không phải cách diễn đạt của Đại hội IX."}},{"s":8,"n":"15","q":"Câu nói sau đây của C.Mác là trong tác phẩm nào: \"Cái cối xay quay bằng tay đưa lại xã hội có lãnh chúa phong kiến, cái cối xay chạy bằng hơi nước đưa lại xã hội có nhà tư bản công nghiệp\".","o":["Lời nói đầu góp phần phê phán kinh tế chính trị.","Sự khốn cùng của triết học","Tư bản"],"a":[1],"p":60,"e":"Câu này nằm trong \"Sự khốn cùng của triết học\" (1847) của C.Mác, nói về mối quan hệ giữa công cụ sản xuất và xã hội.","w":{"a":"\"Lời nói đầu góp phần phê phán kinh tế chính trị\" (1859) nêu công thức về hình thái kinh tế - xã hội.","c":"Tư bản không chứa câu này."}},{"s":8,"n":"16","q":"Câu nói sau đây của C.Mác là trong tác phẩm nào: \"Sự phát triển của các hình thái kinh tế - xã hội là một quá trình lịch sử - tự nhiên\".","o":["Tư bản","Lời nói đầu góp phần phê phán kinh tế chính trị.","Hệ tư tưởng Đức"],"a":[0],"p":61,"e":"Câu \"sự phát triển của những hình thái kinh tế - xã hội là một quá trình lịch sử - tự nhiên\" nằm trong lời tựa bộ Tư bản của C.Mác.","w":{"b":"\"Lời nói đầu góp phần phê phán kinh tế chính trị\" nêu nội dung gần gũi nhưng không phải câu này.","c":"Hệ tư tưởng Đức trình bày quan niệm duy vật về lịch sử."}},{"s":8,"n":"17","q":"Câu nói sau đây của V.I.Lênin là trong tác phẩm nào: \"Chỉ có đem quy những quan hệ xã hội vào những quan hệ sản xuất, và đem quy những quan hệ sản xuất vào trình độ của những lực lượng sản xuất thì người ta mới có được cơ sở vững chắc để quan niệm sự phát triển của những hình thái xã hội là một quá trình lịch sử - tự nhiên\".","o":["Những người bạn dân là thế nào và họ đấu tranh chống những người dân chủ -xã hội ra sao.","Nhà nước và cách mạng xã hội.","Bệnh ấu trĩ tả khuynh và tính tiểu tư sản."],"a":[0],"p":61,"e":"Câu của V.I.Lênin nằm trong tác phẩm \"Những người bạn dân là thế nào và họ đấu tranh chống những người dân chủ - xã hội ra sao\" (1894).","w":{"b":"\"Nhà nước và cách mạng\" (1917) bàn về nhà nước.","c":"\"Bệnh ấu trĩ tả khuynh\" (1920) bàn về sách lược cách mạng."}},{"s":8,"n":"18","q":"Trình độ của lực lượng sản xuất thể hiện ở?","o":["Trình độ công cụ lao động và con người lao động","Trình độ tổ chức và phân công lao động xã hội.","Trình độ ứng dụng khoa học vào sản xuất."],"a":[0,1,2],"p":61,"e":"Trình độ của lực lượng sản xuất thể hiện ở trình độ công cụ lao động và người lao động, trình độ tổ chức và phân công lao động xã hội, và trình độ ứng dụng khoa học vào sản xuất. Cả ba đều đúng.","w":{"a":"Công cụ lao động và con người lao động.","b":"Tổ chức và phân công lao động xã hội.","c":"Ứng dụng khoa học vào sản xuất."}},{"s":8,"n":"19","q":"Tiêu chuẩn khách quan để phân biệt các hình thái kinh tế - xã hội là:","o":["Lực lượng sản xuất","Quan hệ sản xuất","Chính trị, tư tưởng."],"a":[1],"p":61,"e":"Quan hệ sản xuất là tiêu chuẩn khách quan để phân biệt các hình thái kinh tế - xã hội, vì mỗi hình thái có quan hệ sản xuất đặc trưng.","w":{"a":"Lực lượng sản xuất là tiêu chuẩn để phân biệt các thời đại kinh tế.","c":"Chính trị, tư tưởng thuộc kiến trúc thượng tầng."}},{"s":8,"n":"20","q":"Trong sự nghiệp xây dựng chủ nghĩa xã hội ở nước ta, chúng ta phải.","o":["Chủ động xây dựng quan hệ sản xuất trước, sau đó xây dựng lực lượng sản xuất phù hợp.","Chủ động xây dựng lực lượng sản xuất trước, sau đó xây dựng quan hệ sản xuất phù hợp.","Kết hợp đồng thời xây dựng lực lượng sản xuất với xác lập quan hệ sản xuất phù hợp."],"a":[2],"p":61,"e":"Xây dựng chủ nghĩa xã hội ở nước ta phải kết hợp đồng thời xây dựng lực lượng sản xuất với xác lập quan hệ sản xuất phù hợp.","w":{"a":"Xây dựng quan hệ sản xuất trước là chủ quan, duy ý chí.","b":"Chờ lực lượng sản xuất xong mới xây quan hệ sản xuất là máy móc."}},{"s":8,"n":"21","q":"Tiến lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa là:","o":["Phù hợp với quá trình lịch sử - tự nhiên.","Không phù hợp với quá trình lịch sử - tự nhiên.","Vận dụng sáng tạo của Đảng ta."],"a":[0,2],"p":61,"e":"Tiến lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa phù hợp với quá trình lịch sử - tự nhiên và là sự vận dụng sáng tạo của Đảng ta. Hai phương án a và c đều đúng.","w":{"a":"Phù hợp với quá trình lịch sử - tự nhiên.","c":"Vận dụng sáng tạo của Đảng ta.","b":"Không phù hợp với quá trình lịch sử - tự nhiên là sai."}},{"s":8,"n":"22","q":"Triết học ra đời từ thực tiễn, nó có các nguồn gốc:","o":["Nguồn gốc nhận thức và nguồn gốc xã hội","Nguồn gốc nhận thức, nguồn gốc xã hội và giai cấp","Nguồn gốc tự nhiên, xã hội và tư duy","Nguồn gốc tự nhiên và nhận thức"],"a":[0],"p":61,"e":"Triết học ra đời từ hai nguồn gốc: nguồn gốc nhận thức và nguồn gốc xã hội.","w":{"b":"\"Giai cấp\" không phải một nguồn gốc riêng.","c":"Tự nhiên, xã hội và tư duy là đối tượng nghiên cứu, không phải nguồn gốc ra đời.","d":"Nguồn gốc tự nhiên không nằm trong hai nguồn gốc của triết học."}},{"s":8,"n":"23","q":"Đối tượng nghiên cứu của triết học là:","o":["Những quy luật của thế giới khách quan","Những quy luật chung nhất của tự nhiên, xã hội và tư duy","Những vấn đề chung nhất của tự nhiên, xã hội, con người; quan hệ của con người nói chung, tư duy của con người nói riêng với thế giới xung quanh.","Những vấn đề của xã hội, tự nhiên."],"a":[2],"p":61,"e":"Đối tượng của triết học là những vấn đề chung nhất của tự nhiên, xã hội, con người, và quan hệ của con người, nhất là tư duy, với thế giới xung quanh.","w":{"a":"Quy luật của thế giới khách quan nói chung là đối tượng của khoa học nói chung.","b":"Quy luật chung nhất của tự nhiên, xã hội và tư duy là cách diễn đạt khác, nhưng file chọn phương án c.","d":"Vấn đề của xã hội, tự nhiên bỏ sót tư duy và con người."}},{"s":8,"n":"24","q":"Triết học có vai trò là:","o":["Toàn bộ thế giới quan","Toàn bộ thế giới quan, nhân sinh quan và phương pháp luận","Hạt nhân lý luận của thế giới quan.","Toàn bộ thế giới quan và phương pháp luận"],"a":[2],"p":62,"e":"Triết học là hạt nhân lý luận của thế giới quan. Thế giới quan còn có tri thức khoa học cụ thể, niềm tin, lý tưởng.","w":{"a":"Triết học không phải toàn bộ thế giới quan.","b":"Triết học không phải toàn bộ thế giới quan, nhân sinh quan và phương pháp luận.","d":"Triết học không phải toàn bộ thế giới quan và phương pháp luận."}},{"s":8,"n":"25","q":"Vấn đề cơ bản của triết học là:","o":["Quan hệ giữa tồn tại với tư duy và khả năng nhận thức của con người.","Quan hệ giữa vật chất và ý thức, tinh thần với tự nhiên và con người có khả năng nhận thức được thế giới hay không?","Quan hệ giữa vật chất với ý thức, tinh thần với tự nhiên, tư duy với tồn tại và con người có khả năng nhận thức được thế giới hay không?","Quan hệ giữa con người và nhận thức của con người với giới tự nhiên"],"a":[2],"p":62,"e":"Vấn đề cơ bản của triết học là quan hệ giữa vật chất và ý thức, tinh thần với tự nhiên, tư duy với tồn tại. Nó gồm hai mặt: mặt thứ nhất là cái nào có trước, mặt thứ hai là con người có nhận thức được thế giới hay không.","w":{"a":"Thiếu cặp vật chất - ý thức.","b":"Thiếu cặp tư duy - tồn tại.","d":"Không nêu đúng nội dung vấn đề cơ bản."}},{"s":8,"n":"26","q":"Lập trường của chủ nghĩa duy vật khi giải quyết mặt thứ nhất của vấn đề cơ bản của triết học?","o":["Vật chất là tính thứ nhất, ý thức là tính thứ hai","Vật chất có trước, ý thức có sau, vật chất quyết định ý thức.","Cả a và b.","Vật chất và ý thức cùng đồng thời tồn tại, cùng quyết định lẫn nhau."],"a":[2],"p":62,"e":"Chủ nghĩa duy vật khi giải quyết mặt thứ nhất khẳng định vật chất là tính thứ nhất, có trước, quyết định ý thức. Đáp án c gộp a và b.","w":{"a":"Vật chất là tính thứ nhất, ý thức là tính thứ hai.","b":"Vật chất có trước, ý thức có sau, vật chất quyết định ý thức.","d":"Vật chất và ý thức đồng thời quyết định nhau là nhị nguyên luận."}},{"s":8,"n":"27","q":"Ý nào dưới đây không phải là hình thức cơ bản của chủ nghĩa duy vật:","o":["Chủ nghĩa duy vật chất phác","Chủ nghĩa duy vật tầm thường","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng"],"a":[1],"p":62,"e":"Ba hình thức cơ bản của chủ nghĩa duy vật là chất phác, siêu hình và biện chứng. \"Duy vật tầm thường\" không nằm trong số đó.","w":{"a":"Chủ nghĩa duy vật chất phác.","c":"Chủ nghĩa duy vật siêu hình.","d":"Chủ nghĩa duy vật biện chứng."}},{"s":8,"n":"28","q":"Chủ nghĩa duy vật chất phác trong khi thừa nhận tính thứ nhất của vật chất đã:","o":["Đồng nhất vật chất với vật thể","Đồng nhất vật chất với một hoặc một số vật thể cụ thể cảm tính.","Đồng nhất vật chất với nguyên tử và khối lượng.","Đồng nhất vật chất với nguyên tử"],"a":[1],"p":62,"e":"Chủ nghĩa duy vật chất phác đồng nhất vật chất với một hay một số vật thể cụ thể, cảm tính (nước, lửa, không khí).","w":{"a":"Đồng nhất vật chất với vật thể là hạn chế chung của duy vật trước Mác.","c":"Đồng nhất với nguyên tử và khối lượng là duy vật siêu hình.","d":"Đồng nhất với nguyên tử là quan điểm của Đê-mô-crít, một dạng cụ thể."}},{"s":8,"n":"29","q":"Khi cho rằng “tồn tại là được tri giác”, đây là quan điểm:","o":["Duy tâm khách quan","Nhị nguyên","Duy tâm chủ quan","Duy cảm"],"a":[2],"p":62,"e":"Béc-cơ-li nói \"tồn tại là được tri giác\": sự vật chỉ tồn tại khi được cảm giác. Đó là duy tâm chủ quan.","w":{"a":"Duy tâm khách quan coi ý niệm có trước.","b":"Nhị nguyên coi vật chất và ý thức song song.","d":"\"Duy cảm\" không phải tên một lập trường cơ bản."}},{"s":8,"n":"30","q":"Tác phẩm nào được coi là đánh dấu sự chín muồi của thế giới quan mới (chủ nghĩa duy vật về lịch sử)?","o":["Hệ tư tưởng Đức","Bản thảo kinh tế triết học 1844","Sự khốn cùng của triết học","Luận cương về Phoiơbắc"],"a":[0],"p":63,"e":"\"Hệ tư tưởng Đức\" (1845-1846) của Mác và Ăngghen trình bày một cách hệ thống chủ nghĩa duy vật lịch sử, đánh dấu sự chín muồi của thế giới quan mới.","w":{"b":"Bản thảo kinh tế - triết học 1844 còn ảnh hưởng của Phoi-ơ-bắc.","c":"Sự khốn cùng của triết học (1847) phê phán Pru-đông.","d":"Luận cương về Phoi-ơ-bắc (1845) mới là mầm mống thiên tài."}},{"s":8,"n":"31","q":"Yếu tố nào giữ vai trò quyết định trong tồn tại xã hội?","o":["Môi trường tự nhiên","Điều kiện dân số","Phương thức sản xuất","Lực lượng sản xuất"],"a":[2],"p":63,"e":"Phương thức sản xuất quyết định tồn tại xã hội, vì nó quyết định tính chất, kết cấu và sự vận động của xã hội.","w":{"a":"Môi trường tự nhiên là điều kiện thường xuyên cần thiết.","b":"Điều kiện dân số cũng chỉ là điều kiện.","d":"Lực lượng sản xuất chỉ là một mặt của phương thức sản xuất."}},{"s":8,"n":"32","q":"Sản xuất vật chất là gì?","o":["Sản xuất xã hội, sản xuất tinh thần","Sản xuất của cải vật chất","Sản xuất vật chất và sản xuất tinh thần","Sản xuất ra đời sống xã hội"],"a":[1],"p":63,"e":"Sản xuất vật chất là quá trình con người dùng công cụ lao động tác động vào tự nhiên để tạo ra của cải vật chất.","w":{"a":"Sản xuất xã hội và sản xuất tinh thần không phải sản xuất vật chất.","c":"Gộp cả sản xuất tinh thần.","d":"Sản xuất ra đời sống xã hội là ý rộng hơn."}},{"s":8,"n":"33","q":"Tư liệu sản xuất bao gồm:","o":["Con người và công cụ lao động","Con người lao động, công cụ lao động và đối tượng lao động","Đối tượng lao động và tư liệu lao động","Công cụ lao động và tư liệu lao động"],"a":[2],"p":63,"e":"Tư liệu sản xuất gồm đối tượng lao động và tư liệu lao động (trong đó có công cụ lao động).","w":{"a":"Con người không thuộc tư liệu sản xuất.","b":"Con người là chủ thể sản xuất.","d":"Công cụ lao động là một bộ phận của tư liệu lao động."}},{"s":8,"n":"34","q":"Trình độ của lực lượng sản xuất thể hiện ở:","o":["Trình độ công cụ lao động và người lao động","Trình độ tổ chức, phân công lao động xã hội","Trình độ ứng dụng khoa học vào sản xuất","Tăng năng suất lao động"],"a":[0,1,2],"p":63,"e":"Trình độ lực lượng sản xuất thể hiện ở trình độ công cụ lao động và người lao động, trình độ tổ chức và phân công lao động xã hội, và trình độ ứng dụng khoa học vào sản xuất.","w":{"a":"Công cụ lao động và người lao động.","b":"Tổ chức, phân công lao động xã hội.","c":"Ứng dụng khoa học vào sản xuất.","d":"Tăng năng suất lao động là kết quả, không phải thành phần của trình độ."}},{"s":8,"n":"35","q":"Tiêu chuẩn khách quan để phân biệt các chế độ xã hội trong lịch sử?","o":["Quan hệ sản xuất đặc trưng","Chính trị tư tưởng","Lực lượng sản xuất","Phương thức sản xuất"],"a":[0],"p":63,"e":"Quan hệ sản xuất đặc trưng, nhất là quan hệ sở hữu tư liệu sản xuất, là tiêu chuẩn khách quan để phân biệt các chế độ xã hội trong lịch sử.","w":{"b":"Chính trị, tư tưởng thuộc kiến trúc thượng tầng.","c":"Lực lượng sản xuất phân biệt các thời đại kinh tế.","d":"Phương thức sản xuất bao gồm cả lực lượng sản xuất, nên không đặc trưng riêng cho chế độ xã hội."}},{"s":8,"n":"36","q":"Yếu tố cách mạng nhất trong lực lượng sản xuất:","o":["Người lao động","Công cụ lao động","Phương tiện lao động","Tư liệu lao động"],"a":[1],"p":63,"e":"Công cụ lao động là yếu tố động nhất, cách mạng nhất của lực lượng sản xuất, vì nó thay đổi trước và kéo theo mọi yếu tố khác.","w":{"a":"Người lao động là yếu tố quyết định hàng đầu.","c":"Phương tiện lao động là khái niệm rộng hơn.","d":"Tư liệu lao động gồm cả công cụ lao động."}},{"s":8,"n":"37","q":"Trong quan hệ sản xuất, quan hệ nào giữ vai trò quyết định:","o":["Quan hệ sở hữu tư liệu sản xuất","Quan hệ tổ chức, quản lý quá trình sản xuất","Quan hệ phân phối sản phẩm.","Quan hệ sở hữu tư nhân về tư liệu sản xuất"],"a":[0],"p":63,"e":"Trong quan hệ sản xuất, quan hệ sở hữu về tư liệu sản xuất giữ vai trò quyết định, vì nó quy định quan hệ tổ chức quản lý và quan hệ phân phối.","w":{"b":"Quan hệ tổ chức quản lý chịu sự quy định của sở hữu.","c":"Quan hệ phân phối cũng chịu sự quy định của sở hữu.","d":"Sở hữu tư nhân chỉ là một hình thức của sở hữu."}},{"s":8,"n":"38","q":"Thời đại đồ đồng tương ứng với hình thái kinh tế – xã hội:","o":["Hình thái kinh tế – xã hội cộng sản nguyên thuỷ","Hình thái kinh tế – xã hội phong kiến","Hình thái kinh tế – xã hội chiếm hữu nô lệ","Hình thái kinh tế – xã hội tư bản chủ nghĩa"],"a":[2],"p":64,"e":"Thời đại đồ đồng tương ứng với hình thái kinh tế - xã hội chiếm hữu nô lệ, khi công cụ kim loại làm năng suất tăng và xuất hiện sản phẩm thặng dư.","w":{"a":"Cộng sản nguyên thủy gắn với đồ đá.","b":"Phong kiến gắn với đồ sắt.","d":"Tư bản chủ nghĩa gắn với máy móc."}},{"s":8,"n":"39","q":"Nội dung của quá trình sản xuất vật chất là:","o":["Tư liệu sản xuất và quan hệ giữa người với người đối với tư liệu sản xuất","Tư liệu sản xuất và người lao động với kỹ năng lao động tương ứng với công cụ lao động","Tư liệu sản xuất và tổ chức, quản lý quá trình sản xuất.","Tư liệu sản xuất và con người."],"a":[1],"p":64,"e":"Nội dung của quá trình sản xuất vật chất là tư liệu sản xuất cùng người lao động với kỹ năng lao động tương ứng với công cụ lao động. Đó là mặt lực lượng sản xuất.","w":{"a":"Quan hệ giữa người với người về tư liệu sản xuất là quan hệ sản xuất.","c":"Tổ chức, quản lý thuộc quan hệ sản xuất.","d":"Phương án này thiếu kỹ năng lao động tương ứng."}},{"s":8,"n":"40","q":"Nền tảng vật chất của toàn bộ lịch sử nhân loại là:","o":["Lực lượng sản xuất","Quan hệ sản xuất","Của cải vật chất","Phương thức sản xuất"],"a":[0],"p":64,"e":"Lực lượng sản xuất là nền tảng vật chất của toàn bộ lịch sử nhân loại, vì nó quyết định quan hệ sản xuất.","w":{"b":"Quan hệ sản xuất là hình thức xã hội.","c":"Của cải vật chất là kết quả.","d":"Phương thức sản xuất gồm cả lực lượng và quan hệ sản xuất."}},{"s":8,"n":"41","q":"Hoạt động tự giác trên quy mô toàn xã hội là đặc trưng cơ bản của nhân tố chủ quan trong xã hội?","o":["Cộng sản nguyên thuỷ","Tư bản chủ nghĩa","Xã hội chủ nghĩa","Phong kiến"],"a":[2],"p":64,"e":"Hoạt động tự giác trên quy mô toàn xã hội là đặc trưng của nhân tố chủ quan trong xã hội xã hội chủ nghĩa, khi nhân dân làm chủ và quản lý xã hội có kế hoạch.","w":{"a":"Xã hội nguyên thủy chủ yếu là tự phát.","b":"Tư bản chủ nghĩa có tự phát và cạnh tranh.","d":"Xã hội phong kiến chưa tự giác ở quy mô toàn xã hội."}},{"s":8,"n":"42","q":"Khuynh hướng của sản xuất là không ngừng biến đổi phát triển. Sự biến đổi đó bao giờ cũng bắt đầu từ:","o":["Sự biến đổi, phát triển của cách thức sản xuất","Sự biến đổi, phát triển của lực lượng sản xuất","Sự biến đổi, phát triển của kỹ thuật sản xuất","Sự phát triển của khoa học kỹ thuật"],"a":[1],"p":64,"e":"Sự biến đổi của sản xuất luôn bắt đầu từ lực lượng sản xuất, nhất là công cụ lao động, rồi mới kéo theo quan hệ sản xuất.","w":{"a":"Cách thức sản xuất là cách gọi chung.","c":"Kỹ thuật sản xuất chỉ là một mặt của lực lượng sản xuất.","d":"Khoa học kỹ thuật là yếu tố tác động đến lực lượng sản xuất."}},{"s":8,"n":"43","q":"Tính chất xã hội của lực lượng sản xuất được bắt đầu từ:","o":["Xã hội tư bản chủ nghĩa","Xã hội xã hội chủ nghĩa","Xã hội phong kiến","Xã hội chiếm hữu nô lệ."],"a":[0],"p":64,"e":"Tính chất xã hội của lực lượng sản xuất bắt đầu từ xã hội tư bản chủ nghĩa, khi đại công nghiệp cơ khí đòi hỏi lao động tập thể, xã hội hóa cao.","w":{"b":"Xã hội chủ nghĩa phát triển cao hơn tính xã hội.","c":"Phong kiến sản xuất nhỏ, cá thể.","d":"Chiếm hữu nô lệ sản xuất thủ công."}},{"s":8,"n":"44","q":"Quy luật xã hội nào giữ vai trò quyết định đối với sự vận động, phát triển của xã hội?","o":["Quy luật về sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất.","Quy luật tồn tại xã hội quyết định ý thức xã hội","Quy luật cơ sở hạ tầng quyết định kiến trúc thượng tầng","Quy luật đấu tranh giai cấp"],"a":[0],"p":64,"e":"Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất giữ vai trò quyết định đối với sự vận động, phát triển của xã hội.","w":{"b":"Quy luật tồn tại xã hội quyết định ý thức xã hội chỉ quyết định lĩnh vực tinh thần.","c":"Quy luật cơ sở hạ tầng quyết định kiến trúc thượng tầng thuộc cấp độ thứ hai.","d":"Đấu tranh giai cấp là hệ quả của mâu thuẫn trên."}},{"s":8,"n":"45","q":"Trong sự nghiệp xây dựng CNXH ở nước ta, chúng ta cần phải tiến hành:","o":["Phát triển lực lượng sản xuất đạt trình độ tiên tiến để tạo cơ sở cho việc xây dựng quan hệ sản xuất mới.","Chủ động xây dựng quan hệ sản xuất mới để tạo cơ sở thúc đẩy lực lượng sản xuất phát triển","Kết hợp đồng thời phát triển lực lượng sản xuất với từng bước xây dựng quan hệ sản xuất mới phù hợp.","Củng cố xây dựng kiến trúc thượng tầng mới cho phù hợp với cơ sở hạ tầng"],"a":[2],"p":65,"e":"Xây dựng chủ nghĩa xã hội ở nước ta cần kết hợp đồng thời phát triển lực lượng sản xuất với từng bước xây dựng quan hệ sản xuất mới phù hợp.","w":{"a":"Chỉ phát triển lực lượng sản xuất trước là một chiều.","b":"Chỉ xây quan hệ sản xuất trước là chủ quan, duy ý chí.","d":"Củng cố kiến trúc thượng tầng mới là một nhiệm vụ khác."}},{"s":8,"n":"46","q":"Thực chất của quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng:","o":["Quan hệ giữa đời sống vật chất và đời sống tinh thần của xã hội","Quan hệ giữa kinh tế và chính trị","Quan hệ giữa vật chất và tinh thần.","Quan hệ giữa tồn tại xã hội với ý thức xã hội"],"a":[1],"p":65,"e":"Thực chất quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng là quan hệ giữa kinh tế và chính trị: cơ sở hạ tầng là toàn bộ quan hệ sản xuất, kiến trúc thượng tầng gồm chính trị, pháp quyền và các thiết chế tương ứng.","w":{"a":"Đời sống vật chất và đời sống tinh thần là cách nói rộng hơn.","c":"Vật chất và tinh thần là cặp phạm trù của vấn đề cơ bản của triết học.","d":"Tồn tại xã hội và ý thức xã hội là một cặp quan hệ khác, rộng hơn."}},{"s":8,"n":"47","q":"Phạm trù hình thái kinh tế – xã hội là phạm trù được áp dụng:","o":["Cho mọi xã hội trong lịch sử","Cho một xã hội cụ thể","Cho xã hội tư bản chủ nghĩa","Cho xã hội cộng sản chủ nghĩa"],"a":[0],"p":65,"e":"Hình thái kinh tế - xã hội là phạm trù dùng cho mọi xã hội trong lịch sử. Mỗi xã hội cụ thể là một hình thái cụ thể thuộc phạm trù đó.","w":{"b":"Chỉ áp dụng cho một xã hội cụ thể là thu hẹp phạm trù.","c":"Tư bản chủ nghĩa chỉ là một hình thái.","d":"Cộng sản chủ nghĩa cũng chỉ là một hình thái."}},{"s":8,"n":"48","q":"C.Mác viết: “Tôi coi sự phát triển của những hình thái kinh tế – xã hội là một quá trình lịch sử – tự nhiên”, theo nghĩa:","o":["Sự phát triển của các hình thái kinh tế – xã hội cũng giống như sự phát triển của tự nhiên không phụ thuộc chủ quan của con người.","Sự phát triển của các hình thái kinh tế – xã hội tuân theo quy luật khách quan của xã hội.","Sự phát triển của các hình thái kinh tế – xã hội ngoài tuân theo các quy luật chung còn bị chi phối bởi điều kiện lịch sử cụ thể của mỗi quốc gia dân tộc.","Sự phát triển của các hình thái kinh tế – xã hội tuân theo các quy luật chung."],"a":[0,1,2],"p":65,"e":"Câu của C.Mác nói các hình thái kinh tế - xã hội phát triển theo quy luật khách quan như tự nhiên (a, b). Con đường cụ thể của mỗi nước còn chịu chi phối của điều kiện lịch sử riêng (c).","w":{"a":"Phát triển như tự nhiên, không phụ thuộc ý muốn chủ quan.","b":"Tuân theo quy luật khách quan của xã hội.","c":"Ngoài quy luật chung còn có điều kiện lịch sử cụ thể của từng quốc gia, dân tộc.","d":"Chỉ nói quy luật chung là thiếu yếu tố đặc thù của từng nước."}},{"s":8,"n":"49","q":"Chủ trương thực hiện nhất quán cơ cấu kinh tế nhiều thành phần ở nước ta hiện nay là:","o":["Sự vận dụng đúng đắn quy luật về sự phù hợp của quan hệ sản xuất với trình độ của lực lượng sản xuất.","Nhằm đáp ứng yêu cầu hội nhập kinh tế thế giới","Nhằm thúc đẩy sự phát triển kinh tế","Nhằm phát triển quan hệ sản xuất"],"a":[0,2],"p":65,"e":"Cơ cấu kinh tế nhiều thành phần là sự vận dụng đúng quy luật quan hệ sản xuất phải phù hợp với trình độ lực lượng sản xuất, đồng thời thúc đẩy kinh tế phát triển. Trình độ lực lượng sản xuất ở nước ta còn nhiều tầng bậc nên cần nhiều hình thức sở hữu.","w":{"a":"Vận dụng quy luật quan hệ sản xuất phù hợp với lực lượng sản xuất.","c":"Thúc đẩy kinh tế phát triển.","b":"Hội nhập là yêu cầu khác, không làm căn cứ cho cơ cấu nhiều thành phần.","d":"Mục đích cuối cùng là phát triển lực lượng sản xuất, quan hệ sản xuất chỉ là hình thức cho nó."}},{"s":8,"n":"50","q":"Cấu trúc của một hình thái kinh tế – xã hội gồm các yếu tố cơ bản hợp thành:","o":["Lĩnh vực vật chất và lĩnh vực tinh thần","Cơ sở hạ tầng và kiến trúc thượng tầng","Quan hệ sản xuất, lực lượng sản xuất và kiến trúc thượng tầng","Quan hệ sản xuất, cơ sở hạ tầng và kiến trúc thượng tầng"],"a":[2],"p":66,"e":"Hình thái kinh tế - xã hội gồm ba yếu tố cơ bản: lực lượng sản xuất, quan hệ sản xuất và kiến trúc thượng tầng.","w":{"a":"Vật chất và tinh thần là cách chia khác, không phải cấu trúc của hình thái.","b":"Cơ sở hạ tầng và kiến trúc thượng tầng thiếu lực lượng sản xuất.","d":"Cơ sở hạ tầng chính là tổng hợp các quan hệ sản xuất, nên nêu cả hai là trùng lặp và vẫn thiếu lực lượng sản xuất."}},{"s":8,"n":"51","q":"Tiến lên chủ nghĩa xã hội ở nước ta hiện nay là:","o":["Trái với tiến trình lịch sử tự nhiên","Phù hợp với quá trình lịch sử tự nhiên","Vận dụng sáng tạo của Đảng ta","Không phù hợp với quy luật khách quan"],"a":[1,2],"p":66,"e":"Đảng ta chủ trương đi lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa. Điều đó phù hợp với quá trình lịch sử - tự nhiên và là sự vận dụng sáng tạo của Đảng. Hai phương án b và c đều đúng.","w":{"b":"Phù hợp với quá trình lịch sử - tự nhiên.","c":"Vận dụng sáng tạo của Đảng ta.","a":"Nói trái với tiến trình lịch sử tự nhiên là sai.","d":"Nói không phù hợp với quy luật khách quan là sai."}},{"s":8,"n":"52","q":"Luận điểm: “Tôi coi sự phát triển của các hình thái kinh tế – xã hội là một quá trình lịch sử – tự nhiên” được C.Mác nêu trong tác phẩm nào?","o":["Tư bản","Hệ tư tưởng Đức","Lời nói đầu góp phần phê phán khoa kinh tế chính trị","Tuyên ngôn Đảng cộng sản"],"a":[0],"p":66,"e":"Câu này nằm trong lời tựa cho lần xuất bản thứ nhất bộ Tư bản của C.Mác.","w":{"b":"Hệ tư tưởng Đức trình bày quan niệm duy vật về lịch sử nhưng không chứa câu này.","c":"\"Lời nói đầu\" (1859) có công thức nổi tiếng về hình thái kinh tế - xã hội nhưng câu này ở nơi khác.","d":"Tuyên ngôn nêu vấn đề đấu tranh giai cấp."}},{"s":8,"n":"53","q":"Câu nói sau của V.I.Lênin là trong tác phẩm nào: “Chỉ có đem qui những quan hệ xã hội vào những quan hệ sản xuất và đem quy những quan hệ sản xuất vào trình độ của những lực lượng sản xuất thì người ta mới có được cơ sở vững chắc để quan niệm sự phát triển của những hình thái kinh tế – xã hội là một quá trình lịch sử – tự nhiên”.","o":["Nhà nước và cách mạng","Chủ nghĩa tư bản ở Nga","Những người bạn dân là thế nào và họ đấu tranh chống những người dân chủ xã hội ra sao.","Làm gì?"],"a":[2],"p":66,"e":"Câu này V.I.Lênin viết trong \"Những người bạn dân là thế nào và họ đấu tranh chống những người dân chủ - xã hội ra sao\" (1894), khi bảo vệ quan niệm duy vật về lịch sử.","w":{"a":"\"Nhà nước và cách mạng\" (1917) bàn về nhà nước.","b":"\"Sự phát triển của chủ nghĩa tư bản ở Nga\" (1899) nghiên cứu kinh tế Nga.","d":"\"Làm gì?\" (1902) bàn về xây dựng đảng."}},{"s":8,"n":"54","q":"Quan hệ sản xuất bao gồm:","o":["Quan hệ giữa con người với tự nhiên và con người với con người","Quan hệ giữa con người với con người trong quá trình sản xuất, lưu thông, tiêu dùng hàng hoá","Các quan hệ giữa người với người trong quá trình sản xuất","Quan hệ giữa người với người trong đời sống xã hội"],"a":[2],"p":66,"e":"Quan hệ sản xuất là các quan hệ giữa người với người trong quá trình sản xuất, gồm quan hệ sở hữu, quan hệ tổ chức quản lý và quan hệ phân phối.","w":{"a":"Quan hệ giữa người với tự nhiên thuộc lực lượng sản xuất.","b":"Liệt kê lưu thông, tiêu dùng hàng hóa là gắn với kinh tế hàng hóa, hẹp hơn khái niệm chung.","d":"Quan hệ giữa người với người trong đời sống xã hội gồm cả quan hệ chính trị, tư tưởng, rộng hơn."}},{"s":8,"n":"55","q":"Cách viết nào sau đây là đúng:","o":["Hình thái kinh tế – xã hội","Hình thái kinh tế của xã hội","Hình thái xã hội","Hình thái kinh tế, xã hội"],"a":[0],"p":66,"e":"\"Hình thái kinh tế - xã hội\" là một phạm trù thống nhất, hai mặt kinh tế và xã hội gắn liền nhau.","w":{"b":"Chỉ nói mặt kinh tế.","c":"Chỉ nói mặt xã hội.","d":"Dấu phẩy tách hai khái niệm rời nhau."}},{"s":8,"n":"56","q":"Cơ sở hạ tầng của xã hội là:","o":["Đường xá, cầu tàu, bến cảng, bưu điện…","Tổng hợp các quan hệ sản xuất hợp thành cơ cấu kinh tế của xã hội","Toàn bộ cơ sở vật chất – kỹ thuật của xã hội","Đời sống vật chất"],"a":[1],"p":66,"e":"Cơ sở hạ tầng là tổng hợp các quan hệ sản xuất hợp thành cơ cấu kinh tế của một xã hội nhất định.","w":{"a":"Đường xá, cầu tàu, bến cảng là cơ sở vật chất kỹ thuật.","c":"Cơ sở vật chất kỹ thuật gắn với lực lượng sản xuất.","d":"Đời sống vật chất là tồn tại xã hội, rộng hơn."}},{"s":8,"n":"57","q":"Kiến trúc thượng tầng của xã hội bao gồm:","o":["Toàn bộ các quan hệ xã hội","Toàn bộ các tư tưởng xã hội và các tổ chức tương ứng","Toàn bộ những quan điểm chính trị, pháp quyền,… và những thiết chế xã hội tương ứng như nhà nước, đảng phái chính trị, … được hình thành trên cơ sở hạ tầng nhất định.","Toàn bộ ý thức xã hội"],"a":[2],"p":67,"e":"Kiến trúc thượng tầng gồm những quan điểm chính trị, pháp quyền, đạo đức, tôn giáo, nghệ thuật cùng các thiết chế tương ứng như nhà nước, đảng phái. Nó hình thành trên một cơ sở hạ tầng nhất định.","w":{"a":"Toàn bộ quan hệ xã hội gồm cả quan hệ sản xuất, thuộc cơ sở hạ tầng.","b":"Thiếu mối gắn với cơ sở hạ tầng nhất định.","d":"Ý thức xã hội gồm cả hình thái không thuộc kiến trúc thượng tầng, như khoa học tự nhiên."}},{"s":8,"n":"58","q":"Xét đến cùng, nhân tố có ý nghĩa quyết định sự thắng lợi của một trật tự xã hội mới là:","o":["Năng suất lao động","Sức mạnh của luật pháp","Hiệu quả hoạt động của hệ thống chính trị","Sự điều hành và quản lý xã hội của Nhà nước"],"a":[0],"p":67,"e":"Theo V.I.Lênin, xét đến cùng năng suất lao động là cái quan trọng nhất, chủ yếu nhất cho thắng lợi của trật tự xã hội mới (Sáng kiến vĩ đại, 1919).","w":{"b":"Luật pháp thuộc kiến trúc thượng tầng.","c":"Hệ thống chính trị thuộc kiến trúc thượng tầng.","d":"Quản lý của nhà nước cũng thuộc kiến trúc thượng tầng, tác động trở lại nhưng không quyết định."}},{"s":8,"n":"59","q":"Trong 3 đặc trưng của giai cấp thì đặc trưng nào giữ vai trò chi phối các đặc trưng khác:","o":["Tập đoàn này có thể chiếm đoạt lao động của tập đoàn khác","Khác nhau về quan hệ sở hữu tư liệu sản xuất xã hội","Khác nhau về vai trò trong tổ chức lao động xã hội","Khác nhau về địa vị trong hệ thống tổ chức xã hội"],"a":[1],"p":67,"e":"Trong các đặc trưng của giai cấp, quan hệ với tư liệu sản xuất giữ vai trò chi phối, vì nó quyết định vai trò trong tổ chức lao động và cách thức, quy mô thu nhập.","w":{"a":"Chiếm đoạt lao động của người khác là hệ quả của khác biệt về sở hữu.","c":"Vai trò trong tổ chức lao động chịu sự quy định của quan hệ sở hữu.","d":"Địa vị trong hệ thống tổ chức xã hội cũng phụ thuộc quan hệ sở hữu."}},{"s":8,"n":"60","q":"Sự phân chia giai cấp trong xã hội bắt đầu từ hình thái kinh tế – xã hội nào?","o":["Cộng sản nguyên thuỷ","Chiếm hữu nô lệ","Phong kiến.","Tư bản chủ nghĩa"],"a":[1],"p":67,"e":"Giai cấp xuất hiện khi chế độ tư hữu về tư liệu sản xuất ra đời và có sản phẩm thặng dư. Hình thái đầu tiên có giai cấp là chiếm hữu nô lệ.","w":{"a":"Cộng sản nguyên thủy chưa có tư hữu, chưa có giai cấp.","c":"Phong kiến là hình thái có giai cấp sau chiếm hữu nô lệ.","d":"Tư bản chủ nghĩa ra đời sau cả hai hình thái trên."}},{"s":9,"n":"1","q":"Theo quan điểm của chủ nghĩa duy vật lịch sử, trong hai mặt của phương thức sản xuất thì lực lượng sản xuất là gì?","o":["Hình thức của quá trình sản xuất","Hình thức của quan hệ xã hội","Nội dung vật chất của quá trình sản xuất","Nội dung của quan hệ xã hội"],"a":[2],"p":68,"e":"Phương thức sản xuất có hai mặt: lực lượng sản xuất là nội dung vật chất, kỹ thuật của quá trình sản xuất, quan hệ sản xuất là hình thức xã hội của nó.","w":{"a":"Hình thức của quá trình sản xuất là quan hệ sản xuất.","b":"Hình thức của quan hệ xã hội không phải cách xác định lực lượng sản xuất.","d":"Nội dung của quan hệ xã hội cũng không phải."}},{"s":9,"n":"2","q":"Theo quan điểm của chủ nghĩa duy vật lịch sử, cách thức sản xuất ra của cải vật chất của con người ở những giai đoạn lịch sử nhất định, được gọi là gì?","o":["Lực lượng sản xuất","Cơ sở hạ tầng","Phương thức sản xuất","Hạ tầng kinh tế"],"a":[2],"p":68,"e":"Cách thức con người sản xuất ra của cải vật chất ở một giai đoạn lịch sử nhất định gọi là phương thức sản xuất, gồm lực lượng sản xuất và quan hệ sản xuất.","w":{"a":"Lực lượng sản xuất chỉ là một mặt của phương thức sản xuất.","b":"Cơ sở hạ tầng là tổng hợp quan hệ sản xuất.","d":"Hạ tầng kinh tế là cách gọi khác của cơ sở hạ tầng."}},{"s":9,"n":"3","q":"Bộ máy nhà nước, hệ thống chính trị của một quốc gia thuộc nội dung nào sau đây?","o":["Chế độ chính trị","Lực lượng sản xuất","Kiến trúc thượng tầng","Hệ tư tưởng"],"a":[2],"p":68,"e":"Bộ máy nhà nước và hệ thống chính trị là bộ phận quan trọng của kiến trúc thượng tầng.","w":{"a":"Chế độ chính trị là cách gọi chung, không phải tên một yếu tố cấu trúc.","b":"Lực lượng sản xuất thuộc mặt kinh tế.","d":"Hệ tư tưởng là một bộ phận khác của kiến trúc thượng tầng."}},{"s":9,"n":"4","q":"Nội dung nào sau đây không đúng khi nói về ý thức xã hội?","o":["Ý thức xã hội bao gồm hai cấp độ: tâm lý xã hội và hệ tư tưởng","Ý thức xã hội có tính độc lập tương đối so với tồn tại xã hội","Ý thức xã hội thường lạc hậu hơn so với tồn tại xã hội","Ý thức xã hội quyết định sự văn minh của xã hội"],"a":[3],"p":68,"e":"Tồn tại xã hội quyết định ý thức xã hội. Ý thức xã hội phản ánh sự văn minh của xã hội, không quyết định nó. Sự văn minh dựa vào phương thức sản xuất.","w":{"a":"Hai cấp độ tâm lý xã hội và hệ tư tưởng là nội dung đúng.","b":"Tính độc lập tương đối là nội dung đúng.","c":"Ý thức xã hội thường lạc hậu hơn tồn tại xã hội là nội dung đúng."}},{"s":9,"n":"5","q":"Yếu tố nào giữ vai trò quyết định trong lực lượng sản xuất?","o":["Công cụ lao động","Người lao động","Phương tiện lao động","Đối tượng lao động"],"a":[1],"p":68,"e":"Người lao động là chủ thể của sản xuất, giữ vai trò quyết định trong lực lượng sản xuất, vì công cụ do con người tạo ra và sử dụng.","w":{"a":"Công cụ lao động là yếu tố động nhất, cách mạng nhất.","c":"Phương tiện lao động chỉ là một bộ phận của tư liệu sản xuất.","d":"Đối tượng lao động là yếu tố bị tác động."}},{"s":9,"n":"6","q":"Mối quan hệ giữa lực lượng sản xuất và quan hệ sản xuất là mối quan hệ như thế nào?","o":["Lực lượng sản xuất chi phối quan hệ sản xuất","Quan hệ sản xuất tác động trở lại lực lượng sản xuất ở những mức độ nhất định","Mối quan hệ thống nhất, biện chứng","Lực lượng sản xuất đóng vai trò quan trọng"],"a":[2],"p":68,"e":"Lực lượng sản xuất quyết định quan hệ sản xuất, quan hệ sản xuất tác động trở lại, hai mặt gắn bó thành thể thống nhất biện chứng.","w":{"a":"Chỉ nêu mặt lực lượng sản xuất quyết định.","b":"Chỉ nêu mặt tác động trở lại.","d":"Nói lực lượng sản xuất quan trọng chưa nêu được quan hệ giữa hai mặt."}},{"s":9,"n":"7","q":"Trường hợp nào dưới đây sẽ dẫn đến kìm hãm sự phát triển của lực lượng sản xuất?","o":["Quan hệ sản xuất lạc hậu hơn lực lượng sản xuất","Lực lượng sản xuất quyết định quan hệ sản xuất","Quan hệ sản xuất thống nhất với lực lượng sản xuất","Không có trường hợp nào"],"a":[0],"p":68,"e":"Quan hệ sản xuất lạc hậu so với lực lượng sản xuất thì kìm hãm lực lượng sản xuất phát triển.","w":{"b":"Đây là vai trò quyết định, không bàn về kìm hãm.","c":"Khi hai mặt thống nhất, quan hệ sản xuất thúc đẩy lực lượng sản xuất.","d":"Có trường hợp kìm hãm, như lạc hậu hoặc đi trước quá xa."}},{"s":9,"n":"8","q":"Trong “Luận cương về Feubach”, Mác khẳng định bản chất con người là tổng hòa những yếu tố nào?","o":["Những quan hệ sản xuất","Những quan hệ xã hội","Những quan hệ giao tiếp","Những quan hệ giai cấp"],"a":[1],"p":69,"e":"Theo Luận cương về Phoi-ơ-bắc, bản chất con người trong tính hiện thực của nó là tổng hòa những quan hệ xã hội.","w":{"a":"Quan hệ sản xuất chỉ là một bộ phận của quan hệ xã hội.","c":"Quan hệ giao tiếp cũng chỉ là một bộ phận.","d":"Quan hệ giai cấp cũng chỉ là một bộ phận."}},{"s":9,"n":"9","q":"Nhân tố bảo đảm cho sự thắng lợi cuối cùng của một chế độ xã hội là?","o":["Nền khoa học tiên tiến","Năng suất lao động tạo ra ngày càng nhiều","Sức mạnh đoàn kết","Giai cấp thống trị tiến bộ"],"a":[1],"p":69,"e":"Theo V.I.Lênin, năng suất lao động cao hơn chế độ cũ là điều quyết định cho thắng lợi cuối cùng của chế độ xã hội mới.","w":{"a":"Khoa học tiên tiến góp phần tạo ra năng suất lao động.","c":"Sức mạnh đoàn kết là điều kiện hỗ trợ.","d":"Giai cấp thống trị tiến bộ là yếu tố chính trị."}},{"s":9,"n":"10","q":"Nhận định nào sau đây là đúng về sự tác động trở lại của quan hệ sản xuất đối với lực lượng sản xuất?","o":["Luôn luôn diễn ra theo chiều hướng phù hợp","Luôn luôn diễn ra theo chiều hướng không phù hợp","Có thể diễn ra theo chiều hướng phù hợp hoặc không phù hợp","Không phù hợp là cơ bản, còn đôi khi theo chiều hướng phù hợp"],"a":[2],"p":69,"e":"Quan hệ sản xuất tác động trở lại lực lượng sản xuất theo hai hướng: phù hợp thì thúc đẩy, không phù hợp thì kìm hãm.","w":{"a":"Chỉ nêu hướng phù hợp.","b":"Chỉ nêu hướng không phù hợp.","d":"Cho không phù hợp là cơ bản là sai."}},{"s":9,"n":"11","q":"Theo chủ nghĩa duy vật lịch sử, lực lượng sản xuất biểu hiện mối quan hệ giữa con người với yếu tố nào?","o":["Các nhân tố vật chất với công nghệ kỹ thuật của quá trình sản xuất","Con người với tự nhiên","Con người với con người trong quá trình sản xuất","Người lao động và năng lực lao động của họ"],"a":[1],"p":69,"e":"Lực lượng sản xuất biểu hiện quan hệ giữa con người với tự nhiên trong quá trình sản xuất, quan hệ sản xuất biểu hiện quan hệ giữa người với người.","w":{"a":"Nhân tố vật chất với công nghệ kỹ thuật là các yếu tố bên trong lực lượng sản xuất.","c":"Quan hệ người với người là quan hệ sản xuất.","d":"Người lao động và năng lực lao động chỉ nêu một yếu tố."}},{"s":9,"n":"12","q":"Theo quan điểm của triết học Mác-lênin, khái niệm nào dùng để chỉ toàn bộ sinh hoạt vật chất và những điều kiện sinh hoạt vật chất của xã hội?","o":["Hình thái kinh tế - xã hội","Tồn tại xã hội","Phương thức sản xuất","Quan hệ sản xuất"],"a":[1],"p":69,"e":"Tồn tại xã hội là toàn bộ sinh hoạt vật chất và điều kiện sinh hoạt vật chất của xã hội.","w":{"a":"Hình thái kinh tế - xã hội là xã hội ở một nấc thang lịch sử nhất định.","c":"Phương thức sản xuất là một yếu tố của tồn tại xã hội.","d":"Quan hệ sản xuất là một mặt của phương thức sản xuất."}},{"s":9,"n":"13","q":"Yếu tố nào thuộc kiến trúc thựơng tầng có sự tác động trở lại mạnh mẽ nhất đối với cơ sở hạ tầng?","o":["Triết học và khoa học","Chính trị và pháp quyền","Đạo đức và nghệ thuật","Ý thức xã hội"],"a":[1],"p":69,"e":"Chính trị và pháp quyền gắn trực tiếp với kinh tế, nhà nước là công cụ quyền lực nên tác động trở lại cơ sở hạ tầng mạnh nhất.","w":{"a":"Triết học và khoa học ở xa kinh tế hơn.","c":"Đạo đức và nghệ thuật cũng xa kinh tế hơn.","d":"Ý thức xã hội là khái niệm chung."}},{"s":9,"n":"14","q":"Trong tồn tại xã hội, yếu tố nào là quan trọng và quyết định nhất?","o":["Điều kiện tự nhiên, hoàn cảnh địa lý","Dân số và mật độ dân số","Nhà nước thống trị","Phương thức sản xuất"],"a":[3],"p":69,"e":"Phương thức sản xuất là yếu tố quan trọng và quyết định nhất trong tồn tại xã hội.","w":{"a":"Điều kiện tự nhiên, địa lý là điều kiện thường xuyên cần thiết.","b":"Dân số và mật độ dân số cũng chỉ là điều kiện.","c":"Nhà nước thuộc kiến trúc thượng tầng."}},{"s":9,"n":"15","q":"Theo quan điểm của chủ nghĩa duy vật lịch sử, ý thức xã hội là gì?","o":["Toàn bộ phương diện sinh hoạt tinh thần của xã hội, bao gồm những quan điểm, những tư tưởng xã hội, những điều kiện sinh hoạt chính trị xã hội","Toàn bộ phương diện sinh hoạt tinh thần của xã hội nảy sinh từ tồn tại xã hội và phản ánh tồn tại xã hội trong những giai đoạn phát triển nhất định","Toàn bộ phương diện sinh hoạt tinh thần của xã hội, bao gồm những quan điểm, những tư tưởng cùng những tình cảm những tâm trạng và quá trình sinh hoạt chính trị…nảy sinh từ tồn tại xã hội và phản ánh tồn tại xã hội ấy","Toàn bộ phương diện sinh hoạt tinh thần của đời sống bao gồm những quan điểm, những tư tưởng cùng những tình cảm, tâm trạng của con người và những biểu hiện như ăn, mặc, ở của con người"],"a":[1],"p":70,"e":"Ý thức xã hội là toàn bộ phương diện sinh hoạt tinh thần của xã hội, nảy sinh từ tồn tại xã hội và phản ánh tồn tại xã hội ở từng giai đoạn phát triển nhất định.","w":{"a":"Điều kiện sinh hoạt chính trị xã hội thuộc tồn tại xã hội.","c":"Quá trình sinh hoạt chính trị là hoạt động thuộc tồn tại xã hội.","d":"Ăn, mặc, ở là sinh hoạt vật chất."}},{"s":9,"n":"16","q":"Ý thức xã hội là sự phản ánh yếu tố nào sau đây?","o":["Giới tự nhiên, xã hội và tư duy","Những tâm tư, nguyện vọng, tình cảm thói quen của xã hội","Tồn tại xã hội","Hoạt động sản xuất vật chất"],"a":[2],"p":70,"e":"Ý thức xã hội phản ánh tồn tại xã hội.","w":{"a":"Giới tự nhiên, xã hội và tư duy là nội dung quá rộng.","b":"Tâm tư, nguyện vọng, tình cảm chỉ là một phần của ý thức xã hội.","d":"Hoạt động sản xuất vật chất là một bộ phận của tồn tại xã hội."}},{"s":9,"n":"17","q":"Nhận định nào sau là đúng về mối quan hệ giữa ý thức xã hội và ý thức cá nhân?","o":["Ý thức cá nhân tồn tại độc lập với ý thức xã hội","Ý thức xã hội là cái quyết định và tạo thành ý thức cá nhân","Ý thức xã hội là tổng số những ý thức cá nhân","Mối quan hệ giữa ý thức cá nhân với ý thức xã hội là mối quan hệ giữa cái riêng và cái chung"],"a":[3],"p":70,"e":"Ý thức cá nhân là cái riêng, ý thức xã hội là cái chung, hai bên liên hệ như cái riêng với cái chung.","w":{"a":"Ý thức cá nhân tồn tại trong ý thức xã hội.","b":"Hai bên tác động qua lại, ý thức xã hội không \"tạo thành\" ý thức cá nhân.","c":"Ý thức xã hội là cái chung, không bằng phép cộng các ý thức cá nhân."}},{"s":9,"n":"18","q":"Xét theo trình độ phản ánh thì kết cấu của ý thức xã hội bao gồm các yếu tố nào?","o":["Ý thức cá nhân, ý thức xã hội","Ý thức xã hội thông thường và ý thức lý luận","Hệ thống các chính sách chủ trương của nhà nước về văn hoá tư tưởng","Ý thức chính trị, ý thức pháp quyền, ý thức triết học"],"a":[1],"p":70,"e":"Xét theo trình độ phản ánh, ý thức xã hội gồm ý thức xã hội thông thường và ý thức lý luận.","w":{"a":"Ý thức cá nhân và ý thức xã hội là cặp khác.","c":"Chính sách của nhà nước không phải kết cấu của ý thức xã hội.","d":"Ý thức chính trị, pháp quyền, triết học là các hình thái của ý thức xã hội."}},{"s":9,"n":"19","q":"Theo Mác, các nền kinh tế căn bản được phân biệt với nhau bởi yếu tố nào?","o":["Phương thức sản xuất ra của cải vật chất","Mục đích của quá trình sản xuất ra của cải vật chất","Mục đích tự nhiên của quá trình sản xuất ra của cải vật chất","Mục đích xã hội của quá trình sản xuất ra của cải vật chất"],"a":[0],"p":70,"e":"Theo C.Mác, các thời đại kinh tế khác nhau ở cách sản xuất ra của cải vật chất, tức phương thức sản xuất, nhất là tư liệu lao động.","w":{"b":"Mục đích của quá trình sản xuất không phân biệt các nền kinh tế căn bản.","c":"Mục đích tự nhiên cũng không phân biệt.","d":"Mục đích xã hội cũng không phân biệt."}},{"s":9,"n":"20","q":"Theo triết học Mác-Lênin, trong xã hội có phân chia giai cấp thì hệ tư tưởng chủ đạo do hệ tư tưởng của giai cấp nào quy định?","o":["Giai cấp bị trị","Giai cấp thống trị","Tầng lớp trí thức trong xã hội","Giai cấp thống trị và bị trị"],"a":[1],"p":70,"e":"Trong xã hội có giai cấp, giai cấp thống trị về vật chất cũng thống trị về tinh thần, nên tư tưởng chủ đạo là tư tưởng của giai cấp thống trị.","w":{"a":"Giai cấp bị trị không giữ vai trò chủ đạo.","c":"Tầng lớp trí thức không phải giai cấp.","d":"Cả hai giai cấp cùng quy định là sai."}},{"s":9,"n":"21","q":"Theo quan niệm của triết học Mác-lênin, yếu tố chủ yếu nào để vượn chuyển biến thành người?","o":["Quá trình đấu tranh sinh tồn và chọn lọc tự nhiên","Quá trình nhận thức hiện thực khách quan","Quá trình lao động sản xuất vật chất","Quá trình tập hợp để bảo vệ lãnh thổ"],"a":[2],"p":71,"e":"Lao động sản xuất vật chất là yếu tố chủ yếu giúp vượn chuyển biến thành người (Ph.Ăngghen).","w":{"a":"Đấu tranh sinh tồn và chọn lọc tự nhiên là quan điểm sinh học.","b":"Nhận thức xuất hiện sau, nhờ lao động.","d":"Bảo vệ lãnh thổ không phải nguyên nhân chủ yếu."}},{"s":9,"n":"22","q":"Theo quan điểm của triết học Mác-Lênin, cơ sở nào tạo nên mối liên kết giữa cá nhân và tập thể?","o":["Cơ sở tự nhiên","Lợi ích","Tình cảm","Cơ sở tình cảm"],"a":[1],"p":71,"e":"Lợi ích là cơ sở nối kết cá nhân với tập thể.","w":{"a":"Cơ sở tự nhiên không phải cơ sở của liên kết xã hội.","c":"Tình cảm là yếu tố hỗ trợ.","d":"Phương án này lặp lại phương án c."}},{"s":12,"n":"178","q":"Đường lối, quan điểm của đảng và nhà nước thuộc phạm trù nào?","o":["Cơ sở hạ tầng","Lực lượng sản xuất","Kiến trúc thượng tầng","Quan hệ sản xuất"],"a":[2],"p":71,"g":9,"e":"Đường lối, quan điểm của Đảng và Nhà nước là những quan điểm chính trị, thuộc kiến trúc thượng tầng.","w":{"a":"Cơ sở hạ tầng là tổng hợp các quan hệ sản xuất.","b":"Lực lượng sản xuất là mặt kỹ thuật của sản xuất.","d":"Quan hệ sản xuất là cơ sở hạ tầng."}},{"s":9,"n":"23","q":"Ý thức xã hội bao gồm những cấp độ nào?","o":["Tâm lý xã hội và hệ tư tưởng","Tình cảm xã hội và ý thức xã hội","Nhận thức thông thường và nhận thức lý luận","Nhận thức kinh nghiệm và nhận thức khoa học"],"a":[0],"p":71,"e":"Ý thức xã hội có hai cấp độ: tâm lý xã hội và hệ tư tưởng.","w":{"b":"Tình cảm xã hội không phải cấp độ.","c":"Nhận thức thông thường và lý luận là cách phân chia theo trình độ phản ánh.","d":"Nhận thức kinh nghiệm và khoa học là các mức nhận thức."}},{"s":9,"n":"24","q":"Theo Mác, yếu tố đầu tiên đảm bảo cho sự tồn tại của con người là gì?","o":["Làm khoa học","Sản xuất ra chính bản thân con người","Lao động sản xuất của cải vật chất","Làm chính trị"],"a":[2],"p":71,"e":"Theo C.Mác, con người phải ăn, ở, mặc trước khi làm chính trị, khoa học. Vì vậy lao động sản xuất của cải vật chất là điều kiện đầu tiên bảo đảm sự tồn tại.","w":{"a":"Làm khoa học đến sau.","b":"Sản xuất ra bản thân con người đứng sau sản xuất vật chất.","d":"Làm chính trị đến sau."}},{"s":9,"n":"25","q":"Cấu trúc của một hình thái kinh tế- xã hội gồm các yếu tố nào hợp thành?","o":["Lực lượng sản xuất, các quan hệ sản xuất và kiến trúc thượng tầng","Lực lượng sản xuất và quan hệ sản xuất, phương thức sản xuất","Quan hệ sản xuất và kiến trúc thượng tầng, tồn tại xã hội","Cơ sở hạ tầng và kiến trúc thượng tầng"],"a":[0],"p":71,"e":"Hình thái kinh tế - xã hội gồm lực lượng sản xuất, quan hệ sản xuất và kiến trúc thượng tầng.","w":{"b":"Phương thức sản xuất là sự thống nhất của hai mặt đầu, không phải yếu tố riêng và thiếu kiến trúc thượng tầng.","c":"Tồn tại xã hội không nằm trong cấu trúc của hình thái.","d":"Thiếu lực lượng sản xuất."}},{"s":9,"n":"26","q":"Trong xã hội có giai cấp, ý thức xã hội có mang tính giai cấp hay không?","o":["Có","Không","Vừa có vừa không tùy thời điểm lịch sử","Không thể xác định vì các giai cấp có quan niệm khác nhau về các giá trị"],"a":[0],"p":71,"e":"Trong xã hội có giai cấp, ý thức xã hội mang tính giai cấp, vì mỗi giai cấp có lợi ích và địa vị khác nhau.","w":{"b":"Phủ nhận tính giai cấp là sai.","c":"Tính giai cấp tồn tại suốt xã hội có giai cấp.","d":"Có thể xác định, qua lợi ích kinh tế."}},{"s":9,"n":"27","q":"Quan hệ giữa kinh tế và chính trị chính là biểu hiện mối quan hệ nào sau đây?","o":["Quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng","Quan hệ giữa đời sống vật chất và đời sống tinh thần của xã hội","Quan hệ giữa tồn tại xã hội với ý thức xã hội","Quan hệ giữa vật chất và ý thức"],"a":[0],"p":72,"e":"Quan hệ giữa kinh tế và chính trị là biểu hiện của quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng.","w":{"b":"Đời sống vật chất và tinh thần là cách nói rộng hơn.","c":"Tồn tại xã hội và ý thức xã hội là cặp rộng hơn.","d":"Vật chất và ý thức là cặp phạm trù chung nhất."}},{"s":9,"n":"28","q":"Yếu tố nào giữ vai trò quyết định trong sản xuất xã hội?","o":["Sản xuất của cải vật chất","Sản xuất tinh thần","Sản xuất ra bản thân con người","Phát hiện ra công cụ lao động"],"a":[0],"p":72,"e":"Sản xuất của cải vật chất giữ vai trò quyết định, vì nó là cơ sở của sản xuất tinh thần và sản xuất ra bản thân con người.","w":{"b":"Sản xuất tinh thần chịu sự quy định của sản xuất vật chất.","c":"Sản xuất ra con người cũng dựa vào sản xuất vật chất.","d":"Phát hiện công cụ lao động là sự kiện trong lịch sử sản xuất vật chất."}},{"s":9,"n":"29","q":"Sự chuyển biến của xã hội loài người qua các giai đoạn lịch sử khác nhau được quyết định bởi yếu tố nào?","o":["Phương thức sản xuất","Chính trị","Quan hệ sản xuất","Cơ sở hạ tầng"],"a":[0],"p":72,"e":"Phương thức sản xuất quyết định sự chuyển biến của xã hội qua các giai đoạn lịch sử.","w":{"b":"Chính trị thuộc kiến trúc thượng tầng.","c":"Quan hệ sản xuất chỉ là một mặt của phương thức sản xuất.","d":"Cơ sở hạ tầng do phương thức sản xuất quyết định."}},{"s":9,"n":"30","q":"Lịch sử phát triển của xã hội loài người đã và đang trải qua các hình thái kinh tế- xã hội nào?","o":["Công xã nguyên thuỷ, chế độ phong kiến, chiếm hữu nô lệ, tư bản chủ nghĩa và cộng sản chủ nghĩa (giai đoạn thấp của nó là xã hội chủ nghĩa)","Công xã nguyên thuỷ, chiếm hữu nô lệ, chế độ phong kiến, tư bản chủ nghĩa và cộng sản chủ nghĩa (giai đoạn thấp của nó là xã hội chủ nghĩa)","Chiếm hữu nô lệ, chế độ phong kiến, tư bản chủ nghĩa và cộng sản chủ nghĩa (giai đoạn thấp của nó là xã hội chủ nghĩa)","Công xã nguyên thuỷ, chế độ phong kiến, tư bản chủ nghĩa và cộng sản chủ nghĩa (giai đoạn thấp của nó là xã hội chủ nghĩa)"],"a":[1],"p":72,"e":"Năm hình thái kinh tế - xã hội kế tiếp nhau trong lịch sử: công xã nguyên thủy, chiếm hữu nô lệ, phong kiến, tư bản chủ nghĩa và cộng sản chủ nghĩa, giai đoạn thấp của nó là xã hội chủ nghĩa.","w":{"a":"Đảo thứ tự phong kiến và chiếm hữu nô lệ.","c":"Thiếu công xã nguyên thủy.","d":"Thiếu chiếm hữu nô lệ."}},{"s":9,"n":"31","q":"Khi sản xuất được thực hiện với những công cụ ở trình độ thủ công, đơn giản thì lực lượng mang tính chất gì?","o":["Tính xã hội","Cá nhân","Tính quần chúng","Tính lạc hậu"],"a":[1],"p":72,"e":"Công cụ thủ công, đơn giản gắn với sản xuất nhỏ, mỗi người làm riêng nên lực lượng sản xuất mang tính chất cá nhân. Khi có máy móc và đại công nghiệp, lao động mang tính xã hội hóa.","w":{"a":"Tính xã hội xuất hiện cùng đại công nghiệp.","c":"\"Tính quần chúng\" không phải thuật ngữ dùng cho tính chất của lực lượng sản xuất.","d":"\"Lạc hậu\" nói về trình độ, không phải tính chất."}},{"s":9,"n":"32","q":"Đối tượng lao động có các loại nào sau đây?","o":["Đối tượng lao động tự nhiên và đối tượng lao động nhân tạo","Đối tượng lao động có sẵn và đối tượng lao động tự nhiên","Đối tượng lao động hữu hình và đối tượng lao động vô hình","Đối tượng lao động cụ thể và đối tượng lao động trừu tượng"],"a":[0],"p":72,"e":"Đối tượng lao động có hai loại: có sẵn trong tự nhiên (đất, khoáng sản) và nhân tạo, đã qua chế biến (sắt thép, sợi).","w":{"b":"\"Có sẵn\" và \"tự nhiên\" là một loại.","c":"Hữu hình, vô hình không phải cách phân loại của giáo trình.","d":"Cụ thể, trừu tượng cũng không phải cách phân loại của giáo trình."}},{"s":9,"n":"33","q":"Nhận định nào sau đây đúng theo quan điểm của chủ nghĩa Mác?","o":["Tồn tại xã hội có trước, ý thức xã hội có sau, ý thức xã hội quyết định tồn tại xã hội","Tồn tại xã hội có trước, ý thức xã hội có sau, tồn tại xã hội quyết định ý thức xã hội nhưng ý thức xã hội có sự tác động trở lại tồn tại xã hội","Tồn tại xã hội và ý thức xã hội ra đời đồng thời nhưng tồn tại xã hội quyết định ý thức xã hội, ý thức xã hội có sự tác động trở lại tồn tại xã hội","Tồn tại xã hội và ý thức xã hội có vai trò như nhau"],"a":[1],"p":73,"e":"Tồn tại xã hội có trước và quyết định ý thức xã hội. Ý thức xã hội có tính độc lập tương đối nên tác động trở lại tồn tại xã hội.","w":{"a":"Ý thức xã hội không quyết định tồn tại xã hội.","c":"Hai mặt không ra đời đồng thời, tồn tại xã hội có trước.","d":"Hai mặt không có vai trò ngang nhau."}},{"s":9,"n":"34","q":"Yếu tố nào giữ vai trò quyết định trong quan hệ sản xuất?","o":["Quan hệ phân phối sản phẩm lao động","Quan hệ sở hữu tư liệu sản xuất","Quan hệ tổ chức, quản lý và phân công lao động","Quan hệ cạnh tranh"],"a":[1],"p":73,"e":"Quan hệ sở hữu tư liệu sản xuất giữ vai trò quyết định, vì nó quy định quan hệ tổ chức quản lý và quan hệ phân phối.","w":{"a":"Quan hệ phân phối chịu sự quy định của quan hệ sở hữu.","c":"Quan hệ tổ chức quản lý cũng chịu sự quy định của quan hệ sở hữu.","d":"Cạnh tranh không phải một mặt của quan hệ sản xuất."}},{"s":9,"n":"35","q":"Chủ nghĩa Mác quan niệm như thế nào về sự phát triển của các hình thái kinh tế – xã hội?","o":["Sự phát triển của các hình thái kinh tế – xã hội là quá trình lịch sử – tự nhiên","Quá trình lịch sử hướng theo ý chí của giai cấp cầm quyền","Quá trình lịch sử hướng theo ý chí của đảng cầm quyền","Quá trình sản xuất hàng hóa"],"a":[0],"p":73,"e":"Chủ nghĩa Mác coi sự phát triển của các hình thái kinh tế - xã hội là quá trình lịch sử - tự nhiên, theo quy luật khách quan.","w":{"b":"Ý chí của giai cấp cầm quyền không quyết định tiến trình lịch sử.","c":"Ý chí của đảng cầm quyền cũng không quyết định.","d":"Sản xuất hàng hóa chỉ là một giai đoạn của kinh tế."}},{"s":9,"n":"36","q":"Pháp quyền, đạo đức là những yếu tố thuộc phạm trù nào sau đây?","o":["Cơ sở hạ tầng","Quan hệ sản xuất","Kiến trúc thượng tầng","Lực lượng sản xuất"],"a":[2],"p":73,"e":"Pháp quyền và đạo đức là các hình thái ý thức xã hội và thiết chế tương ứng, thuộc kiến trúc thượng tầng.","w":{"a":"Cơ sở hạ tầng là tổng hợp các quan hệ sản xuất.","b":"Quan hệ sản xuất là mặt kinh tế.","d":"Lực lượng sản xuất cũng thuộc mặt kinh tế."}},{"s":9,"n":"37","q":"Nội dung nào sau đây không thể hiện vai trò của sản xuất vật chất đối với sự phát triển của xã hội?","o":["Sản xuất vật chất là cơ sở nảy sinh, hủy diệt nền văn minh nhân loại, xuất hiện khi con người phát minh ra lửa","Sản xuất vật chất là nhân tố quyết định sự sinh tồn phát triển của con người và xã hội","Sản xuất vật chất là hoạt động nền tảng làm phát sinh, phát triển những mối quan hệ xã hội của con người","Sản xuất vật chất là cơ sở hình thành biến đổi và phát triển của xã hội loài người"],"a":[0],"p":73,"e":"Câu a nói sản xuất vật chất là cơ sở \"hủy diệt\" nền văn minh, và gắn nó với việc phát minh ra lửa. Điều đó sai, vì sản xuất vật chất là cơ sở nảy sinh và phát triển xã hội, không phải cơ sở hủy diệt.","w":{"b":"Đúng: sản xuất vật chất quyết định sự sinh tồn và phát triển của con người.","c":"Đúng: nó làm phát sinh, phát triển các quan hệ xã hội.","d":"Đúng: nó là cơ sở hình thành, biến đổi xã hội loài người."}},{"s":9,"n":"38","q":"Theo triết học Mác-Lênin, giới tự nhiên được xem là?","o":["Thân thể vô cơ của con người","Thân thể hữu cơ của con người","Thân thể tự nhiên của con người","Thân thể bên ngoài của con người"],"a":[0],"p":73,"e":"Trong Bản thảo kinh tế - triết học năm 1844, C.Mác gọi giới tự nhiên là \"thân thể vô cơ của con người\".","w":{"b":"\"Thân thể hữu cơ\" là cơ thể sinh học của con người.","c":"Cách nói \"thân thể tự nhiên\" không có trong luận điểm của Mác.","d":"\"Thân thể bên ngoài\" cũng không phải cách nói của Mác."}},{"s":9,"n":"39","q":"Các nhà triết học siêu hình quan niệm như thế nào về con người?","o":["Con người là sản phẩm của lực lượng siêu nhiên","Con người là một động vật thuần túy","Trong tính hiện thực của nó con người là tổng hòa các mối quan hệ xã hội","Con người là sản phẩm của tự nhiên và xã hội"],"a":[1],"p":73,"e":"Quan niệm siêu hình coi con người thuần túy là một động vật, một cơ thể sinh học, bỏ qua mặt xã hội.","w":{"a":"Con người là sản phẩm của lực lượng siêu nhiên là quan niệm tôn giáo, duy tâm.","c":"Tổng hòa các quan hệ xã hội là luận điểm của C.Mác.","d":"Sản phẩm của tự nhiên và xã hội là quan niệm của chủ nghĩa Mác."}},{"s":9,"n":"40","q":"Nhận định nào sau là đúng về sự tác động trở lại của kiến trúc thượng tầng đối với cơ sở hạ tầng?","o":["Luôn luôn diễn ra theo chiều hướng tích cực","Luôn luôn diễn ra theo chiều hướng tiêu cực","Có thể diễn ra theo chiều hướng tích cực hoặc tiêu cực","Tiêu cực là cơ bản còn đôi khi theo chiều hướng tích cực"],"a":[2],"p":74,"e":"Kiến trúc thượng tầng tác động trở lại cơ sở hạ tầng theo hai hướng: tích cực khi phù hợp với quy luật khách quan, tiêu cực khi kìm hãm sự phát triển.","w":{"a":"Chỉ nêu hướng tích cực.","b":"Chỉ nêu hướng tiêu cực.","d":"Coi tiêu cực là cơ bản là sai."}},{"s":9,"n":"41","q":"Nhận định nào sau đây phản ánh mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng?","o":["Kiến trúc thượng tầng chịu sự chi phối, quyết định hoàn toàn của cơ sở hạ tầng, cơ sở hạ tầng nào sinh ra kiến trúc thượng tầng ấy","Cơ sở hạ tầng và kiến trúc thượng tầng là hai mặt của đời sống xã hội, song hai mặt này không có mối quan hệ ràng buộc, quy định lẫn nhau","Kiến trúc thượng tầng quyết định cơ sở hạ tầng, cơ sở hạ tầng được hình thành trên một kiến trúc thượng tầng nhất định","Cơ sở hạ tầng quyết định kiến trúc thượng tầng, song đến lượt nó, kiến trúc thượng tầng cũng có sự tác động trở lại đối với cơ sở hạ tầng"],"a":[3],"p":74,"e":"Cơ sở hạ tầng quyết định kiến trúc thượng tầng, kiến trúc thượng tầng tác động trở lại cơ sở hạ tầng.","w":{"a":"Quyết định \"hoàn toàn\" bỏ qua tác động trở lại.","b":"Hai mặt có quan hệ quy định lẫn nhau.","c":"Đảo ngược quan hệ quyết định."}},{"s":9,"n":"42","q":"Yếu tố nào của quan hệ sản xuất tác động đến thái độ của con người trong sản xuất, là chất xúc tác đặc biệt quan trọng đối với tăng trưởng kinh tế?","o":["Quan hệ phân phối sản phẩm","Quan hệ sở hữu đối với tư liệu sản xuất","Quan hệ tổ chức, quản lý sản xuất","Quan hệ quyền lực"],"a":[0],"p":74,"e":"Quan hệ phân phối sản phẩm gắn trực tiếp với lợi ích, là chất xúc tác kích thích hoặc kìm hãm thái độ lao động và tăng trưởng kinh tế.","w":{"b":"Quan hệ sở hữu quyết định, nhưng đây là vai trò khác.","c":"Quan hệ tổ chức, quản lý có vai trò điều khiển quá trình sản xuất.","d":"Quan hệ quyền lực không phải một mặt của quan hệ sản xuất."}},{"s":9,"n":"43","q":"Trường phái triết học nào quan niệm rằng ý thức xã hội luôn luôn phụ thuộc vào tồn tại xã hội?","o":["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật lịch sử"],"a":[2],"p":74,"e":"Quan niệm cho rằng ý thức xã hội luôn phụ thuộc một chiều vào tồn tại xã hội là duy vật siêu hình, vì nó bỏ qua tính độc lập tương đối và tác động trở lại của ý thức.","w":{"a":"Duy vật biện chứng thừa nhận sự tác động trở lại của ý thức.","b":"Duy tâm coi ý thức quyết định tồn tại.","d":"Duy vật lịch sử cũng thừa nhận tính độc lập tương đối của ý thức xã hội."}},{"s":9,"n":"44","q":"Theo chủ nghĩa duy vật lịch sử, lực lượng sản xuất được hiểu như thế nào?","o":["Toàn bộ các nhân tố vật chất, kỹ thuật của quá trình sản xuất, chúng tồn tại trong mối quan hệ biện chứng với nhau tạo ra sức sản xuất","Sự thống nhất giữa người lao động và tư liệu sản xuất trong quá trình sản xuất vật chất","Tạo ra năng lực thực tiễn làm biến đổi các đối tượng vật chất của giới tự nhiên theo nhu cầu nhất định của con người và xã hội","Người lao động"],"a":[1],"p":74,"e":"Theo giáo trình, lực lượng sản xuất là sự thống nhất giữa người lao động với tư liệu sản xuất trong quá trình sản xuất vật chất, tạo ra sức sản xuất.","w":{"d":"Người lao động chỉ là một yếu tố.","a":"Mô tả các nhân tố vật chất, kỹ thuật của sản xuất, file coi là chưa nêu sự thống nhất giữa người lao động và tư liệu sản xuất.","c":"Nêu năng lực thực tiễn của lực lượng sản xuất, file không chọn phương án này làm định nghĩa."},"f":"File gốc đánh dấu đáp án B. Các phương án a và c cũng trích gần nguyên văn những định nghĩa về lực lượng sản xuất trong giáo trình, nên đề này dễ gây tranh cãi. Điểm tính theo đáp án B của file."},{"s":9,"n":"45","q":"Theo triết học Mác-Lênin: sự biến đổi của giới tự nhiên có ảnh hưởng đến con người không?","o":["Có ảnh hưởng","Không ảnh hưởng gì","Con người có thể chế ngự được tự nhiên nên con người tồn tại độc lập với giới tự nhiên","Con người không do giới tự nhiên sinh ra nên không phụ thuộc giới tự nhiên"],"a":[0],"p":75,"e":"Con người là sản phẩm của giới tự nhiên nên sự biến đổi của tự nhiên có ảnh hưởng đến con người.","w":{"b":"Con người phụ thuộc vào giới tự nhiên.","c":"Chế ngự tự nhiên vẫn là sống trong tự nhiên.","d":"Con người do giới tự nhiên sinh ra."}},{"s":10,"n":"1","q":"Quá trình con người sử dụng công cụ lao động tác động vào giới tự nhiên để tạo ra của cải cho xã hội, được gọi là gì?","o":["Lao động","Sản xuất","Sản xuất xã hội","Sản xuất vật chất"],"a":[3],"p":76,"e":"Sản xuất vật chất là quá trình con người sử dụng công cụ lao động tác động vào tự nhiên để tạo ra của cải vật chất cho xã hội.","w":{"a":"Lao động là khái niệm rộng hơn.","b":"Sản xuất gồm cả sản xuất tinh thần và sản xuất ra con người.","c":"Sản xuất xã hội là khái niệm gộp cả ba loại sản xuất."}},{"s":10,"n":"2","q":"Trong sản xuất vật
