<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quiz Triết học Mác-Lênin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Bố cục: một cột tối đa 860px, thanh trạng thái dính trên cùng, thanh hành động dính dưới cùng khi làm bài.
   Giao diện cố định một tông xanh dương tối, lời giải thích hiện ngay trong từng phương án sau khi trả lời. */
:root{
  --bg:#0b2150;
  --bg-deep:#071a42;
  --card:#12306f;
  --card-hi:#1a4090;
  --line:#2a54ad;
  --line-soft:#1f438f;
  --ink:#f2f6ff;
  --mute:#b4c6ec;
  --acc:#5aa2ff;
  --acc-fill:#2468e0;
  --acc-fill-hi:#3a7bf0;
  --acc-line:#7db4ff;
  --on-acc:#ffffff;
  --ok:#7df0b0;
  --ok-bg:#0d4636;
  --ok-line:#2bbf84;
  --on-ok:#04261b;
  --bad:#ffb4bc;
  --bad-bg:#561a32;
  --bad-line:#ff6b7d;
  --on-bad:#2b0710;
  --warn:#ffd98a;
  --glow-a:rgba(90,162,255,.22);
  --glow-b:rgba(36,104,224,.18);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(900px 420px at 88% -120px,var(--glow-a),transparent 70%),radial-gradient(760px 380px at -12% 36%,var(--glow-b),transparent 70%);background-repeat:no-repeat;color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg-deep);z-index:20}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
h1,h2,h3,p{margin:0}

.wrap{max-width:860px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.q{padding-block:0 120px}

/* thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:21;background:var(--bg-deep);border-bottom:1px solid var(--line-soft)}
.top .in{max-width:860px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand span{overflow-wrap:anywhere}
.pill{background:var(--card);border:1px solid var(--line-soft);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill b{color:var(--ok)}
.bar{height:5px;background:var(--card)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc-fill),var(--acc));transition:width .3s}
.link{background:none;border:0;color:var(--acc);cursor:pointer;padding:4px 2px;text-decoration:underline;font-size:.9rem}

/* trang chủ */
.hero{padding-top:38px}
.eyebrow{color:var(--acc);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.hero h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.12;font-weight:800}
.nb{white-space:nowrap}
.hero p{color:var(--mute);max-width:58ch;margin-top:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:22px;max-width:620px}
.fact{background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:14px;padding:10px 16px;min-width:0}
.fact b{display:block;font-size:1.5rem;line-height:1.2;font-weight:800;font-variant-numeric:tabular-nums}
.fact span{color:var(--mute);font-size:.82rem}
h2{font-size:1.05rem;font-weight:700;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h2 i{font-style:normal;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--acc-fill);color:var(--on-acc);font-size:.85rem}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.set{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--card);border:2px solid var(--line-soft);border-radius:16px;padding:14px 14px 12px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;min-width:0}
.set:hover{border-color:var(--acc);transform:translateY(-1px)}
.set[aria-pressed="true"]{border-color:var(--acc);background:var(--card-hi)}
.set[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--acc-fill);color:var(--on-acc);display:grid;place-items:center;font-size:.8rem;font-weight:800}
.sn{font-size:1.9rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.sn small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.sc{color:var(--mute);font-size:.88rem;font-variant-numeric:tabular-nums}
.pb{display:flex;height:6px;border-radius:999px;background:var(--bg-deep);overflow:hidden;margin-top:8px}
.pb i{display:block;height:100%}
.pb .g{background:var(--ok-line)}
.pb .r{background:var(--bad-line)}
.sm{color:var(--mute);font-size:.76rem;min-height:1.2em;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:14px}
.hint2{color:var(--mute);font-size:.88rem;margin-top:14px;max-width:70ch}
.opts-row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.lab{color:var(--mute);font-size:.9rem;font-weight:600}
.seg{display:inline-flex;background:var(--bg-deep);border:1px solid var(--line-soft);border-radius:12px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--acc-fill);color:var(--on-acc)}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:.92rem}
.tog input{width:18px;height:18px;accent-color:var(--acc-fill)}
.btn{border-radius:14px;padding:13px 22px;font-weight:700;cursor:pointer;background:var(--card-hi);border:2px solid var(--line);transition:background .15s,border-color .15s}
.btn:hover:not([disabled]){border-color:var(--acc)}
.btn.pri{background:var(--acc-fill);border-color:var(--acc-line);color:var(--on-acc)}
.btn.pri:hover:not([disabled]){background:var(--acc-fill-hi)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{padding:15px 28px;font-size:1.05rem}
.note{color:var(--mute);font-size:.88rem;margin-top:26px;max-width:70ch;border-left:3px solid var(--line);padding-left:14px}
.note + .note{margin-top:12px}

/* làm bài */
.qcard{margin-top:22px;background:var(--card);border:1px solid var(--line-soft);border-radius:20px;padding:22px 22px 24px}
.tag{color:var(--mute);font-size:.82rem;margin-bottom:10px;font-variant-numeric:tabular-nums}
.qt{font-size:clamp(1.1rem,2.8vw,1.32rem);font-weight:600;line-height:1.5;overflow-wrap:anywhere;text-wrap:pretty}
.chip{display:inline-block;margin-top:10px;background:var(--bg-deep);border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:2px 12px;font-size:.84rem;font-weight:600}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;border-radius:14px;background:var(--bg);border:2px solid var(--line-soft);transition:border-color .15s,background .15s}
button.opt{cursor:pointer}
button.opt:hover{border-color:var(--acc)}
.lt{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card-hi);display:grid;place-items:center;font-weight:700;font-size:.92rem}
.ob{display:flex;flex-direction:column;gap:6px;min-width:0;padding-top:4px}
.ot{overflow-wrap:anywhere}
.opt.sel{border-color:var(--acc);background:var(--card-hi)}
.opt.sel .lt{background:var(--acc-fill)}
.opt.ok{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.ok .lt{background:var(--ok-line);color:var(--on-ok)}
.opt.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.bad .lt{background:var(--bad-line);color:var(--on-bad)}
.opt.miss{border-style:dashed}
.tg{font-size:.8rem;font-weight:700;letter-spacing:.02em}
.opt.ok .tg{color:var(--ok)}
.opt.bad .tg{color:var(--bad)}
.on{color:var(--mute);font-size:.92rem;line-height:1.5;overflow-wrap:anywhere}
.opt.ok .on,.opt.bad .on{color:var(--ink)}
.ex,.flag{margin-top:16px;border-radius:16px;padding:16px 18px;scroll-margin-bottom:104px}
.ex{background:var(--bg-deep);border:1px solid var(--line)}
.flag{background:var(--bg-deep);border:1px solid var(--warn)}
.ex h3,.flag h3{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.ex h3{color:var(--acc)}
.flag h3{color:var(--warn)}
.ex p,.flag p{overflow-wrap:anywhere}
.kb{color:var(--mute);font-size:.8rem;margin-top:14px;text-align:center}
@media (hover:none){.kb{display:none}}

/* thanh hành động dưới */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:22;background:var(--bg-deep);border-top:1px solid var(--line);padding-top:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dk{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:10px}
.vd{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35;font-size:.9rem;color:var(--mute)}
.vd b{font-size:1.02rem}
.vd.ok b{color:var(--ok)}
.vd.bad b{color:var(--bad)}
.vd span{overflow-wrap:anywhere}
.dk .btn{padding:11px 18px;flex:none}

/* kết quả */
.score{margin-top:26px;background:var(--card);border:1px solid var(--line-soft);border-radius:22px;padding:28px 22px;text-align:center}
.ring{width:176px;height:176px;max-width:60vw;display:block;margin:6px auto 0}
.rt{fill:none;stroke:var(--bg-deep);stroke-width:10}
.rv{fill:none;stroke:var(--ok-line);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .6s}
.rv.low{stroke:var(--warn)}
.rp{font:800 26px var(--font);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.sc2{font-size:1.5rem;font-weight:800;margin-top:12px;font-variant-numeric:tabular-nums}
.sc2 small{font-size:.6em;color:var(--mute);font-weight:600}
.sub2{color:var(--mute);margin-top:2px}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.wl{margin-top:12px;display:grid;gap:8px}
details{background:var(--card);border:1px solid var(--line-soft);border-radius:14px;padding:11px 16px}
summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere}
details p{margin-top:8px;color:var(--mute);overflow-wrap:anywhere}
details b{color:var(--ink)}
details .bd{color:var(--bad)}
details .gd{color:var(--ok)}
@media (max-width:520px){
  .top.quiz .brand span{display:none}
  .set{padding:12px 11px 10px}
  .sm{font-size:.72rem}
  .qcard{padding:18px 14px 20px;border-radius:18px}
  .hero{padding-top:26px}
  .dk .btn{padding:10px 14px;font-size:.92rem}
  .btn{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>const DATA=[{"s":1,"n":"1","q":"Vai trò của triết học trong đời sống xã hội được xác định thông qua yếu tố nào?","o":["Uy tín của người nêu lên chủ thuyết","Số lượng người tìm hiểu trường phái triết học","Chức năng thế giới quan và phương pháp luận của triết học","Tính giai cấp và tính đảng của nó"],"a":[2],"p":2,"e":"Triết học tác động đến đời sống xã hội qua hai chức năng: thế giới quan (đưa ra hệ thống quan điểm chung nhất về thế giới và con người) và phương pháp luận (đưa ra nguyên tắc chung cho nhận thức và hành động). Vai trò của nó được xác định từ hai chức năng này.","w":{"a":"Uy tín của người lập thuyết không quyết định vai trò của một hệ thống triết học. Giá trị của nó nằm ở nội dung và chức năng.","b":"Số người tìm hiểu chỉ cho biết mức độ phổ biến của một trường phái.","d":"Tính giai cấp và tính đảng là đặc điểm của triết học. Chúng không xác định vai trò của triết học trong đời sống xã hội."}},{"s":1,"n":"2","q":"Lý luận nào của C. Mác được xem là thành tựu vĩ đại nhất của tư tưởng khoa học?","o":["Chủ nghĩa duy vật biện chứng","Nhận thức của con người là một quá trình biện chứng","Tổng kết hoạt động của phong trào công nhân quốc tế","Chủ nghĩa duy vật lịch sử"],"a":[3],"p":2,"e":"Mác mở rộng quan điểm duy vật sang lĩnh vực xã hội và tạo ra chủ nghĩa duy vật lịch sử. Lần đầu tiên đời sống xã hội được giải thích bằng quy luật khách quan bắt nguồn từ sản xuất vật chất. Cùng với học thuyết giá trị thặng dư, đây là hai phát kiến vĩ đại nhất của Mác.","w":{"a":"Chủ nghĩa duy vật biện chứng là thành tựu quan trọng, nhưng bước ngoặt được giáo trình nhấn mạnh là việc áp dụng nó vào lịch sử xã hội.","b":"\"Nhận thức là một quá trình biện chứng\" là một nội dung của lý luận nhận thức, chưa phải thành tựu được xem là vĩ đại nhất.","c":"Tổng kết phong trào công nhân là cơ sở thực tiễn để hình thành học thuyết. Bản thân nó chưa phải một lý luận."}},{"s":1,"n":"3","q":"Tác phẩm nào sau đây được xem là văn kiện có tính cương lĩnh đầu tiên của chủ nghĩa Mác - Lênin?","o":["Sự khốn cùng của Triết học (1847)","Tuyên ngôn Đảng cộng sản (1848)","Tư bản (1867)","Hệ tư tưởng Đức (1845-1846)"],"a":[1],"p":2,"e":"Tuyên ngôn của Đảng Cộng sản (C.Mác và Ph.Ăngghen, 1848) trình bày hệ thống những nguyên lý cơ bản về thế giới quan, đấu tranh giai cấp và sứ mệnh lịch sử của giai cấp công nhân. Vì vậy nó được coi là văn kiện cương lĩnh đầu tiên của chủ nghĩa Mác.","w":{"a":"Sự khốn cùng của triết học (1847) phê phán quan điểm của Pru-đông, mới đặt những cơ sở ban đầu.","c":"Tư bản (1867) là tác phẩm kinh tế chính trị học phân tích phương thức sản xuất tư bản chủ nghĩa.","d":"Hệ tư tưởng Đức (1845-1846) trình bày quan niệm duy vật về lịch sử, nhưng không mang tính văn kiện cương lĩnh."}},{"s":1,"n":"4","q":"Tiền đề khoa học tự nhiên cho sự ra đời triết học Mác là gì?","o":["Lý thuyết điện từ của M. Pha-ra-đây; Định luật tuần hoàn các nguyên tố hóa học của Men-đê-lê-ép; Di truyền học hiện đại của Men-đen","Cơ học cổ điển của I. Neu-ton; Thuyết tương đối của A. Anh-xtanh; học thuyết về tinh vân vũ trụ của I. Kan-tơ","Hình học phi Ơ-clít; mẫu nguyên tử của Tôm-xơn; thuyết tương đối của A. anh-xtanh","Thuyết tiến hóa của S. Đác-uyn; Học thuyết bảo toàn và chuyển hóa năng lượng; Học thuyết tế bào (M. Sơ-lay-đen và T. Sa-van-sơ)"],"a":[3],"p":2,"e":"Ba phát minh của khoa học tự nhiên nửa đầu thế kỷ XIX là tiền đề: định luật bảo toàn và chuyển hóa năng lượng, học thuyết tế bào, thuyết tiến hóa của Đác-uyn. Chúng cho thấy các dạng vật chất liên hệ và chuyển hóa lẫn nhau, đồng thời cho thấy tính biện chứng của tự nhiên.","w":{"a":"Di truyền học của Men-đen chỉ được công nhận từ đầu thế kỷ XX, sau khi triết học Mác đã ra đời.","b":"Thuyết tương đối của Anh-xtanh ra đời đầu thế kỷ XX. Cơ học Niu-tơn thuộc thế kỷ XVII.","c":"Mẫu nguyên tử của Tôm-xơn và thuyết tương đối đều ra đời sau thời kỳ hình thành triết học Mác."}},{"s":1,"n":"5","q":"Quan điểm của thuyết khả tri về mặt thứ hai của vấn đề cơ bản của triết học là gì?","o":["Cuộc sống con người sẽ đi về đâu","Con người không có khả năng nhận thức được thế giới","Con người hoàn toàn có khả năng nhận thức được thế giới","Nghi ngờ khả năng nhận thức thế giới của con người"],"a":[2],"p":2,"e":"Vấn đề cơ bản của triết học có hai mặt. Mặt thứ hai hỏi con người có nhận thức được thế giới hay không. Thuyết khả tri trả lời là có: con người có khả năng nhận thức được bản chất của thế giới.","w":{"a":"\"Cuộc sống con người sẽ đi về đâu\" không thuộc nội dung mặt thứ hai của vấn đề cơ bản.","b":"Đây là quan điểm của thuyết bất khả tri.","d":"Nghi ngờ khả năng nhận thức là thái độ của thuyết hoài nghi."}},{"s":1,"n":"6","q":"Quan điểm của triết học Mác –Lênin, điều kiện ra đời của triết học là gì?","o":["Khi sự nhận thức của con người đã đạt đến trình độ trừu tượng hóa và khái quát hóa về thế giới khách quan","Khi xã hội loài người đã có sự đấu tranh giai cấp","Khi xã hội có sự phân chia giữa nông nghiệp và công nghiệp","Khi xã hội có sự phân chia lao động giữa người giàu và người nghèo"],"a":[0],"p":2,"e":"Theo triết học Mác-Lênin, triết học ra đời khi nhận thức của con người đạt đến trình độ trừu tượng hóa, khái quát hóa để hình thành hệ thống tri thức chung về thế giới. Đây là nguồn gốc nhận thức. Nguồn gốc xã hội là sự phân chia lao động trí óc và lao động chân tay.","w":{"b":"Đấu tranh giai cấp là bối cảnh xã hội của thời kỳ này. Điều kiện giáo trình nêu cho sự ra đời của triết học là trình độ tư duy trừu tượng.","c":"Sự phân chia nông nghiệp và công nghiệp là một lần phân công lao động xã hội, không phải điều kiện ra đời của triết học.","d":"Sự phân chia người giàu và người nghèo là hệ quả của tư hữu, không phải điều kiện của triết học."}},{"s":1,"n":"7","q":"Phát biểu nào sau đây không đúng về Triết học Mác?","o":["Triết học Mác là khoa học của mọi khoa học","Theo quan điểm của triết học Mác, triết học không thay thế được các khoa học cụ thể","Theo quan điểm của triết học Mác, sự phát triển của triết học quan hệ chặt chẽ với sự phát triển của khoa học tự nhiên","Triết học Mác ra đời vào những năm 40 của thế kỷ XIX"],"a":[0],"p":3,"e":"Quan niệm \"triết học là khoa học của mọi khoa học\" là của Hê-ghen. Triết học Mác không đứng trên các khoa học khác. Nó nghiên cứu những quy luật chung nhất của tự nhiên, xã hội và tư duy. Vì vậy phát biểu a là phát biểu không đúng.","w":{"b":"Đúng: triết học Mác không thay thế các khoa học cụ thể.","c":"Đúng: triết học phát triển gắn chặt với sự phát triển của khoa học tự nhiên.","d":"Đúng: triết học Mác ra đời vào những năm 40 của thế kỷ XIX."}},{"s":1,"n":"8","q":"Triết học xuất hiện ở giai đoạn nào của lịch sử văn minh nhân loại?","o":["Từ thời nguyên thuỷ","Từ khi có tôn giáo","Từ thời chiếm hữu nô lệ","Từ khi con người có nhận thức"],"a":[2],"p":3,"e":"Triết học xuất hiện vào khoảng thế kỷ VIII đến VI trước Công nguyên, trong thời kỳ chiếm hữu nô lệ. Lúc đó xã hội đã phân chia giai cấp và lao động trí óc đã tách khỏi lao động chân tay.","w":{"a":"Thời nguyên thủy chưa có tầng lớp lao động trí óc, nhận thức còn ở dạng thần thoại.","b":"Tôn giáo có từ trước đó. Nó không đánh dấu thời điểm ra đời của triết học.","d":"Nhận thức có từ khi có con người, nhưng triết học cần trình độ trừu tượng hóa cao hơn nhiều."}},{"s":1,"n":"9","q":"Nội dung nào sau đây là tiền đề lý luận trực tiếp cho sự ra đời của Triết học Mác – Lênin?","o":["Triết học Cổ điển Đức","Kinh tế chính trị cổ điển Anh","CNXH không tưởng Pháp","Các thành tựu về kinh tế xã hội của các nước tây Âu vào giữa thế kỷ XIX"],"a":[0],"p":3,"e":"Chủ nghĩa Mác có ba nguồn gốc lý luận: triết học cổ điển Đức, kinh tế chính trị học cổ điển Anh và chủ nghĩa xã hội không tưởng Pháp. Với triết học Mác, tiền đề trực tiếp là triết học cổ điển Đức, cụ thể là phép biện chứng của Hê-ghen và chủ nghĩa duy vật của Phoi-ơ-bắc.","w":{"b":"Kinh tế chính trị học cổ điển Anh là tiền đề trực tiếp của học thuyết kinh tế.","c":"Chủ nghĩa xã hội không tưởng Pháp là tiền đề trực tiếp của chủ nghĩa xã hội khoa học.","d":"Thành tựu kinh tế xã hội là tiền đề thực tiễn, không thuộc loại tiền đề lý luận."}},{"s":1,"n":"10","q":"Triết học là gì?","o":["Sự yêu mến sự thông thái","Sự suy nghĩ và nói năng chuẩn mực","Triết học là hệ thống tri thức lý luận chung nhất của con người về thế giới; về vị trí, vai trò của con người trong thế giới ấy","Sự suy tư, suy nghiệm về những vấn đề siêu hình học"],"a":[2],"p":3,"e":"Triết học là hệ thống tri thức lý luận chung nhất của con người về thế giới, về vị trí và vai trò của con người trong thế giới ấy. Định nghĩa này nêu được cả đối tượng lẫn mục đích của triết học.","w":{"a":"\"Yêu mến sự thông thái\" là nghĩa gốc của từ philosophia trong tiếng Hy Lạp, chưa nêu nội dung của triết học.","b":"Suy nghĩ và nói năng chuẩn mực mô tả kỹ năng lập luận, chưa nói gì về đối tượng của triết học.","d":"Siêu hình học chỉ là một bộ phận hay một khuynh hướng, nên định nghĩa này thu hẹp triết học."}},{"s":1,"n":"11","q":"Đối tượng nghiên cứu của triết học là gì?","o":["Về những vấn đề chung nhất của tự nhiên, xã hội và tư duy","Mối liên hệ giữa nhà nước và nhân dân","Nghiên cứu về những vấn đề siêu nhiên trừu tượng","Nghiên cứu về đời sống tâm linh của con người"],"a":[0],"p":3,"e":"Triết học nghiên cứu những vấn đề chung nhất của thế giới, bao gồm tự nhiên, xã hội và tư duy. Các khoa học cụ thể chỉ nghiên cứu từng lĩnh vực riêng.","w":{"b":"Quan hệ giữa nhà nước và nhân dân thuộc chính trị học và luật học.","c":"Cái siêu nhiên là đối tượng của thần học. Triết học Mác không nghiên cứu nó.","d":"Đời sống tâm linh thuộc tôn giáo học, hẹp hơn đối tượng của triết học."}},{"s":1,"n":"12","q":"Trình độ cao nhất của thế giới quan là gì?","o":["Tín ngưỡng vật linh","Thế giới quan thần thoại","Thế giới quan khoa học triết học","Thần học tôn giáo"],"a":[2],"p":3,"e":"Thế giới quan có ba hình thức lịch sử: thần thoại, tôn giáo và triết học. Triết học là trình độ cao nhất vì nó dựa trên tri thức khoa học và được diễn đạt bằng hệ thống khái niệm, phạm trù, quy luật.","w":{"a":"Tín ngưỡng vật linh là hình thức niềm tin sơ khai.","b":"Thế giới quan thần thoại là hình thức đầu tiên, dùng trí tưởng tượng để giải thích thế giới.","d":"Thần học tôn giáo dựa vào niềm tin vào lực lượng siêu nhiên."}},{"s":1,"n":"13","q":"Triết học ra đời sớm nhất ở đâu?","o":["Ấn Độ, Châu Phi, Nga","Ấn Độ, Trung Quốc, Hy Lạp","Ai Cập, Ấn Độ, Trung Quốc","Đức, Anh, Pháp"],"a":[1],"p":3,"e":"Triết học xuất hiện sớm nhất ở các trung tâm văn minh cổ đại là Ấn Độ, Trung Quốc và Hy Lạp, vào khoảng thế kỷ VIII đến VI trước Công nguyên.","w":{"a":"Châu Phi và Nga không nằm trong số các cái nôi của triết học cổ đại.","c":"Giáo trình chỉ nêu Ấn Độ, Trung Quốc, Hy Lạp. Ai Cập không nằm trong nhóm này.","d":"Triết học ở Đức, Anh, Pháp phát triển mạnh muộn hơn rất nhiều, từ thế kỷ XVII đến XIX."}},{"s":1,"n":"14","q":"Đặc trưng của thế giới quan thời kỳ nguyên thủy là gì?","o":["Khoa học","Tôn giáo","Chính trị","Thần thoại"],"a":[3],"p":4,"e":"Ở thời nguyên thủy, con người giải thích tự nhiên bằng trí tưởng tượng, nơi cái thực và cái ảo, cái thần và cái người hòa lẫn. Đây là thế giới quan thần thoại.","w":{"a":"Khoa học xuất hiện muộn hơn nhiều, khi sản xuất và nhận thức đã phát triển.","b":"Tôn giáo là hình thức thế giới quan thứ hai, niềm tin vào lực lượng siêu nhiên giữ vai trò chủ yếu.","c":"Chính trị gắn với nhà nước, chưa có ở thời nguyên thủy."}},{"s":1,"n":"15","q":"“Nghiên cứu thế giới trong tính chỉnh thể và tìm ra bản chất quy luật của nó” thuộc đối tượng nghiên cứu của bộ phận nào trong chủ nghĩa Mác- Lênin?","o":["Chủ nghĩa Mác- Lênin","Triết học Mác- Lênin","Kinh tế chính trị Mác- Lênin","Chủ nghĩa xã hội khoa học Mác- Lênin"],"a":[1],"p":4,"e":"Triết học Mác-Lênin nghiên cứu thế giới trong tính chỉnh thể và tìm ra bản chất, quy luật chung nhất của nó. Kinh tế chính trị và chủ nghĩa xã hội khoa học nghiên cứu những lĩnh vực cụ thể của đời sống xã hội.","w":{"a":"Chủ nghĩa Mác-Lênin là toàn bộ hệ thống gồm ba bộ phận, rộng hơn đối tượng được hỏi.","c":"Kinh tế chính trị Mác-Lênin nghiên cứu quy luật kinh tế của phương thức sản xuất.","d":"Chủ nghĩa xã hội khoa học nghiên cứu quá trình cách mạng xã hội chủ nghĩa."}},{"s":1,"n":"16","q":"Mục đích cơ bản nhất của môn học Triết học Mác- Lênin là gì?","o":["Hiểu rõ cơ sở lý luận quan trọng nhất của tư tưởng Hồ Chí Minh và đường lối cách mạng của Đảng cộng sản Việt Nam","Xây dựng thế giới quan và phương pháp luận khoa học và vận dụng sáng tạo những nguyên lý đó trong hoạt động nhận thức và hoạt động thực tiễn","Hiểu rõ nền tảng tư tưởng của Đảng cộng sản Việt Nam. Xây dựng niềm tin, lý tưởng cho sinh viên về con đường đi lên chủ nghĩa xã hội mà Chủ tịch Hồ Chí Minh, Đảng cộng sản Việt Nam và toàn thể nhân dân ta đã lựa chọn và đang quyết tâm xây dựng"],"a":[1],"p":4,"e":"Mục đích cơ bản nhất của môn học là giúp người học xây dựng thế giới quan, phương pháp luận khoa học và vận dụng những nguyên lý đó vào nhận thức và hoạt động thực tiễn. Các mục tiêu khác đều dựa trên nền tảng này.","w":{"a":"Hiểu cơ sở lý luận của tư tưởng Hồ Chí Minh và đường lối của Đảng là một mục tiêu đi kèm, chưa phải cơ bản nhất.","c":"Hiểu nền tảng tư tưởng của Đảng và xây dựng niềm tin, lý tưởng là mục tiêu quan trọng, nhưng nó dựa trên việc có thế giới quan và phương pháp luận khoa học."}},{"s":1,"n":"17","q":"Đối tượng nghiên cứu của Kinh tế chính trị Mác- Lênin là gì?","o":["Kinh tế học chính trị của A.Smít","Kinh tế học chính trị của D.Ricácđô","Quy luật vận động và phát triển của phương thức sản xuất tư bản chủ nghĩa và tính tất yếu của sự ra đời của phương thức sản xuất cộng sản chủ nghĩa","Sự phát triển của các phương thức sản xuất qua các thời kỳ lịch sử"],"a":[2],"p":4,"e":"Kinh tế chính trị Mác-Lênin nghiên cứu quy luật vận động và phát triển của phương thức sản xuất tư bản chủ nghĩa, cùng tính tất yếu ra đời của phương thức sản xuất cộng sản chủ nghĩa.","w":{"a":"Kinh tế chính trị của A.Smít là một nguồn gốc lý luận của Mác, không phải đối tượng nghiên cứu của bộ môn này.","b":"Kinh tế chính trị của Ri-các-đô cũng chỉ là một nguồn gốc lý luận.","d":"Phạm vi \"mọi thời kỳ lịch sử\" rộng hơn. Môn này tập trung vào phương thức sản xuất tư bản chủ nghĩa và sự thay thế nó."}},{"s":1,"n":"18","q":"Nội dung nào trong tư tưởng của các nhà chủ nghĩa xã hội không tưởng Pháp được chủ nghĩa Mác kế thừa?","o":["Phương thức xây dựng xã hội mới – xã hội cộng sản chủ nghĩa","Nhận thức đúng đắn sứ mệnh lịch sử của giai cấp công nhân","Quan điểm đúng đắn về đặc trưng của xã hội cộng sản chủ nghĩa trong tương lai","Nhận thức đúng đắn về thành tựu và hạn chế của phương thức sản xuất tư bản chủ nghĩa"],"a":[0],"p":4,"e":"File gốc đánh dấu đáp án A. Cần biết thêm rằng giáo trình nêu Mác kế thừa từ chủ nghĩa xã hội không tưởng Pháp sự phê phán chủ nghĩa tư bản và những dự đoán về xã hội tương lai, còn phương thức thực hiện của họ bị coi là thiếu cơ sở khoa học.","w":{"b":"Các nhà không tưởng chưa nhận thức được sứ mệnh lịch sử của giai cấp công nhân, đây là điểm Mác khắc phục.","c":"Nội dung về đặc trưng của xã hội tương lai là phần giáo trình thường nêu là được kế thừa.","d":"Họ phê phán chủ nghĩa tư bản nhưng chưa giải thích được bản chất của nó, phần này Mác giải quyết bằng học thuyết giá trị thặng dư."},"f":"Đáp án trong file là A. Theo giáo trình, điều Mác kế thừa là sự phê phán chủ nghĩa tư bản và những dự đoán về xã hội tương lai, còn phương thức xây dựng xã hội mới của các nhà không tưởng bị phê phán là thiếu cơ sở khoa học. Câu này có thể có sai lệch trong file gốc."},{"s":1,"n":"19","q":"Đâu là tiền đề kinh tế - xã hội quyết định sự ra đời của chủ nghĩa Mác?","o":["Sự phát triển của khoa học kỹ thuật vào giữa thế kỷ XIX làm sâu sắc thêm mâu thuẫn giữa chủ nghĩa duy vật và chủ nghĩa duy tâm trong việc giải quyết vấn đề cơ bản của triết học","Sự phát triển của lực lượng sản xuất làm sâu sắc thêm mâu thuẫn giữa giai cấp tư sản và giai cấp công nhân trong xã hội tư bản chủ nghĩa","Sự phát triển của khoa học kỹ thuật vào giữa thế kỷ XIX làm sâu sắc thêm mâu thuẫn giữa các tôn giáo lớn với các nhà khoa học","Phong trào đấu tranh của giai cấp công nhân trên toàn thế giới chuyển từ tự phát sang tự giác"],"a":[1],"p":4,"e":"Giữa thế kỷ XIX, lực lượng sản xuất của chủ nghĩa tư bản phát triển mạnh và làm mâu thuẫn giữa giai cấp tư sản với giai cấp công nhân trở nên gay gắt (khởi nghĩa thợ dệt ở Li-ông và Xi-lê-di, phong trào Hiến chương ở Anh). Thực tiễn đó đòi hỏi một lý luận dẫn đường, nên đây là tiền đề kinh tế - xã hội.","w":{"a":"Mâu thuẫn duy vật - duy tâm thuộc lĩnh vực tư tưởng, không thuộc tiền đề kinh tế - xã hội.","c":"Mâu thuẫn tôn giáo - khoa học cũng thuộc lĩnh vực tư tưởng.","d":"Việc phong trào công nhân chuyển từ tự phát sang tự giác là kết quả có học thuyết Mác dẫn dắt, nó đến sau tiền đề."}},{"s":1,"n":"20","q":"Tác phẩm nào sau đây của C.Mác đã phản ánh bản chất và những quy luật phát triển của chủ nghĩa tư bản?","o":["Tuyên ngôn Đảng Cộng sản","Tư bản","Hệ tư tưởng Đức","Chủ nghĩa đế quốc – giai đoạn tột cùng của chủ nghĩa tư bản"],"a":[1],"p":5,"e":"Bộ Tư bản (C.Mác) phân tích phương thức sản xuất tư bản chủ nghĩa, nêu học thuyết giá trị thặng dư và các quy luật vận động, phát triển của chủ nghĩa tư bản.","w":{"a":"Tuyên ngôn nêu nguyên lý chung về đấu tranh giai cấp, chưa phân tích sâu kinh tế.","c":"Hệ tư tưởng Đức trình bày quan niệm duy vật về lịch sử.","d":"Tác phẩm này của V.I.Lênin, không phải của C.Mác."}},{"s":1,"n":"21","q":"Thành tựu nào sau đây thể hiện rõ ràng nhất sức ảnh hưởng của chủ nghĩa Mác – Lênin đến phong trào cách mạng vô sản trên toàn thế giới?","o":["Sự thành công của cách mạng Tháng Mười Nga (1917)","Sự ra đời của Quốc tế Cộng sản (1919)","Sự thành công của phong trào giải phóng dân tộc của các nước thuộc địa giữa thế kỷ XX","Sự phát triển về lực lượng sản xuất của nước thuộc địa sau khi giành được độc lập"],"a":[0],"p":5,"e":"Cách mạng Tháng Mười Nga năm 1917 lần đầu đưa lý luận Mác-Lênin thành hiện thực và lập ra nhà nước xã hội chủ nghĩa đầu tiên. Nó tác động trực tiếp đến phong trào cách mạng vô sản toàn thế giới.","w":{"b":"Quốc tế Cộng sản (1919) ra đời sau, là hệ quả của ảnh hưởng này.","c":"Phong trào giải phóng dân tộc giữa thế kỷ XX là kết quả muộn hơn.","d":"Phát triển lực lượng sản xuất ở nước thuộc địa chưa thể hiện ảnh hưởng trực tiếp của chủ nghĩa Mác-Lênin."}},{"s":1,"n":"22","q":"Những cống hiến của V.I.Lênin đối với triết học Mác là gì?","o":["Phê phán, khắc phục và chống những quan điểm sai lầm xuất hiện trong thời đại đế quốc chủ nghĩa như: chủ nghĩa xét lại chủ nghĩa Mác, chủ nghĩa duy tâm vật lý học, bệnh ấu trĩ tả khuynh trong triết học, chủ nghĩa giáo điều...","Hiện thực hóa lý luận chủ nghĩa Mác bằng sự ra đời của Quốc tế cộng sản","Bổ sung và hoàn chỉnh về mặt lý luận và thực tiễn những vấn đề như lý luận về cách mạng tư sản trong thời đại đế quốc chủ nghĩa","Vinh danh công lao của Mác"],"a":[0],"p":5,"e":"Cống hiến của Lênin cho triết học Mác trong thời đại đế quốc chủ nghĩa gồm việc phê phán và khắc phục các quan điểm sai lầm: chủ nghĩa xét lại, chủ nghĩa duy tâm vật lý học, bệnh ấu trĩ \"tả khuynh\", chủ nghĩa giáo điều.","w":{"b":"Quốc tế Cộng sản là sự kiện về tổ chức, không phải cống hiến lý luận triết học.","c":"Lênin phát triển lý luận về cách mạng vô sản và cách mạng xã hội chủ nghĩa, không phải cách mạng tư sản.","d":"\"Vinh danh công lao của Mác\" không phải một cống hiến lý luận."}},{"s":1,"n":"23","q":"Thế giới thống nhất ở tính gì?","o":["Tính thống nhất ở vật chất và tinh thần","Ta cho nó thống nhất thì nó thống nhất","Thống nhất ở tính vật chất","Thống nhất vì do Thượng đế sinh ra"],"a":[2],"p":5,"e":"Theo chủ nghĩa duy vật biện chứng, thế giới thống nhất ở tính vật chất. Thế giới tồn tại khách quan, mọi sự vật, hiện tượng là những dạng cụ thể của vật chất.","w":{"a":"Thống nhất ở cả vật chất và tinh thần là quan điểm nhị nguyên.","b":"Thế giới thống nhất do ý thức con người \"cho\" là duy tâm chủ quan.","d":"Thế giới do Thượng đế sinh ra là duy tâm tôn giáo."}},{"s":1,"n":"24","q":"Sự kiện xã hội nào lần đầu tiên đã chứng minh tính hiện thực của chủ nghĩa Mác- Lênin trong lịch sử?","o":["Cách mạng Tháng Mười Nga thắng lợi","Công xã Pa-ri","Cách mạng tháng 8 năm 1945 ở Việt Nam","Chiến tranh thế giới lần thứ II"],"a":[0],"p":5,"e":"Cách mạng Tháng Mười Nga (1917) lần đầu tiên biến lý luận Mác-Lênin thành hiện thực bằng một nhà nước vô sản đầu tiên.","w":{"b":"Công xã Pa-ri (1871) chỉ tồn tại 72 ngày rồi thất bại, chưa chứng minh được tính hiện thực của học thuyết.","c":"Cách mạng tháng Tám 1945 ở Việt Nam là sự vận dụng sau đó.","d":"Chiến tranh thế giới thứ hai là sự kiện chiến tranh, không phải sự kiện chứng minh học thuyết."}},{"s":1,"n":"25","q":"“Triết học bao gồm quan điểm chung nhất, những sự lý giải có luận chứng cho các câu hỏi chung của con người, nên triết học bao gồm toàn bộ tri thức của nhân loại\". Nhận định trên ứng với triết học thời kỳ nào?","o":["Triết học Cổ đại","Triết học Phục Hưng.","Triết học Trung cổ Tây Âu.","Triết học Mác – Lênin"],"a":[0],"p":5,"e":"Ở Hy Lạp cổ đại, khoa học chưa tách khỏi triết học. Nhà triết học đồng thời là nhà toán học, thiên văn học, vật lý học, nên triết học bao gồm toàn bộ tri thức của nhân loại.","w":{"b":"Thời Phục hưng, các ngành khoa học tự nhiên bắt đầu tách khỏi triết học.","c":"Ở Tây Âu thời trung cổ, triết học bị thần học chi phối.","d":"Triết học Mác-Lênin nghiên cứu quy luật chung nhất, không bao gồm toàn bộ tri thức."}},{"s":1,"n":"26","q":"Điền vào chỗ trống để hoàn thiện mệnh đề sau đây? “Triết học Mác – Lênin là khoa học... ”","o":["Nghiên cứu mọi hiện tượng quá trình xảy ra trong tự nhiên, xã hội và tư duy con người","Nghiên cứu quy luật chung nhất của thế giới","Nghiên cứu mọi khoa học","Nghiên cứu mọi quy luật"],"a":[0],"p":6,"e":"File gốc đánh dấu đáp án A. Cách diễn đạt phổ biến trong giáo trình là triết học Mác-Lênin nghiên cứu những quy luật chung nhất của tự nhiên, xã hội và tư duy, còn việc nghiên cứu từng hiện tượng cụ thể thuộc các khoa học chuyên ngành.","w":{"b":"Phương án này sát cách diễn đạt trong giáo trình hơn: nghiên cứu quy luật chung nhất của thế giới.","c":"Triết học không nghiên cứu mọi khoa học.","d":"Triết học không nghiên cứu mọi quy luật, chỉ các quy luật chung nhất."},"f":"Đáp án trong file là A, nhưng theo giáo trình, triết học nghiên cứu \"quy luật chung nhất\" (phương án B), không nghiên cứu \"mọi hiện tượng\". Câu này có thể có sai lệch trong file gốc."},{"s":1,"n":"27","q":"Triết học Mácxít có chức năng gì?","o":["Chức năng chỉ đạo hoạt động thực tiễn","Chức năng nghiên cứu mọi khoa học","Chức năng thế giới quan và phương pháp luận phổ biến","Chức năng hoàn thiện lý trí và nâng cao phẩm chất đạo đức cách mạng"],"a":[2],"p":6,"e":"Chức năng của triết học Mác-Lênin là thế giới quan và phương pháp luận phổ biến, vì nó áp dụng được cho mọi lĩnh vực nhận thức và thực tiễn.","w":{"a":"Triết học định hướng cho hoạt động thực tiễn, không trực tiếp chỉ đạo từng hoạt động cụ thể.","b":"Triết học không nghiên cứu mọi khoa học.","d":"Hoàn thiện lý trí và nâng cao phẩm chất đạo đức không phải chức năng cơ bản."}},{"s":1,"n":"28","q":"Theo quan điểm của triết học Mácxít, triết học có những chức năng cơ bản nào?","o":["Chức năng giáo dục những giá trị đạo đức và thẩm mỹ cho con người","Chức năng thế giới quan và phương pháp luận chung cho mọi hoạt động nhận thức và thực tiễn","Chức năng tổ chức tri thức khoa học, thúc đẩy sự phát triển khoa học-công nghệ","Giải thích hiện thực và thúc đẩy quần chúng làm cách mạng để xóa bỏ hiện thực"],"a":[1],"p":6,"e":"Chức năng cơ bản của triết học Mác-Lênin là thế giới quan và phương pháp luận chung cho mọi hoạt động nhận thức và thực tiễn.","w":{"a":"Giáo dục đạo đức và thẩm mỹ thuộc đạo đức học và mỹ học.","c":"Tổ chức tri thức khoa học là tác động gián tiếp, không phải chức năng cơ bản.","d":"Câu này gần với luận đề của Mác về việc cải tạo thế giới, nhưng chức năng cơ bản theo giáo trình vẫn là thế giới quan và phương pháp luận."}},{"s":1,"n":"29","q":"Hạt nhân lý luận của thế giới quan theo quan điểm của triết học Mác – Lênin là gì?","o":["Chính trị","Triết học","Lý luận của những ngành khoa học cụ thể","Tôn giáo"],"a":[1],"p":6,"e":"Thế giới quan gồm tri thức, niềm tin và lý tưởng. Triết học là hạt nhân lý luận của nó vì triết học khái quát những vấn đề chung nhất và làm cơ sở cho các quan điểm chính trị, đạo đức, thẩm mỹ.","w":{"a":"Chính trị là một bộ phận chịu sự định hướng của thế giới quan, không phải hạt nhân.","c":"Lý luận của khoa học cụ thể chỉ phản ánh từng lĩnh vực riêng.","d":"Tôn giáo là một hình thức thế giới quan, không phải hạt nhân lý luận của thế giới quan khoa học."}},{"s":1,"n":"30","q":"Quan điểm của Hêghen về khoa học triết học là gì?","o":["Triết học là khoa học của mọi khoa học","Khoa học triết học là siêu hình học","Triết học là khoa học về mọi khoa học","Triết học là khoa học về xã hội và lịch sử"],"a":[0],"p":6,"e":"Hê-ghen coi triết học là khoa học của mọi khoa học, đứng trên các khoa học khác. Quan niệm này bị triết học Mác bác bỏ.","w":{"b":"Hê-ghen không coi triết học là siêu hình học.","c":"Phương án này chỉ khác a một chữ. Cách diễn đạt trong giáo trình là \"khoa học của mọi khoa học\".","d":"Khoa học về xã hội và lịch sử không phải quan niệm về triết học của Hê-ghen."}},{"s":1,"n":"31","q":"Đối tượng của Triết học thời kỳ phục hưng là gì?","o":["Triết học tự nhiên bao gồm tất cả những tri thức mà con người có được, trước hết là các tri thức thuộc khoa học tự nhiên sau này như toán học, vật lý học, thiên văn học...","Triết học kinh viện, triết học mang tính tôn giáo","Triết học tách ra thành các môn khoa học như cơ học, toán học, vật lý học, thiên văn học, hóa học, sinh học, xã hội học, tâm lý học, văn hóa học...","Triết học là khoa học của mọi khoa học"],"a":[0],"p":6,"e":"Thời kỳ Phục hưng, đối tượng của triết học là triết học tự nhiên, bao gồm các tri thức mà con người có được, trước hết là tri thức khoa học tự nhiên như toán, vật lý, thiên văn.","w":{"b":"Triết học kinh viện, tôn giáo là đặc điểm của thời trung cổ.","c":"Việc triết học tách thành các môn khoa học riêng diễn ra về sau, từ cận đại.","d":"Quan niệm triết học là khoa học của mọi khoa học là của Hê-ghen và triết học cổ đại."}},{"s":1,"n":"32","q":"Đối tượng của triết học ở phương Tây thời trung cổ là gì?","o":["Về thượng đế và quyền năng của thượng đế","Về nghi thức và văn hóa","Nghiên cứu về tự nhiên","Nghiên cứu về xã hội và lịch sử"],"a":[0],"p":6,"e":"Ở Tây Âu thời trung cổ, triết học bị thần học chi phối, trở thành \"tôi tớ của thần học\". Đối tượng chủ yếu là Thượng đế và quyền năng của Thượng đế.","w":{"b":"Nghi thức và văn hóa không phải đối tượng của triết học thời kỳ này.","c":"Nghiên cứu tự nhiên bị kìm hãm vào thời kỳ này.","d":"Nghiên cứu xã hội và lịch sử không phải đối tượng của triết học thời kỳ này."}},{"s":1,"n":"33","q":"Tác phẩm nào sau đây của chủ nghĩa Mác đã làm sáng tỏ bản chất của phương thức sản xuất tư bản chủ nghĩa và vạch ra tính tất yếu của hình thái kinh tế xã hội cộng sản chủ nghĩa?","o":["Bản thảo kinh tế - Triết học","Chính sách Kinh tế mới","Tư bản","Tuyên ngôn đảng cộng sản"],"a":[2],"p":7,"e":"Bộ Tư bản của C.Mác làm sáng tỏ bản chất của phương thức sản xuất tư bản chủ nghĩa bằng học thuyết giá trị thặng dư, và chỉ ra tính tất yếu của hình thái kinh tế - xã hội cộng sản chủ nghĩa.","w":{"a":"Bản thảo kinh tế - triết học (1844) bàn về lao động bị tha hóa.","b":"Chính sách kinh tế mới là chính sách của Lênin, không phải tác phẩm của Mác.","d":"Tuyên ngôn nêu tính tất yếu ở mức khái quát, chưa phân tích bản chất phương thức sản xuất tư bản bằng học thuyết giá trị thặng dư."}},{"s":1,"n":"34","q":"Giai đoạn lịch sử nào sau đây là giai đoạn Lênin bảo vệ chủ nghĩa Mác?","o":["Chủ nghĩa tư bản đang trong quá trình hình thành","Chủ nghĩa tư bản tự do cạnh tranh","Chủ nghĩa tư bản độc quyền (đế quốc chủ nghĩa)","Chủ nghĩa tư bản độc quyền nhà nước"],"a":[2],"p":7,"e":"Lênin hoạt động khi chủ nghĩa tư bản chuyển sang giai đoạn độc quyền, tức giai đoạn đế quốc chủ nghĩa (cuối thế kỷ XIX, đầu thế kỷ XX). Ông bảo vệ và phát triển chủ nghĩa Mác để giải quyết các vấn đề của thời đại này.","w":{"a":"Giai đoạn hình thành chủ nghĩa tư bản là thời kỳ trước Mác.","b":"Chủ nghĩa tư bản tự do cạnh tranh là thời kỳ của Mác và Ăngghen.","d":"Chủ nghĩa tư bản độc quyền nhà nước phát triển mạnh sau Chiến tranh thế giới thứ hai, muộn hơn thời kỳ hoạt động của Lênin."}},{"s":1,"n":"35","q":"Trường phái triết học duy tâm nào ảnh hưởng trực tiếp đến sự ra đời của triết học Mác-Lênin?","o":["I. Kant","G. Hê-ghen","G. Béc-cơ-li","Platon"],"a":[1],"p":7,"e":"Phép biện chứng của Hê-ghen (duy tâm khách quan) ảnh hưởng trực tiếp đến triết học Mác. Mác cải tạo nó, bỏ lớp vỏ duy tâm và giữ lại hạt nhân hợp lý.","w":{"a":"Can-tơ thuộc triết học cổ điển Đức nhưng không phải nguồn trực tiếp của phép biện chứng Mác.","c":"Béc-cơ-li là đại diện duy tâm chủ quan ở Anh, không có ảnh hưởng trực tiếp.","d":"Pla-tông là nhà duy tâm khách quan cổ đại, cách thời Mác rất xa."}},{"s":1,"n":"36","q":"Đâu không phải là nguồn gốc ra đời của chủ nghĩa duy tâm?","o":["Sự tuyệt đối hóa vai trò của ý thức","Xem xét phiến diện, tuyệt đối hóa, thần thánh hóa một mặt, một đặc tính nào đó của quá trình nhận thức mang tính biện chứng của con người","Tuyệt đối hóa vai trò của lao động trí óc và của giai cấp thống trị","Sự phát triển của khoa học tự nhiên"],"a":[3],"p":7,"e":"Chủ nghĩa duy tâm có nguồn gốc nhận thức (tuyệt đối hóa một mặt của quá trình nhận thức) và nguồn gốc xã hội (lao động trí óc tách khỏi lao động chân tay, lợi ích giai cấp thống trị). Sự phát triển của khoa học tự nhiên không phải nguồn gốc của duy tâm.","w":{"a":"Tuyệt đối hóa vai trò của ý thức là nguồn gốc nhận thức của duy tâm.","b":"Xem xét phiến diện, thần thánh hóa một mặt của nhận thức là nguồn gốc nhận thức của duy tâm.","c":"Tuyệt đối hóa lao động trí óc và vai trò của giai cấp thống trị là nguồn gốc xã hội của duy tâm."}},{"s":1,"n":"37","q":"Trong thế giới quan tôn giáo, yếu tố nào đóng vai trò chủ yếu?","o":["Tri thức","Niềm tin","Tình cảm","Lễ giáo phong kiến"],"a":[1],"p":7,"e":"Trong thế giới quan tôn giáo, niềm tin vào lực lượng siêu nhiên giữ vai trò chủ yếu, còn tri thức và lý trí ở vị trí thứ yếu.","w":{"a":"Tri thức giữ vai trò chủ yếu ở thế giới quan khoa học.","c":"Tình cảm có mặt trong thế giới quan tôn giáo nhưng không giữ vai trò chủ yếu.","d":"Lễ giáo phong kiến là một hệ thống quy tắc xã hội, không phải yếu tố cấu thành thế giới quan tôn giáo."}},{"s":1,"n":"38","q":"Chọn một đáp án đúng và điền vào chỗ trống của mệnh đề sau đây? “Chủ nghĩa Mác-Lênin là hệ thống quan điểm và học thuyết khoa học của C.Mác, Ph.Ăngghen và sự ……… của V.I.Lênin.”","o":["Bảo tồn","Phát triển","Góp ý","Nghiên cứu"],"a":[1],"p":7,"e":"Chủ nghĩa Mác-Lênin là hệ thống quan điểm và học thuyết khoa học của C.Mác, Ph.Ăngghen, được V.I.Lênin phát triển. Lênin kế thừa và phát triển học thuyết trong điều kiện thời đại mới.","w":{"a":"Lênin đã phát triển học thuyết của Mác trong điều kiện mới, vượt khỏi việc bảo tồn.","c":"\"Góp ý\" không diễn tả đóng góp của Lênin.","d":"\"Nghiên cứu\" không diễn tả đúng vai trò của Lênin với học thuyết này."}},{"s":1,"n":"39","q":"Trong chủ nghĩa Mác - Lênin, bộ phận lý luận nào nghiên cứu những quy luật kinh tế của xã hội, đặc biệt là những quy luật kinh tế của quá trình ra đời, phát triển, suy tàn của phương thức sản xuất tư bản chủ nghĩa và sự ra đời, phát triển của phương thức sản xuất mới – phương thức sản xuất cộng sản chủ nghĩa?","o":["Triết học Mác - Lênin","Kinh tế chính trị Mác - Lênin","Chủ nghĩa xã hội khoa học","Lý luận nhận thức"],"a":[1],"p":7,"e":"Kinh tế chính trị Mác-Lênin nghiên cứu quy luật kinh tế của xã hội, đặc biệt quá trình ra đời, phát triển, suy tàn của phương thức sản xuất tư bản chủ nghĩa và sự ra đời của phương thức sản xuất cộng sản chủ nghĩa.","w":{"a":"Triết học Mác-Lênin nghiên cứu quy luật chung nhất của tự nhiên, xã hội và tư duy.","c":"Chủ nghĩa xã hội khoa học nghiên cứu quá trình cách mạng xã hội chủ nghĩa.","d":"Lý luận nhận thức là một bộ phận của triết học."}},{"s":1,"n":"40","q":"Đối tượng nghiên cứu của bộ phận chủ nghĩa xã hội khoa học trong chủ nghĩa Mác - Lênin là gì?","o":["Quá trình cách mạng xã hội chủ nghĩa","Xã hội loài người","Lịch sử phát triển của khoa học kỹ thuật","Phong trào công nhân"],"a":[0],"p":8,"e":"Chủ nghĩa xã hội khoa học nghiên cứu những quy luật chính trị - xã hội của quá trình phát sinh, hình thành và phát triển hình thái kinh tế - xã hội cộng sản chủ nghĩa. Nội dung cốt lõi là quá trình cách mạng xã hội chủ nghĩa.","w":{"b":"Xã hội loài người là đối tượng rộng hơn, thuộc nhiều ngành khoa học.","c":"Lịch sử phát triển của khoa học kỹ thuật thuộc lịch sử khoa học.","d":"Phong trào công nhân là một nội dung liên quan, không phải đối tượng chính của bộ môn."}},{"s":1,"n":"41","q":"Trong ba bộ phận lý luận cấu thành chủ nghĩa Mác - Lênin, triết học có vai trò như thế nào?","o":["Chỉ là những nghiên cứu khoa học đầu tiên của C.Mác","Cơ sở lý luận, là thế giới quan và phương pháp luận khoa học cho những bộ phận còn lại","Chỉ chuyên nghiên cứu về những vấn đề của giới tự nhiên","Là vũ khí lý luận để chống lại những tư tưởng triết học khác"],"a":[1],"p":8,"e":"Chủ nghĩa Mác-Lênin có ba bộ phận: triết học, kinh tế chính trị và chủ nghĩa xã hội khoa học. Triết học là cơ sở lý luận, cung cấp thế giới quan và phương pháp luận khoa học cho hai bộ phận còn lại.","w":{"a":"Triết học Mác là một hệ thống lý luận hoàn chỉnh, vượt khỏi mức những nghiên cứu đầu tiên.","c":"Triết học nghiên cứu cả tự nhiên, xã hội và tư duy, không riêng giới tự nhiên.","d":"Đấu tranh với các tư tưởng khác là một nhiệm vụ, nhưng không nêu được vai trò cơ sở của triết học đối với hai bộ phận kia."}},{"s":1,"n":"42","q":"Giá trị nhân văn của chủ nghĩa Mác – Lênin là gì?","o":["Xác định bản chất con người và lịch sử phát triển của nhân loại","Tầm quan trọng của con người trong lực lượng sản xuất đối với sự phát triển văn minh nhân loại","Giải phóng nhân loại khỏi nghèo nàn, lạc hậu và bất công","Thực hiện giải phóng giai cấp, giải phóng nhân dân lao động và giải phóng con người khỏi ách áp bức, bóc lột bằng cách mạng vô sản"],"a":[3],"p":8,"e":"Giá trị nhân văn của chủ nghĩa Mác-Lênin là mục tiêu giải phóng giai cấp, giải phóng nhân dân lao động và giải phóng con người khỏi áp bức, bóc lột bằng cách mạng vô sản.","w":{"a":"Xác định bản chất con người và lịch sử nhân loại là nội dung nhận thức, chưa nêu mục tiêu nhân văn.","b":"Tầm quan trọng của con người trong lực lượng sản xuất là nội dung của chủ nghĩa duy vật lịch sử.","c":"Giải phóng khỏi nghèo nàn, lạc hậu và bất công là cách nói chung chung, chưa chỉ ra con đường và lực lượng thực hiện."}},{"s":1,"n":"43","q":"Quá trình ra đời và phát triển của chủ nghĩa Mác-Lênin được chia làm mấy giai đoạn chính?","o":["Ba giai đoạn: Giai đoạn C.Mác khởi xướng; Giai đoạn Ph.Ăngghen bổ sung; Giai đoạn V.I.Lênin phát triển","Ba giai đoạn: Giai đoạn C.Mác và Ph.Ăngghen; Giai đoạn phát triển của V.I.Lênin; Giai đoạn vận dụng ở các nước XHCN","Hai giai đoạn: Giai đoạn truyền thống từ C.Mác đến V.I.Lênin; Giai đoạn hiện đại từ sau chiến tranh thế giới lần II đến nay","Hai giai đoạn: Giai đoạn hình thành, phát triển chủ nghĩa Mác (do C.Mác và Ph.Ăngghen thực hiện); Giai đoạn bảo vệ, phát triển chủ nghĩa Mác thành chủ nghĩa Mác-Lênin (do V.I.Lênin thực hiện)"],"a":[3],"p":8,"e":"Giáo trình chia quá trình ra đời và phát triển của chủ nghĩa Mác-Lênin làm hai giai đoạn: giai đoạn hình thành, phát triển chủ nghĩa Mác do C.Mác và Ph.Ăngghen thực hiện, và giai đoạn bảo vệ, phát triển chủ nghĩa Mác thành chủ nghĩa Mác-Lênin do V.I.Lênin thực hiện.","w":{"a":"Chia thành ba giai đoạn tách riêng Mác và Ăngghen là cách chia không đúng với giáo trình.","b":"Giai đoạn vận dụng ở các nước xã hội chủ nghĩa không phải một giai đoạn hình thành lý luận.","c":"Giai đoạn \"truyền thống\" và \"hiện đại\" không phải cách phân chia của giáo trình."}},{"s":1,"n":"44","q":"Hàng loạt cuộc đấu tranh của công nhân chống lại chủ nghĩa tư bản trong những năm 30-40 của thế kỷ XX đã cho thấy giai cấp công nhân có những thay đổi về địa vị chính trị như thế nào?","o":["Giai cấp công nhân trở thành một lực lượng chính trị độc lập trong xã hội tư bản","Giai cấp công nhân trở thành một lực lượng chủ yếu của xã hội tư bản","Giai cấp công nhân trở thành một giai cấp đối lập với giai cấp tư sản","Giai cấp công nhân trở thành lực lượng sản xuất trong xã hội tư bản"],"a":[0],"p":8,"e":"Những cuộc đấu tranh lớn của công nhân (khởi nghĩa Li-ông, phong trào Hiến chương, khởi nghĩa thợ dệt Xi-lê-di) cho thấy giai cấp công nhân đã trở thành một lực lượng chính trị độc lập trong xã hội tư bản.","w":{"b":"Lực lượng chủ yếu của xã hội tư bản về kinh tế vẫn là giai cấp tư sản nắm tư liệu sản xuất.","c":"Đối lập với giai cấp tư sản là quan hệ có từ khi công nhân ra đời. Điểm mới là vị thế chính trị độc lập.","d":"Công nhân là người trực tiếp tạo ra lực lượng sản xuất, nhưng điều đó không phải \"thay đổi địa vị chính trị\"."},"f":"Đề ghi \"thế kỷ XX\", nhưng các cuộc đấu tranh này diễn ra vào những năm 30-40 của thế kỷ XIX, nên có thể là lỗi đánh máy trong file gốc."},{"s":1,"n":"45","q":"Trên lĩnh vực xã hội, hoạt động nào vừa là tiền đề vừa là mục đích thực tiễn chủ yếu nhất của chủ nghĩa Mác?","o":["Cuộc cách mạng khoa học kỹ thuật lần thứ nhất","Sự ra đời của một số ngành khoa học xã hội","Thực tiễn các phong trào cách mạng của giai cấp công nhân","Thực tiễn các phong trào đấu tranh giành độc lập của các nước thuộc địa"],"a":[2],"p":9,"e":"Thực tiễn các phong trào cách mạng của giai cấp công nhân vừa cung cấp cơ sở thực tiễn cho học thuyết Mác, vừa là mục đích mà học thuyết hướng tới là giải phóng giai cấp công nhân.","w":{"a":"Cách mạng khoa học kỹ thuật lần thứ nhất là tiền đề về sản xuất, không phải mục đích thực tiễn.","b":"Sự ra đời của một số ngành khoa học xã hội là điều kiện lý luận.","d":"Phong trào giành độc lập ở các nước thuộc địa không phải tiền đề của chủ nghĩa Mác lúc hình thành."}},{"s":1,"n":"46","q":"Trong triết học Hêghen, C.Mác và Ph.Ăngghen đã kế thừa nội dung nào là chủ yếu nhất?","o":["Chủ nghĩa duy tâm khách quan","Triết học pháp quyền","Mỹ học","Phép biện chứng"],"a":[3],"p":9,"e":"Từ triết học Hê-ghen, Mác và Ăngghen kế thừa chủ yếu phép biện chứng, coi đó là \"hạt nhân hợp lý\", sau đó cải tạo nó trên nền tảng duy vật.","w":{"a":"Chủ nghĩa duy tâm khách quan là phần bị loại bỏ.","b":"Triết học pháp quyền của Hê-ghen bị Mác phê phán.","c":"Mỹ học không phải nội dung được kế thừa chủ yếu."}},{"s":1,"n":"47","q":"Bước chuyển biến của C.Mác và Ph.Ăngghen từ thế giới quan duy tâm sang thế giới quan duy vật, từ lập trường chủ nghĩa dân chủ - cách mạng sang lập trường chủ nghĩa cộng sản, xuất phát từ sự kế thừa biện chứng khuynh hướng triết học nào?","o":["Triết học duy vật nhân bản L. Phoi-ơ-bắc","Chủ nghĩa xã hội không tưởng phê phán Pháp","Chủ nghĩa vô chính phủ Pru-đông","Chủ nghĩa duy vật duy lý Pháp thế kỷ XVII – XVIII"],"a":[0],"p":9,"e":"Mác và Ăngghen chuyển từ thế giới quan duy tâm sang duy vật nhờ kế thừa biện chứng chủ nghĩa duy vật nhân bản của L.Phoi-ơ-bắc, khi các ông thấy tính chất duy tâm của triết học Hê-ghen.","w":{"b":"Chủ nghĩa xã hội không tưởng Pháp giúp chuyển sang lập trường cộng sản, không phải chuyển sang thế giới quan duy vật.","c":"Chủ nghĩa vô chính phủ của Pru-đông bị Mác phê phán trong \"Sự khốn cùng của triết học\".","d":"Chủ nghĩa duy vật Pháp thế kỷ XVII-XVIII là nguồn tham khảo, nhưng ảnh hưởng trực tiếp là Phoi-ơ-bắc."}},{"s":1,"n":"48","q":"Khi phê phán những hạn chế trong học thuyết giá trị của A. Smít, C.Mác đã xây dựng nên lý luận gì?","o":["Học thuyết về đấu tranh giai cấp trong xã hội có giai cấp","Lý luận về giá trị thặng dư, luận chứng khoa học về bản chất bóc lột của chủ nghĩa tư bản","Học thuyết về sứ mệnh lịch sử của giai cấp công nhân","Lý luận về chủ nghĩa tư bản độc quyền và chủ nghĩa tư bản độc quyền nhà nước"],"a":[1],"p":9,"e":"Khi phê phán học thuyết giá trị của A.Smít và Ri-các-đô, Mác xây dựng lý luận về giá trị thặng dư, chứng minh bản chất bóc lột của chủ nghĩa tư bản.","w":{"a":"Học thuyết đấu tranh giai cấp được Mác tiếp thu và phát triển, nhưng không xuất phát từ việc phê phán học thuyết giá trị.","c":"Học thuyết về sứ mệnh lịch sử của giai cấp công nhân thuộc chủ nghĩa xã hội khoa học.","d":"Lý luận về chủ nghĩa tư bản độc quyền là của Lênin."}},{"s":1,"n":"49","q":"Tư tưởng về những giai đoạn trong quá trình xây dựng chủ nghĩa cộng sản; thời kỳ quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội của chủ nghĩa Mác - Lênin được hình thành vào giai đoạn nào?","o":["Khi C.Mác còn tham gia hoạt động trong phái Hê-ghen Trẻ","Những năm 1842 – l843","Những năm 1847 – 1848","Từ năm l849 đến năm 1895"],"a":[3],"p":9,"e":"Tư tưởng về các giai đoạn xây dựng chủ nghĩa cộng sản và thời kỳ quá độ được hình thành từ năm 1849 đến 1895, khi Mác và Ăngghen tổng kết các phong trào cách mạng, nhất là Công xã Pa-ri.","w":{"a":"Khi còn ở phái Hê-ghen trẻ, Mác chưa có thế giới quan cộng sản.","b":"Giai đoạn 1842-1843 là bước đầu chuyển biến tư tưởng.","c":"Giai đoạn 1847-1848 là lúc hình thành những nguyên lý cơ bản, đánh dấu bằng Tuyên ngôn của Đảng Cộng sản."}},{"s":1,"n":"50","q":"Tại sao ở Tây Âu thời cận đại, triết học duy vật lại phát triển mạnh mẽ?","o":["Khoa học tự nhiên phát triển mạnh mẽ","Do ảnh hưởng của chủ nghĩa duy vật siêu hình","Các nhà triết học có sự phân hóa mạnh mẽ","Nhận thức con người phát triển lên một trình độ cao hơn"],"a":[0],"p":9,"e":"Ở Tây Âu thời cận đại, khoa học tự nhiên phát triển mạnh (cơ học, thiên văn học, toán học), tạo cơ sở cho chủ nghĩa duy vật phát triển.","w":{"b":"Chủ nghĩa duy vật siêu hình là một hình thức của duy vật, không phải nguyên nhân khiến nó phát triển.","c":"Sự phân hóa giữa các triết gia là kết quả, không phải nguyên nhân.","d":"Nhận thức nói chung là khái niệm rộng. Điều thúc đẩy trực tiếp là các thành tựu khoa học tự nhiên."}},{"s":1,"n":"51","q":"Triết học xuất hiện vào khoảng thời gian nào?","o":["Thế kỷ IV (Trước công nguyên)","Thế kỷ VI (Trước công nguyên)","Thế kỷ VII (Trước công nguyên)","Thế kỷ IX (Trước công nguyên)"],"a":[1],"p":10,"e":"File chọn đáp án thế kỷ VI trước Công nguyên. Giáo trình nêu triết học xuất hiện khoảng thế kỷ VIII đến VI trước Công nguyên, và thế kỷ VI là mốc gắn với các nhà triết học đầu tiên ở Hy Lạp, Ấn Độ và Trung Quốc.","w":{"a":"Thế kỷ IV TCN là thời Aristốt, triết học đã phát triển từ trước.","c":"Thế kỷ VII TCN nằm trong khoảng này, nhưng file không chọn mốc đó.","d":"Thế kỷ IX TCN sớm hơn mốc ra đời của triết học."}},{"s":1,"n":"52","q":"Những câu chuyện như Truyền thuyết Âu Cơ – Lạc Long Quân, truyền thuyết thánh Gióng của Việt Nam là biểu hiện của hình thức thế giới quan nào sau đây?","o":["Thế giới quan thần thoại","Thế giới quan tôn giáo","Thế giới quan triết học","Biểu hiện của cả ba hình thức thế giới quan trên"],"a":[0],"p":10,"e":"Truyền thuyết Âu Cơ - Lạc Long Quân và Thánh Gióng giải thích nguồn gốc dân tộc và hiện tượng tự nhiên bằng trí tưởng tượng, đan xen cái thực và cái ảo. Đó là thế giới quan thần thoại.","w":{"b":"Thế giới quan tôn giáo dựa vào niềm tin vào đấng siêu nhiên và có giáo lý, nghi lễ.","c":"Thế giới quan triết học dựa vào lập luận lý luận, không dùng hình tượng kỳ ảo.","d":"Mỗi câu chuyện chỉ thuộc một hình thức thế giới quan."}},{"s":1,"n":"53","q":"Tại sao nói sự ra đời của chủ nghĩa Mác là hiện tượng hợp quy luật?","o":["Đó là sản phẩm của tình hình kinh tế-xã hội những năm 40 của thế kỷ XIX","Là sự tổng kết những giá trị của tri thức nhân loại thể hiện trong các lĩnh vực khoa học","Là tài năng bẩm sinh của những người sáng lập ra nó","Là hiện tượng khách quan"],"a":[1],"p":10,"e":"Chủ nghĩa Mác ra đời là hợp quy luật vì nó là sự tổng kết những giá trị của tri thức nhân loại trong các lĩnh vực khoa học và tư tưởng, kế thừa ba nguồn gốc lý luận và ba phát minh khoa học tự nhiên.","w":{"a":"Tình hình kinh tế - xã hội là điều kiện thực tiễn, câu hỏi hướng tới tính kế thừa tri thức.","c":"Tài năng bẩm sinh là cách giải thích duy tâm.","d":"\"Hiện tượng khách quan\" chỉ nhắc lại câu hỏi, chưa giải thích vì sao."}},{"s":1,"n":"54","q":"Đâu không phải là vai trò của những tiền đề về khoa học tự nhiên đối với sự ra đời chủ nghĩa Mác?","o":["Bác bỏ tư duy siêu hình và vai trò của “Đấng Sáng tạo”","Khẳng định tính đúng đắn của quan điểm duy vật biện chứng về bản chất của thế giới","Khẳng định tính khoa học của quan điểm duy vật biện chứng trong nhận thức và trong thực tiễn","Giúp Mác- Ăngghen có điều kiện tiếp cận với nguồn tri thức hiện đại"],"a":[3],"p":10,"e":"Các tiền đề khoa học tự nhiên bác bỏ tư duy siêu hình và vai trò của \"Đấng Sáng tạo\", khẳng định quan điểm duy vật biện chứng về bản chất thế giới và tính khoa học của nó. Việc giúp Mác - Ăngghen tiếp cận nguồn tri thức hiện đại không phải vai trò triết học của các tiền đề này.","w":{"a":"Đây là một vai trò của các tiền đề khoa học tự nhiên.","b":"Đây là một vai trò của các tiền đề khoa học tự nhiên.","c":"Đây là một vai trò của các tiền đề khoa học tự nhiên."}},{"s":1,"n":"55","q":"Đâu là hạn chế lớn trong triết học của Hê-ghen đã được chủ nghĩa Mác khắc phục?","o":["Tư duy siêu hình","Nhận thức về thế giới còn ngây thơ chất phác","Tính duy tâm","Phủ định “sạch trơn” những thành tựu triết học trước đó"],"a":[2],"p":10,"e":"Hạn chế lớn của triết học Hê-ghen là tính duy tâm: ông coi \"ý niệm tuyệt đối\" có trước và sinh ra thế giới. Chủ nghĩa Mác khắc phục bằng cách đặt phép biện chứng trên nền tảng duy vật.","w":{"a":"Hê-ghen có tư duy biện chứng, nên \"tư duy siêu hình\" không phải đặc điểm của ông.","b":"Nhận thức \"ngây thơ chất phác\" là đặc điểm của duy vật cổ đại.","d":"Phủ định \"sạch trơn\" là thái độ của chủ nghĩa siêu hình, không phải của Hê-ghen."}},{"s":1,"n":"56","q":"Triết học có tính giai cấp không?","o":["Không có","Chỉ có trong xã hội Tư bản","Có tính giai cấp trong mọi trường phái triết học","Chỉ có trong một số hệ thống triết học"],"a":[2],"p":10,"e":"Triết học có tính giai cấp trong mọi trường phái. Mỗi hệ thống triết học đều phản ánh lợi ích, lập trường của một giai cấp hay tầng lớp xã hội nhất định.","w":{"a":"Cho rằng triết học \"không có\" tính giai cấp là quan điểm phi giai cấp, không đúng với triết học Mác.","b":"Tính giai cấp có ở mọi xã hội có giai cấp, không giới hạn ở xã hội tư bản.","d":"Tính giai cấp có ở mọi hệ thống triết học, không giới hạn ở một số hệ thống."}},{"s":1,"n":"57","q":"Thế giới quan là gì?","o":["Thế giới quan là sự phán ánh của sự tồn tại vật chất và xã hội của con người dưới hình thức các quan niệm, quan điểm chung","Thế giới quan không phụ thuộc vào trình độ hiểu biết của con người đã đạt được trong một giai đoạn lịch sử nhất định","Thế giới quan là quan điểm của giai cấp thống trị xã hội","Thế giới quan là nội tâm, là những suy nghĩ bên trong của con người"],"a":[0],"p":11,"e":"Thế giới quan là sự phản ánh tồn tại vật chất và xã hội của con người dưới dạng các quan niệm, quan điểm chung về thế giới và về vị trí của con người trong thế giới đó.","w":{"b":"Thế giới quan phụ thuộc vào trình độ hiểu biết của con người trong từng giai đoạn lịch sử.","c":"Thế giới quan có ở mọi cá nhân và cộng đồng. Quan điểm của giai cấp thống trị chỉ là một trường hợp.","d":"Thế giới quan phản ánh tồn tại bên ngoài, không phải chỉ là suy nghĩ nội tâm."}},{"s":1,"n":"58","q":"Theo quan điểm triết học mácxít, triết học ra đời trong điều kiện nào?","o":["Xã hội phân chia thành giai cấp","Khi xuất hiện tầng lớp trí thức ngạc nhiên, hoài nghi về mọi thứ xung quanh","Tư duy của con người đạt trình độ khái quát cao và xuất hiện tầng lớp trí thức","Khi con người biết ngạc nhiên và hoài nghi"],"a":[2],"p":11,"e":"Theo triết học mácxít, triết học ra đời khi tư duy của con người đạt trình độ khái quát cao và xuất hiện tầng lớp trí thức (lao động trí óc tách khỏi lao động chân tay).","w":{"a":"Xã hội phân chia giai cấp là một điều kiện đi kèm, chưa đủ để nêu hai điều kiện nhận thức và xã hội.","b":"Tầng lớp trí thức thiếu điều kiện về trình độ tư duy nên chưa đủ.","d":"Sự ngạc nhiên và hoài nghi là cách giải thích về động cơ của triết gia, không phải điều kiện ra đời theo triết học Mác."}},{"s":1,"n":"59","q":"Xét về đối tượng nghiên cứu, Triết học khác với Khoa học cụ thể ở chỗ nào?","o":["Triết học nghiên cứu về con người, còn Khoa học cụ thể chỉ nghiên cứu tự nhiên","Khoa học cụ thể tìm hiểu bản chất của thế giới, còn Triết học khám phá quy luật của thế giới","Khoa học cụ thể chỉ nghiên cứu một mặt của thế giới còn Triết học nghiên cứu toàn bộ thế giời trong tính chỉnh thể của nó","Khoa học cụ thể khám phá ra mọi quy luật của thế giới, còn Triết học khám phá ra mọi cấp độ bản chất của thế giới"],"a":[2],"p":11,"e":"Khoa học cụ thể chỉ nghiên cứu một mặt, một lĩnh vực của thế giới. Triết học nghiên cứu thế giới như một chỉnh thể và tìm ra những quy luật chung nhất.","w":{"a":"Khoa học cụ thể gồm cả khoa học tự nhiên và khoa học xã hội.","b":"Phương án này gán sai chức năng cho hai bên.","d":"Khoa học cụ thể không \"khám phá mọi quy luật\"."}},{"s":1,"n":"60","q":"Những phát minh của Khoa học tự nhiên nửa đầu thế kỷ XIX đã đem lại cơ sở khoa học cho sự phát triển của điều gì sau đây?","o":["Sự phát triển phương pháp siêu hình và chủ nghĩa cơ giới lên một trình độ mới","Sự phát triển phép biện chứng từ tự phát chuyển thành tự giác","Sự phát triển phép biện chứng duy tâm thành chủ nghĩa tư biện, thần bí","Sự phát triển tư duy biện chứng giúp nó thoát khỏi tính tự phát và cởi bỏ lớp vỏ thần bí duy tâm"],"a":[3],"p":11,"e":"Phát minh khoa học tự nhiên nửa đầu thế kỷ XIX cho thấy tự nhiên vận động, phát triển và liên hệ với nhau. Tư duy biện chứng nhờ đó thoát khỏi tính tự phát và cởi bỏ lớp vỏ thần bí duy tâm.","w":{"a":"Các phát minh làm suy yếu phương pháp siêu hình, không giúp nó phát triển.","b":"Phương án này cũng nói đến bước từ tự phát sang tự giác, nhưng đáp án d nêu đầy đủ hơn: thoát khỏi tính tự phát và cởi bỏ lớp vỏ thần bí duy tâm của phép biện chứng Hê-ghen.","c":"Các phát minh không đưa phép biện chứng sang chủ nghĩa tư biện thần bí."}},{"s":1,"n":"61","q":"Ở phương Tây thời trung cổ con người chịu sự chi phối của quan niệm thế giới quan nào?","o":["Tôn giáo","Huyền thoại","Khoa học","Triết học"],"a":[0],"p":11,"e":"Ở Tây Âu thời trung cổ, tôn giáo (Kitô giáo) chi phối đời sống tinh thần và triết học bị thần học chi phối.","w":{"b":"Huyền thoại là đặc trưng thời nguyên thủy.","c":"Khoa học bị kìm hãm vào thời kỳ này.","d":"Triết học thời kỳ này nằm dưới sự chi phối của thần học, nên không phải thế giới quan chi phối."}},{"s":1,"n":"62","q":"Thành tựu vĩ đại nhất của cuộc cách mạng trong triết học do Các Mác và Ănghen thực hiện là gì?","o":["Xây dựng phép biện chứng vật, chấm dứt sự thống trị của phép biện chứng duy tâm của Hêghen","Xây dựng chủ nghĩa duy vật về lịch sử, làm sáng tỏ lịch sử tồn tại và phát triển của xã hội loài người","Phát hiện ra lịch sử phát triển của xã hội loài người là lịch sử đấu tranh giai cấp, và đấu tranh giai cấp sẽ dẫn đến cách mạng vô sản nhằm xóa bỏ chế độ người bóc lột người","Phát hiện ra giá trị thặng dư, làm sáng tỏ bản chất của xã hội tư bản chủ nghĩa"],"a":[0],"p":11,"e":"File gốc đánh dấu đáp án A. Câu này gần giống câu \"lý luận nào của C.Mác được xem là thành tựu vĩ đại nhất\" ở trên, nơi file chọn chủ nghĩa duy vật lịch sử. Cần ghi nhớ cả hai cách: Mác và Ăngghen xây dựng chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử.","w":{"b":"Chủ nghĩa duy vật lịch sử là phát kiến được giáo trình nhiều nơi gọi là vĩ đại nhất.","c":"Lịch sử là lịch sử đấu tranh giai cấp là một luận điểm thuộc chủ nghĩa duy vật lịch sử.","d":"Giá trị thặng dư là thành tựu về kinh tế chính trị, không thuộc cách mạng trong triết học."},"f":"File gốc chọn A, nhưng câu này dễ nhầm với phương án B (chủ nghĩa duy vật lịch sử). Khi thi nên đối chiếu theo giáo trình của trường."},{"s":1,"n":"63","q":"Mối quan hệ giữa triết học duy vật biện chứng (THDVBC) với khoa học tự nhiên (KHTN) là gì?","o":["THDVBC là khoa học của mọi ngành KHTN","Các phát minh về KHTN là cơ sở của các luận điểm của THDVBC, còn THDVBC là cơ sở thế giới quan và phương pháp luận chung cho KHTN","KHTN là cơ sở duy nhất cho sự hình thành và phát triển của THDVBC","THDVBC là cơ sở duy nhất cho sự hình thành và phát triển của KHTN"],"a":[1],"p":12,"e":"Khoa học tự nhiên và triết học duy vật biện chứng tác động qua lại: phát minh của khoa học tự nhiên là cơ sở cho các luận điểm triết học, còn triết học cung cấp thế giới quan và phương pháp luận chung cho khoa học tự nhiên.","w":{"a":"Triết học không phải khoa học của mọi ngành khoa học tự nhiên.","c":"Khoa học tự nhiên không phải cơ sở duy nhất, còn có tiền đề lý luận và thực tiễn.","d":"Triết học không phải cơ sở duy nhất cho sự phát triển của khoa học tự nhiên."}},{"s":1,"n":"64","q":"Nội dung nào sau đây phản ánh giá trị thực tiễn chính trị xã hội thì chủ nghĩa Mác – Lênin?","o":["Sự hình thành và phát triển trên cơ sở kế thừa những giá trị tư tưởng nhân loại và tổng kết thực tiễn thời đại","Thế giới quan, phương pháp luận phổ biến của nhận thức khoa học và thực tiễn cách mạng","Khoa học về sự nghiệp giải phóng giai cấp vô sản, giải phóng nhân dân lao động khỏi chế độ áp bức, bóc lột và tiến tới giải phóng con người","Cung cấp cơ sở thực tiễn cho sự phát triển của các khoa học cụ thể"],"a":[2],"p":12,"e":"Giá trị thực tiễn chính trị - xã hội của chủ nghĩa Mác-Lênin là khoa học về sự nghiệp giải phóng giai cấp vô sản, nhân dân lao động và con người khỏi áp bức, bóc lột.","w":{"a":"Đây là nguồn gốc hình thành của chủ nghĩa Mác-Lênin.","b":"Đây là giá trị lý luận, phương pháp luận.","d":"Cung cấp cơ sở cho khoa học cụ thể là giá trị về mặt khoa học."}},{"s":1,"n":"65","q":"Theo nhận xét của C.Mác, những hạn chế cơ bản của chủ nghĩa xã hội không tưởng phê phán Pháp cần phải khắc phục là gì?","o":["Không luận chứng được một cách khoa học về bản chất của chủ nghĩa tư bản","Không phát hiện được quy luật vận động, phát triển của chủ nghĩa tư bản","Không nhận thức được vai trò, sứ mệnh của giai cấp công nhân với tư cách là lực lượng xã hội có khả năng xóa bỏ chủ nghĩa tư bản để xây dựng một xã hội bình đẳng, không có bóc lột","A,B,C"],"a":[3],"p":12,"e":"Mác nhận xét chủ nghĩa xã hội không tưởng có cả ba hạn chế: không luận chứng khoa học về bản chất chủ nghĩa tư bản, không phát hiện quy luật vận động của nó, và không nhận thức được sứ mệnh lịch sử của giai cấp công nhân.","w":{"a":"Đây là một hạn chế của chủ nghĩa xã hội không tưởng.","b":"Đây là một hạn chế của chủ nghĩa xã hội không tưởng.","c":"Đây là một hạn chế của chủ nghĩa xã hội không tưởng."}},{"s":1,"n":"66","q":"Ưu điểm lớn nhất của những trào chủ nghĩa xã hội không tưởng là gì?","o":["Khái quát được sự phát triển lịch sử nhân loại","Tinh thần nhân đạo cao cả","Dám đối đầu trực tiếp với chủ nghĩa tư bản","Xác định được sứ mệnh lịch sử của giai cấp công nhân"],"a":[1],"p":12,"e":"Ưu điểm lớn nhất của chủ nghĩa xã hội không tưởng là tinh thần nhân đạo cao cả: họ thương cảm người lao động và phê phán sự bất công của xã hội tư bản.","w":{"a":"Khái quát sự phát triển lịch sử nhân loại là công lao của chủ nghĩa duy vật lịch sử.","c":"Họ chủ yếu thuyết phục, không đối đầu trực tiếp với chủ nghĩa tư bản.","d":"Họ chưa xác định được sứ mệnh lịch sử của giai cấp công nhân, đây là hạn chế."}},{"s":1,"n":"67","q":"(ELO 3) Yêu cầu cơ bản của việc học tập, nghiên cứu triết học Mác- Lênin?","o":["Hiểu đúng thực chất, tinh thần của môn học; hoàn thiện mình trong đời sống cá nhân cũng như trong đời sống cộng đồng xã hội.","Xem những quan điểm của triết học Mác- Lênin là luôn đúng với mọi thời đại thực tiễn của cách mạng Việt Nam","Vận dụng nguyên vẹn toàn bộ chủ nghĩa Mác- Lênin trong mọi tình huống cách mạng","Chỉ học những kiến thức trọng tâm, những nguyên lý cơ bản"],"a":[0],"p":12,"e":"Yêu cầu cơ bản khi học triết học Mác-Lênin là hiểu đúng thực chất, tinh thần của môn học để hoàn thiện bản thân trong đời sống cá nhân và cộng đồng.","w":{"b":"Không có quan điểm nào \"luôn đúng với mọi thời đại\", học thuyết cần được vận dụng sáng tạo.","c":"Vận dụng nguyên vẹn trong mọi tình huống là giáo điều.","d":"Chỉ học trọng tâm thì không hiểu đầy đủ hệ thống."}},{"s":1,"n":"68","q":"(ELO 3) Tác phẩm nào sau đây được xây dựng trên cơ sở thế giới quan thần thoại?","o":["Tấm Cám","Thần Trụ trời","Tây du ký","Truyện Kiều"],"a":[1],"p":12,"e":"\"Thần Trụ Trời\" là truyện thần thoại giải thích sự hình thành trời đất bằng hình tượng một vị thần, đặc trưng của thế giới quan thần thoại.","w":{"a":"Tấm Cám là truyện cổ tích về đời sống xã hội.","c":"Tây du ký là tiểu thuyết có yếu tố thần thoại, tôn giáo nhưng không xây dựng trên thế giới quan thần thoại nguyên thủy.","d":"Truyện Kiều là truyện thơ hiện thực."}},{"s":1,"n":"69","q":"(ELO 3). Tác phẩm nào sau đây được xây dựng trên quan niệm siêu hình?","o":["Tấm Cám","Thầy bói xem voi","Sọ dừa","Bình ngô đại cáo"],"a":[1],"p":13,"e":"\"Thầy bói xem voi\" kể năm ông thầy mỗi người chỉ sờ một bộ phận rồi kết luận cả con voi. Đây là cách nhìn phiến diện, tách rời từng mặt, tiêu biểu cho quan niệm siêu hình.","w":{"a":"Tấm Cám là truyện cổ tích về thiện - ác.","c":"Sọ Dừa là truyện cổ tích.","d":"Bình Ngô đại cáo là văn kiện chính trị - quân sự."}},{"s":2,"n":"1","q":"Quan điểm của chủ nghĩa duy vật biện chứng về đứng im là gì?","o":["Đứng im là không vận động","Đứng im là tạm thời","Đứng im là vận động trong thế cân bằng ổn định tuyệt đối","Đứng im là một hình thức đặc biệt của vận động, đứng im là tương đối"],"a":[3],"p":14,"e":"Chủ nghĩa duy vật biện chứng coi đứng im là một hình thức đặc biệt của vận động: vận động trong trạng thái cân bằng, ổn định tương đối. Vì vậy đứng im chỉ có tính tương đối, tạm thời.","w":{"a":"Đứng im không phải không vận động.","b":"\"Tạm thời\" chỉ nêu một tính chất, chưa nêu bản chất.","c":"Cân bằng ổn định tuyệt đối là quan điểm siêu hình."}},{"s":2,"n":"2","q":"Không gian là hình thức tồn tại của vật chất xét ở góc độ nào?","o":["Trường tính","Quảng tính","Chiều cao","Chiều sâu"],"a":[1],"p":14,"e":"Không gian là hình thức tồn tại của vật chất xét ở quảng tính: sự cùng tồn tại, trật tự, kết cấu và quy mô của các sự vật.","w":{"a":"Trường tính là thuộc tính của thời gian.","c":"Chiều cao chỉ là một số đo của không gian.","d":"Chiều sâu cũng chỉ là một số đo của không gian."}},{"s":12,"n":"72","q":"Thời gian là hình thức tồn tại của vật chất xét ở góc độ nào?","o":["Trường tính","Quảng tính","Chiều cao","Chiều sâu"],"a":[0],"p":14,"g":2,"e":"Thời gian là hình thức tồn tại của vật chất xét ở trường tính: sự kế tiếp, diễn tiến của các quá trình.","w":{"b":"Quảng tính là thuộc tính của không gian.","c":"Chiều cao là số đo của không gian.","d":"Chiều sâu là số đo của không gian."}},{"s":2,"n":"3","q":"Trong lịch sử triết học, chủ nghĩa duy tâm có những hình thức cơ bản nào?","o":["Chủ nghĩa hoài nghi và thuyết bất khả tri","Chủ nghĩa duy tâm chủ quan và chủ nghĩa duy tâm khách quan","Chủ nghĩa duy linh và thần học","Chủ nghĩa thực chứng và chủ nghĩa thực dụng"],"a":[1],"p":14,"e":"Chủ nghĩa duy tâm có hai hình thức cơ bản: duy tâm chủ quan (coi cảm giác, ý thức con người có trước) và duy tâm khách quan (coi ý thức, tinh thần có trước thế giới và tồn tại ngoài con người).","w":{"a":"Chủ nghĩa hoài nghi và thuyết bất khả tri là quan điểm về khả năng nhận thức.","c":"Chủ nghĩa duy linh và thần học là các biểu hiện cụ thể, không phải hai hình thức cơ bản.","d":"Chủ nghĩa thực chứng và thực dụng là các trào lưu triết học hiện đại."}},{"s":2,"n":"4","q":"Trong lịch sử triết học, chủ nghĩa duy vật có những hình thức cơ bản nào?","o":["Chủ nghĩa duy vật chất phác, chủ nghĩa duy vật siêu hình, chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật duy cảm, chủ nghĩa duy vật duy lý, chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng, chủ nghĩa kinh nghiệm, chủ nghĩa duy vật duy cảm","Chủ nghĩa duy vật biện chứng, chủ nghĩa duy vật thô thiển, chủ nghĩa duy vật kinh tế"],"a":[0],"p":14,"e":"Chủ nghĩa duy vật có ba hình thức cơ bản: chủ nghĩa duy vật chất phác (cổ đại), chủ nghĩa duy vật siêu hình (thế kỷ XV-XVIII) và chủ nghĩa duy vật biện chứng (do Mác, Ăngghen sáng lập).","w":{"b":"\"Duy cảm\", \"duy lý\" không phải tên các hình thức cơ bản của chủ nghĩa duy vật.","c":"Chủ nghĩa kinh nghiệm là một trào lưu về nhận thức luận.","d":"\"Duy vật thô thiển\" và \"duy vật kinh tế\" không phải các hình thức cơ bản."}},{"s":2,"n":"5","q":"Khẳng định bản chất của thế giới là vật chất, thế giới thống nhất ở tính vật chất của nó. Đó là quan điểm của trường phái triết học nào?","o":["Chủ nghĩa duy vật","Chủ nghĩa duy vật biện chứng Mác - Lênin","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan"],"a":[1],"p":14,"e":"Khẳng định bản chất thế giới là vật chất và thế giới thống nhất ở tính vật chất là quan điểm của chủ nghĩa duy vật biện chứng Mác-Lênin, vì nó coi vật chất tồn tại khách quan và vận động, phát triển theo quy luật.","w":{"a":"Chủ nghĩa duy vật nói chung cũng coi thế giới là vật chất, nhưng cách diễn đạt đầy đủ là duy vật biện chứng.","c":"Duy tâm chủ quan coi cảm giác, ý thức là cái có trước.","d":"Duy tâm khách quan coi tinh thần khách quan là cái có trước."}},{"s":2,"n":"6","q":"Khẳng định thế giới vật chất tồn tại vĩnh viễn, vô tận, vô hạn, không được sinh ra và không bị mất đi. Đó là quan điểm của trường phái triết học nào?","o":["Chủ nghĩa siêu hình","Chủ nghĩa duy vật","Chủ nghĩa duy vật biện chứng Mác - Lênin","Chủ nghĩa siêu nhiên"],"a":[2],"p":14,"e":"Thế giới vật chất tồn tại vĩnh viễn, vô tận, không được sinh ra và không mất đi là luận điểm của chủ nghĩa duy vật biện chứng Mác-Lênin, dựa trên định luật bảo toàn vật chất và năng lượng.","w":{"a":"Chủ nghĩa siêu hình xem xét sự vật trong trạng thái cô lập, tĩnh tại.","b":"Chủ nghĩa duy vật nói chung là khái niệm rộng. Câu hỏi hướng tới lập trường đầy đủ nhất là duy vật biện chứng.","d":"Chủ nghĩa siêu nhiên thừa nhận lực lượng siêu nhiên tạo ra thế giới."}},{"s":2,"n":"7","q":"Khẳng định nào sau đây là đúng?","o":["Định nghĩa về vật chất của V. I. Lênin đã phê phán chủ nghĩa duy vật biện chứng của C. Mác","Định nghĩa về vật chất của V. I. Lênin đã khẳng định ông là một triết gia vĩ đại nhất trong lịch sử triết học","Định nghĩa về vật chất của V. I. Lênin đã phê phán những quan niệm sai lầm, phản khoa học của các trường phái triết học duy tâm nói chung","Định nghĩa về vật chất của V. I. Lênin có ý nghĩa phê phán các nhà khoa học tự nhiên cuối thế kỷ XIX – đầu thế kỷ XX"],"a":[2],"p":15,"e":"Định nghĩa vật chất của Lênin phê phán những quan niệm sai lầm, phản khoa học của các trường phái duy tâm.","w":{"a":"Định nghĩa của Lênin kế thừa và phát triển chủ nghĩa duy vật biện chứng của Mác, không phê phán nó.","b":"Định nghĩa không nhằm khẳng định \"triết gia vĩ đại nhất\".","d":"Định nghĩa phê phán quan niệm duy tâm đã nảy sinh trong khoa học tự nhiên, nhưng không nhằm phê phán các nhà khoa học nói chung."}},{"s":2,"n":"8","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, nguồn gốc của vận động là gì?","o":["Vận động là sự tự thân vận động của vật chất","Vận động là do lực đẩy và lực hút của vật thể","Vật động là do lực hút của trái đất","Vận động là do thần thánh sáng tạo ra"],"a":[0],"p":15,"e":"Theo chủ nghĩa duy vật biện chứng, vận động là sự tự thân vận động của vật chất, vì nguyên nhân của vận động nằm trong bản thân sự vật, do mâu thuẫn bên trong.","w":{"b":"Lực đẩy và lực hút chỉ là biểu hiện của một dạng vận động cơ học.","c":"Lực hút của Trái Đất chỉ giải thích được vận động rơi.","d":"Do thần thánh sáng tạo ra là quan điểm duy tâm tôn giáo."}},{"s":2,"n":"9","q":"Nội dung nào sau đây là đúng với quan điểm của chủ nghĩa duy vật biện chứng về không gian, thời gian?","o":["Không gian và thời gian tồn tại thuần túy ngoài vật chất","Không gian và thời gian là hình thức tồn tại của vật chất, không tách rời vật chất","Không gian và thời gian là do thói quen của con người quy định","Không gian và thời gian phụ thuộc vào cảm giác của con người"],"a":[1],"p":15,"e":"Không gian và thời gian là hình thức tồn tại của vật chất, không tách rời vật chất, vì vật chất vận động luôn trong không gian và thời gian.","w":{"a":"Quan niệm không gian, thời gian tồn tại ngoài vật chất là quan điểm duy tâm hoặc siêu hình.","c":"Không gian và thời gian khách quan, không do thói quen quy định.","d":"Phụ thuộc cảm giác là quan điểm duy tâm chủ quan."}},{"s":2,"n":"10","q":"Theo Đêmôcrít, ý thức con người có cấu tạo từ yếu tố nào?","o":["Lửa","Nguyên tử","Nước","Không khí"],"a":[1],"p":15,"e":"Đê-mô-crít cho rằng vạn vật, kể cả linh hồn và ý thức con người, đều cấu tạo từ nguyên tử.","w":{"a":"Lửa là yếu tố khởi nguyên theo Hê-ra-clít.","c":"Nước là yếu tố khởi nguyên theo Ta-lét.","d":"Không khí là yếu tố khởi nguyên theo A-na-xi-men."}},{"s":2,"n":"11","q":"Đặc điểm cơ bản để phân biệt vật chất với ý thức là gì?","o":["Thực tại khách quan","Con người có thể cảm nhận","Được con người chép lại, chụp lại, phán ánh lại","Tồn tại không lệ thuộc vào cảm giác"],"a":[0],"p":15,"e":"Vật chất là thực tại khách quan, tồn tại bên ngoài và độc lập với ý thức. Ý thức chỉ là hình ảnh chủ quan của thế giới khách quan. Tính thực tại khách quan là điểm phân biệt cơ bản giữa hai phạm trù.","w":{"b":"Con người có thể cảm nhận là khả năng nhận biết vật chất, chưa nêu được đặc điểm phân biệt với ý thức.","c":"Được cảm giác chép lại, chụp lại, phản ánh lại mô tả quan hệ giữa vật chất và cảm giác trong định nghĩa của Lênin.","d":"Tồn tại không lệ thuộc vào cảm giác là một vế của định nghĩa. Đáp án trong file chọn cách nêu gọn là thực tại khách quan."}},{"s":2,"n":"12","q":"Nguồn gốc tự nhiên của ý thức là gì?","o":["Ý thức tồn tại trên cơ sở quá trình sinh lý của não người","Ý thức đồng nhất với quá trình sinh lý của não người","Lao động","Sự tương tác giữa bộ óc người và thế giới khách quan"],"a":[3],"p":15,"e":"Nguồn gốc tự nhiên của ý thức gồm bộ óc người, cơ quan vật chất có tổ chức cao, và sự tác động của thế giới khách quan lên bộ óc đó, tức là quá trình phản ánh. Cả hai đều cần thiết.","w":{"a":"Hoạt động sinh lý của não là điều kiện cần, thiếu sự tác động của thế giới bên ngoài thì chưa có ý thức.","b":"Đồng nhất ý thức với quá trình sinh lý của não là quan điểm duy vật tầm thường.","c":"Lao động là nguồn gốc xã hội của ý thức."}},{"s":2,"n":"13","q":"Quan điểm của triết học Mác - Lênin về nguồn gốc xã hội của ý thức?","o":["Lao động, cùng với lao động là ngôn ngữ là hai sức kích thích chủ yếu hình thành nên ý thức con người","Lao động tạo ra ngôn ngữ, ngôn ngữ tạo ra ý thức","Lao động tạo ra ý thức của lao động, ngôn ngữ tạo ra ý thức có ngôn ngữ","Lao động tạo ra kinh nghiệm, ngôn ngữ tạo ra tư duy"],"a":[0],"p":16,"e":"Nguồn gốc xã hội của ý thức là lao động và ngôn ngữ. Lao động làm cho bộ óc phát triển và có nhu cầu trao đổi, ngôn ngữ là vỏ vật chất của tư duy. Hai yếu tố này cùng kích thích hình thành ý thức.","w":{"b":"Ngôn ngữ không tự \"tạo ra\" ý thức, nó hình thành cùng với lao động.","c":"Cách chia \"ý thức của lao động\" và \"ý thức có ngôn ngữ\" không có trong giáo trình.","d":"Lao động và ngôn ngữ cùng góp phần hình thành ý thức, tách riêng từng yếu tố là chưa đủ."}},{"s":2,"n":"14","q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, kết cấu của ý thức bao gồm những yếu tố nào?","o":["Tri thức, ý chí","Tri thức, ước muốn và nguyện vọng","Tri thức, tình cảm và ý chí","Ước muốn, nguyện vọng và niềm tin"],"a":[2],"p":16,"e":"Ý thức có kết cấu gồm ba yếu tố chính: tri thức, tình cảm và ý chí. Ngoài ra còn có niềm tin và lý trí, nhưng ba yếu tố này là cơ bản nhất.","w":{"a":"Thiếu tình cảm.","b":"Ước muốn và nguyện vọng chưa phải yếu tố cơ bản của kết cấu ý thức.","d":"Ước muốn, nguyện vọng và niềm tin bỏ sót tri thức, yếu tố cốt lõi."}},{"s":2,"n":"15","q":"Trong các yếu tố tạo thành kết cấu của ý thức thì nhân tố nào quan trọng nhất?","o":["Tình cảm","Tri thức","Ý chí","Niềm tin"],"a":[1],"p":16,"e":"Tri thức là nhân tố cơ bản và cốt lõi nhất của ý thức. Tình cảm, ý chí và niềm tin đều được hình thành trên cơ sở tri thức.","w":{"a":"Tình cảm dựa trên tri thức mà có.","c":"Ý chí cũng dựa trên tri thức, nhận thức đúng mới đưa đến quyết tâm đúng.","d":"Niềm tin là tri thức đã được
