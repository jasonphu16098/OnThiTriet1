 chất, yếu tố nào được coi là năng động, cách mạng nhất?","o":["Lực lượng lao động","Công cụ lao động","Trí tuệ","Tư duy"],"a":[1],"p":76,"e":"Công cụ lao động là yếu tố năng động, cách mạng nhất của lực lượng sản xuất, vì nó đổi mới trước và kéo theo các yếu tố khác.","w":{"a":"Lực lượng lao động giữ vai trò quyết định, nhưng không phải yếu tố cách mạng nhất.","c":"Trí tuệ là năng lực của con người.","d":"Tư duy là hoạt động của ý thức."}},{"s":10,"n":"3","q":"Trường phái triết học nào thừa nhận rằng. “Tồn tại xã hội quyết định ý thức xã hội nhưng đồng thời ý thức xã hội lại có tính độc lập tương đối của nó”?","o":["Chủ nghĩa duy vật","Chủ nghĩa duy tâm","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật lịch sử"],"a":[3],"p":76,"e":"Chủ nghĩa duy vật lịch sử thừa nhận tồn tại xã hội quyết định ý thức xã hội và ý thức xã hội có tính độc lập tương đối.","w":{"a":"Chủ nghĩa duy vật nói chung chưa nêu rõ tính độc lập tương đối.","b":"Duy tâm coi ý thức quyết định.","c":"Duy vật siêu hình bỏ qua tính độc lập của ý thức."}},{"s":10,"n":"4","q":"Trong hình thái kinh tế - xã hội, yếu tố nào đóng vai trò nền tảng?","o":["Quan hệ sản xuất","Phương thức sản xuất","Lực lượng sản xuất","Kiến trúc thượng tầng"],"a":[1],"p":76,"e":"Phương thức sản xuất là cơ sở quyết định sự tồn tại, vận động và phát triển của một hình thái kinh tế - xã hội.","w":{"a":"Quan hệ sản xuất chỉ là một mặt của phương thức sản xuất.","c":"Lực lượng sản xuất cũng chỉ là một mặt.","d":"Kiến trúc thượng tầng được dựng trên cơ sở hạ tầng."},"f":"File gốc đánh dấu đáp án B. Một số tài liệu gọi lực lượng sản xuất là nền tảng vật chất của xã hội, nên phương án C cũng có người chọn. Điểm tính theo đáp án B của file."},{"s":10,"n":"5","q":"Yếu tố nào được coi là tiền đề xuất phát của quan điểm duy vật lịch sử?","o":["Con người hiện thực","Con người trừu tượng","Con người hành động","Con người tư duy"],"a":[0],"p":76,"e":"Trong Hệ tư tưởng Đức, tiền đề xuất phát của quan điểm duy vật về lịch sử là những con người hiện thực, đang hoạt động trong những điều kiện vật chất xác định.","w":{"b":"Con người trừu tượng là cách nhìn của triết học duy tâm.","c":"\"Con người hành động\" nói thiếu điều kiện vật chất.","d":"\"Con người tư duy\" chỉ nhìn ở mặt ý thức."}},{"s":10,"n":"6","q":"Chủ nghĩa duy vật lịch sử quan niệm như thế nào về bản chất của con người?","o":["Thiện","Ác","Không thiện, không ác","Tổng hòa các quan hệ xã hội"],"a":[3],"p":76,"e":"Theo chủ nghĩa duy vật lịch sử, bản chất con người là tổng hòa các quan hệ xã hội.","w":{"a":"Bản chất thiện là quan niệm của Mạnh Tử.","b":"Bản chất ác là quan niệm của Tuân Tử.","c":"Không thiện không ác là quan niệm của Cáo Tử."}},{"s":10,"n":"7","q":"Tư liệu sản xuất bao gồm các yếu tố nào?","o":["Con người và công cụ lao động","Con người lao động, công cụ lao động và đối tượng lao động","Đối tượng lao động và tư liệu lao động","Công cụ lao động và tư liệu lao động"],"a":[2],"p":76,"e":"Tư liệu sản xuất gồm đối tượng lao động và tư liệu lao động.","w":{"a":"Con người không thuộc tư liệu sản xuất.","b":"Người lao động không thuộc tư liệu sản xuất.","d":"Công cụ lao động là một bộ phận của tư liệu lao động."}},{"s":10,"n":"8","q":"Yếu tố nào quyết định trong tư liệu sản xuất?","o":["Người lao động","Phương tiện lao động","Công cụ lao động","Tư liệu lao động"],"a":[2],"p":76,"e":"Công cụ lao động là yếu tố quyết định trong tư liệu sản xuất, vì nó thể hiện trình độ chinh phục tự nhiên và thay đổi trước.","w":{"a":"Người lao động không thuộc tư liệu sản xuất.","b":"Phương tiện lao động là yếu tố phụ trợ.","d":"Tư liệu lao động bao gồm cả công cụ lao động."}},{"s":10,"n":"9","q":"Ăngghen quan niệm như thế nào về vai trò của lao động đối với quá trình biến vượn thành người?","o":["Lao động làm cho con người ngày càng hoàn thiện hơn","Lao động làm cho não vượn người phát triển hơn","Lao động là nguồn gốc của sự giàu có","Lao động làm cho các giác quan của con người ngày càng hoàn thiện"],"a":[1],"p":77,"e":"Ph.Ăngghen chỉ ra rằng lao động làm bàn tay hoàn thiện, kéo theo bộ não và các giác quan phát triển. Phương án b nêu một mặt của luận điểm này.","w":{"c":"Lao động là nguồn gốc của sự giàu có, nhưng câu hỏi hỏi về quá trình biến vượn thành người.","a":"Nói chung về việc con người hoàn thiện hơn, chưa nêu sự phát triển của bộ não.","d":"Giác quan hoàn thiện là một kết quả của lao động, file không chọn phương án này."},"f":"File gốc đánh dấu đáp án B. Phương án a và d cũng khớp ý Ăngghen khi bàn về vai trò của lao động. Điểm tính theo đáp án B của file."},{"s":10,"n":"10","q":"Phát biểu “Các thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì, mà ở chỗ chúng sản xuất như thế nào, với các công cụ, phương tiện gì” là ai?","o":["Lenin","Engels","Marx","Hegel"],"a":[2],"p":77,"e":"Câu này của C.Mác, trong bộ Tư bản.","w":{"a":"V.I.Lênin không phát biểu câu này.","b":"Ph.Ăngghen viết nhiều về vai trò của lao động nhưng câu này không phải của ông.","d":"Hê-ghen là nhà duy tâm khách quan, không phát biểu câu này."}},{"s":10,"n":"11","q":"Yếu tố nào tác động đến cơ sở hạ tầng một cách gián tiếp?","o":["Đảng chính trị, triết học","Triết học, tôn giáo","Chính phủ, tôn giáo","Tôn giáo, đảng chính trị"],"a":[1],"p":77,"e":"Triết học, tôn giáo, nghệ thuật ở xa cơ sở hạ tầng hơn nên tác động gián tiếp. Nhà nước, pháp luật, đảng chính trị tác động trực tiếp.","w":{"a":"Đảng chính trị tác động trực tiếp.","c":"Chính phủ tác động trực tiếp.","d":"Đảng chính trị tác động trực tiếp."}},{"s":10,"n":"12","q":"Yếu tố nào sau đây không thuộc tồn tại xã hội?","o":["Phương thức sản xuất","Môi trường tự nhiên","Lực lượng sản xuất","Điều kiện dân số"],"a":[2],"p":77,"e":"Tồn tại xã hội gồm phương thức sản xuất, điều kiện tự nhiên và dân số. Theo file, lực lượng sản xuất là phương án không thuộc.","w":{"a":"Phương thức sản xuất thuộc tồn tại xã hội.","b":"Môi trường tự nhiên thuộc tồn tại xã hội.","d":"Điều kiện dân số thuộc tồn tại xã hội."},"f":"File gốc đánh dấu đáp án C. Lực lượng sản xuất là một mặt của phương thức sản xuất, nên theo giáo trình vẫn nằm trong tồn tại xã hội. Điểm tính theo đáp án C của file."},{"s":10,"n":"13","q":"Theo quan điểm của chủ nghĩa Mác - Lênin, ý thức xã hội là một phạm trù dùng để chỉ khía cạnh nào của đời sống xã hội?","o":["Đời sống vật chất","Hiện thực khách quan","Đời sống tinh thần","Hoạt động sản xuất vật chất"],"a":[2],"p":77,"e":"Ý thức xã hội chỉ mặt đời sống tinh thần của xã hội.","w":{"a":"Đời sống vật chất là tồn tại xã hội.","b":"Hiện thực khách quan là cách nói chung.","d":"Hoạt động sản xuất vật chất thuộc tồn tại xã hội."}},{"s":10,"n":"14","q":"Ý thức xã hội tác động trở lại tồn tại xã hội thông qua yếu tố nào?","o":["Hệ thống chính trị","Pháp luật","Hoạt động thực tiễn của con người","Hoạt động kinh tế"],"a":[2],"p":77,"e":"Ý thức xã hội tác động trở lại tồn tại xã hội thông qua hoạt động thực tiễn của con người, nhờ đó tư tưởng trở thành lực lượng vật chất.","w":{"a":"Hệ thống chính trị là một kênh cụ thể.","b":"Pháp luật là một kênh cụ thể.","d":"Hoạt động kinh tế là một dạng thực tiễn."}},{"s":10,"n":"15","q":"Phương thức sản xuất được hiểu là gì?","o":["Kế hoạch và phương pháp sản xuất","Cách thức mà con người tiến hành quá trình sản xuất trong từng giai đoạn lịch sử nhất định","Là quá trình hoạt động sản xuất của con người phải tuân theo một phương pháp nhất định","Phương pháp sản xuất"],"a":[1],"p":77,"e":"Phương thức sản xuất là cách thức con người tiến hành sản xuất ở từng giai đoạn lịch sử nhất định, gồm lực lượng sản xuất và quan hệ sản xuất.","w":{"a":"Kế hoạch và phương pháp sản xuất là cách hiểu hẹp.","c":"Phương án này nêu phương pháp, chưa nêu hai mặt.","d":"\"Phương pháp sản xuất\" chưa đủ nội dung."}},{"s":10,"n":"16","q":"Theo triết học Mác-Lênin, khẳng định nào sau đây không đúng?","o":["Con người không do giới tự nhiên sinh ra nên không phụ thuộc giới tự nhiên","Con người là một bộ phận của giới tự nhiên","Con người là kết quả của sự tiến hóa và phát triển lâu dài của giới tự nhiên","Con người luôn bị chi phối bởi các quy luật xã hội"],"a":[0],"p":78,"e":"Con người là sản phẩm của tự nhiên nên phụ thuộc vào tự nhiên. Câu a phủ nhận điều này, nên là câu không đúng.","w":{"b":"Đúng: con người là một bộ phận của giới tự nhiên.","c":"Đúng: con người là kết quả của quá trình tiến hóa lâu dài.","d":"Đúng: con người chịu chi phối bởi các quy luật xã hội."}},{"s":10,"n":"17","q":"Bản chất của con người được quyết định bởi yếu tố nào?","o":["Giáo dục của gia đình và nhà trường","Các mối quan hệ xã hội","Nỗ lực của mỗi cá nhân","Điều kiện địa lý, tự nhiên"],"a":[1],"p":78,"e":"Bản chất con người được quyết định bởi tổng hòa các quan hệ xã hội.","w":{"a":"Giáo dục là yếu tố tác động.","c":"Nỗ lực cá nhân là yếu tố tác động.","d":"Điều kiện địa lý, tự nhiên là yếu tố tác động."}},{"s":10,"n":"18","q":"Mác đã định nghĩa như thế nào về bản chất con người?","o":["Bản chất con người không phải là cái trừu tượng cố hữu của cá nhân riêng biệt. Trong tính hiện thực của nó, bản chất con người là tổng hoà những mối quan hệ xã hội","Bản chất con người do các điều kiện xã hội quy định","Bản chất con người là bất biến","Con người là một sinh vật"],"a":[0],"p":78,"e":"Trong Luận cương về Phoi-ơ-bắc, C.Mác nêu: bản chất con người, trong tính hiện thực của nó, là tổng hòa những quan hệ xã hội.","w":{"b":"Chỉ nêu điều kiện xã hội, thiếu chữ \"tổng hòa các mối quan hệ\".","c":"Bản chất con người thay đổi theo điều kiện xã hội.","d":"Chỉ nói con người là sinh vật, bỏ qua mặt xã hội."}},{"s":10,"n":"19","q":"Phát biểu “Lao động là điều kiện cơ bản đầu tiên của toàn bộ đời sống con người, và như thế đến một mức mà trên một ý nghĩa nào đó, chúng ta phải nói lao động đã sáng tạo ra bản thân con người” là ai?","o":["Engels","Hegel","Marx","Lenin"],"a":[0],"p":78,"e":"Câu này nằm trong bài \"Vai trò của lao động trong quá trình chuyển biến từ vượn thành người\" của Ph.Ăngghen.","w":{"b":"Hê-ghen là nhà duy tâm khách quan.","c":"C.Mác có nhiều luận điểm về lao động, nhưng câu này của Ph.Ăngghen.","d":"V.I.Lênin không phải tác giả câu này."}},{"s":10,"n":"20","q":"Theo quan niệm của triết học Mác-Lênin, yếu tố nào có tính cách mạng nhất trong lực lượng sản xuất?","o":["Khoa học – công nghệ","Kinh nghiệm lao động","Công cụ lao động","Phương thức lao động"],"a":[2],"p":78,"e":"Công cụ lao động là yếu tố cách mạng nhất trong lực lượng sản xuất, vì nó thay đổi trước và kéo theo các yếu tố khác.","w":{"a":"Khoa học - công nghệ là lực lượng sản xuất trực tiếp trong thời đại ngày nay.","b":"Kinh nghiệm lao động là một thuộc tính của người lao động.","d":"Phương thức lao động là khái niệm chung."}},{"s":10,"n":"21","q":"Cơ sở nào để xác định và phân chia thời đại?","o":["Sự thay thế lẫn nhau của các chế độ chính trị","Sự thay thế lẫn nhau giữa các nền văn minh","Sự thay thế lẫn nhau giữa các kiểu quan hệ sản xuất","Sự thay thế lẫn nhau giữa các hình thái kinh tế - xã hội"],"a":[3],"p":78,"e":"Các thời đại được phân chia theo sự thay thế nhau giữa các hình thái kinh tế - xã hội.","w":{"a":"Chế độ chính trị là một mặt của kiến trúc thượng tầng.","b":"Văn minh là một mặt của đời sống xã hội.","c":"Quan hệ sản xuất chỉ là một mặt của hình thái."}},{"s":10,"n":"22","q":"Trình độ phát triển của lực lượng sản xuất thể hiện thông qua yếu tố nào?","o":["Trình độ nhận thức thế giới khách quan","Trình độ lý luận chính trị - xã hội","Trình độ chinh phục tự nhiên","Sự tự ý thức của con người"],"a":[2],"p":79,"e":"Trình độ của lực lượng sản xuất thể hiện ở trình độ chinh phục tự nhiên của con người.","w":{"a":"Trình độ nhận thức chưa phản ánh trình độ sản xuất.","b":"Trình độ lý luận chính trị - xã hội thuộc kiến trúc thượng tầng.","d":"Sự tự ý thức của con người là mặt ý thức."}},{"s":10,"n":"23","q":"Yếu tố nào giữ vai trò quyết định hình thành bản chất con người?","o":["Quan hệ đạo đức","Quan hệ giáo dục","Quan hệ kinh tế","Quan hệ chính trị"],"a":[2],"p":79,"e":"Quan hệ kinh tế, tức quan hệ sản xuất, giữ vai trò quyết định hình thành bản chất con người, vì nó là cơ sở của các quan hệ xã hội khác.","w":{"a":"Quan hệ đạo đức chịu sự quy định của quan hệ kinh tế.","b":"Quan hệ giáo dục là quan hệ thuộc kiến trúc thượng tầng.","d":"Quan hệ chính trị thuộc kiến trúc thượng tầng."}},{"s":10,"n":"24","q":"Các yếu tố cơ bản của quá trình sản xuất là đúng?","o":["Người lao động, vốn, máy móc","Sức lao động, tư liệu lao động, đối tượng lao động","Khoa học kỹ thuật, máy móc, người lao động","Tất cả đều"],"a":[1],"p":79,"e":"Quá trình sản xuất có ba yếu tố cơ bản: sức lao động, tư liệu lao động và đối tượng lao động.","w":{"a":"Vốn không phải yếu tố của quá trình lao động nói chung.","c":"Khoa học kỹ thuật không phải yếu tố riêng.","d":"Các phương án trên đều không đúng."}},{"s":10,"n":"25","q":"Trong mối quan hệ biện chứng giữa lực lượng sản xuất (LLSX) và quan hệ sản xuất (QHSX), thì LLSX ở trình độ nào thì yêu cầu một cách tất yếu QHSX phải như thế nào?","o":["QHSX phải phù hợp với LLSX","QHSX tiến bộ hơn LLSX","QHSX lạc hậu hơn LLSX","QHSX thúc đẩy LLSX"],"a":[0],"p":79,"e":"Lực lượng sản xuất ở trình độ nào thì tất yếu đòi hỏi quan hệ sản xuất phù hợp với trình độ ấy.","w":{"b":"Quan hệ sản xuất đi trước quá xa sẽ kìm hãm lực lượng sản xuất.","c":"Quan hệ sản xuất lạc hậu cũng kìm hãm.","d":"Quan hệ sản xuất thúc đẩy lực lượng sản xuất khi phù hợp."}},{"s":10,"n":"26","q":"Cách mạng được hiểu theo nghĩa chung nhất là gì?","o":["Sự thay thế cái cũ bằng cái mới tiến bộ hơn","Sự phát triển","Sự phá bỏ","Là chiến tranh"],"a":[0],"p":79,"e":"Theo nghĩa chung nhất, cách mạng là sự thay thế cái cũ bằng cái mới tiến bộ hơn.","w":{"b":"Sự phát triển là khái niệm rộng hơn.","c":"Phá bỏ chỉ là một mặt.","d":"Chiến tranh chỉ là một hình thức đấu tranh."}},{"s":10,"n":"27","q":"Nhận định nào đúng với quan niệm của Ăngghen về con người?","o":["Con người là một động vật biết tư duy","Biết chế tạo và sử dụng công cụ lao động","Biết ứng xử theo các quy phạm đạo đức","Biết ứng xử theo các quy định chính trị"],"a":[1],"p":79,"e":"Ph.Ăngghen cho rằng đặc điểm phân biệt con người với động vật là biết chế tạo và sử dụng công cụ lao động.","w":{"a":"Biết tư duy là thuộc tính, nhưng Ăngghen nhấn mạnh việc chế tạo công cụ.","c":"Quy phạm đạo đức là sản phẩm của xã hội.","d":"Quy định chính trị cũng là sản phẩm của xã hội."}},{"s":10,"n":"28","q":"Mác xem yếu tố nào là thân thể vô cơ của con người?","o":["Xã hội","Giới tự nhiên","Tự nhiên – xã hội","Môi trường"],"a":[1],"p":79,"e":"C.Mác coi giới tự nhiên là thân thể vô cơ của con người.","w":{"a":"Xã hội không phải thân thể vô cơ.","c":"Tự nhiên - xã hội gộp hai khái niệm.","d":"Môi trường là khái niệm chung."}},{"s":10,"n":"29","q":"Con người phát triển và hoàn thiện mình chủ yếu dựa vào yếu tố nào?","o":["Phát triển kinh tế – xã hội","Đấu tranh giai cấp","Lao động sản xuất","Đấu tranh với tự nhiên"],"a":[2],"p":80,"e":"Con người phát triển và hoàn thiện mình chủ yếu qua lao động sản xuất.","w":{"a":"Phát triển kinh tế - xã hội là kết quả của lao động.","b":"Đấu tranh giai cấp là động lực trong xã hội có giai cấp.","d":"Đấu tranh với tự nhiên diễn ra thông qua lao động."}},{"s":10,"n":"30","q":"Nhân tố có tác dụng thúc đẩy quá trình biến đổi mạnh mẽ nhất của lực lượng sản xuất trong nền công nghiệp hiện đại là?","o":["Sự sáng tạo khoa học và công nghệ","Kinh nghiệm của các chuyên gia","Khoa học - công nghệ và việc ứng dụng khoa học - công nghệ hiện đại vào trong quá trình sản xuất","Nhà quản lí giỏi kết hợp các yếu tố quốc tế hóa"],"a":[2],"p":80,"e":"Trong nền công nghiệp hiện đại, khoa học - công nghệ và việc ứng dụng chúng vào sản xuất làm lực lượng sản xuất biến đổi mạnh nhất. Khoa học đã trở thành lực lượng sản xuất trực tiếp.","w":{"a":"Chỉ có sáng tạo mà chưa ứng dụng vào sản xuất thì chưa làm biến đổi lực lượng sản xuất.","b":"Kinh nghiệm chuyên gia là yếu tố hỗ trợ.","d":"Quản lý giỏi là yếu tố tổ chức, không phải động lực biến đổi chính."}},{"s":10,"n":"31","q":"Muốn phát triển kinh tế, trước hết phải phát triển yếu tố nào?","o":["Quan hệ sản xuất","Lực lượng sản xuất","Khoa học kỹ thuật","Đối tượng lao động"],"a":[1],"p":80,"e":"Muốn phát triển kinh tế thì trước hết phải phát triển lực lượng sản xuất, vì nó là yếu tố quyết định quan hệ sản xuất.","w":{"a":"Quan hệ sản xuất chịu sự quyết định của lực lượng sản xuất.","c":"Khoa học kỹ thuật là một nhân tố bên trong lực lượng sản xuất.","d":"Đối tượng lao động chỉ là một yếu tố."}},{"s":10,"n":"32","q":"Quy luật cơ bản của sự vận động và phát triển xã hội là quy luật nào?","o":["Quy luật về sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất.","Quy luật về mối quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng.","Quy luật đấu tranh giai cấp","Quy luật tự nhiên và xã hội"],"a":[0],"p":80,"e":"Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất là quy luật cơ bản, chi phối sự vận động và phát triển xã hội.","w":{"b":"Quy luật cơ sở hạ tầng và kiến trúc thượng tầng giữ vai trò quan trọng nhưng ở cấp thứ hai.","c":"Đấu tranh giai cấp là động lực trong xã hội có giai cấp.","d":"\"Quy luật tự nhiên và xã hội\" không phải tên một quy luật của chủ nghĩa duy vật lịch sử."}},{"s":10,"n":"33","q":"Theo quan điểm của chủ nghĩa duy vật lịch sử, khi quan hệ sản xuất cũ mất đi thì yếu tố nào không còn tồn tại?","o":["Phương thức sản xuất cũ","Ý thức xã hội cũ","Lực lượng thống trị cũ","Các giai cấp cũ"],"a":[0],"p":80,"e":"Phương thức sản xuất gồm lực lượng sản xuất và quan hệ sản xuất. Khi quan hệ sản xuất cũ mất đi thì phương thức sản xuất cũ không còn.","w":{"b":"Ý thức xã hội cũ còn tồn tại dai dẳng vì nó lạc hậu hơn tồn tại xã hội.","c":"Lực lượng thống trị cũ có thể còn tồn tại một thời gian.","d":"Các giai cấp cũ có thể còn tồn tại một thời gian."}},{"s":10,"n":"34","q":"Theo chủ nghĩa duy vật lịch sử, quá trình thay thế các hình thức sở hữu tư liệu sản xuất phụ thuộc vào yếu tố nào?","o":["Trình độ của công cụ sản xuất","Trình độ kỹ thuật sản xuất","Trình độ phát triển của lực lượng sản xuất","Trình độ phân công lao động xã hội"],"a":[2],"p":80,"e":"Sự thay thế các hình thức sở hữu tư liệu sản xuất phụ thuộc vào trình độ phát triển của lực lượng sản xuất.","w":{"a":"Trình độ công cụ là một mặt của trình độ lực lượng sản xuất.","b":"Trình độ kỹ thuật là một mặt của trình độ lực lượng sản xuất.","d":"Phân công lao động là một mặt của trình độ lực lượng sản xuất."}},{"s":10,"n":"35","q":"Cơ sở hạ tầng kinh tế của Việt Nam hiện nay là gì?","o":["Cơ cấu kinh tế nhiều thành phần nhưng trong đó thành phần kinh tế dựa trên quan hệ sở hữu tập thể là nền tảng","Cơ cấu kinh tế nhiều thành phần nhưng trong đó thành phần kinh tế dựa trên quan hệ sở hữu tư hữu là nền tảng","Cơ cấu kinh tế nhiều thành phần nhưng trong đó thành phần kinh tế tư nhân là nền tảng","Cơ cấu kinh tế nhiều thành phần nhưng trong đó thành phần kinh tế dựa trên quan hệ sở hữu công hữu là nền tảng"],"a":[3],"p":80,"e":"Ở Việt Nam, cơ cấu kinh tế nhiều thành phần dựa trên chế độ công hữu về tư liệu sản xuất làm nền tảng, với kinh tế nhà nước giữ vai trò chủ đạo.","w":{"a":"Sở hữu tập thể là một bộ phận của công hữu.","b":"Sở hữu tư hữu không phải nền tảng của chế độ xã hội chủ nghĩa.","c":"Kinh tế tư nhân là một động lực quan trọng, không phải nền tảng."}},{"s":10,"n":"36","q":"Động lực chủ yếu của sự tiến bộ xã hội là gì?","o":["Sự phát triển của lực lượng sản xuất","Sự phát triển của hoạt động nghiên cứu khoa học, cải tiến kỹ thuật","Sự phát triển của các quan hệ quốc tế, hợp tác quốc tế","Không có phương án nào"],"a":[0],"p":81,"e":"Sự phát triển của lực lượng sản xuất là động lực chủ yếu của tiến bộ xã hội.","w":{"b":"Nghiên cứu khoa học, cải tiến kỹ thuật là một phần của lực lượng sản xuất.","c":"Quan hệ quốc tế là điều kiện hỗ trợ.","d":"Phương án a là đúng."}},{"s":10,"n":"37","q":"Phát biểu. “Cái cối xay quay bằng tay đưa lại xã hội có lãnh chúa, cái cối xay chạy bằng hơi nước đưa lại xã hội có nhà tư bản công nghiệp” là của ai?","o":["Feuerbach","Lenin","Marx","Engels"],"a":[2],"p":81,"e":"Câu này nằm trong \"Sự khốn cùng của triết học\" (1847) của C.Mác, nói về mối quan hệ giữa công cụ sản xuất và quan hệ xã hội.","w":{"a":"Phoi-ơ-bắc là nhà duy vật siêu hình.","b":"V.I.Lênin không phải tác giả câu này.","d":"Ph.Ăngghen không phát biểu câu này."}},{"s":10,"n":"38","q":"Cơ sở hạ tầng và kiến trúc thượng tầng là hai phương diện cơ bản của đời sống xã hội. Chúng tồn tại như thế nào với nhau?","o":["Trong mối quan hệ thống nhất biện chứng với nhau, tác động lẫn nhau","Trong mối quan hệ độc lập, tách rời nhau","Tồn tại song song nhau","Tồn tại trong sự phụ thuộc nhau"],"a":[0],"p":81,"e":"Cơ sở hạ tầng và kiến trúc thượng tầng thống nhất biện chứng, tác động qua lại: cơ sở hạ tầng quyết định, kiến trúc thượng tầng tác động trở lại.","w":{"b":"Hai mặt gắn bó, không tách rời.","c":"Không tồn tại song song riêng rẽ.","d":"Chỉ nói phụ thuộc một chiều, bỏ qua tác động trở lại."}},{"s":10,"n":"39","q":"Ý nghĩa của mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là?","o":["Là cơ sở khoa học cho việc nhận thức đúng đắn mối quan hệ giữa vật chất và ý thức","Là cơ sở khoa học cho việc nhận thức đúng đắn mối quan hệ giữa giai cấp thống trị và giai cấp bị trị","Là cơ sở khoa học cho việc nhận thức đúng đắn mối quan hệ giữa pháp luật và kinh tế","Là cơ sở khoa học cho việc nhận thức đúng đắn mối quan hệ giữa kinh tế và chính trị"],"a":[3],"p":81,"e":"Quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là cơ sở khoa học để nhận thức đúng mối quan hệ giữa kinh tế và chính trị.","w":{"a":"Quan hệ vật chất và ý thức là vấn đề cơ bản của triết học.","b":"Quan hệ giữa giai cấp là nội dung khác.","c":"Pháp luật thuộc kiến trúc thượng tầng, không đại diện cho cả cặp quan hệ."}},{"s":10,"n":"40","q":"Các yếu tố nào sau đây cấu thành tồn tại xã hội?","o":["Điều kiện tự nhiên và dân số","Điều kiện tự nhiên và điều kiện xã hội","Điều kiện xã hội, phương thức sản xuất","Phương thức sản xuất, môi trường tự nhiên, dân số và mật độ dân cư"],"a":[3],"p":81,"e":"Tồn tại xã hội gồm phương thức sản xuất, điều kiện tự nhiên (môi trường tự nhiên), dân số và mật độ dân cư.","w":{"a":"Thiếu phương thức sản xuất.","b":"\"Điều kiện xã hội\" quá chung.","c":"Thiếu điều kiện tự nhiên và dân số."}},{"s":10,"n":"41","q":"Trong các thời đại lịch sử, những tư tưởng của giai cấp thống trị là tư tưởng?","o":["Tư tưởng thống trị xã hội","Tư tưởng phụ thuộc","Tư tưởng hỗ trợ","Cũng như tư tưởng của các giai cấp khác"],"a":[0],"p":81,"e":"Theo C.Mác và Ph.Ăngghen, tư tưởng của giai cấp thống trị trong mỗi thời đại là tư tưởng thống trị xã hội, vì giai cấp nắm tư liệu sản xuất vật chất cũng chi phối tư liệu sản xuất tinh thần.","w":{"b":"Tư tưởng thống trị không phụ thuộc vào tư tưởng nào.","c":"Tư tưởng thống trị giữ vai trò chủ đạo, vượt khỏi vai trò hỗ trợ.","d":"Tư tưởng các giai cấp khác không giữ vị trí thống trị."}},{"s":10,"n":"42","q":"Nội dung nào sau đây không thể hiện ý nghĩa của mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng?","o":["Là cơ sở khoa học cho việc nhận thức đúng đắn mối quan hệ giữa kinh tế và chính trị","Trong nhận thức và thực tiễn, không được tuyệt đối hóa yếu tố kinh tế","Trong nhận thức và thực tiễn, không được tuyệt đối hóa yếu tố chính trị","Là cơ sở khoa học cho việc nhận thức đúng đắn mối quan hệ giữa pháp luật và kinh tế"],"a":[3],"p":82,"e":"Câu d nói ý nghĩa là cơ sở nhận thức mối quan hệ giữa pháp luật và kinh tế. Ý nghĩa thật là quan hệ giữa kinh tế và chính trị, nên d không thể hiện ý nghĩa đó.","w":{"a":"Đúng: cơ sở nhận thức quan hệ giữa kinh tế và chính trị.","b":"Đúng: không tuyệt đối hóa kinh tế.","c":"Đúng: không tuyệt đối hóa chính trị."}},{"s":10,"n":"43","q":"Biểu hiện tính độc lập tương đối của ý thức xã hội đối với tồn tại xã hội là?","o":["Ý thức xã hội kéo lùi tồn tại xã hội","Ý thức xã hội có tính kế thừa trong sự phát triển","Ý thức xã hội tồn tại song song với tồn tại xã hội","Hoàn toàn không phụ thuộc vào tồn tại xã hội"],"a":[1],"p":82,"e":"Tính kế thừa trong sự phát triển của ý thức xã hội là một biểu hiện của tính độc lập tương đối.","w":{"a":"Ý thức xã hội có thể thúc đẩy hoặc kìm hãm, nhưng \"kéo lùi\" tồn tại xã hội không phải biểu hiện đặc trưng.","c":"Không tồn tại song song với tồn tại xã hội.","d":"Ý thức xã hội phụ thuộc vào tồn tại xã hội, độc lập chỉ là tương đối."}},{"s":10,"n":"44","q":"Trong hệ thống các khái niệm của chủ nghĩa duy vật lịch sử, các khái niệm dùng để chỉ quan hệ mà C.Mác gọi là “quan hệ song trùng” của bản thân sự sản xuất xã hội là?","o":["Vật chất - ý thức","Tồn tại xã hội - ý thức xã hội","Cơ sở hạ tầng - kiến trúc thượng tầng","Lực lượng sản xuất - quan hệ sản xuất"],"a":[3],"p":82,"e":"C.Mác gọi quan hệ giữa lực lượng sản xuất và quan hệ sản xuất là \"quan hệ song trùng\" của sản xuất xã hội: một mặt là quan hệ với tự nhiên, mặt kia là quan hệ giữa người với người.","w":{"a":"Vật chất - ý thức là cặp phạm trù của vấn đề cơ bản của triết học.","b":"Tồn tại xã hội - ý thức xã hội là cặp khác.","c":"Cơ sở hạ tầng - kiến trúc thượng tầng là cặp khác."}},{"s":10,"n":"45","q":"Ý thức xã hội chỉ tác động trở lại tồn tại xã hội trong điều kiện nào?","o":["Ý thức xã hội phải đạt đến trình độ lý luận khoa học và phù hợp với tồn tại xã hội","Được sự nhất trí của nhà nước và luật pháp hiện hành, dưới sự lãnh đạo của đảng","Khi giai cấp bị trị phản kháng lại giai cấp thống trị","Xuất hiện những quan niệm “vượt trước” thời đại"],"a":[0],"p":82,"e":"Ý thức xã hội tác động trở lại tồn tại xã hội mạnh khi đạt trình độ lý luận khoa học và phù hợp với tồn tại xã hội.","w":{"b":"Sự nhất trí của nhà nước không phải điều kiện của quy luật.","c":"Phản kháng của giai cấp bị trị là hiện tượng chính trị.","d":"Quan niệm vượt trước chỉ có tác dụng khi phản ánh đúng quy luật."}},{"s":11,"n":"1","q":"Nhận định nào sau đây phản ánh mối quan hệ biện chứng giữa tồn tại xã hội và ý thức xã hội?","o":["Tồn tại xã hội quyết định ý thức xã hội, ý thức xã hội là sự phản ánh của tồn tại xã hội, phụ thuộc vào tồn tại xã hội","Ý thức xã hội quyết định tồn tại xã hội, đặc điểm của tồn tại xã hội như thế nào là do ý thức xã hội quy định, thông qua ý thức xã hội để hình thành và phát triển","Ý thức xã hội là sự phản ánh của tồn tại xã hội một cách thụ động, tồn tại xã hội như thế nào thì được phản ánh qua ý thức xã hội như thế ấy","Ý thức xã hội là sự phản ánh của tồn tại xã hội, phụ thuộc vào tồn tại xã hội, tuy nhiên ý thức xã hội cũng có tính độc lập tương đối trong mối quan hệ với tồn tại xã hội"],"a":[3],"p":82,"e":"Ý thức xã hội phản ánh và phụ thuộc vào tồn tại xã hội nhưng có tính độc lập tương đối, nên tác động trở lại tồn tại xã hội.","w":{"a":"Thiếu mặt tác động trở lại.","b":"Đảo ngược quan hệ quyết định.","c":"Phản ánh thụ động là cách nhìn siêu hình."}},{"s":11,"n":"2","q":"Trong xã hội có giai cấp, vì sao ý thức xã hội lại mang tính giai cấp?","o":["Vì nó truyền tải tư tưởng của giai cấp thống trị","Các giai cấp có quan niệm khác nhau về các giá trị","Do điều kiện sinh hoạt vật chất, địa vị và lợi ích các giai cấp khác nhau","Sự áp đặt tư tưởng của giai cấp thống trị"],"a":[2],"p":82,"e":"Ý thức xã hội mang tính giai cấp vì các giai cấp có điều kiện sinh hoạt vật chất, địa vị và lợi ích khác nhau.","w":{"a":"Chỉ nêu tư tưởng của giai cấp thống trị.","b":"Quan niệm khác nhau là hệ quả.","d":"Sự áp đặt là hiện tượng, không phải nguyên nhân gốc."}},{"s":11,"n":"3","q":"Sự tác động của ý thức chính trị đối với các hình thái ý thức xã hội khác và với tồn tại xã hội thông qua quyền lực nào?","o":["Đảng phái","Quyền lực nhà nước","Quyền lực kinh tế","Lãnh tụ"],"a":[1],"p":83,"e":"Ý thức chính trị tác động đến các hình thái ý thức khác và đến tồn tại xã hội chủ yếu thông qua quyền lực nhà nước.","w":{"a":"Đảng phái là một chủ thể chính trị.","c":"Quyền lực kinh tế gắn với sở hữu.","d":"Lãnh tụ là một cá nhân."}},{"s":11,"n":"4","q":"Mác viết. “Tôi coi sự phát triển của những hình thái kinh tế - xã hội là một quá trình lịch sử - tự nhiên”. Luận điểm này được hiểu như thế nào?","o":["Sự phát triển của các hình thái – kinh tế xã hội cũng giống như sự phát triển của tự nhiên, không phụ thuộc vào ý muốn chủ quan của con người","Sự phát triển của các hình thái – kinh tế xã hội là tuân theo tuần tự phát triển của lịch sử xã hội loài người từ thấp đến cao","Sự phát triển của các hình thái – kinh tế xã hội chỉ bị chi phối bởi quy luật xã hội","Sự phát triển của các hình thái – kinh tế xã hội ngoài tuân theo các quy luật khách quan chung, còn bị chi phối bởi các điều kiện lịch sử cụ thể của mỗi quốc gia, dân tộc"],"a":[3],"p":83,"e":"Quá trình lịch sử - tự nhiên nghĩa là các hình thái kinh tế - xã hội phát triển theo quy luật khách quan, đồng thời chịu chi phối bởi điều kiện lịch sử cụ thể của từng quốc gia, dân tộc.","w":{"a":"Đúng nhưng chưa đủ, chưa nêu điều kiện lịch sử cụ thể.","b":"Phát triển tuần tự là một cách hiểu hẹp.","c":"Không chỉ có quy luật xã hội, còn có quy luật chung khác."}},{"s":11,"n":"5","q":"Yếu tố nào được Ph.Ăngghen coi là “khí quan của bộ óc con người”, là “sức mạnh của tri thức đã được vật thể hóa” có tác dụng “nối dài bàn tay” và nhân lên sức mạnh trí tuệ của con người?","o":["Công cụ lao động","Lực lượng sản xuất","Tri thức","Khoa học công nghệ"],"a":[0],"p":83,"e":"Ph.Ăngghen gọi công cụ lao động là khí quan của bộ óc con người, sức mạnh của tri thức được vật thể hóa, nối dài bàn tay con người.","w":{"b":"Lực lượng sản xuất là khái niệm rộng.","c":"Tri thức chưa được vật thể hóa thành công cụ.","d":"Khoa học công nghệ là khái niệm khác."}},{"s":11,"n":"6","q":"Luận điểm nào sau đây không đúng khi nói về lực lượng sản xuất (LLSX)?","o":["LLSX bao gồm người lao động và tư liệu sản xuất","Tư liệu sản xuất, công cụ lao động là các yếu tố thuộc về LLSX","Quan hệ giữa người với người là một trong các yếu tố cấu thành LLSX","Đối tượng lao động, phương tiện lao động là các yếu tố thuộc về LLSX"],"a":[2],"p":83,"e":"Quan hệ giữa người với người là quan hệ sản xuất, không cấu thành lực lượng sản xuất.","w":{"a":"Đúng: lực lượng sản xuất gồm người lao động và tư liệu sản xuất.","b":"Đúng: tư liệu sản xuất và công cụ lao động thuộc lực lượng sản xuất.","d":"Đúng: đối tượng lao động và phương tiện lao động thuộc lực lượng sản xuất."}},{"s":11,"n":"7","q":"Thực chất của quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là gì?","o":["Quan hệ giữa kinh tế và chính trị","Quan hệ giữa đời sống và tự nhiên","Quan hệ giữa tồn tại xã hội với ý thức xã hội","Quan hệ giữa lực lượng sản xuất - quan hệ sản xuất"],"a":[0],"p":83,"e":"Thực chất của quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng là quan hệ giữa kinh tế và chính trị.","w":{"b":"Đời sống và tự nhiên là cách nói khác.","c":"Tồn tại xã hội và ý thức xã hội là cặp khác.","d":"Lực lượng sản xuất và quan hệ sản xuất là hai mặt của phương thức sản xuất."}},{"s":11,"n":"8","q":"Giai cấp thống trị về kinh tế có thể trở thành giai cấp thống trị về chính trị là nhờ yếu tố nào?","o":["Nhà nước","Hệ tư tưởng","Vị thế chính trị","Hệ thống luật pháp"],"a":[0],"p":83,"e":"Giai cấp thống trị về kinh tế trở thành giai cấp thống trị về chính trị nhờ nắm bộ máy nhà nước, công cụ quyền lực chính trị.","w":{"b":"Hệ tư tưởng là công cụ hỗ trợ.","c":"Vị thế chính trị là kết quả của việc nắm nhà nước.","d":"Hệ thống luật pháp là một phần của nhà nước."}},{"s":11,"n":"9","q":"Tính chất đối kháng của kiến trúc thượng tầng do yếu tố nào quy định?","o":["Khác nhau về tư tưởng","Đối kháng của cơ sở hạ tầng","Tranh giành địa vị thống trị","Khác nhau về đường lối"],"a":[1],"p":84,"e":"Tính chất đối kháng của kiến trúc thượng tầng do tính đối kháng của cơ sở hạ tầng quy định.","w":{"a":"Khác nhau về tư tưởng là biểu hiện.","c":"Tranh giành địa vị thống trị là hệ quả.","d":"Khác nhau về đường lối là biểu hiện."}},{"s":11,"n":"10","q":"Việc phát hiện ra chủ nghĩa duy vật lịch sử, Mác đã bước đầu đặt cơ sở lý luận cho lĩnh vực nào?","o":["Chủ nghĩa cộng sản khoa học","Kinh tế chính trị học","Chính trị","Chủ nghĩa xã hội"],"a":[0],"p":84,"e":"Phát hiện chủ nghĩa duy vật lịch sử là bước đặt cơ sở lý luận cho chủ nghĩa cộng sản khoa học, tức chủ nghĩa xã hội khoa học.","w":{"b":"Kinh tế chính trị học là phát hiện giá trị thặng dư.","c":"Chính trị là phạm vi hẹp.","d":"Chủ nghĩa xã hội nói chung gồm cả dạng không tưởng."}},{"s":11,"n":"11","q":"Tính chất nào sau đây biểu hiện sự độc lập tương đối của ý thức xã hội?","o":["Tính phản ánh","Tính cực đoan","Tính tích cực, sáng tạo","Tính bảo thủ"],"a":[2],"p":84,"e":"Tính tích cực, sáng tạo biểu hiện sự độc lập tương đối của ý thức xã hội, vì ý thức tác động trở lại tồn tại xã hội.","w":{"a":"Tính phản ánh là thuộc tính chung của ý thức.","b":"\"Tính cực đoan\" không được dùng trong lý luận này.","d":"Tính bảo thủ là biểu hiện tiêu cực."}},{"s":11,"n":"12","q":"Trong các hình thái ý thức xã hội sau, hình thái nào tác động đến kinh tế một cách trực tiếp?","o":["Ý thức chính trị","Ý thức đạo đức","Ý thức thẩm mỹ","Ý thức pháp quyền"],"a":[0],"p":84,"e":"Ý thức chính trị gắn trực tiếp với lợi ích giai cấp và quyền lực nhà nước nên tác động trực tiếp đến kinh tế.","w":{"b":"Đạo đức tác động gián tiếp.","c":"Thẩm mỹ tác động gián tiếp.","d":"Pháp quyền cũng gắn với nhà nước nhưng tác động qua chính trị."}},{"s":11,"n":"13","q":"Ý thức xã hội thường lạc hậu hơn so với tồn tại xã hội là vì?","o":["Phản ánh kịp thời những biến đổi trong tồn tại xã hội","Không gắn liền với lợi ích của các lực lượng xã hội phản tiến bộ","Ý thức xã hội quyết định tồn tại xã hội sinh ra nó","Do sức ỳ của các thói quen, tập quán, tư duy cũ kỹ, bảo thủ"],"a":[3],"p":84,"e":"Ý thức xã hội lạc hậu hơn vì thói quen, tập quán và tư duy cũ có sức ỳ lớn, cộng với lợi ích của các lực lượng lạc hậu.","w":{"a":"Nếu phản ánh kịp thời thì không lạc hậu.","b":"Câu này nói sai về lợi ích của các lực lượng phản tiến bộ.","c":"Ý thức xã hội không quyết định tồn tại xã hội."}},{"s":11,"n":"14","q":"Trong các luận điểm dưới đây, luận điểm nào không đúng?","o":["Công cụ lao động là yếu tố động nhất của lực lượng sản xuất","Đối tượng lao động là yếu tố động nhất và cách mạng nhất trong lực lượng sản xuất","\"Cái cối xay chạy bằng hơi nước đưa lại xã hội có nhà tư bản công nghiệp\"","Năng suất lao động xã hội là thước đo trình độ phát triển của lực lượng sản xuất"],"a":[1],"p":84,"e":"Công cụ lao động mới là yếu tố động nhất, cách mạng nhất của lực lượng sản xuất, nên câu b gán điều đó cho đối tượng lao động là sai.","w":{"a":"Đúng: công cụ lao động là yếu tố động nhất.","c":"Đúng: câu nổi tiếng của C.Mác.","d":"Đúng: năng suất lao động là thước đo trình độ lực lượng sản xuất."}},{"s":11,"n":"15","q":"Yếu tố nào được xem là quyết định để phát huy nhân tố con người, ổn định và phát triển kinh tế, đáp ứng nguyện vọng chính đáng của nhân dân?","o":["Xóa mù chữ","Giải quyết việc làm","Phòng chống tệ nạn xã hội","Hiện đại hóa mạng lưới giao thông"],"a":[1],"p":84,"e":"Giải quyết việc làm giúp phát huy nhân tố con người, ổn định xã hội, phát triển kinh tế và đáp ứng nguyện vọng chính đáng của nhân dân.","w":{"a":"Xóa mù chữ là biện pháp về giáo dục.","c":"Phòng chống tệ nạn xã hội là biện pháp xã hội.","d":"Hiện đại hóa giao thông là điều kiện hạ tầng."}},{"s":11,"n":"16","q":"Quan hệ sản xuất (QHSX) có tác động thúc đẩy sự phát triển lực lượng sản xuất (LLSX) khi thỏa mãn điều kiện gì?","o":["QHSX phù hợp với LLSX","QHSX tiến bộ hơn so với LLSX","QHSX lạc hậu hơn so với LLSX","Khi QHSX ưu việt nhất"],"a":[0],"p":85,"e":"Quan hệ sản xuất thúc đẩy lực lượng sản xuất khi phù hợp với trình độ của nó.","w":{"b":"Quan hệ sản xuất đi trước quá xa sẽ kìm hãm.","c":"Quan hệ sản xuất lạc hậu cũng kìm hãm.","d":"Ưu việt nhất chỉ có nghĩa khi phù hợp."}},{"s":11,"n":"17","q":"Phương diện kỹ thuật của phương thức sản xuất dùng để chỉ quá trình nào?","o":["Quá trình sản xuất được tiến hành bằng cách thức kỹ thuật, công nghệ nào để làm biến đổi các đối tượng sản xuất","Quá trình sản xuất được thực hiện theo những phát minh công nghệ nào đó","Quá trình sản xuất được tiến hành với những cách thức tổ chức kinh tế nào đó","Quá trình sản xuất được quản lý bởi những tổ chức khoa học công nghệ nào đó"],"a":[0],"p":85,"e":"Phương diện kỹ thuật của phương thức sản xuất là quá trình sản xuất tiến hành bằng cách thức kỹ thuật, công nghệ nào để làm biến đổi đối tượng sản xuất.","w":{"b":"Phát minh công nghệ chỉ là một yếu tố.","c":"Cách thức tổ chức kinh tế là phương diện kinh tế.","d":"Tổ chức khoa học công nghệ là bộ máy quản lý."}},{"s":11,"n":"18","q":"Yếu tố quy định hành vi lịch sử đầu tiên và là động lực thúc đẩy con người hoạt động là gì?","o":["Lý tưởng sống","Mục tiêu, lý tưởng","Khát vọng về quyền lực","Nhu cầu và lợi ích vật chất"],"a":[3],"p":85,"e":"Nhu cầu và lợi ích vật chất quy định hành vi lịch sử đầu tiên của con người, là động lực thúc đẩy hoạt động của họ.","w":{"a":"Lý tưởng sống thuộc đời sống tinh thần.","b":"Mục tiêu, lý tưởng thuộc đời sống tinh thần.","c":"Khát vọng quyền lực không phải động lực đầu tiên."}},{"s":11,"n":"19","q":"Phương thức tồn tại của nhân loại là gì?","o":["Sản xuất vật chất","Quan hệ sản xuất","Ăn, ở và mặc","Của cải vật chất"],"a":[0],"p":85,"e":"Sản xuất vật chất là phương thức tồn tại của loài người.","w":{"b":"Quan hệ sản xuất chỉ là một mặt.","c":"Ăn, ở, mặc là nhu cầu.","d":"Của cải vật chất là kết quả."}},{"s":11,"n":"20","q":"Yếu tố nào quyết định đến sự biến đổi xã hội?","o":["Sự biến đổi, phát triển của cách thức sản xuất","Sự biến đổi, phát triển của kỹ thuật sản xuất","Sự phát triển của khoa học kỹ thuật","Sự biến đổi, phát triển của lực lượng sản xuất"],"a":[3],"p":85,"e":"Sự biến đổi và phát triển của lực lượng sản xuất quyết định sự biến đổi của xã hội, vì quan hệ sản xuất thay đổi theo nó.","w":{"a":"Cách thức sản xuất là phương thức sản xuất, bản thân sự biến đổi của nó khởi đầu từ lực lượng sản xuất.","b":"Kỹ thuật sản xuất chỉ là một mặt của lực lượng sản xuất.","c":"Khoa học kỹ thuật là yếu tố tác động đến lực lượng sản xuất."},"f":"File gốc đánh dấu đáp án D. Ở bộ 9 câu 29, file lại chọn phương thức sản xuất. Hai câu có phương án khác nhau nên đáp án khác nhau. Điểm tính theo file."},{"s":11,"n":"21","q":"Theo quan điểm triết học Mác- Lênin, muốn thay đổi một chế độ xã hội thì phải bắt đầu từ đâu?","o":["Thay đổi lực lượng sản xuất","Tạo ra nhiều của cải","Thay đổi quan hệ sản xuất","Thay đổi lực lượng sản xuất và quan hệ sản xuất"],"a":[3],"p":85,"e":"Muốn thay đổi một chế độ xã hội cần thay đổi cả lực lượng sản xuất và quan hệ sản xuất, vì hai mặt này thống nhất trong phương thức sản xuất.","w":{"a":"Chỉ nói lực lượng sản xuất.","b":"Tạo ra nhiều của cải là kết quả.","c":"Chỉ nói quan hệ sản xuất."}},{"s":11,"n":"22","q":"Trong những năm đổi mới, Đảng và Nhà nước đã có nhiều chủ trương, chính sách, biện pháp để tăng cường, mở rộng hợp tác quốc tế, tham gia các quan hệ song phương và tổ chức đa phương, như ASEAN, APEC, ASEM, WTO..., thu hút mạnh mẽ vốn đầu tư nước ngoài (FDI, ODA...), cho thấy?","o":["Vai trò quyết định của quan hệ sản xuất đối với lực lượng sản xuất","Vai trò quyết định của cơ sở hạ tầng kỹ thuật","Vai trò quyết định của lực lượng sản xuất","Vai trò quyết định của ngoại giao"],"a":[2],"p":86,"e":"Việc mở rộng hợp tác quốc tế, thu hút vốn đầu tư nước ngoài nhằm tăng vốn, công nghệ, kỹ năng quản lý, tức phát triển lực lượng sản xuất, thể hiện vai trò quyết định của lực lượng sản xuất.","w":{"a":"Quan hệ sản xuất không quyết định lực lượng sản xuất.","b":"Cơ sở hạ tầng kỹ thuật là cách nói hẹp.","d":"Ngoại giao là công cụ, không phải yếu tố quyết định."}},{"s":11,"n":"23","q":"“Không có một lập trường chính trị đúng thì một giai cấp nhất định nào đó, không thể nào giữ vững được sự thống trị của mình, và do đó, cũng không thể hoàn thành được nhiệm vụ của mình trong lĩnh vực sản xuất”, Lênin khẳng định điều gì?","o":["Sự tác động trở lại của chính trị đối với kinh tế","Sự tác động trở lại của ý thức đối với vật chất","Sự tác động trở lại của quan hệ sản xuất đối với lực lượng sản xuất","Sự quyết định của cơ sở hạ tầng đối với kiến trúc thượng tầng"],"a":[0],"p":86,"e":"Câu của V.I.Lênin nói rằng chính trị đúng mới giữ được sự thống trị và hoàn thành nhiệm vụ sản xuất, tức chính trị tác động trở lại kinh tế.","w":{"b":"Quan hệ ý thức và vật chất rộng hơn.","c":"Quan hệ sản xuất và lực lượng sản xuất là cặp khác.","d":"Đây là tác động trở lại, không phải sự quyết định."}},{"s":11,"n":"24","q":"Chủ trương “Kết hợp chặt chẽ ngay từ đầu đổi mới kinh tế với đổi mới chính trị, lấy đổi mới kinh tế làm trọng tâm, đồng thời từng bước đổi mới chính trị”, Đảng nhấn mạnh yếu tố nào?","o":["Quan hệ biện chứng giữa cơ sở hạ tầng và kiến trức thượng tầng","Tính quyết định của tồn tại xã hội đối với ý thức xã hội","Vai trò của vật chất đối với ý thức","Mối quan hệ giữa kinh tế và chính trị"],"a":[0],"p":86,"e":"Chủ trương kết hợp đổi mới kinh tế với đổi mới chính trị thể hiện quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng.","w":{"b":"Tồn tại xã hội và ý thức xã hội là cặp khác.","c":"Vật chất và ý thức là cặp rộng nhất.","d":"Cũng đúng về nội dung, vì thực chất quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng là quan hệ kinh tế và chính trị. File chọn phương án a."},"f":"File gốc đánh dấu đáp án A. Phương án D (quan hệ giữa kinh tế và chính trị) cũng đúng, vì thực chất quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng là quan hệ kinh tế và chính trị (xem bộ 8 câu 46). Điểm tính theo đáp án A của file."},{"s":11,"n":"25","q":"Yếu tố nào tác động trực tiếp để phát huy nguồn lực con người?","o":["Phát triển kinh tế – xã hội","Chính trị","Giáo dục về đạo đức, lối sống","Giải quyết việc làm"],"a":[0],"p":86,"e":"Phát triển kinh tế - xã hội tạo điều kiện trực tiếp để phát huy nguồn lực con người.","w":{"b":"Chính trị tác động qua thể chế.","c":"Giáo dục đạo đức tác động đến phẩm chất.","d":"Giải quyết việc làm là một biện pháp cụ thể."}},{"s":11,"n":"26","q":"Trong xã hội có giai cấp, quy luật nào giữ vai trò là động lực thúc đấy sự phát triển của xã hội?","o":["Quy luật đấu tranh giai cấp","Quy luật cơ sở hạ tầng quyết định kiến trúc thượng tầng","Quy luật tồn tại xã hội quyết định ý thức xã hội","Quy luật mâu thuẫn"],"a":[0],"p":86,"e":"Trong xã hội có giai cấp, quy luật đấu tranh giai cấp là động lực thúc đẩy sự phát triển của xã hội.","w":{"b":"Quy luật cơ sở hạ tầng quyết định kiến trúc thượng tầng giữ vai trò quan trọng nhưng không phải động lực.","c":"Quy luật tồn tại xã hội quyết định ý thức xã hội cũng không phải động lực.","d":"\"Quy luật mâu thuẫn\" là cách nói chung."}},{"s":11,"n":"27","q":"Vì sao ý thức xã hội thường lạc hậu so với tồn tại xã hội?","o":["Vì ý thức xã hội chỉ có thể biến đổi sau khi có sự biến đổi của tồn tại xã hội","Vì ý thức xã hội có thể tác động trở lại tồn tại xã hội","Vì ý thức xã hội là một hiện tượng khách quan","Vì ý thức xã hội có sự bảo thủ trì trệ trong quá trình tồn tại"],"a":[0],"p":86,"e":"Ý thức xã hội là phản ánh của tồn tại xã hội nên chỉ biến đổi sau khi tồn tại xã hội biến đổi.","w":{"b":"Khả năng tác động trở lại không giải thích sự lạc hậu.","c":"Tính khách quan không giải thích sự lạc hậu.","d":"Sức ỳ của thói quen, tập quán cũng là lý do, nhưng file chọn phương án a."}},{"s":11,"n":"28","q":"Theo quan điểm của chủ nghĩa Mác - Lênin, phạm trù nào dùng để chỉ toàn bộ đời sống tình cảm, tâm trạng, khát vọng, ý chí của những cộng đồng người nhất định; là sự phản ánh trực tiếp và tự phát triển đối với hoàn cảnh sống của họ?","o":["Ý thức thông thường","Ý thức lý luận","Tâm lý xã hội","Hệ tư tưởng"],"a":[2],"p":87,"e":"Tâm lý xã hội là toàn bộ đời sống tình cảm, tâm trạng, khát vọng, ý chí của một cộng đồng người, phản ánh trực tiếp, tự phát hoàn cảnh sống của họ.","w":{"a":"Ý thức thông thường là cách phân theo trình độ phản ánh.","b":"Ý thức lý luận phản ánh gián tiếp, tự giác.","d":"Hệ tư tưởng phản ánh gián tiếp, tự giác."}},{"s":11,"n":"29","q":"Theo quan điểm của chủ nghĩa Mác - Lênin, dạng ý thức nào là trình độ nhận thức lý luận về tồn tại xã hội, là hệ thống những quan điểm, tư tưởng (chính trị, triết học, đạo đức, nghệ thuật, tôn giáo), là sự phản ánh gián tiếp và tự giác đối với tồn tại xã hội?","o":["Ý thức thông thường","Ý thức lý luận","Tâm lý xã hội","Hệ tư tưởng"],"a":[3],"p":87,"e":"Hệ tư tưởng là trình độ nhận thức lý luận về tồn tại xã hội, hệ thống các quan điểm chính trị, triết học, đạo đức, nghệ thuật, tôn giáo, phản ánh gián tiếp và tự giác.","w":{"a":"Ý thức thông thường là cách phân theo trình độ phản ánh.","b":"Ý thức lý luận là cách phân theo trình độ phản ánh.","c":"Tâm lý xã hội phản ánh trực tiếp, tự phát."}},{"s":11,"n":"30","q":"Theo quan điểm chủ nghĩa Mác - Lênin, dạng ý thức nào là những tư tưởng, quan điểm đã được hệ thống hoá, khái quát hoá thành các học thuyết xã hội, được trình bày dưới dạng những khái niệm, phạm trù, quy luật?","o":["Ý thức xã hội thông thường","Ý thức lý luận","Tâm lý xã hội","Hệ tư tưởng"],"a":[1],"p":87,"e":"Ý thức lý luận là những tư tưởng, quan điểm đã được hệ thống hóa, khái quát hóa thành học thuyết, trình bày bằng khái niệm, phạm trù, quy luật.","w":{"a":"Ý thức thông thường chưa được hệ thống hóa.","c":"Tâm lý xã hội là tình cảm, tâm trạng, chưa thành lý luận.","d":"Hệ tư tưởng là cách phân theo mặt phản ánh, không phải cách phân theo trình độ."}},{"s":11,"n":"31","q":"Theo quan điểm chủ nghĩa Mác – Lênin, dạng ý thức nào là toàn bộ tri thức, quan niệm của con người trong một cộng đồng người nhất định, được hình thành một cách trực tiếp từ hoạt động thực tiễn hàng ngày, chưa được hệ thống hoá, khái quát hoá thành lý luận?","o":["Ý thức thông thường","Ý thức lý luận","Tâm lý xã hội","Hệ tư tưởng"],"a":[0],"p":87,"e":"Ý thức thông thường hình thành trực tiếp từ hoạt động thực tiễn hằng ngày của một cộng đồng, chưa được hệ thống hóa thành lý luận.","w":{"b":"Ý thức lý luận đã được hệ thống hóa.","c":"Tâm lý xã hội là cách phân theo mặt phản ánh.","d":"Hệ tư tưởng là hệ thống quan điểm đã được lý luận hóa."}},{"s":11,"n":"32","q":"Tiêu chuẩn khách quan để phân biệt các chế độ xã hội trong lịch sử theo quan điểm duy vật lịch sử là gì?","o":["Lực lượng sản xuất","Phương thức sản xuất","Chính trị tư tưởng","Quan hệ sản xuất đặc trưng"],"a":[3],"p":87,"e":"Quan hệ sản xuất đặc trưng, nhất là quan hệ sở hữu tư liệu sản xuất, là tiêu chuẩn khách quan để phân biệt các chế độ xã hội.","w":{"a":"Lực lượng sản xuất phân biệt các thời đại kinh tế.","b":"Phương thức sản xuất gồm cả lực lượng sản xuất, không riêng cho chế độ xã hội.","c":"Chính trị, tư tưởng thuộc kiến trúc thượng tầng."}},{"s":11,"n":"33","q":"Nhận định nào sau là đúng về chủ nghĩa duy vật lịch sử?","o":["Chủ nghĩa duy vật lịch sử là hệ thống quan điểm duy vật biện chứng về tự nhiên","Chủ nghĩa duy vật lịch sử là kết quả của sự vận dụng phương pháp luận của chủ nghĩa duy biện chứng và phép biện chứng duy vật và việc nghiên cứu đời sống xã hội lịch sử nhân loại","Chủ nghĩa duy vật lịch sử là một trong những phát hiện vĩ đại nhất của chủ nghĩa duy vật trước Mác","Chỉ ra sự phát triển của thế giới vật chất tuân theo quy luật tồn tại xã hội quyết định ý thức xã hội"],"a":[1],"p":87,"e":"Chủ nghĩa duy vật lịch sử ra đời khi C.Mác và Ph.Ăngghen vận dụng chủ nghĩa duy vật biện chứng và phép biện chứng duy vật vào nghiên cứu đời sống xã hội và lịch sử nhân loại.","w":{"a":"Quan điểm duy vật biện chứng về tự nhiên là nội dung của chủ nghĩa duy vật biện chứng.","c":"Đó là phát hiện của C.Mác, không phải của chủ nghĩa duy vật trước Mác.","d":"Quy luật tồn tại xã hội quyết định ý thức xã hội là một nội dung, không phải toàn bộ chủ nghĩa duy vật lịch sử."}},{"s":11,"n":"34","q":"Lênin coi yếu tố nào là lực lượng sản xuất hàng đầu của nhân loại?","o":["Người lao động","Con người","Công cụ lao động","Trí thức"],"a":[0],"p":88,"e":"V.I.Lênin viết rằng lực lượng sản xuất hàng đầu của toàn thể nhân loại là công nhân, người lao động.","w":{"b":"\"Con người\" là cách nói chung.","c":"Công cụ lao động là yếu tố động nhất, nhưng do người lao động tạo ra và sử dụng.","d":"Trí thức chỉ là một bộ phận."}},{"s":11,"n":"35","q":"Trong công cuộc đổi mới đất nước, Đảng chủ trương, phát triển kinh tế là trọng tâm, xây dựng Đảng là then chốt, đã nhấn mạnh đến mặt nào?","o":["Mối quan hệ biện chứng giữa tồn tại xã hội và ý thức xã hội","Vai trò quyết định của kinh tế đối với pháp quyền","Xây dựng Đảng có ý nghĩa quyết định","Vai trò quyết định của chính trị đối với kinh tế"],"a":[1],"p":88,"e":"Chủ trương phát triển kinh tế là trọng tâm thể hiện vai trò quyết định của kinh tế đối với chính trị và kiến trúc thượng tầng.","w":{"a":"Quan hệ tồn tại xã hội và ý thức xã hội là cặp khác.","c":"Xây dựng Đảng là then chốt, không quyết định kinh tế.","d":"Chính trị tác động trở lại kinh tế, không quyết định."},"f":"File gốc đánh dấu đáp án B. Phương án B nói về \"pháp quyền\", hơi lệch với ý của câu hỏi. Ý đúng là kinh tế giữ vai trò quyết định so với chính trị. B là phương án gần nhất trong bốn phương án. Điểm tính theo file."},{"s":11,"n":"36","q":"Trong các xã hội nông nghiệp truyền thống, phương thức kỹ thuật và phương diện kinh tế chủ yếu của quá trình sản xuất là?","o":["Sử dụng công cụ kỹ thuật thủ công với những tổ chức kinh tế quy mô nhỏ và khép kín","Sử dụng máy móc công nghiệp và theo kinh tế thị trường với những quy mô ngày càng mở rộng và không ngừng phát triển","Sử dụng công cụ có sẵn trong tự nhiên, kỹ thuật lao động tùy tiện cảm tính với những cá nhân riêng lẻ độc lập","Sử dụng công cụ hiện đại, kỹ thuật lao động tiên tiến"],"a":[0],"p":88,"e":"Trong xã hội nông nghiệp truyền thống, sản xuất dùng công cụ thủ công, tổ chức kinh tế quy mô nhỏ và khép kín.","w":{"b":"Máy móc công nghiệp thuộc thời đại công nghiệp.","c":"Công cụ có sẵn trong tự nhiên là mô tả của xã hội nguyên thủy.","d":"Công cụ hiện đại thuộc thời đại ngày nay."}},{"s":11,"n":"37","q":"Theo quan điểm của Đảng Cộng sản Việt Nam, lực lượng chủ yếu nhất của sự phát triển đất nước hiện nay là gì?","o":["Khoa học kỹ thuật, cùng với sự hội nhập quốc tế","Kinh tế thị trường định hướng xã hội chủ nghĩa, Nhà nước quản lý","Đại đoàn kết dân tộc","Liên minh công - nông – trí thức do Đảng Cộng sản Việt Nam lãnh đạo"],"a":[3],"p":88,"e":"Văn kiện của Đảng nêu liên minh công nhân, nông dân, trí thức do Đảng lãnh đạo là nền tảng và lực lượng chủ yếu của sự phát triển đất nước.","w":{"a":"Khoa học kỹ thuật và hội nhập là điều kiện.","b":"Kinh tế thị trường là cơ chế.","c":"Đại đoàn kết dân tộc là nguồn sức mạnh chung, xây dựng trên nền tảng liên minh."}},{"s":11,"n":"38","q":"Đảng ta quan niệm như thế nào về việc phát triển lực lượng sản xuất và quan hệ sản xuất trong thời kỳ quá độ lên CNXH ở nước ta hiện nay?","o":["Phát triển lực lượng sản xuất đạt trình độ tiên tiến để tạo cơ sở cho việc xây dựng quan hệ sản xuất mới","Chủ động xây dựng quan hệ sản xuất mới để tạo cơ sở thúc đẩy lực lượng sản xuất phát triển","Kết hợp đồng thời giữa phát triển lực lượng sản xuất với từng bước xây dựng quan hệ sản xuất mới phù hợp với trình độ của lực lượng sản xuất","Quan hệ sản xuất phải đi trước một bước để mở đường cho lực lượng sản xuất phát triển"],"a":[2],"p":88,"e":"Đảng ta chủ trương kết hợp đồng thời phát triển lực lượng sản xuất với từng bước xây dựng quan hệ sản xuất mới phù hợp trình độ của lực lượng sản xuất.","w":{"a":"Chờ lực lượng sản xuất tiên tiến mới xây quan hệ sản xuất là máy móc.","b":"Chủ động xây quan hệ sản xuất trước là duy ý chí.","d":"Quan hệ sản xuất đi trước một bước dễ vi phạm quy luật."}},{"s":11,"n":"39","q":"Ăngghen đã dự báo như thế nào về sự phát triển của lực lượng sản xuất trong tương lai?","o":["Máy móc sẽ thay thế lao động của con người","Khoa học kỹ thuật sẽ trở thành một lực lượng sản xuất trực tiếp","Khoa học sẽ thay thế con người bằng những thiết bị máy móc siêu việt, nó sẽ giúp con người có khả năng lao động không giới hạn","Khoa học sẽ trở thành lực lượng sản xuất cơ bản của xã hội"],"a":[1],"p":88,"e":"Ph.Ăngghen dự báo khoa học kỹ thuật sẽ trở thành lực lượng sản xuất trực tiếp.","w":{"a":"Thay thế lao động bằng máy móc chưa nêu được vai trò của khoa học.","c":"Khoa học sẽ thay thế con người bằng thiết bị siêu việt là phỏng đoán quá mức.","d":"Khoa học là lực lượng sản xuất cơ bản không phải ý của câu dự báo."}},{"s":11,"n":"40","q":"Trong thời đại ngày nay, yếu tố nào trở thành lực lượng sản xuất trực tiếp?","o":["Khoa học và công nghệ hiện đại","Thể chế chính trị của một quốc gia","Giá trị văn hóa truyền thống","Tinh thần yêu nước"],"a":[0],"p":89,"e":"Trong thời đại ngày nay, khoa học và công nghệ hiện đại trở thành lực lượng sản xuất trực tiếp.","w":{"b":"Thể chế chính trị thuộc kiến trúc thượng tầng.","c":"Giá trị văn hóa truyền thống thuộc ý thức xã hội.","d":"Tinh thần yêu nước thuộc ý thức xã hội."}},{"s":11,"n":"41","q":"Phát biểu. “Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì mà là ở chỗ chúng sản xuất bằng cách nào, với những tư liệu lao động nào”, chủ nghĩa Mác-Lênin muốn đề cập đến phạm trù nào?","o":["Quan hệ sản xuất","Phương thức sản xuất","Lực lượng sản xuất","Sản xuất vật chất"],"a":[1],"p":89,"e":"Câu này của C.Mác nói về phương thức sản xuất: các thời đại kinh tế khác nhau ở cách thức sản xuất và tư liệu lao động dùng để sản xuất.","w":{"a":"Quan hệ sản xuất chỉ là một mặt.","c":"Lực lượng sản xuất cũng chỉ là một mặt.","d":"Sản xuất vật chất là khái niệm chung."}},{"s":11,"n":"42","q":"Điểm xuất phát để nghiên cứu xã hội và lịch sử của Mác, Ăngghen là gì?","o":["Các quan hệ xã hội","Con người hiện thực","Đời sống xã hội","Sản xuất vật chất"],"a":[3],"p":89,"e":"C.Mác và Ph.Ăngghen xuất phát từ sản xuất vật chất để nghiên cứu xã hội và lịch sử, vì nó là cơ sở của đời sống xã hội.","w":{"a":"Quan hệ xã hội là kết quả của sản xuất.","c":"Đời sống xã hội là đối tượng nghiên cứu.","b":"Con người hiện thực là tiền đề xuất phát trong Hệ tư tưởng Đức, file không chọn ở câu hỏi này."},"f":"File gốc đánh dấu đáp án D. Ở bộ 10 câu 5, câu hỏi về \"tiền đề xuất phát\" lại chọn con người hiện thực (phương án B ở câu này). Hai câu hỏi khác nhau ở cụm \"tiền đề\" và \"điểm xuất phát để nghiên cứu\", điểm tính theo file."},{"s":11,"n":"43","q":"Quy luật nào giữ vai trò quyết định đối với sự vận động, phát triển của xã hội?","o":["Quy luật tồn tại xã hội quyết định ý thức xã hội","Quy luật cơ sở hạ tầng quyết định kiến trúc thượng tầng","Quy luật về sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất","Quy luật đấu tranh giai cấp"],"a":[2],"p":89,"e":"Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất giữ vai trò quyết định đối với sự vận động, phát triển của xã hội.","w":{"a":"Quy luật tồn tại xã hội quyết định ý thức xã hội thuộc lĩnh vực ý thức.","b":"Quy luật cơ sở hạ tầng quyết định kiến trúc thượng tầng giữ vai trò thứ hai.","d":"Đấu tranh giai cấp là động lực trong xã hội có giai cấp."}},{"s":11,"n":"44","q":"Trong chủ nghĩa duy vật lịch sử, học thuyết nào đóng vai trò trọng tâm?","o":["Học thuyết về giai cấp công nhân","Học thuyết về đấu tranh giai cấp","Học thuyết về biện chứng giữa lực lượng sản xuất và quan hệ sản xuất","Học thuyết hình thái kinh tế - xã hội"],"a":[3],"p":89,"e":"Học thuyết hình thái kinh tế - xã hội là nội dung trọng tâm của chủ nghĩa duy vật lịch sử, vì nó tổng hợp mọi quy luật xã hội.","w":{"a":"Học thuyết về giai cấp công nhân thuộc chủ nghĩa xã hội khoa học.","b":"Học thuyết đấu tranh giai cấp là một bộ phận.","c":"Biện chứng giữa lực lượng sản xuất và quan hệ sản xuất là một quy luật trong học thuyết."}},{"s":11,"n":"45","q":"Yếu tố nào giữ vai trò quyết định sự thắng lợi của một trật tự xã hội mới?","o":["Sự điều hành và quản lý xã hội của Nhà nước","Sức mạnh của luật pháp","Năng suất lao động","Hiệu quả hoạt động của hệ thống chính trị"],"a":[2],"p":89,"e":"V.I.Lênin chỉ ra: xét đến cùng, năng suất lao động là cái quan trọng nhất, chủ yếu nhất để chiến thắng chế độ cũ.","w":{"a":"Quản lý của nhà nước thuộc kiến trúc thượng tầng.","b":"Sức mạnh luật pháp thuộc kiến trúc thượng tầng.","d":"Hệ thống chính trị thuộc kiến trúc thượng tầng."}},{"s":11,"n":"46","q":"Mâu thuẫn giữa hai giai cấp đối kháng về lợi ích là sự thể hiện về mặt xã hội của mâu ,"Kiến trúc thượng tầng"],"a":[2],"p":90,"e":"Xây dựng kinh tế thị trường định hướng xã hội chủ nghĩa là xây dựng cơ sở hạ tầng, tổng hợp các quan hệ sản xuất, để phát huy vai trò quyết định của nó.","w":{"a":"Nhà nước thuộc kiến trúc thượng tầng.","b":"Lực lượng sản xuất là yếu tố của phương thức sản xuất.","d":"Kiến trúc thượng tầng chịu sự quyết định của cơ sở hạ tầng."}},{"s":11,"n":"52","q":"Chủ trương đẩy mạnh công nghiệp hóa, hiện đại hóa của Đảng là nhằm phát huy vai trò quyết định của yếu tố nào?","o":["Lực lượng sản xuất","Kinh tế","Khoa học – công nghệ","Chính trị"],"a":[0],"p":91,"e":"Đẩy mạnh công nghiệp hóa, hiện đại hóa nhằm phát triển lực lượng sản xuất, phát huy vai trò quyết định của nó.","w":{"b":"Kinh tế là khái niệm chung.","c":"Khoa học - công nghệ là một yếu tố của lực lượng sản xuất.","d":"Chính trị thuộc kiến trúc thượng tầng."}},{"s":11,"n":"53","q":"Tư tưởng nôn nóng muốn đưa Việt Nam tiến nhanh, tiến thẳng lên chủ nghĩa xã hội trong bối cảnh đất nước nghèo nàn, lạc hậu, thể hiện điều gì?","o":["Sự vi phạm quy luật phát triển","Không tuân thủ nguyên tắc lịch sử - cụ thể","Không tuân thủ quy luật về sự phù hợp giữa quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất","Không tuân thủ nguyên tắc toàn diện"],"a":[2],"p":91,"e":"Nôn nóng tiến nhanh, tiến thẳng lên chủ nghĩa xã hội khi đất nước nghèo, lạc hậu là chưa tính đến sự phù hợp giữa quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất.","w":{"a":"\"Vi phạm quy luật phát triển\" nói chung quá rộng.","b":"Nguyên tắc lịch sử - cụ thể là phương pháp luận.","d":"Nguyên tắc toàn diện không phải mấu chốt."}},{"s":11,"n":"54","q":"Khẳng định của Lê-nin. “Chúng ta chưa tính toán đầy đủ mà đã tưởng là - có thể trực tiếp dùng pháp lệnh của nhà nước vô sản, để tổ chức theo kiểu cộng sản chủ nghĩa, trong một nước tiểu nông, việc nhà nước sản xuất và phân phối sản phẩm. Đời sống thực tế đã vạch rõ sai lầm của chúng ta”, nhấn mạnh điều gì?","o":["Mối quan hệ giữa kinh tế và chính trị","Tính biện chứng giữa lực lượng sản xuất và quan hệ sản xuất","Quan hệ giữa nhà nước và pháp luật","Quan hệ giữa vật chất và tinh thần"],"a":[1],"p":91,"e":"Lênin nhận thấy chính sách cộng sản thời chiến đã đi trước trình độ sản xuất tiểu nông, nên rút ra bài học về mối quan hệ biện chứng giữa lực lượng sản xuất và quan hệ sản xuất, dẫn đến chính sách kinh tế mới.","w":{"a":"Câu này bàn về sản xuất, không bàn về chính trị.","c":"Nhà nước và pháp luật không phải trọng tâm.","d":"Vật chất và tinh thần là cặp chung nhất."}}];</script>
<script>
(function(){
"use strict";
const LET="ABCDE";
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const SETS=Array.from(new Set(DATA.map(q=>q.s))).sort((a,b)=>a-b);
const OTHER=12;
const setName=s=>s===OTHER?"Câu lẻ":"Bộ "+s;
const countOf=s=>DATA.filter(q=>q.s===s).length;
const FLAGGED=DATA.filter(q=>q.f).length;
const LOGO='<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="11" cy="15" r="8.5" fill="none" stroke="#7db4ff" stroke-width="2"/><circle cx="19" cy="15" r="8.5" fill="none" stroke="#f2f6ff" stroke-width="2"/><path d="M15 8.4a8.5 8.5 0 0 1 0 13.2a8.5 8.5 0 0 1 0-13.2z" fill="#2468e0"/></svg>';

let prefs={};
try{prefs=JSON.parse(store.get("tq:prefs2")||"{}")||{}}catch(e){prefs={}}
let hist={};
try{hist=JSON.parse(store.get("tq:hist2")||"{}")||{}}catch(e){hist={}}
const savePrefs=()=>store.set("tq:prefs2",JSON.stringify({sets:Array.from(S.sets),shuffle:S.shuffle,limit:S.limit}));
const saveHist=()=>store.set("tq:hist2",JSON.stringify(hist));

const S={
  screen:"home",
  sets:new Set(Array.isArray(prefs.sets)?prefs.sets.filter(x=>SETS.includes(x)):SETS),
  shuffle:!!prefs.shuffle,
  limit:[0,20,50].includes(prefs.limit)?prefs.limit:0,
  round:1,queue:[],pos:0,res:{},correct:0,streak:0,best:0,pick:new Set(),done:false,base:null,arm:false
};

const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>{const r=[];DATA.forEach((q,i)=>{if(S.sets.has(q.s))r.push(i)});return r};
const sessionSize=()=>{const n=pool().length;return S.limit&&S.limit<n?S.limit:n};
function buildQueue(){
  let l=pool();
  if(S.limit&&S.limit<l.length){l=shuffled(l).slice(0,S.limit);if(!S.shuffle)l.sort((a,b)=>a-b)}
  else if(S.shuffle)l=shuffled(l);
  return l;
}
function startRound(list,round){
  S.round=round;S.queue=list.slice();S.pos=0;S.res={};S.correct=0;S.streak=0;
  S.pick=new Set();S.done=false;S.screen="quiz";render();window.scrollTo(0,0);
}
const sameSet=(a,pick)=>pick.size===a.length&&a.every(k=>pick.has(k));
function matched(q,pick){
  if(sameSet(q.a,pick))return q.a;
  const alts=q.alt||[];
  for(let i=0;i<alts.length;i++)if(sameSet(alts[i],pick))return alts[i];
  return null;
}
function finalize(reveal){
  const idx=S.queue[S.pos],q=DATA[idx];if(S.done)return;
  const m=reveal?null:matched(q,S.pick),ok=!!m;
  S.done=true;
  S.res[idx]={ok,set:m||q.a,pick:Array.from(S.pick).sort((a,b)=>a-b)};
  if(ok){S.correct++;S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0;
  hist[idx]=ok?1:0;saveHist();
  render();
  const ex=document.getElementById("ex");
  if(ex&&ex.scrollIntoView){
    const calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    ex.scrollIntoView({block:"nearest",behavior:calm?"auto":"smooth"});
  }
}
function topbar(){
  const quiz=S.screen==="quiz";
  const prog=quiz?Math.round((S.pos+(S.done?1:0))/S.queue.length*100):0;
  return '<header class="top'+(quiz?" quiz":"")+'"><div class="in"><div class="brand">'+LOGO+'<span>Triết học Mác-Lênin</span></div>'+
    (quiz?'<span class="pill">Đúng <b>'+S.correct+'</b>/'+Object.keys(S.res).length+'</span><span class="pill">Chuỗi '+S.streak+'</span>'+(S.round>1?'<span class="pill">Lượt '+S.round+'</span>':"")+'<button class="link" data-act="home">Thoát</button>':"")+
    '</div>'+(quiz?'<div class="bar"><i style="width:'+prog+'%"></i></div>':"")+'</header>';
}
function setStats(s){
  let t=0,d=0,w=0;
  DATA.forEach((q,i)=>{if(q.s===s){t++;if(hist[i]===1)d++;else if(hist[i]===0)w++}});
  return {t,d,w};
}
function savedWrong(){const r=[];DATA.forEach((q,i)=>{if(hist[i]===0)r.push(i)});return r}
function renderHome(){
  const n=sessionSize(),sw=savedWrong().length;
  const done=Object.keys(hist).filter(k=>DATA[k]).length;
  const tiles=SETS.map(s=>{
    const st=setStats(s);
    const label=s===OTHER?'<small>Câu</small>lẻ':'<small>Bộ</small>'+s;
    return '<button class="set" data-act="set" data-s="'+s+'" aria-pressed="'+S.sets.has(s)+'" aria-label="'+setName(s)+', '+st.t+' câu">'+
      '<span class="sn">'+label+'</span><span class="sc">'+st.t+' câu</span>'+
      '<span class="pb"><i class="g" style="width:'+(st.d/st.t*100)+'%"></i><i class="r" style="width:'+(st.w/st.t*100)+'%"></i></span>'+
      '<span class="sm">'+((st.d+st.w)?'đúng '+st.d+' · sai '+st.w:'')+'</span></button>';
  }).join("");
  const lone=SETS.includes(OTHER)?'<p class="note">Mục “Câu lẻ” gồm '+countOf(OTHER)+' câu bị đánh số lệch trong file: “Câu 72” nằm giữa bộ 2 và “Câu 178” nằm giữa bộ 9. Hai câu này được tách riêng để bộ 2 còn '+countOf(2)+' câu và bộ 9 còn '+countOf(9)+' câu.</p>':"";
  app.innerHTML=topbar()+'<main class="wrap">'+
  '<section class="hero"><div class="eyebrow">Trắc nghiệm có giải thích</div><h1>Ôn tập <span class="nb">Triết học Mác-Lênin</span></h1>'+
  '<p>Làm bài theo từng bộ đề, xem ngay đáp án và lý do của từng phương án. Các câu làm sai được lưu để làm lại.</p>'+
  '<div class="facts"><div class="fact"><b>'+DATA.length+'</b><span>câu hỏi</span></div><div class="fact"><b>'+SETS.filter(s=>s!==OTHER).length+'</b><span>bộ đề'+(SETS.includes(OTHER)?' + '+countOf(OTHER)+' câu lẻ':'')+'</span></div><div class="fact"><b>'+done+'</b><span>câu đã làm</span></div><div class="fact"><b>'+sw+'</b><span>câu đang sai</span></div></div></section>'+
  '<h2><i>1</i>Chọn bộ đề</h2><div class="sets">'+tiles+'</div>'+
  '<div class="row"><button class="link" data-act="all">Chọn tất cả</button><button class="link" data-act="none">Bỏ chọn</button></div>'+
  '<h2><i>2</i>Tùy chọn</h2>'+
  '<div class="opts-row"><div><div class="lab" id="lm">Số câu mỗi lượt</div><div class="seg" role="group" aria-labelledby="lm" style="margin-top:6px">'+
  [[0,"Tất cả"],[20,"20 câu"],[50,"50 câu"]].map(x=>'<button data-act="limit" data-n="'+x[0]+'" aria-pressed="'+(S.limit===x[0])+'">'+x[1]+'</button>').join("")+'</div></div>'+
  '<label class="tog"><input type="checkbox" data-act="shuffle" '+(S.shuffle?"checked":"")+'> Trộn thứ tự câu hỏi</label></div>'+
  '<div class="row" style="margin-top:26px"><button class="btn pri big" data-act="start" '+(n?"":"disabled")+'>Bắt đầu · '+n+' câu</button>'+
  (sw?'<button class="btn" data-act="saved">Ôn '+sw+' câu sai đã lưu</button>':"")+'</div>'+
  '<p class="note">Đáp án chấm theo file gốc. '+FLAGGED+' câu có đáp án gây tranh cãi so với giáo trình, phần giải thích của các câu này có ô “Lưu ý về đáp án”.</p>'+lone+
  (done?'<div class="row"><button class="link" data-act="reset">'+(S.arm?'Bấm lần nữa để xóa toàn bộ lịch sử làm bài':'Xóa lịch sử làm bài')+'</button></div>':"")+
  '</main>';
}
function dockHtml(q,r){
  const multi=q.a.length>1;
  if(S.done){
    const acc=[q.a].concat(q.alt||[]).filter(s=>s!==r.set);
    const alt=acc.length?' (cũng chấp nhận: '+acc.map(s=>s.map(k=>LET[k]).join(", ")).join(" hoặc ")+')':"";
    const last=S.pos+1>=S.queue.length;
    return '<div class="vd '+(r.ok?"ok":"bad")+'"><b>'+(r.ok?"✓ Chính xác":"✕ Chưa đúng")+'</b><span>Đáp án: '+r.set.map(k=>LET[k]).join(", ")+alt+'</span></div>'+
      '<button class="btn pri" data-act="next" id="nextbtn">'+(last?"Xem kết quả":"Câu tiếp theo")+'</button>';
  }
  if(multi)return '<div class="vd"><span id="pc">Đã chọn '+S.pick.size+'/'+q.a.length+'</span></div><button class="btn" data-act="reveal">Xem đáp án</button><button class="btn pri" data-act="confirm" id="cfm" '+(S.pick.size?"":"disabled")+'>Xác nhận</button>';
  return '<div class="vd"><span>Chọn một đáp án</span></div><button class="btn" data-act="reveal">Xem đáp án</button>';
}
function renderQuiz(){
  const idx=S.queue[S.pos],q=DATA[idx],multi=q.a.length>1,r=S.res[idx];
  let opts;
  if(!S.done){
    opts=q.o.map((o,k)=>'<button class="opt'+(S.pick.has(k)?" sel":"")+'" data-act="opt" data-k="'+k+'" aria-pressed="'+S.pick.has(k)+'"><span class="lt">'+LET[k]+'</span><span class="ob"><span class="ot">'+esc(o)+'</span></span></button>').join("");
  }else{
    opts=q.o.map((o,k)=>{
      const isAns=r.set.includes(k),picked=r.pick.includes(k);
      const cls=isAns?(picked||!multi?"ok":"ok miss"):(picked?"bad":"");
      let tg="";
      if(isAns&&picked)tg='✓ Bạn chọn đúng';
      else if(isAns)tg=multi?'✓ Đáp án đúng, bạn chưa chọn':'✓ Đáp án đúng';
      else if(picked)tg='✕ Bạn đã chọn';
      const note=q.w&&q.w[LET[k].toLowerCase()];
      return '<div class="opt '+cls+'" role="listitem"><span class="lt">'+LET[k]+'</span><span class="ob"><span class="ot">'+esc(o)+'</span>'+(tg?'<span class="tg">'+tg+'</span>':"")+(note?'<span class="on">'+esc(note)+'</span>':"")+'</span></div>';
    }).join("");
  }
  const after=S.done?'<section class="ex" id="ex"><h3>Giải thích</h3><p>'+esc(q.e)+'</p></section>'+(q.f?'<section class="flag"><h3>Lưu ý về đáp án</h3><p>'+esc(q.f)+'</p></section>':""):"";
  const where=(q.s===OTHER?'Câu '+esc(q.n)+', nằm giữa bộ '+q.g:setName(q.s)+', câu '+esc(q.n))+', trang '+q.p;
  app.innerHTML=topbar()+'<main class="wrap q"><article class="qcard"><div class="tag">Câu '+(S.pos+1)+'/'+S.queue.length+' · Trong file: '+where+'</div><p class="qt">'+esc(q.q)+'</p>'+
    (multi?'<span class="chip">Chọn đủ '+q.a.length+' đáp án rồi bấm Xác nhận</span>':"")+
    '<div class="opts"'+(S.done?' role="list"':"")+'>'+opts+'</div>'+after+'</article><p class="kb">Phím tắt: A–E hoặc 1–5 để chọn, Enter để tiếp tục</p></main>'+
    '<div class="dock"><div class="dk" role="status">'+dockHtml(q,r)+'</div></div>';
  if(S.done){const nb=document.getElementById("nextbtn");if(nb&&nb.focus)nb.focus({preventScroll:true})}
}
const wrongList=()=>S.queue.filter(i=>S.res[i]&&!S.res[i].ok);
function renderResult(){
  const total=S.queue.length,w=wrongList(),pct=Math.round(S.correct/total*100);
  if(S.round===1)S.base={c:S.correct,t:total};
  const C=2*Math.PI*52;
  const items=w.map(i=>{
    const q=DATA[i],p=S.res[i].pick,rs=S.res[i].set;
    const mine=p.length?p.map(k=>LET[k]+". "+esc(q.o[k])).join("; "):"(chưa chọn)";
    return '<details><summary>'+setName(q.s)+', câu '+esc(q.n)+': '+esc(q.q.length>90?q.q.slice(0,90)+"…":q.q)+'</summary><p>'+esc(q.q)+'</p>'+
      '<p>Bạn chọn: <b class="bd">'+mine+'</b></p><p>Đáp án đúng: <b class="gd">'+rs.map(k=>LET[k]+". "+esc(q.o[k])).join("; ")+'</b></p><p>'+esc(q.e)+'</p>'+(q.f?'<p><b>Lưu ý:</b> '+esc(q.f)+'</p>':"")+'</details>';
  }).join("");
  const head=(!w.length&&S.round>1)?"Đã sửa hết các câu sai":"Kết quả lượt "+S.round;
  app.innerHTML=topbar()+'<main class="wrap"><section class="score" role="status"><div class="eyebrow">'+head+'</div>'+
    '<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="'+pct+'% chính xác"><circle class="rt" cx="60" cy="60" r="52"/><circle class="rv'+(pct<50?" low":"")+'" cx="60" cy="60" r="52" transform="rotate(-90 60 60)" stroke-dasharray="'+(C*pct/100).toFixed(1)+' '+C.toFixed(1)+'"/><text class="rp" x="60" y="60">'+pct+'%</text></svg>'+
    '<div class="sc2">'+S.correct+'<small>/'+total+' câu đúng</small></div>'+
    '<div class="sub2">'+(w.length?'Còn '+w.length+' câu cần làm lại':'Không còn câu sai trong lượt này')+'</div>'+
    '<div class="stats"><span class="pill">Sai '+w.length+'</span><span class="pill">Chuỗi đúng dài nhất '+S.best+'</span>'+((S.round>1&&S.base)?'<span class="pill">Lượt đầu '+S.base.c+'/'+S.base.t+'</span>':"")+'</div>'+
    '<div class="row" style="justify-content:center;margin-top:22px">'+(w.length?'<button class="btn pri big" data-act="redo-wrong">Làm lại '+w.length+' câu sai</button>':"")+'<button class="btn" data-act="redo-all">Làm lại toàn bộ</button><button class="btn" data-act="home">Về trang chủ</button></div></section>'+
    (w.length?'<h2>Các câu làm sai</h2><div class="wl">'+items+'</div>':"")+'</main>';
}
function render(){if(S.screen==="home")renderHome();else if(S.screen==="quiz")renderQuiz();else renderResult()}
function next(){
  if(!S.done)return;
  S.pos++;S.pick=new Set();S.done=false;
  if(S.pos>=S.queue.length)S.screen="result";
  render();window.scrollTo(0,0);
}
function updateMulti(q){
  const pc=document.getElementById("pc"),cf=document.getElementById("cfm");
  if(pc)pc.textContent="Đã chọn "+S.pick.size+"/"+q.a.length;
  if(cf)cf.disabled=!S.pick.size;
  app.querySelectorAll('[data-act="opt"]').forEach(b=>{
    const on=S.pick.has(+b.getAttribute("data-k"));
    b.classList.toggle("sel",on);b.setAttribute("aria-pressed",on);
  });
}
function choose(k){
  const q=DATA[S.queue[S.pos]];if(S.done)return;
  if(q.a.length>1){if(S.pick.has(k))S.pick.delete(k);else S.pick.add(k);updateMulti(q)}
  else{S.pick=new Set([k]);finalize(false)}
}
function startMain(){S.best=0;S.base=null;startRound(buildQueue(),1)}
app.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.getAttribute("data-act");
  if(a!=="reset"&&S.arm){S.arm=false}
  if(a==="set"){
    const s=+el.getAttribute("data-s");
    if(S.sets.has(s))S.sets.delete(s);else S.sets.add(s);
    savePrefs();renderHome();
    const again=app.querySelector('[data-act="set"][data-s="'+s+'"]');if(again&&again.focus)again.focus();
  }
  else if(a==="all"){S.sets=new Set(SETS);savePrefs();renderHome()}
  else if(a==="none"){S.sets=new Set();savePrefs();renderHome()}
  else if(a==="limit"){S.limit=+el.getAttribute("data-n");savePrefs();renderHome()}
  else if(a==="start")startMain();
  else if(a==="saved"){S.best=0;S.base=null;const l=savedWrong();startRound(S.shuffle?shuffled(l):l,1)}
  else if(a==="reset"){
    if(S.arm){hist={};store.del("tq:hist2");S.arm=false}else S.arm=true;
    renderHome();
  }
  else if(a==="home"){S.screen="home";render();window.scrollTo(0,0)}
  else if(a==="opt")choose(+el.getAttribute("data-k"));
  else if(a==="confirm"){if(S.pick.size)finalize(false)}
  else if(a==="reveal")finalize(true);
  else if(a==="next")next();
  else if(a==="redo-wrong")startRound(wrongList(),S.round+1);
  else if(a==="redo-all")startMain();
});
app.addEventListener("change",e=>{
  if(e.target&&e.target.getAttribute&&e.target.getAttribute("data-act")==="shuffle"){S.shuffle=e.target.checked;savePrefs()}
});
document.addEventListener("keydown",e=>{
  if(S.screen!=="quiz"||e.ctrlKey||e.metaKey||e.altKey)return;
  const q=DATA[S.queue[S.pos]];
  if(e.key==="Enter"){
    if(S.done){e.preventDefault();next()}
    else if(q.a.length>1&&S.pick.size){e.preventDefault();finalize(false)}
    return;
  }
  if(e.key.length!==1||S.done)return;
  let k=LET.indexOf(e.key.toUpperCase());
  if(k<0&&e.key>="1"&&e.key<="5")k=+e.key-1;
  if(k>=0&&k<q.o.length)choose(k);
});
render();
})();
</script>

</body></html>
